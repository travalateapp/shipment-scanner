<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="company" content="<?= company ?>">
  <!-- iPhone: "Add to Home Screen" opens it full-screen with its own icon (GitHub Pages copy). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="theme-color" content="#2f5fe3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #f3f5fa; --card: #ffffff; --text: #1b2333; --muted: #6b7486; --line: #e3e7ef;
      --brand: #2f5fe3; --brand-soft: #e8eefc;
      --green: #1f9d55; --green-soft: #e3f6eb; --amber: #c27c0e; --amber-soft: #fdf1dc;
      --red: #d63a3a; --red-soft: #fde6e6; --blue: #2b78c5; --blue-soft: #e2effb;
      --gray: #8a93a5; --gray-soft: #eef0f4; --purple: #7b4cc2; --purple-soft: #efe7fb;
      --teal: #128a86; --teal-soft: #dff4f3; --orange: #e0661b; --orange-soft: #fdeadc;
      --ot: #4338ca; --ot-soft: #e3e5fd; --pink: #c2417b; --pink-soft: #fce7f1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
    button { font: inherit; cursor: pointer; border: 0; }
    input, select, textarea { font: inherit; }
    .hidden { display: none !important; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 96px; }

    /* Header */
    .top { background: var(--brand); color: #fff; padding: 16px 16px 56px; }
    .top .wrap { padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .top h1 { font-size: 18px; margin: 0; }
    .top small { opacity: .85; }
    .top .hbtn { background: rgba(255,255,255,.18); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
    .pull { margin-top: -44px; }

    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(20,30,60,.07); }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .center { text-align: center; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* Login & forms */
    .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login .card { width: 100%; max-width: 380px; padding: 28px 22px; }
    .login h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
    .field { margin-top: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input:not([type=checkbox]):not([type=radio]) { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px; }
    .field input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .inp { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; color: var(--text); }
    textarea.inp { min-height: 70px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    .btn { display: block; width: 100%; padding: 15px; border-radius: 14px; font-weight: 600; font-size: 16px;
      background: var(--brand); color: #fff; margin-top: 16px; }
    .btn:disabled { opacity: .55; }
    .btn.green { background: var(--green); }
    .btn.red { background: var(--red); }
    .btn.soft-red { background: var(--red-soft); color: var(--red); }
    .btn.ghost { background: var(--brand-soft); color: var(--brand); }
    .btn.small { display: inline-block; width: auto; padding: 9px 14px; font-size: 14px; margin: 0; border-radius: 10px; }
    .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btns .btn { flex: 1; margin-top: 0; }
    .btns .btn.small { flex: 1 1 calc(50% - 4px); white-space: nowrap; }
    .big-btn { width: 100%; padding: 22px; border-radius: 18px; font-size: 20px; font-weight: 700; color: #fff; margin-top: 6px; }

    .clock { font-size: 40px; font-weight: 700; letter-spacing: 1px; text-align: center; margin: 4px 0; }
    .msg { padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 14px; }
    .msg.err { background: var(--red-soft); color: var(--red); }
    .msg.ok { background: var(--green-soft); color: var(--green); }
    .msg.info { background: var(--blue-soft); color: var(--blue); }
    .msg.warn { background: var(--amber-soft); color: var(--amber); }

    .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kv div, .kv .tile { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
    .kv .tile { border: 2px solid transparent; color: var(--text); }
    .kv .tile.sel { background: var(--green-soft); border-color: var(--green); }
    .kv .tile.sel b, .kv .tile.sel span { color: var(--green); }
    .kv b { display: block; font-size: 18px; }
    .kv span { font-size: 12px; color: var(--muted); }

    .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .s-PRESENT, .s-APPROVED { background: var(--green-soft); color: var(--green); }
    .s-WORKING { background: var(--blue-soft); color: var(--blue); }
    .s-HALF_DAY, .s-PENDING { background: var(--amber-soft); color: var(--amber); }
    .s-ABSENT, .s-REJECTED, .s-FLAG { background: var(--red-soft); color: var(--red); }
    .s-LEAVE { background: var(--blue-soft); color: var(--blue); }
    .s-WEEK_OFF, .s-NOT_MARKED, .s-NOT_JOINED, .s-INACTIVE, .s-UPCOMING, .s-CANCELLED, .s-CLOSED { background: var(--gray-soft); color: var(--gray); }
    .s-HOLIDAY { background: var(--pink-soft); color: var(--pink); }
    .s-OFF_WORK, .s-ACTIVE { background: var(--teal-soft); color: var(--teal); }
    .s-LATE, .s-EARLY, .s-PAUSED { background: var(--orange-soft); color: var(--orange); }
    .s-OT { background: var(--ot-soft); color: var(--ot); }
    .s-PF, .s-LOCK { background: var(--purple-soft); color: var(--purple); }
    .k-red b { color: var(--red); } .k-amber b { color: var(--amber); } .k-orange b { color: var(--orange); } .k-ot b { color: var(--ot); }

    /* Check-in flow */
    .flow-step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
    .flow-step:first-child { border-top: 0; }
    .flow-step .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--gray-soft); color: var(--gray);
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
    .flow-step.done .dot { background: var(--green); color: #fff; }
    .flow-step.fail .dot { background: var(--red); color: #fff; }
    .selfie-preview { width: 100%; max-height: 320px; object-fit: cover; border-radius: 14px; margin-top: 10px; }
    .cam { width: 100%; border-radius: 14px; transform: scaleX(-1); background: #000; }
    .spinner { width: 18px; height: 18px; border: 3px solid var(--brand-soft); border-top-color: var(--brand);
      border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .champ { background: linear-gradient(135deg, #fff6d6, #ffe1ec); border: 1px solid #f3c74e; }
    .champ-name { font-size: 26px; font-weight: 800; margin: 6px 0; color: #9a5b00; }

    /* Month */
    .month-nav { display: flex; align-items: center; justify-content: space-between; }
    .month-nav button { background: var(--brand-soft); color: var(--brand); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; font-weight: 700; flex: none; }
    .month-nav h2 { margin: 0; font-size: 17px; }
    .month-select { flex: 1; margin: 0 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 12px;
      font-weight: 700; font-size: 16px; text-align: center; background: #fff; color: var(--text); }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
    .cal .h { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
    .cal .d { aspect-ratio: 1 / 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 600; position: relative; padding: 0; transition: opacity .15s; }
    .cal .d small { font-size: 9px; font-weight: 600; }
    .cal .d.today { outline: 2px solid var(--brand); }
    .cal .d .late-dot { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
    .cal .d .ot-dot { position: absolute; top: 4px; left: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--ot); }
    .cal .d .flag-dot { position: absolute; bottom: 3px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
    .cal.f-ABSENT .d:not(.m-ABSENT), .cal.f-HALF_DAY .d:not(.m-HALF_DAY),
    .cal.f-OT .d:not(.m-OT), .cal.f-LATE .d:not(.m-LATE) { opacity: .18; }
    .cal.f-OT .d.m-OT { background: var(--ot-soft); color: var(--ot); }
    .cal.f-MISSED .d:not(.m-MISSED) { opacity: .18; }
    .cal .d.m-MISSED { outline: 2px solid var(--red); outline-offset: -2px; }
    .cal .d .miss-mark { position: absolute; bottom: 2px; left: 4px; font-size: 10px; font-weight: 800; color: var(--red); }
    .fchip.fc-MISSED.on { background: var(--red); }
    .alert { background: var(--red-soft); border: 2px solid var(--red); }
    .alert h2 { color: var(--red); }
    .cal.f-LATE .d.m-LATE { background: var(--orange-soft); color: var(--orange); }
    .filters { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; }
    .fchip { padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--gray-soft); color: var(--muted); flex: none; }
    .fchip.on { color: #fff; background: var(--brand); }
    .fchip.fc-ABSENT.on { background: var(--red); } .fchip.fc-HALF_DAY.on { background: var(--amber); }
    .fchip.fc-OT.on { background: var(--ot); } .fchip.fc-LATE.on { background: var(--orange); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .split div { background: var(--green-soft); border-radius: 12px; padding: 12px; }
    .split div:last-child { background: var(--amber-soft); }
    .split span { display: block; font-size: 13px; color: var(--muted); }
    .split b { font-size: 18px; }
    .total-tile { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 14px 16px;
      border-radius: 12px; background: var(--brand-soft); }
    .total-tile span { font-weight: 600; color: var(--brand); }
    .total-tile b { font-size: 22px; }
    table.sum { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    table.sum th { text-align: right; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px; border-bottom: 2px solid var(--line); }
    table.sum td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.sum th:first-child, table.sum td:first-child { text-align: left; }
    table.sum tr { cursor: pointer; }
    table.sum td.red { color: var(--red); }
    table.sum tr.tot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }
    .pay-line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .pay-line:first-child { border-top: 0; }
    .pay-line > :last-child { white-space: nowrap; text-align: right; }
    .rate-line { font-size: 12px; color: var(--muted); padding: 2px 0 8px; }
    .pay-line.total { font-size: 18px; font-weight: 700; border-top: 2px solid var(--line); margin-top: 4px; padding-top: 12px; }

    /* Switch, PF grid */
    .switch { position: relative; width: 48px; height: 28px; flex: none; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--gray-soft); border-radius: 999px; transition: .2s; }
    .switch span:before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span:before { transform: translateX(20px); }
    .pf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .pf-grid label { font-size: 11px; color: var(--muted); }
    .pf-grid input { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; }

    /* Lists */
    .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
    .list-item:first-child { border-top: 0; }
    .list-item .name { font-weight: 600; }
    .list-item .sub { font-size: 12px; color: var(--muted); }
    .list-item .right { text-align: right; flex: none; }
    .link { background: none; color: var(--brand); padding: 0; font-size: 13px; font-weight: 600; }

    .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(20,30,60,.07); overflow-x: auto; }
    .tabs button { flex: 1 0 auto; padding: 10px 14px; border-radius: 10px; background: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .tabs button.on { background: var(--brand); color: #fff; }
    .lang { display: inline-flex; background: var(--gray-soft); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
    .lang button { padding: 6px 14px; border-radius: 8px; background: none; color: var(--muted); font-weight: 600; font-size: 13px; }
    .lang button.on { background: var(--brand); color: #fff; }
    .checklist { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
    .checklist label, label.check { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
    .checklist label + label { border-top: 1px solid var(--line); }
    label.perm { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
    label.perm input, .checklist input, label.check input { width: 20px; height: 20px; flex: none; margin-top: 1px; }

    /* Bottom nav */
    .nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
      display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
    .nav .in { display: flex; width: 100%; max-width: 520px; }
    .nav button { flex: 1; background: none; padding: 10px 4px 12px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
    .nav button .ic { display: block; font-size: 22px; line-height: 1.2; }
    .nav button.on { color: var(--brand); }
    .badge { position: absolute; top: 4px; left: 55%; background: var(--red); color: #fff; border-radius: 999px; font-size: 10px; padding: 1px 6px; }

    /* Modal */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,20,35,.55); display: flex; align-items: flex-end;
      justify-content: center; z-index: 10; }
    .modal .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 20px 16px 28px;
      max-height: 90vh; overflow: auto; }
    .modal img { width: 100%; border-radius: 14px; }
    .upd-pill { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 60; background: #1b2333; color: #fff;
      font-size: 13px; padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: flex; gap: 6px; align-items: center; }
    .upd-pill .spinner { width: 14px; height: 14px; border-width: 2px; }
    .kiosk-msg { text-align: center; padding: 12px; border-radius: 12px; margin: 10px 0; background: var(--bg); font-weight: 600; min-height: 48px; }
    .kiosk-msg.ok { background: var(--green-soft); color: var(--green); }
    .kiosk-msg.big { font-size: 22px; }
    .kiosk-msg.warn { background: var(--amber-soft); color: var(--amber); }
    .kiosk-msg.err { background: var(--red-soft); color: var(--red); }
    .adv-st { font-size: 12px; text-align: left; padding: 0; }
    table.given td:first-child, table.given td.r { white-space: nowrap; }
    table.given { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    table.given th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    table.given td { padding: 5px 6px; border-bottom: 1px dashed var(--line); }
    table.given .r { text-align: right; } table.given tr.tot td { font-weight: 700; border-bottom: 0; }
    .celeb-banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none;
      background: linear-gradient(135deg, #fff6d6, #ffe1ec); color: #9a5b00; border: 1px solid #f3c74e; border-radius: 999px;
      padding: 10px 20px; font-size: 18px; font-weight: 800; box-shadow: 0 6px 22px rgba(0,0,0,.18); white-space: nowrap; max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis; transition: opacity .8s; }
    .celeb-banner.out { opacity: 0; }
    .celeb-sound { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 1000; border: 1px solid #f3c74e;
      background: #fff6d6; color: #9a5b00; border-radius: 999px; padding: 8px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .card.bday { background: linear-gradient(135deg, #fff6d6, #ffe1ec); border: 1px solid #f3c74e; text-align: center; }
    .card.bday .big { font-size: 22px; font-weight: 800; color: #9a5b00; margin: 4px 0; }
    .x-btn { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; flex: none; }
    .day-nav { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 2px; }
    .day-nav b { font-size: 17px; }
    .day-arrow { border: 0; background: var(--brand-soft); color: var(--brand); width: 44px; height: 38px; border-radius: 10px; font-size: 20px; cursor: pointer; }
    .day-arrow:disabled { opacity: .35; cursor: default; }
    .emp-pick { max-width: 320px; margin: 0 auto; font-weight: 700; text-align: center; }
    .slip { width: 100%; height: 60vh; border: 1px solid var(--line); border-radius: 12px; }

    .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #1b2333; color: #fff;
      padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
  </style>
</head>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login hidden">
  <div class="card">
    <h1 id="coName">&nbsp;</h1>
    <p class="center muted" style="margin:0 0 8px">Employee Attendance</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="empId">Employee ID</label>
        <input id="empId" autocapitalize="characters" autocomplete="username" placeholder="e.g. E001" required>
      </div>
      <div class="field">
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" required>
      </div>
      <button class="btn" id="loginBtn" type="submit">Login</button>
      <div id="loginMsg"></div>
    </form>
    <div id="iosTip"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <div class="top">
    <div class="wrap">
      <div>
        <h1 id="hdrName">–</h1>
        <small id="hdrSub"></small>
      </div>
      <div style="display:flex;gap:6px">
        <button class="hbtn" id="btnPin" onclick="openChangePin()">PIN</button>
        <button class="hbtn" id="btnLogout" onclick="doLogout()">Logout</button>
      </div>
    </div>
  </div>
  <div class="wrap pull" id="content"></div>

  <div class="nav">
    <div class="in">
      <button data-tab="home" onclick="go('home')"><span class="ic">⏱</span><span id="navHome">Attendance</span></button>
      <button data-tab="month" onclick="go('month')"><span class="ic">📅</span><span id="navMonth">My Month</span></button>
      <button data-tab="requests" onclick="go('requests')"><span class="ic">📝</span><span id="navReq">Requests</span><span id="reqBadge" class="badge hidden"></span></button>
      <button data-tab="admin" id="navAdmin" class="hidden" onclick="go('admin')"><span class="ic">🛠</span><span id="navAdminLabel">Admin</span><span id="adminBadge" class="badge hidden"></span></button>
    </div>
  </div>
</div>

<div id="loadingView" class="login"><div class="spinner"></div></div>

<input type="file" id="selfieInput" accept="image/*" capture="user" class="hidden">
<div id="updPill" class="upd-pill hidden"><span class="spinner"></span> Updating…</div>
<div id="modal" class="modal hidden" onclick="if (event.target === this) closeModal()"><div class="sheet" id="modalBody"></div></div>

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function chip(status, extra) {
    if (!STATUS[status]) return '';
    return '<span class="chip s-' + status + '">' + t(STATUS[status]) + '</span>' + (extra || '');
  }
  function lateChip(late) { return late ? ' <span class="chip s-LATE">' + t('Late') + '</span>' : ''; }
  /** by = { in: 'Name' | 'Guard (Name)', out: ... }: who marked the check-in / check-out for the employee. */
  function flagChips(flags, by) {
    var list = Array.isArray(flags) ? flags : String(flags || '').split(/\s+/).filter(String);
    by = by || {};
    return list.map(function (f) {
      var who = f === 'PROXY' ? by.in : f === 'PROXY_OUT' ? by.out : null;
      if (who) return ' <span class="chip s-LEAVE">👤 ' + (f === 'PROXY' ? 'Check-in' : 'Check-out') + ' marked by ' + esc(who) + '</span>';
      if (/^OUTSIDE/.test(f)) return ' <span class="chip s-LEAVE">📍 ' + esc(FLAGS[f]) + '</span>';
      if (/^FACE/.test(f)) return ' <span class="chip s-PRESENT">🙂 ' + esc(FLAGS[f]) + '</span>';
      return /^PROXY/.test(f) ? ' <span class="chip s-LEAVE">👤 ' + esc(FLAGS[f]) + '</span>' : ' <span class="chip s-FLAG">⚠ ' + esc(FLAGS[f] || f) + '</span>';
    }).join('');
  }
  function money(n, cur) {
    return (cur || '') + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  /** 850 → '850 m', 12345 → '12.3 km' */
  function dist(m) { m = Number(m); return m >= 1000 ? (Math.round(m / 100) / 10) + ' km' : Math.round(m) + ' m'; }
  function num(n) { return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function hrs(n) { n = Number(n || 0); var h = Math.floor(n), m = Math.round((n - h) * 60); return h + 'h ' + (m < 10 ? '0' : '') + m + 'm'; }
  function mins(n) { n = Math.round(Number(n || 0)); var h = Math.floor(n / 60), m = n % 60; return h ? h + 'h ' + (m < 10 ? '0' : '') + m + 'm' : m + 'm'; }
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function toast(t) {
    var el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
    el.textContent = trMsg(t);
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3500);

  function pad(n) { return ('0' + n).slice(-2); }
  function todayLocal() { var n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); }
  function ymNow() { return todayLocal().slice(0, 7); }
  function ymShift(ym, delta) { var d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + delta, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function addDaysLocal(ds, n) { var p = ds.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addMinutes(hhmm, add) { var t = +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5) + add; t = Math.min(t, 23 * 60 + 59); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }

    if (isHi()) return HI_MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);

    var role = S.profile ? S.profile.role : (S.token ? load('att_role') : null); // att_role: before the first server answer
    return load('att_lang') === 'hi' && (role === 'EMPLOYEE' || role === 'GUARD');

    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  /*
   * Two ways to reach the server:
   *  - opened from the Apps Script /exec link → google.script.run
   *  - hosted page (e.g. GitHub Pages) → fetch() to the /exec URL. No Google cookies are sent, so it
   *    works even when Chrome is signed into several Google accounts.
   * The hosted page finds the server from ?id=<deployment id or /exec URL> (remembered on the phone)
   * or from API_URL below.
   */
  var API_URL = '';
  var COMPANY = document.querySelector('meta[name="company"]').getAttribute('content'); // filled in by Apps Script
  var IN_APPS_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;

  function serverUrl() {
    var id = null;
    try { id = new URLSearchParams(location.search).get('id'); } catch (e) {}
    if (id) store('att_api', id); else {
      id = load('att_api') || API_URL;
      // Keep the id in the address: an iPhone home-screen icon opens the address it was added from, with its
      // own empty storage, so it must carry the id.
      if (id && !IN_APPS_SCRIPT && window.history && history.replaceState) {
        try { history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(id) + location.hash); } catch (e) {}
      }
    }
    if (!id) return null;
    return /^https?:/.test(id) ? id : 'https://script.google.com/macros/s/' + id + '/exec';
  }

  /** Calls a server function and returns a Promise. Handles expired sessions centrally. */
  /** Calls that only read. Any other call changes data, so screens kept in memory are forgotten. */
  var READ_ONLY = /^(get[A-Z]|my[A-Z]|publicInfo$|proxyList$|admin(Today|Holidays|Celebrations|Summary|Month|EmployeeMonth|Requests|Staff|Advances|Employees|EntryOptions|GetEntry|GetSelfie|ExportPayroll|AttendanceRegister|Payslip)$|proxyFaces$|super(ListAdmins|AuditLog)$)/;

  var PAGE_LOADED_AT = Date.now();
  /**
   * A super admin pressed "Refresh everyone's app" (at = server time) after this page was loaded: load the
   * newest page. Each press reloads a phone at most once (remembered on the phone), so a wrong phone clock
   * can never cause a reload loop.
   */
  function checkRefresh(at) {
    var seen = S.seenRefreshAt;
    if (!seen) S.seenRefreshAt = at;
    if (seen ? at <= seen : (at <= PAGE_LOADED_AT || load('att_reloaded') === String(at))) return;
    reloadApp(at);
  }
  /** Loads the page again from a fresh URL (no cached copy), never in the middle of a check-in or a pop-up. */
  function reloadApp(at) {
    if (S.reloading || S.flow || !$('modal').classList.contains('hidden')) return;
    S.reloading = true; store('att_reloaded', String(at));
    try { var u = new URL(location.href); u.searchParams.set('_r', Date.now()); location.replace(u.toString()); }
    catch (e) { location.reload(); }
  }

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!READ_ONLY.test(fn)) { S.viewCache = {}; S.monthCache = {}; S.reqCache = null; }
    var fail = function (err) {
      var msg = (err && err.message) || String(err);
      if (msg.indexOf('SESSION_EXPIRED') >= 0) { toast('Session expired. Please login again.'); showLogin(); }
      return Promise.reject(new Error(msg.replace(/^Exception:\s*/, '')));
    };
    if (IN_APPS_SCRIPT) {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
      }).catch(fail);
    }
    var url = serverUrl();
    if (!url) return fail(new Error('App link is incomplete. Open the link your company shared with you.'));
    // Google sometimes answers with a 404/5xx page or drops the reply. Retry up to 3 more times; the request
    // id makes a retry safe (the server returns the first answer instead of repeating a check-in etc.).
    var body = JSON.stringify({ fn: fn, args: args, rid: newRid(), pv: NEEDS_SERVER });
    var attempt = function (n) {
      return postOnce(url, body).catch(function (err) {
        if (!err.retry || n >= 3) throw err;
        return wait([700, 1500, 3000][n]).then(function () { return attempt(n + 1); });
      });
    };
    return attempt(0).catch(function (err) {
      return err.network ? diagnose(url).then(function (msg) { throw new Error(msg || err.message); }) : Promise.reject(err);
    }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'Something went wrong.');
      if (res.refreshAt && READ_ONLY.test(fn)) checkRefresh(res.refreshAt);
      return res.result;
    }).catch(fail);
  }

  /**
   * After a request could not reach the server at all, find out why:
   * - the ping works → it was a passing problem;
   * - Google answers but blocks the app → the Apps Script deployment is not public (or the link has a wrong ID);
   * - nothing answers → the phone is offline.
   */
  function diagnose(url) {
    return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'ping=1', { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (j) { return j && j.ok ? 'The server did not answer in time. Please try again.' : null; })
      .catch(function () {
        return fetch(url, { mode: 'no-cors', credentials: 'omit' }).then(function () {
          return 'The app server is not set up correctly. Admin: in Apps Script open Deploy → Manage deployments → ✏ Edit, ' +
            'set "Execute as: Me" and "Who has access: Anyone", choose "New version" and Deploy. ' +
            'Also make sure the link contains that deployment\'s ID.';
        }, function () {
          return 'No internet connection. Please check your mobile data / Wi-Fi and try again.';
        });
      });
  }

  function postOnce(url, body) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 40000) : null;
    var retryable = function (msg) { var e = new Error(msg); e.retry = true; return e; };
    return fetch(url, {
      method: 'POST', credentials: 'omit', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // a "simple" request: no CORS pre-flight
      body: body
    }).then(function (r) {
      if (!r.ok) throw retryable('The server is busy (' + r.status + '). Please try again in a moment.');
      return r.text().then(function (t) {
        try { return JSON.parse(t); } catch (e) {
          var err = retryable('The server is busy. Please try again in a moment.');
          err.network = true; // got a Google page instead of the app's answer: check why after the retries
          throw err;
        }
      });
    }, function () {
      var e = retryable('No internet connection, or the server could not be reached. Please try again.');
      e.network = true;
      throw e;
    }).then(function (res) { clearTimeout(timer); return res; }, function (e) { clearTimeout(timer); throw e; });
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function newRid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12); }

  function appBack() {
    if (!$('modal').classList.contains('hidden')) { closeModal(); return 'handled'; }

  function loadHome() {
    var sentAt = Date.now();
    if (S.prefetchedHome) { var pre = S.prefetchedHome; S.prefetchedHome = null; return showHome(pre, sentAt); }
    if (!S.home) {
      // App just opened: draw the last home screen saved on the phone (buttons wait for the server).
      var saved = null;
      try { saved = JSON.parse(load('att_home') || 'null'); } catch (e) { saved = null; }
      if (saved && saved.t === S.token && saved.h && saved.h.today === todayLocal()) {
        saved.h.fromPhone = true; S.tab === 'home' && showHome(saved.h, sentAt);
      }
    }
    // Show the last screen at once (buttons wait), then refresh from the server.
    if (S.home && S.home.today === todayLocal()) { S.homeStale = true; renderHome(); } else setLoading();
    api('getHome', S.token).then(function (h) { showHome(h, sentAt); })
      .catch(function (e) { if (S.home && S.homeStale) { S.homeStale = false; renderHome(); toast(e.message); } else setError(e, "loadHome()"); });
  }

      S.homeStale = false;

  /** True when the phone's clock and time zone match the server (i.e. automatic time is on). */
  function phoneTimeOk() {
    var srv = S.home.server, tol = Math.max(1, S.home.clockTolerance || 3) * 60000;
    var elapsed = Date.now() - S.homeLoadedAt;
    var epochDiff = Math.abs(S.homeLoadedPhoneEpoch - srv.epoch);
    var wallDiff = Math.abs(wallMs(phoneClock().local) - (wallMs(srv.local) + elapsed));
    return epochDiff <= tol && wallDiff <= tol;
  }

    if (!NATIVE || !info || !(info.minAppVersion > 0) || $('updateWall')) return;
    var m = /(\d+)\s*$/.exec(String(NATIVE.version ? NATIVE.version() : ''));
    var mine = m ? +m[1] : 0;
    if (mine >= info.minAppVersion) return;
    var w = document.createElement('div');
    w.id = 'updateWall'; w.className = 'login';
    w.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg)';

      '<button class="btn" id="updNow">' + t('Update now') + '</button>' +
      '<p class="muted small">' + t('update.how') + '</p></div>';

  /** Watches GPS for up to 15 s and returns the most accurate reading. */
  function getBestPosition(targetAcc) {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error('This browser does not support location.'));
      var best = null, done = false, watchId;
      function finish() {
        if (done) return; done = true;
        navigator.geolocation.clearWatch(watchId); clearTimeout(timer);
        best ? resolve(best) : reject(new Error('Could not get your location. Turn on GPS and try again.'));
      }
      var timer = setTimeout(finish, 15000);
      watchId = navigator.geolocation.watchPosition(function (pos) {
        var c = pos.coords;
        if (!best || c.accuracy < best.accuracy) best = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
        if (c.accuracy <= Math.min(targetAcc, 20)) finish();
      }, function (err) {
        if (done) return;
        if (err.code === 1) { done = true; clearTimeout(timer); navigator.geolocation.clearWatch(watchId);
          reject(new Error('Location permission denied. Allow location for this site in your browser settings and try again.')); }
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    });
  }

  function distance(lat1, lng1, lat2, lng2) {
    var R = 6371000, toRad = function (x) { return x * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    var a = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.pow(Math.sin(dLng / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function compressImage(file, maxSize, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  }

  /** Salary, OT amount and total for one day (only where the month's pay is shown). */
  function dayMoneyHtml(m, d) {
    var p = m.pay;
    if (!p || !p.perDay || d.planned || ['UPCOMING', 'NOT_MARKED'].indexOf(d.status) >= 0) return '';
    var share = { PRESENT: 1, WORKING: 1, HALF_DAY: 0.5, LEAVE: 1, WEEK_OFF: 1, HOLIDAY: 1, OFF_WORK: 1 + (d.offCredit || 0) }[d.status] || 0;
    var cur = m.currency || '₹';
    var salary = Math.round(p.perDay * share);
    var otMin = d.dayOtMin !== undefined ? d.dayOtMin : (d.otMin || 0);
    var ot = Math.round(otMin * (p.hourly || 0) / 60 * ((m.rules && m.rules.otMultiplier) || 1));
    if (d.shortCutMin) { otMin = -d.shortCutMin; ot = -Math.round(d.shortCutMin * (p.hourly || 0) / 60); } // cut from salary (no hourly OT)
    var sign = function (n) { return (n < 0 ? '−' : '') + money(Math.abs(n), cur); };
    var html = '<div class="kv" style="margin-top:10px">' +
      '<div><b>' + money(salary, cur) + '</b><span>' + t('Salary for the day') + '</span></div>' +
      (ot < 0 ? '<div><b style="color:var(--red)">' + sign(ot) + '</b><span>' + t(shortLabel(d)) + ' (' + mins(-otMin) + ')</span></div>'
        : '<div class="k-ot"><b>' + sign(ot) + '</b><span>' + t('OT amount') + '</span></div>') +
      '<div><b style="color:var(' + (salary + ot < 0 ? '--red' : '--green') + ')">' + sign(salary + ot) + '</b><span>' + t('Total for the day') + '</span></div></div>';

  /* ---------------- Payslip ---------------- */
  function openPayslip(ym, empId) {
    openModal('<div class="center"><div class="spinner"></div></div>');
    api('getPayslip', S.token, ym, empId || null, false).then(function (r) {
      S.slip = { ym: ym, empId: empId || null, fileName: r.fileName, html: r.html };
      openModal('<iframe id="slipFrame" class="slip"></iframe>' +
        '<div class="btns"><button class="btn" id="slipPdf" onclick="downloadPayslip()">' + t('⬇ Download PDF') + '</button>' +
        '<button class="btn ghost" onclick="printPayslip()">' + t('🖨 Print') + '</button></div>' +
        '<button class="btn ghost" onclick="closeModal()">' + t('Close') + '</button>');
      $('slipFrame').srcdoc = r.html;
    }).catch(function (e) { openModal(errBox(e) + '<button class="btn ghost" onclick="closeModal()">' + t('Close') + '</button>'); });
  }
  /** Inside the Android app (APK) files and printing go through the app; see android/MainActivity.java. */
  var NATIVE = window.AttendanceApp || null;

  function printPayslip() {
    if (NATIVE) { NATIVE.print(S.slip.html, S.slip.fileName.replace(/\.pdf$/i, '')); return; }
    try { $('slipFrame').contentWindow.focus(); $('slipFrame').contentWindow.print(); }
    catch (e) { toast(t('Printing is not available here. Use Download PDF.')); }
  }
  function downloadPayslip() {
    var sl = S.slip; $('slipPdf').disabled = true;
    api('getPayslip', S.token, sl.ym, sl.empId, true).then(function (r) {
      if (NATIVE) { NATIVE.saveFile(r.pdf, r.fileName, 'application/pdf'); return; }
      var bin = atob(r.pdf), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = r.fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    }).catch(function (e) { toast(e.message); }).then(function () { var b = $('slipPdf'); if (b) b.disabled = false; });
  }

  /* ---------------- Employee requests ---------------- */
  function loadMyRequests() {
    var cached = S.reqCache;
    if (cached) { renderMyRequests(JSON.parse(cached)); updating(true); } else setLoading();
    api('myRequests', S.token).then(function (list) {
      updating(false);
      var json = JSON.stringify(list);
      if (S.tab !== 'requests' || json === cached) return;
      S.reqCache = json;
      renderMyRequests(list);
    }).catch(function (e) { updating(false); if (cached) toast(e.message); else setError(e, 'loadMyRequests()'); });
  }

  function renderMyRequests(list) {
    var today = todayLocal();
    var html = '<div class="card"><h2>' + t('New request') + '</h2>' +
      '<div class="field"><label>' + t('Type') + '</label><select id="rqType" class="inp" onchange="toggleReqType()">' +
      '<option value="LEAVE">' + t('Leave') + '</option><option value="CORRECTION">' + t('Attendance correction (forgot check-in / check-out)') + '</option>' +
      '<option value="ADVANCE">' + t('Salary advance') + '</option></select></div>' +
      '<div id="rqAdv" class="hidden"><div class="grid2"><div class="field"><label>' + t('Amount needed') + '</label><input id="rqAmt" class="inp" inputmode="decimal" placeholder="' + t('e.g. 10000') + '"></div>' +
      '<div class="field"><label>' + t('Deduct per month (suggested)') + '</label><input id="rqMon" class="inp" inputmode="decimal" placeholder="' + t('e.g. 2000') + '"></div></div></div>' +
      '<div id="rqLeave"><div class="grid2"><div class="field"><label>' + t('From') + '</label><input id="rqFrom" class="inp" type="date" value="' + today + '" onchange="leaveDatesChanged(true)"></div>' +
      '<div class="field"><label>' + t('To') + '</label><input id="rqTo" class="inp" type="date" value="' + today + '" onchange="leaveDatesChanged(false)"></div></div>' +
      '<div id="rqDays" class="msg info" style="margin-top:8px"></div></div>' +
      '<div id="rqCorr" class="hidden"><div class="field"><label>' + t('Date') + '</label><input id="rqDate" class="inp" type="date" max="' + today + '" value="' + today + '"></div>' +
      '<div class="grid2"><div class="field"><label>' + t('Correct check-in') + '</label><input id="rqIn" class="inp" type="time"></div>' +
      '<div class="field"><label>' + t('Correct check-out') + '</label><input id="rqOut" class="inp" type="time"></div></div>' +
      '<p class="muted small" style="margin:6px 0 0">' + t('Leave a time empty to keep what is already recorded.') + '</p></div>' +
      '<div class="field"><label>' + t('Reason') + '</label><textarea id="rqReason" class="inp" placeholder="' + t('Why?') + '"></textarea></div>' +

    html += '<div class="card"><h2>' + t('My requests') + '</h2>';
    if (!list.length) html += '<p class="muted">' + t('No requests yet.') + '</p>';
    list.forEach(function (r) {
      html += '<div class="list-item"><div><div class="name">' + reqTitle(r) + '</div>' +
        '<div class="sub">' + esc(r.reason) + '</div>' +
        (r.remark ? '<div class="sub">' + t('Admin: {r}', { r: esc(r.remark) }) + '</div>' : '') + '</div>' +
        '<div class="right">' + chip(r.status) +
        (r.status === 'PENDING' ? '<div><button class="link" style="color:var(--red)" onclick="cancelMyRequest(\'' + esc(r.id) + '\')">' + t('Cancel') + '</button></div>' : '') + '</div></div>';
    });
    html += '</div>';
    $('content').innerHTML = html;
    leaveDatesChanged(false);
  }

  /** Keeps "To" on or after "From" and shows which days the leave covers. */
  function leaveDatesChanged(fromChanged) {
    var f = $('rqFrom'), to = $('rqTo');
    if (!f || !to) return;
    if (f.value && (!to.value || to.value < f.value)) to.value = f.value;
    to.min = f.value;
    var n = f.value && to.value ? Math.round((new Date(to.value) - new Date(f.value)) / 86400000) + 1 : 0;
    $('rqDays').innerHTML = n > 0 ? t('Leave for <b>{n} day(s)</b>: {d}', { n: n, d: esc(fmtDate(f.value)) + (n > 1 ? ' – ' + esc(fmtDate(to.value)) : '') }) : '';
  }

  function reqTitle(r) {
    if (r.type === 'ADVANCE') return t('Salary advance {amt}{mon}', { amt: money(r.amount, '₹'), mon: r.monthly ? ' · ' + money(r.monthly, '₹') + t('/month') : '' });
    if (r.type === 'LEAVE') return t(r.leaveType === 'UNPAID' ? 'Unpaid leave · {d}' : r.leaveType === 'PAID' ? 'Paid leave · {d}' : 'Leave · {d}', { d: esc(fmtDate(r.from)) + (r.to !== r.from ? ' – ' + esc(fmtDate(r.to)) : '') });
    return t('Correction · {d} · {i} → {o}', { d: esc(fmtDate(r.from)), i: esc(r.in || '—'), o: esc(r.out || '—') });
  }
  function toggleReqType() {
    var t = $('rqType').value;
    $('rqLeave').classList.toggle('hidden', t !== 'LEAVE');
    $('rqCorr').classList.toggle('hidden', t !== 'CORRECTION');
    $('rqAdv').classList.toggle('hidden', t !== 'ADVANCE');
  }
  function sendRequest() {
    var type = $('rqType').value;
    var req = type === 'LEAVE'
      ? { type: 'LEAVE', from: $('rqFrom').value, to: $('rqTo').value, reason: $('rqReason').value }
      : type === 'ADVANCE'
        ? { type: 'ADVANCE', amount: $('rqAmt').value, monthly: $('rqMon').value, reason: $('rqReason').value }
        : { type: 'CORRECTION', from: $('rqDate').value, in: $('rqIn').value, out: $('rqOut').value, reason: $('rqReason').value };
    if (type === 'LEAVE' && req.from && req.to && !confirm($('rqDays').textContent + '. ' + t('Send this leave request?'))) return;
    $('rqBtn').disabled = true;
    api('submitRequest', S.token, req).then(function (list) { renderMyRequests(list); toast(t('Request sent')); })
      .catch(function (e) { $('rqBtn').disabled = false; $('rqMsg').innerHTML = errBox(e); });
  }
  function cancelMyRequest(id) {
    if (!confirm(t('Cancel this request?'))) return;
    api('cancelRequest', S.token, id).then(renderMyRequests).catch(function (e) { toast(e.message); });
  }

  /* ---------------- Admin ---------------- */

    { key: 'mark', label: 'Mark Attendance', perm: 'markOthers', load: function () { loadProxy(); } },

    { key: 'summary', label: 'Monthly Summary', perm: 'viewSummary', load: function () { loadSummary(S.admin.sumYm || ymNow()); } },
    { key: 'payroll', label: 'Payroll', perm: 'viewPayroll', load: function () { loadAdminMonth(S.admin.ym || ymNow()); } },
    { key: 'requests', label: 'Requests', perm: ['approveRequests', 'manageAdvances'], load: function () { loadAdminRequests(); } },

    { key: 'log', label: 'Activity', perm: 'superAdmin', load: function () { loadAudit(); } }
  ];
  function can(perm) {
    if (Array.isArray(perm)) return perm.some(can);
    return !!(S.profile && S.profile.perms && S.profile.perms[perm]);
  }

  function renderAdmin() {
    var a = S.admin;
    var tabs = ADMIN_TABS.filter(function (t) { return can(t.perm); });
    if (!tabs.length) { setError('You have no admin permissions yet. Ask the super admin.'); return; }
    if (!tabs.some(function (t) { return t.key === a.tab; })) a.tab = tabs[0].key;
    var html = '<div class="tabs">' + tabs.map(function (tb) {
      return '<button class="' + (a.tab === tb.key ? 'on' : '') + '" onclick="adminTab(\'' + tb.key + '\')">' + t(tb.label) + '</button>';
    }).join('') + '</div>' + serverOldHtml() + '<div id="adminBody"></div>';
    $('content').innerHTML = html;
    var on = document.querySelector('.tabs .on');
    if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
    S.reloadAfterEntry = null;
    tabs.filter(function (t) { return t.key === a.tab; })[0].load();
  }
  function adminTab(tb) { if (S.admin.tab !== tb) navPush(); S.admin.tab = tb; renderAdmin(); }
  function adminBody(html) { var el = $('adminBody'); if (el) el.innerHTML = html; }

  /**
   * Loads an admin screen. A screen seen before is drawn at once from the last answer, then quietly
   * replaced when the server answers (only if something changed). An answer for a screen the admin has
   * already left is dropped.
   */
  function adminFetch(key, fn, args, render) {
    S.viewCache = S.viewCache || {};
    var seq = S.adminSeq = (S.adminSeq || 0) + 1, cached = S.viewCache[key];
    if (cached) { render(JSON.parse(cached)); updating(true); } else adminLoading();
    api.apply(null, [fn, S.token].concat(args)).then(function (r) {
      if (seq !== S.adminSeq) return;
      updating(false);
      var json = JSON.stringify(r);
      if (json === cached) return;
      S.viewCache[key] = json;
      render(r);
    }).catch(function (e) {
      if (seq !== S.adminSeq) return;
      updating(false);
      if (cached) toast(e.message); else adminErr(e);
    });
  }
  /** Small "Updating…" note while a screen drawn from memory is being refreshed. */
  function updating(on) { var el = $('updPill'); if (el) el.classList.toggle('hidden', !on); }
  function adminLoading() { adminBody('<div class="card center"><div class="spinner"></div></div>'); }
  function adminErr(e) { adminBody('<div class="card">' + errBox(e) + '</div>'); }

  /* ---------- Mark attendance for others (no smartphone / forgot phone) ---------- */
  function loadProxy() {
    adminLoading();
    var sentAt = Date.now();
    api('proxyList', S.token).then(function (r) {
      S.proxy = { data: r, filter: '', pos: S.proxy && S.proxy.pos, loadedAt: Date.now(),
        phoneEpoch: Math.round((sentAt + Date.now()) / 2) };
      renderProxy();
      if (!proxyPosFresh()) proxyLocate();
    }).catch(adminErr);
  }

  function proxyPosFresh() { var p = S.proxy && S.proxy.pos; return p && !p.error && Date.now() - p.at < 3 * 60000; }

  /** Phone clock check, same rule as the employee's own check-in. */
  function proxyTimeOk() {
    var P = S.proxy, d = P.data, tol = Math.max(1, d.clockTolerance || 3) * 60000;
    var elapsed = Date.now() - P.loadedAt;
    return Math.abs(P.phoneEpoch - d.server.epoch) <= tol &&
      Math.abs(wallMs(phoneClock().local) - (wallMs(d.server.local) + elapsed)) <= tol;
  }

  function proxyLocate() {
    var o = S.proxy.data.office;
    S.proxy.pos = { locating: true };
    renderProxyLoc();
    getBestPosition(o.maxAccuracy).then(function (p) {
      p.at = Date.now();
      p.distance = distance(p.lat, p.lng, o.lat, o.lng);
      if (o.lat == null) p.error = t('Office location is not set yet.');
      else if (p.accuracy > o.maxAccuracy) p.error = 'GPS signal is weak (±' + Math.round(p.accuracy) + ' m). Move near a window or open area.';
      else if (p.distance > o.radius) p.error = 'This phone is ' + Math.round(p.distance) + ' m from the office. It must be within ' + o.radius + ' m.';
      S.proxy.pos = p; renderProxyLoc();
    }).catch(function (e) { S.proxy.pos = { error: e.message }; renderProxyLoc(); });
  }

  function renderProxyLoc() {
    var el = $('pxLoc'); if (!el) return;
    var p = S.proxy.pos || {};
    el.innerHTML = p.locating ? '<span class="spinner"></span> <span class="muted">' + t("Checking this phone's location…") + '</span>'
      : p.error ? errBox(p.error) + '<button class="btn small ghost" style="margin-top:8px" onclick="proxyLocate()">' + t('Retry location') + '</button>'
      : '<div class="row"><span>📍 <b style="color:var(--green)">' + t('At office') + '</b> <span class="muted small">' + Math.round(p.distance) + ' m · ±' + Math.round(p.accuracy) + ' m</span></span>' +
        '<button class="link" onclick="proxyLocate()">' + t('Refresh') + '</button></div>';
  }

  function renderProxy() {
    var r = S.proxy.data, q = (S.proxy.filter || '').toLowerCase();
    var sw = langSwitch(); // guards only (admins see English)
    var html = '<div class="card">' + (sw ? '<div class="center">' + sw + '</div>' : '') + '<h2>' + t('Mark attendance for others') + '</h2>' +
      '<p class="muted small" style="margin:-6px 0 8px">' + t('proxy.info') + '</p>' +
      (proxyTimeOk() ? '' : '<div class="msg err">' + t('proxy.badtime') + '</div>') +
      '<div id="pxLoc"></div>' +
      (faceSupported() ? '<button class="btn green" style="margin-top:10px" onclick="kioskStart()">' + t('🙂 Scan faces (auto check in / out)') + '</button>' : '') + '</div>';
    html += '<div class="card"><input class="inp" id="pxSearch" placeholder="' + t('🔍 Search name or ID') + '" value="' + esc(S.proxy.filter || '') + '" oninput="S.proxy.filter=this.value;renderProxyList()">' +
      '<div id="pxList" style="margin-top:8px"></div></div>';
    adminBody(html);
    renderProxyLoc();
    renderProxyList();
    if (q) { var si = $('pxSearch'); si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
  }

  function proxyByText(by) {
    by = by || {};
    if (by.in && by.out && by.in !== by.out) return t('in by {a}, out by {b}', { a: esc(by.in), b: esc(by.out) });
    return t('marked by {n}', { n: esc(by.in || by.out || t('someone else')) });
  }
  function renderProxyList() {
    var r = S.proxy.data, q = (S.proxy.filter || '').toLowerCase().trim();
    var list = r.list.filter(function (e) { return !q || e.name.toLowerCase().indexOf(q) >= 0 || e.id.toLowerCase().indexOf(q) >= 0; });
    var html = list.length ? '' : '<p class="muted">' + t('No employees found.') + '</p>';
    list.forEach(function (e) {
      var i = r.list.indexOf(e);
      var btn = !e.in ? '<button class="btn small green" onclick="proxyMark(' + i + ',\'in\',this)">' + t('Check In') + '</button>'
        : !e.out ? '<button class="btn small red" onclick="proxyMark(' + i + ',\'out\',this)">' + t('Check Out') + '</button>'
        : (e.date === r.date && e.out > e.in ? '<button class="btn small ghost" onclick="proxyMark(' + i + ',\'again\',this)">' + t('In again') + '</button>'
          : '<span class="chip s-PRESENT">' + t('✓ Done') + '</span>');
      html += '<div class="list-item"><div><div class="name">' + esc(e.name) + ' <span class="muted" style="font-weight:400">' + esc(e.id) + '</span></div>' +
        '<div class="sub">' + (e.in ? t('In {t}', { t: esc(e.in) }) + (e.out ? ' · ' + t('Out {t}', { t: esc(e.out) }) : '') + (e.date !== r.date ? ' (' + esc(fmtDate(e.date)) + ')' : '') : t('Not checked in')) +
        (e.byOther ? ' · 👤 ' + proxyByText(e.markedBy) : '') + '</div></div><div class="right">' + btn + '</div></div>';
    });
    $('pxList').innerHTML = html;
  }

  function proxyMark(i, mode, btn) {
    var e = S.proxy.data.list[i];
    if (!proxyTimeOk()) return toast(t('Phone time is not correct. Turn on automatic date & time.'));
    if (!proxyPosFresh()) { proxyLocate(); return toast(t('Checking location… tap again in a moment')); }
    if (mode === 'in') return proxyPhoto(i); // check-in needs a photo of the employee first
    if (mode === 'again') {
      if (!confirm(t('{n} is back in the office? Check in again now.', { n: e.name }))) return;
      return proxySubmit(i, 'again', btn, null);
    }
    if (!confirm(t('Check out {n} now?', { n: e.name }))) return;
    proxySubmit(i, mode, btn, null);
  }

  /* Photo of the employee for a check-in marked by someone else (compulsory). Front camera first (🔄 switches). */
  /*
   * "Scan faces" on the guard's phone: the camera stays on; each recognised employee is marked at once —
   * Check In, Check Out or In again, from their status — with a small proof photo. The same person is not
   * marked again for 2 minutes. Faces that are not registered / not recognised: use the list (with photo).
   */
  function kioskStart(facing) {
    var K = S.kiosk = { active: true, facing: facing || 'user', faces: null, recent: {}, busy: false, unknownSince: 0 };
    openModal('<div class="row"><h2 style="margin:0">' + t('🙂 Scan faces') + '</h2><button class="x-btn" onclick="kioskStop()" aria-label="Close">✕</button></div>' +
      '<video id="kioskVideo" class="cam" autoplay playsinline muted' + (K.facing === 'user' ? '' : ' style="transform:none"') + '></video>' +
      '<div id="kioskMsg" class="kiosk-msg"><span class="spinner"></span> ' + t('Starting face recognition…') + '</div>' +
      '<div class="btns"><button class="btn ghost" onclick="kioskStart(\'' + (K.facing === 'user' ? 'environment' : 'user') + '\')">' + t('🔄 Switch camera') + '</button>' +
      '<button class="btn ghost" onclick="kioskStop()">' + t('Close') + '</button></div>');
    if (!proxyPosFresh()) proxyLocate();
    Promise.all([loadFace(), openCamera('kioskVideo', K.facing), api('proxyFaces', S.token)]).then(function (res) {
      if (S.kiosk !== K) return;
      K.faces = res[2];
      if (!K.faces.list.length) return kioskMsg('warn', t('No faces are registered yet. Ask the admin to register faces (Employees → Edit).'));
      kioskMsg('', t('Look at the camera'));
      kioskLoop(K);
    }).catch(function (err) { if (S.kiosk === K) kioskMsg('err', err.message); });
  }
  function kioskStop() { if (S.kiosk) S.kiosk.active = false; S.kiosk = null; closeModal(); renderProxyList(); }
  function kioskMsg(kind, html) { var el = $('kioskMsg'); if (el) { el.className = 'kiosk-msg ' + (kind || ''); el.innerHTML = html; } }
  function kioskLoop(K) {
    if (S.kiosk !== K || !K.active || $('modal').classList.contains('hidden')) { if (S.kiosk === K) S.kiosk = null; return; }
    if (K.busy) return setTimeout(function () { kioskLoop(K); }, 200);
    var v = $('kioskVideo');
    faceRead(v).then(function (r) {
      if (S.kiosk !== K) return;
      if (!r) { K.unknownSince = 0; if (!K.hold || Date.now() > K.hold) kioskMsg('', t('Look at the camera')); }
      else {
        var best = null, second = 9;
        K.faces.list.forEach(function (p) {
          var d = faceDist(r.d, p.d);
          if (!best || d < best.dist) { if (best) second = best.dist; best = { p: p, dist: d }; } else if (d < second) second = d;
        });
        // Mark only when sure: close enough, clearly closer than anyone else, and the same person in 2 looks in a row.
        var sure = best && best.dist < (K.faces.distance || FACE_MAX) && second - best.dist >= 0.08;
        if (sure) {
          K.unknownSince = 0;
          if (K.lastId === best.p.id) { K.lastId = null; return kioskMark(K, best.p, best.dist, v); }
          K.lastId = best.p.id; return setTimeout(function () { kioskLoop(K); }, 60);
        }
        K.lastId = null;
        K.unknownSince = K.unknownSince || Date.now();
        if (Date.now() - K.unknownSince > 4000) kioskMsg('err', t('Face not recognised. Close this and use the list below (with photo).'));
      }
      setTimeout(function () { kioskLoop(K); }, 150);
    }).catch(function (err) { kioskMsg('err', err.message); setTimeout(function () { kioskLoop(K); }, 1000); });
  }
  function kioskMark(K, p, dist, v) {
    var next = function (ms) { setTimeout(function () { kioskLoop(K); }, ms); };
    if (K.recent[p.id] && Date.now() - K.recent[p.id] < 120000) {
      kioskMsg('ok', '✓ ' + esc(p.name) + ' — ' + t('already marked just now')); K.hold = Date.now() + 1500; return next(800);
    }
    var row = (S.proxy.data.list || []).filter(function (x) { return x.id === p.id; })[0];
    if (!row) { kioskMsg('err', esc(p.name) + ': ' + t('not in your list today')); return next(1500); }
    var mode = !row.in ? 'in' : !row.out ? 'out' : (row.date === S.proxy.data.date && row.out > row.in ? 'again' : null);
    if (!mode) { kioskMsg('ok', '✓ ' + esc(p.name) + ' — ' + t('already done for today')); K.recent[p.id] = Date.now(); return next(1500); }
    var pos = S.proxy.pos;
    if (!pos || pos.error || pos.locating) { kioskMsg('warn', t('Checking location… one moment')); if (!pos || pos.error) proxyLocate(); return next(1500); }
    if (!proxyPosFresh()) proxyLocate(); // refresh in the background for the next people
    K.busy = true;
    var photo = facePhoto(v, K.facing === 'user'), face = { dist: Math.round(dist * 1000) / 1000 };
    kioskMsg('', '<span class="spinner"></span> ' + esc(p.name) + '…');
    var call = mode !== 'out' ? api('proxyCheckIn', S.token, p.id, pos.lat, pos.lng, pos.accuracy, phoneClock(), photo, face)
      : api('proxyCheckOut', S.token, p.id, pos.lat, pos.lng, pos.accuracy, phoneClock(), photo, face);
    call.then(function (res) {
      K.recent[p.id] = Date.now(); K.busy = false;
      S.proxy.data.list = res.list;
      var what = res.again ? t('back in at {t}', { t: res.time }) : mode === 'in' ? t('checked in at {t}', { t: res.time }) + (res.late ? t(' (Late)') : '')
        : t('checked out at {t}', { t: res.time });
      kioskMsg('ok big', '✓ ' + esc(p.name) + '<br><small>' + what + '</small>');
      K.hold = Date.now() + 2500; next(2500);
    }).catch(function (err) {
      K.busy = false; K.recent[p.id] = Date.now() - 90000; // try this person again in 30 s
      kioskMsg('err', esc(p.name) + ': ' + esc(err.message)); next(2500);
    });
  }

  function proxyPhoto(i) {
    S.pxPhoto = { i: i, data: null, facing: 'user' };
    proxyCamera();
  }
  function proxyCamera() {
    var ph = S.pxPhoto, e = S.proxy.data.list[ph.i];
    stopCamera();
    var head = '<h2 style="margin-top:0">' + t('Photo of {n}', { n: esc(e.name) }) + '</h2><p class="muted small" style="margin:-6px 0 8px">' + t('proxy.photo') + '</p>';
    var live = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (!live) { openModal(head + '<div class="center"><div class="spinner"></div></div>'); return proxyPhotoFile(); }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: ph.facing, width: { ideal: 720 } }, audio: false }).then(function (stream) {
      S.camStream = stream;
      openModal(head + '<video id="camVideo" class="cam" autoplay playsinline muted' + (ph.facing === 'user' ? '' : ' style="transform:none"') + '></video>' +
        '<button class="btn green" onclick="proxySnap()">' + t('📸 Take Photo') + '</button>' +
        '<div class="btns"><button class="btn ghost" onclick="S.pxPhoto.facing=S.pxPhoto.facing===\'user\'?\'environment\':\'user\';proxyCamera()">' + t('🔄 Switch camera') + '</button>' +
        '<button class="btn ghost" onclick="closeModal()">' + t('Cancel') + '</button></div>');
      $('camVideo').srcObject = stream;
    }).catch(function () { openModal(head + '<div class="center"><div class="spinner"></div></div>'); proxyPhotoFile(); });
  }
  function proxyPhotoFile() {
    var inp = $('selfieInput');
    inp.setAttribute('capture', S.pxPhoto.facing); inp.value = ''; inp.click();
  }
  function proxySnap() {
    var v = $('camVideo'), ph = S.pxPhoto;
    if (!v || !v.videoWidth) return toast(t('Camera is starting, try again'));
    var scale = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
    var c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    var ctx = c.getContext('2d');
    if (ph.facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); } // mirror like the preview
    ctx.drawImage(v, 0, 0, c.width, c.height);
    proxyPhotoReady(c.toDataURL('image/jpeg', 0.72));
  }
  function proxyPhotoReady(dataUrl) {
    var ph = S.pxPhoto, e = S.proxy.data.list[ph.i];
    ph.data = dataUrl;
    stopCamera();
    openModal('<h2 style="margin-top:0">' + t('Photo of {n}', { n: esc(e.name) }) + '</h2><img class="selfie-preview" src="' + dataUrl + '">' +
      '<button class="btn green" id="pxConfirm" onclick="proxySubmit(S.pxPhoto.i,\'in\',this,S.pxPhoto.data)">' + t('Check In {n}', { n: esc(e.name) }) + '</button>' +
      '<div class="btns"><button class="btn ghost" onclick="proxyCamera()">' + t('Retake') + '</button><button class="btn ghost" onclick="closeModal()">' + t('Cancel') + '</button></div>');
  }

  function proxySubmit(i, mode, btn, photo) {
    var e = S.proxy.data.list[i];
    if (mode === 'in' && !photo) return toast(t('A photo is required to check in.'));
    var again = mode === 'again';
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    var p = S.proxy.pos;
    var call = mode !== 'out' ? api('proxyCheckIn', S.token, e.id, p.lat, p.lng, p.accuracy, phoneClock(), photo)
      : api('proxyCheckOut', S.token, e.id, p.lat, p.lng, p.accuracy, phoneClock());
    call.then(function (r) {
      if (mode === 'in') { S.pxPhoto = null; closeModal(); }
      S.proxy.data.list = r.list;
      renderProxyList();
      toast(again ? t('{n} back in at {t}', { n: e.name, t: r.time }) : mode === 'in' ? t('{n} checked in at {t}', { n: e.name, t: r.time }) + (r.late ? t(' (Late)') : '')
        : t('{n} checked out at {t} · {w}', { n: e.name, t: r.time, w: hrs(r.worked) }));
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = again ? t('In again') : mode === 'in' ? t('Check In {n}', { n: e.name }) : t('Check Out'); toast(err.message);
    });
  }

  /** Builds the payroll as an Excel file in the browser and downloads it. */
  /** Search box that hides the rows / cards (data-q = "name id") on the current admin screen that don't match. */
  function searchBox() {
    return '<input class="inp" style="margin-bottom:6px" placeholder="🔍 Search name or ID" oninput="filterRows(this.value)">';
  }
  function filterRows(q) {
    q = String(q || '').toLowerCase().trim();
    Array.prototype.forEach.call(document.querySelectorAll('#adminBody [data-q]'), function (el) {
      el.classList.toggle('hidden', !!q && el.getAttribute('data-q').indexOf(q) < 0);
    });
  }

  /** Muster roll: an In row and an Out row per employee, one column per day (times, or A / L / WO / H …), totals at the end. */
  function downloadRegister(ym) {
    var btn = $('regBtn'), label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing register…';
    $('regMsg').innerHTML = '';
    Promise.all([api('adminAttendanceRegister', S.token, ym), loadXlsx()]).then(function (res) {
      var r = res[0];
      var aoa = [[r.title], [r.status], [r.legend], [], r.header].concat(r.rows);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      var fixed = r.rowsPerEmployee === 2 ? 3 : 2;
      ws['!cols'] = r.header.map(function (h, i) { return { wch: i === 1 ? 24 : (i === 0 ? 8 : (i === 2 && fixed === 3 ? 5 : (/^\d/.test(h) ? 7 : 11))) }; });
      if (r.rowsPerEmployee === 2) {
        // Each employee has an In row and an Out row: merge the cells that are the same in both
        // (ID, name, totals, and days with a code such as A / WO / H instead of times).
        var merges = [];
        for (var k = 0; k + 1 < r.rows.length; k += 2) {
          var rowA = r.rows[k], rowB = r.rows[k + 1], at = 5 + k;
          for (var c = 0; c < r.header.length; c++) {
            if (c === 2) continue;
            if (rowA[c] === rowB[c]) merges.push({ s: { r: at, c: c }, e: { r: at + 1, c: c } });
          }
        }
        ws['!merges'] = merges;
      }
      ws['!freeze'] = { xSplit: fixed, ySplit: 5 };
      ws['!views'] = [{ state: 'frozen', xSplit: fixed, ySplit: 5 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Register ' + ym);
      if (NATIVE) NATIVE.saveFile(XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }), r.fileName,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      else XLSX.writeFile(wb, r.fileName);
      $('regMsg').innerHTML = '<div class="msg ok">Downloaded <b>' + esc(r.fileName) + '</b> (' + (r.rows.length / (r.rowsPerEmployee || 1)) + ' employees).</div>';
    }).catch(function (e) { $('regMsg').innerHTML = errBox(e); })
      .then(function () { var b = $('regBtn'); if (b) { b.disabled = false; b.innerHTML = label; } });
  }

  function exportPayroll(ym) {
    var btn = $('exportBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing Excel…';
    $('exportMsg').innerHTML = '';
    Promise.all([api('adminExportPayroll', S.token, ym), loadXlsx()]).then(function (res) {
      var r = res[0];
      var noSum = ['Emp ID', 'Name', 'Days Counted', 'PF', 'Per Day', 'Per Hour', 'Per Min'];
      var totals = r.header.map(function (h, i) {
        if (i === 0) return 'TOTAL';
        if (noSum.indexOf(h) >= 0) return '';
        var sum = 0, any = false;
        r.rows.forEach(function (row) { if (typeof row[i] === 'number') { sum += row[i]; any = true; } });
        return any ? Math.round(sum * 100) / 100 : '';
      });
      var aoa = [[r.title], [r.status], ['Generated ' + r.generated + ' · amounts in ' + r.currency], [], r.header]
        .concat(r.rows).concat([totals]);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = r.header.map(function (h) { return { wch: h === 'Name' ? 22 : Math.max(10, Math.min(18, h.length + 2)) }; });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 4, c: 0 }, e: { r: 4 + r.rows.length, c: r.header.length - 1 } }) };
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Payroll ' + ym);
      if (NATIVE) NATIVE.saveFile(XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }), r.fileName,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      else XLSX.writeFile(wb, r.fileName);
      $('exportMsg').innerHTML = '<div class="msg ok">Downloaded <b>' + esc(r.fileName) + '</b> (' + r.rows.length + ' employees). Check your Downloads folder.</div>';
    }).catch(function (e) {
      $('exportMsg').innerHTML = errBox(e);
    }).then(function () { var b = $('exportBtn'); if (b) { b.disabled = false; b.innerHTML = '⬇ Download Excel'; } });
  }

  /** Loads the Excel library (SheetJS) the first time it is needed. */
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = function () { resolve(); };
      sc.onerror = function () { reject(new Error('Could not load the Excel maker. Check the internet connection and try again.')); };
      document.head.appendChild(sc);
    });
  }

  /*
   * Entry editor times: the first Check-in / Check-out pair, then one "Check in again" / "Check out" pair for
   * every return to the office. Stored as first check-in, last check-out and the gaps between the pairs
   * (breaks), so worked time = the sum of all the pairs.
   */
  function sessionsOf(en) {
    var list = [], cur = en.in || '';
    (en.breaks ? en.breaks.split(';') : []).forEach(function (b) { var p = b.split('-'); list.push([cur, p[0]]); cur = p[1]; });
    list.push([cur, en.out || '']);
    return list;
  }
  function sessionRowHtml(a, b) {
    return '<div class="grid2 sess-row" style="align-items:end;margin-top:6px">' +
      '<div class="field" style="margin:0"><label>Check in again</label><input class="inp ss-a" type="time" value="' + esc(a || '') + '"></div>' +
      '<div class="field" style="margin:0;position:relative"><label>Check out</label><input class="inp ss-b" type="time" value="' + esc(b || '') + '">' +
      '<button type="button" class="link" style="position:absolute;right:0;top:0;color:var(--red)" onclick="this.closest(\'.sess-row\').remove()">Remove</button></div></div>';
  }
  function addSessionRow() { $('edSessions').insertAdjacentHTML('beforeend', sessionRowHtml('', '')); }
  /** { in, out, breaks } from the pairs; null (with a message) when the times don't follow each other. */
  function readSessions() {
    var pairs = [[$('edIn').value, $('edOut').value]];
    Array.prototype.forEach.call(document.querySelectorAll('#edSessions .sess-row'), function (r) {
      var a = r.querySelector('.ss-a').value, b = r.querySelector('.ss-b').value;
      if (a || b) pairs.push([a, b]);
    });
    var bad = '';
    for (var k = 0; k < pairs.length && !bad; k++) {
      var a = pairs[k][0], b = pairs[k][1], last = k === pairs.length - 1;
      if (k > 0 && !a) bad = 'Enter the "Check in again" time.';
      else if (!b && !last) bad = 'Enter the check-out before checking in again.';
      else if (k > 0 && a <= pairs[k - 1][1]) bad = '"Check in again" must be after the check-out before it.';
      else if (b && a && b <= a && pairs.length > 1) bad = 'Each check-out must be after its check-in.';
    }
    if (bad) { $('edMsg').innerHTML = errBox(bad); return null; }
    var breaks = [];
    for (var n = 1; n < pairs.length; n++) breaks.push(pairs[n - 1][1] + '-' + pairs[n][0]);
    return { in: pairs[0][0], out: pairs[pairs.length - 1][1], breaks: breaks.join(';') };
  }

  /** Admin registers a face: a few scans in a row are averaged into one fingerprint (+ a small photo). */
  function registerFace(i, facing) {
    var e = S.staff.list[i], reg = S.faceReg = { i: i, facing: facing || 'user', samples: [], photo: null, active: true, started: 0 };
    openModal('<div class="row"><h2 style="margin:0">🙂 ' + esc(e.name) + '</h2><button class="x-btn" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<p class="muted small">Hold the phone at face height. ' + esc(e.name) + ' looks straight at the camera; good light, no mask or sunglasses.</p>' +
      '<video id="regVideo" class="cam" autoplay playsinline muted' + (reg.facing === 'user' ? '' : ' style="transform:none"') + '></video>' +
      '<p class="center" id="regMsg"><span class="spinner"></span> Starting face recognition…</p>' +
      '<button class="btn ghost" onclick="registerFace(' + i + ',\'' + (reg.facing === 'user' ? 'environment' : 'user') + '\')">🔄 Switch camera</button>');
    Promise.all([loadFace(), openCamera('regVideo', reg.facing)]).then(function () { reg.started = Date.now(); regLoop(reg); })
      .catch(function (err) { if (S.faceReg === reg) $('regMsg').innerHTML = errBox(err); });
  }
  function regLoop(reg) {
    if (S.faceReg !== reg || !reg.active || $('modal').classList.contains('hidden')) return;
    var v = $('regVideo');
    faceRead(v).then(function (r) {
      if (S.faceReg !== reg || $('modal').classList.contains('hidden')) return;
      var hint = '';
      if (r && r.score > 0.6 && r.size >= 0.2) { // clear, front-facing and close enough
        reg.samples.push(r.d);
        if (reg.samples.length === 2) reg.photo = facePhoto(v, reg.facing === 'user');
      } else if (r && r.size < 0.2) hint = ' — come closer';
      if (reg.samples.length >= 5) {
        // All scans must agree (same person, sharp): drop odd ones and scan again if needed.
        var avg = faceAvg(reg.samples);
        reg.samples = reg.samples.filter(function (d) { return faceDist(d, avg) < 0.3; });
        if (reg.samples.length >= 5) return regSave(reg);
      }
      $('regMsg').innerHTML = (reg.samples.length ? 'Scanning… ' + reg.samples.length + ' / 5' : 'Looking for the face…') + hint;
      if (Date.now() - reg.started > 20000) {
        reg.active = false; stopCamera();
        $('regMsg').innerHTML = errBox('Could not get a clear look at the face. Use good light, remove mask / sunglasses, look straight at the camera, and try again.') +
          '<button class="btn" onclick="registerFace(' + reg.i + ',\'' + reg.facing + '\')">Try again</button>';
        return;
      }
      setTimeout(function () { regLoop(reg); }, 250);
    }).catch(function (err) { $('regMsg').innerHTML = errBox(err); });
  }
  function regSave(reg) {
    reg.active = false;
    stopCamera();
    var avg = faceAvg(reg.samples);
    var e = S.staff.list[reg.i];
    $('regMsg').innerHTML = '<span class="spinner"></span> Saving…';
    api('adminSaveFace', S.token, e.id, avg, reg.photo).then(function (r) {
      reopenStaff(r, e.id); toast('Face registered for ' + e.name);
    }).catch(function (err) {
      $('regMsg').innerHTML = errBox(err) + '<button class="btn" onclick="registerFace(' + reg.i + ',\'' + reg.facing + '\')">Try again</button>';
    });
  }
  function removeFace(i) {

    api('adminDeleteFace', S.token, e.id).then(function (r) { reopenStaff(r, e.id); toast('Face removed'); }).catch(function (err) { toast(err.message); });

  /** Super admin: tick the employees who take part in the OT leaderboard (men's and women's boards). */
