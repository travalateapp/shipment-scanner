        '<div class="checklist">' + people.map(function (e) {
          return '<label><input type="checkbox" class="lb-pick lb-' + (g || 'X') + '" value="' + esc(e.id) + '"' + (e.leaderboard !== false ? ' checked' : '') + (g ? '' : ' disabled') + '> ' +
            esc(e.name) + ' <span class="muted">' + esc(e.id) + '</span></label>';
        }).join('') + '</div>' + (g ? '' : '<p class="muted small" style="margin:4px 0 0">Set their gender in Edit to place them on a board.</p>') + '</div>';
    };
    openModal('<div class="row"><h2 style="margin:0">🏆 OT leaderboard</h2><button class="x-btn" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<p class="muted small">Ticked employees are ranked by their net OT this month (late and early leaving already taken off). Unticked ones are not ranked but still see the board.</p>' +
      group('♂ Men', 'M') + group('♀ Women', 'F') + group('Gender not set', '') +
      '<button class="btn" id="lbSave" style="margin-top:14px" onclick="saveLeaderboardPicker()">Save</button><div id="lbMsg"></div>');
  }
  function lbAll(g, on) { Array.prototype.forEach.call(document.querySelectorAll('.lb-' + g), function (c) { c.checked = on; }); }
  function saveLeaderboardPicker() {
    var ids = Array.prototype.filter.call(document.querySelectorAll('.lb-pick'), function (c) { return c.checked; }).map(function (c) { return c.value; });
    // Inactive employees are not listed: keep their current choice.
    (S.staff.list || []).forEach(function (e) { if (!e.active && e.leaderboard !== false) ids.push(e.id); });
    $('lbSave').disabled = true;
    api('superSetLeaderboard', S.token, ids).then(function (r) { renderStaff(r); closeModal(); toast('Leaderboard saved'); })
      .catch(function (e) { $('lbSave').disabled = false; $('lbMsg').innerHTML = errBox(e); });
  }

  function openStaffForm(i) {
    var isNew = i < 0, e = isNew ? { id: '', name: '', salary: '', joinDate: todayLocal(), phone: '', active: true, role: 'EMPLOYEE' } : S.staff.list[i];
    var html = '<h2 style="margin-top:0">' + (isNew ? 'Add employee' : esc(e.name)) + '</h2>' +
      (isNew ? '<div class="field"><label>Employee ID</label><input id="sfId" class="inp" autocapitalize="characters" placeholder="e.g. E010"></div>' : '') +
      '<div class="field"><label>Name</label><input id="sfName" class="inp" value="' + esc(e.name) + '"></div>' +
      '<div class="grid2"><div class="field"><label>' + (isNew ? 'Monthly salary' : 'Current salary') + '</label><input id="sfSalary" class="inp" inputmode="decimal" value="' + esc(e.salary) + '"' +
        (isNew ? '' : ' readonly style="background:var(--bg)"') + '></div>' +
      '<div class="field"><label>Join date</label><input id="sfJoin" class="inp" type="date" value="' + esc(e.joinDate) + '"></div></div>' +
      '<div class="grid2"><div class="field"><label>Phone</label><input id="sfPhone" class="inp" inputmode="tel" value="' + esc(e.phone) + '"></div>' +
      '<div class="field"><label>Gender</label><select id="sfGender" class="inp"><option value="">— Not set —</option>' +
        '<option value="M"' + (e.gender === 'M' ? ' selected' : '') + '>Male</option><option value="F"' + (e.gender === 'F' ? ' selected' : '') + '>Female</option></select></div></div>' +
      (e.role === 'GUARD' ? '' : '<div class="field"><label>Birth date <span class="muted small">(for the birthday wish; only the day is shown, never the age)</span></label><input id="sfBirth" class="inp" type="date" max="' + todayLocal() + '" value="' + esc(e.birthDate || '') + '"></div>') +
      (isNew ? '<div class="field"><label>PIN (4–6 digits)</label><input id="sfPin" class="inp" inputmode="numeric"></div>' : '') +
      (S.staff.canSetRole && e.role !== 'SUPER_ADMIN' ? '<div class="field"><label>Role</label><select id="sfRole" class="inp"><option value="EMPLOYEE"' + (e.role === 'EMPLOYEE' ? ' selected' : '') + '>Employee</option><option value="ADMIN"' + (e.role === 'ADMIN' ? ' selected' : '') + '>Admin</option><option value="GUARD"' + (e.role === 'GUARD' ? ' selected' : '') + '>Guard (only marks others)</option></select></div>' : '') +
      (e.role === 'GUARD' ? '' : '<div class="card" style="background:var(--bg);margin:14px 0 0;padding:12px"><b>Work timing</b>' +
        '<p class="muted small" style="margin:4px 0 0">Leave empty for the company shift. With an own shift, late marks, early leaving and OT use these times.</p>' +
        '<div class="grid2"><div class="field"><label>Shift start</label><input id="sfShiftStart" class="inp" type="time" value="' + esc(e.shiftStart || '') + '"></div>' +
        '<div class="field"><label>Shift end</label><input id="sfShiftEnd" class="inp" type="time" value="' + esc(e.shiftEnd || '') + '"></div></div>' +
        '<label class="check" style="margin-top:8px"><input type="checkbox" id="sfHourlyOt"' + (e.hourlyOt === false ? '' : ' checked') + ' onchange="$(\'sfMorningOt\').disabled=!this.checked;$(\'sfLateCut\').disabled=this.checked"> Hourly OT on working days (untick = only Sunday / week-off work is paid extra)</label>' +
        '<label class="check"><input type="checkbox" id="sfMorningOt"' + (e.morningOt === false ? '' : ' checked') + (e.hourlyOt === false ? ' disabled' : '') + '> Morning OT: coming before the shift start counts as OT (untick = only evening OT, after the shift end)</label>' +
        '<label class="check"><input type="checkbox" id="sfLateCut"' + (e.lateCut === false ? '' : ' checked') + (e.hourlyOt === false ? '' : ' disabled') + '> Cut late coming / early leaving from salary, by the minute (only without hourly OT; with hourly OT it is taken from the OT)</label></div>') +
      (e.role === 'GUARD' ? '' : '<label class="check" style="margin-top:10px"><input type="checkbox" id="sfAnywhere"' + (e.anywhere ? ' checked' : '') + '> Can mark from anywhere (outstation): no office distance check, location still recorded</label>') +
      (isNew ? '' : '<label class="check" style="margin-top:10px"><input type="checkbox" id="sfActive"' + (e.active ? ' checked' : '') + ' onchange="staffActiveChanged(' + i + ')"> Active (untick when someone leaves the company)</label>' +
        '<div id="sfActiveDate" class="field hidden"><label id="sfActiveLabel"></label><input id="sfActiveOn" class="inp" type="date"></div>' +
        periodsHtml(e)) +
      '<button class="btn" id="sfSave" onclick="saveStaff(' + i + ')">Save</button>' +
      (isNew || e.role === 'GUARD' ? '' : incrementsHtml(e, i)) +
      (isNew || e.role === 'GUARD' ? '' : '<div class="card" style="background:var(--bg);margin-top:16px"><b>🙂 Face recognition</b>' +
        '<p class="muted small" style="margin:4px 0 8px">' + (e.face ? 'Registered (' + esc(e.face) + '). ' + esc(e.name) + ' checks in and out by face, on their phone or the guard\'s phone.'
          : 'Not registered: ' + esc(e.name) + ' uses the selfie as now. Register with ' + esc(e.name) + ' in front of the camera, in good light.') + '</p>' +
        '<div class="btns"><button class="btn small" onclick="registerFace(' + i + ')">' + (e.face ? 'Register again' : '📷 Register face') + '</button>' +
        (e.face ? '<button class="btn small soft-red" onclick="removeFace(' + i + ')">Remove</button>' : '') + '</div></div>') +
      (isNew ? '' : '<div class="card" style="background:var(--bg);margin-top:16px"><b>Reset PIN</b><div class="row" style="margin-top:8px"><input id="sfNewPin" class="inp" inputmode="numeric" placeholder="New PIN"><button class="btn small" onclick="resetPin(\'' + esc(e.id) + '\')">Reset</button></div></div>') +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><div id="sfMsg"></div>';
    openModal(html);
  }

  /** Unticking Active asks for the last working day; ticking it again asks for the first day back. */
  function staffActiveChanged(i) {
    var e = S.staff.list[i], on = $('sfActive').checked, changed = on !== e.active;
    $('sfActiveDate').classList.toggle('hidden', !changed);
    if (!changed) return;
    $('sfActiveLabel').textContent = on ? 'Active again from (salary and attendance start this day)' : 'Last working day';
    $('sfActiveOn').value = todayLocal();
    if (on) $('sfActiveOn').removeAttribute('max'); else $('sfActiveOn').max = todayLocal();
  }

  function periodsHtml(e) {
    var p = e.periods || [];
    if (p.length < 2 && e.active) return '';
    return '<p class="muted small" style="margin:8px 0 0">Employment: ' + p.map(function (x) {
      return esc(fmtDate(x.from)) + ' – ' + (x.to ? esc(fmtDate(x.to)) : 'now');
    }).join(' · ') + '</p>';
  }

  /** Salary increments: the original salary is never edited; each increment starts in its own month. */
  function incrementsHtml(e, i) {
    var inc = e.increments || [];
    var html = '<div class="card" style="background:var(--bg);margin-top:16px"><b>Salary increment</b>' +
      '<p class="muted small" style="margin:4px 0 0">Original salary ' + money(e.baseSalary, '₹') + '. The new salary applies from the chosen month; earlier months stay as they were. Use a minus amount for a decrease.</p>' +
      '<div class="grid2"><div class="field"><label>Increment (₹/month)</label><input id="inAmt" class="inp" inputmode="decimal" placeholder="e.g. 2000"></div>' +
      '<div class="field"><label>From month</label><input id="inMonth" class="inp" type="month" value="' + ymNow() + '"></div></div>' +
      '<div class="field"><label>Note (optional)</label><input id="inNote" class="inp" placeholder="e.g. Annual increment"></div>' +
      '<button class="btn small" style="margin-top:10px" id="inBtn" onclick="addIncrement(' + i + ')">＋ Add increment</button><div id="inMsg"></div>';
    if (inc.length) {
      html += '<div style="margin-top:10px">' + inc.map(function (x) {
        return '<div class="row small" style="padding:6px 0;border-top:1px dashed var(--line)"><span><b>' + (x.amount > 0 ? '+' : '−') + money(Math.abs(x.amount), '₹') +
          '</b> from ' + esc(monthName(x.month)) + ' → ' + money(x.newSalary, '₹') + (x.note ? ' <span class="muted">(' + esc(x.note) + ')</span>' : '') + '</span>' +
          (x.locked ? '<span class="chip s-LOCK">🔒</span>' : '<button class="link" style="color:var(--red)" onclick="deleteIncrement(' + i + ',' + x.row + ')">Remove</button>') + '</div>';
      }).join('') + '</div>';
    }
    return html + '</div>';
  }

  function reopenStaff(r, id) {
    renderStaff(r);
    var j = S.staff.list.findIndex(function (x) { return x.id === id; });
    if (j >= 0) openStaffForm(j);
  }
  function addIncrement(i) {
    var e = S.staff.list[i], amt = $('inAmt').value, month = $('inMonth').value;
    if (!month) return ($('inMsg').innerHTML = errBox('Choose the month the new salary starts.'));
    if (!confirm('Salary of ' + e.name + ' changes by ' + amt + ' from ' + monthName(month) + '. Months before stay as they were. Continue?')) return;
    $('inBtn').disabled = true;
    api('adminAddIncrement', S.token, e.id, { amount: amt, month: month, note: $('inNote').value })
      .then(function (r) { S.monthCache = {}; reopenStaff(r, e.id); toast('Increment added'); })
      .catch(function (err) { $('inBtn').disabled = false; $('inMsg').innerHTML = errBox(err); });
  }
  function deleteIncrement(i, row) {
    var e = S.staff.list[i];
    if (!confirm('Remove this increment of ' + e.name + '?')) return;
    api('adminDeleteIncrement', S.token, e.id, row).then(function (r) { S.monthCache = {}; reopenStaff(r, e.id); toast('Increment removed'); })
      .catch(function (err) { toast(err.message); });
  }

  function saveStaff(i) {
    var isNew = i < 0;
    var data = { isNew: isNew, id: isNew ? $('sfId').value : S.staff.list[i].id, name: $('sfName').value, salary: $('sfSalary').value,
      joinDate: $('sfJoin').value, phone: $('sfPhone').value };
    if (isNew) data.pin = $('sfPin').value;
    else {
      data.active = $('sfActive').checked;
      if (data.active !== S.staff.list[i].active) {
        if (!$('sfActiveOn').value) { $('sfMsg').innerHTML = errBox(data.active ? 'Choose the date they start again.' : 'Choose the last working day.'); return; }
        if (data.active) data.activeFrom = $('sfActiveOn').value; else data.leftOn = $('sfActiveOn').value;
      }
    }
    if ($('sfAnywhere')) data.anywhere = $('sfAnywhere').checked;
    if ($('sfGender')) data.gender = $('sfGender').value;
    if ($('sfBirth')) data.birthDate = $('sfBirth').value;
    if ($('sfShiftStart')) { data.shiftStart = $('sfShiftStart').value; data.shiftEnd = $('sfShiftEnd').value; data.hourlyOt = $('sfHourlyOt').checked; data.morningOt = $('sfMorningOt').checked; data.lateCut = $('sfLateCut').checked; }
    if ($('sfRole')) data.role = $('sfRole').value;
    $('sfSave').disabled = true;
    api('adminSaveStaff', S.token, data).then(function (r) {
      var saved = (r.list || []).filter(function (e) { return e.id === String(data.id).trim().toUpperCase(); })[0];
      if (data.role && saved && saved.role !== data.role) {
        // An older Code.gs ignores roles it doesn't know (e.g. Guard) and keeps Employee.
        renderStaff(r);
        $('sfSave').disabled = false;
        $('sfMsg').innerHTML = errBox('The role was not saved: the Apps Script server is running older code. Paste the latest Code.gs ' +
          'into Apps Script, then Deploy → Manage deployments → ✏ Edit → New version → Deploy, and save again.');
        return;
      }
      closeModal(); renderStaff(r); toast('Saved');
    })
      .catch(function (e) { $('sfSave').disabled = false; $('sfMsg').innerHTML = errBox(e); });
  }

  function resetPin(id) {
    var pin = $('sfNewPin').value;
    api('adminResetPin', S.token, id, pin).then(function () { toast('PIN reset. Tell the employee their new PIN.'); $('sfNewPin').value = ''; })
      .catch(function (e) { $('sfMsg').innerHTML = errBox(e); });
  }

  /* ---------- Advances ---------- */
  function loadAdvances() {
    adminFetch('adv', 'adminAdvances', [], renderAdvances);
  }

  function renderAdvances(r) {
    S.adv = r;
    var cur = r.currency;
    var html = '<div class="card"><h2>Give an advance</h2>' +
      '<div class="field"><label>Employee</label><select id="avEmp" class="inp" onchange="advEmpHint()">' + r.employees.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' (' + esc(e.id) + ')' + (e.ongoing ? ' – advance running' : '') + '</option>'; }).join('') + '</select></div>' +
      '<div id="avHint"></div>' +
      '<div class="grid2"><div class="field"><label>Amount</label><input id="avAmt" class="inp" inputmode="decimal" placeholder="e.g. 10000"></div>' +
      '<div class="field"><label>Deduct per month</label><input id="avMon" class="inp" inputmode="decimal" placeholder="e.g. 2000"></div>' +
      '<div class="field"><label>Start deducting from</label><input id="avStart" class="inp" type="month" value="' + r.currentMonth + '"></div>' +
      '<div class="field"><label>Date given</label><input id="avDate" class="inp" type="date" value="' + todayLocal() + '"></div></div>' +
      '<div class="field"><label>Note</label><input id="avNote" class="inp" placeholder="e.g. Medical"></div>' +
      '<button class="btn" id="avBtn" onclick="saveAdvance()">Save advance</button><div id="avMsg"></div></div>';

    html += '<div class="card"><h2>Advances</h2>';
    if (!r.list.length) html += '<p class="muted">No advances yet.</p>';
    // One card per employee: every payment as a row, then the combined amounts.
    var groups = [], byEmp = {};
    r.list.forEach(function (a, i) {
      if (!byEmp[a.empId]) { byEmp[a.empId] = { empId: a.empId, name: a.name, items: [] }; groups.push(byEmp[a.empId]); }
      byEmp[a.empId].items.push({ a: a, i: i });
    });
    groups.forEach(function (g) {
      var sum = function (k) { return g.items.reduce(function (n, x) { return n + (Number(x.a[k]) || 0); }, 0); };
      var total = sum('amount'), thisMonth = sum('thisMonth'), after = sum('balanceAfter'), recovered = sum('deductedBefore');
      // Repaid only when an admin marked it (status Closed); until then it is Active (or Paused).
      var running = g.items.filter(function (x) { return x.a.status === 'ACTIVE'; }).length;
      var allClosed = g.items.every(function (x) { return x.a.status === 'CLOSED'; });
      var st = allClosed ? '<span class="chip s-APPROVED">✓ Repaid</span>' : running ? '<span class="chip s-WORKING">Active</span>' : '<span class="chip s-PAUSED">Paused</span>';
      var rows = [];
      g.items.forEach(function (x) {
        (x.a.given && x.a.given.length ? x.a.given : [{ date: x.a.dateGiven, amount: x.a.amount, note: x.a.note }]).forEach(function (p) { rows.push({ p: p, x: x }); });
      });
      rows.sort(function (u, v) { return u.p.date < v.p.date ? -1 : u.p.date > v.p.date ? 1 : 0; });
      html += '<div class="list-item" style="display:block"><div class="row"><div class="name">' + esc(g.name) + ' <span class="muted" style="font-weight:400">' + esc(g.empId) + '</span></div>' + st + '</div>' +
        '<table class="given"><tr><th>Date given</th><th class="r">Amount</th><th>Note</th><th>Status</th></tr>' +
        rows.map(function (u) {
          return '<tr><td>' + esc(fmtDate(u.p.date)) + '</td><td class="r">' + money(u.p.amount, cur) + '</td><td class="muted">' + esc(u.p.note || '') + '</td>' +
            '<td><button class="link adv-st" onclick="advManage(' + u.x.i + ')">' + advStatusText(u.x.a, cur) + ' ›</button></td></tr>';
        }).join('') +
        (rows.length > 1 ? '<tr class="tot"><td>Total given</td><td class="r">' + money(total, cur) + '</td><td></td><td></td></tr>' : '') + '</table>' +
        '<div class="kv" style="margin-top:8px"><div class="k-red"><b>' + money(total - recovered, cur) + '</b><span>Pending</span></div>' +
        '<div><b>' + money(thisMonth, cur) + '</b><span>This month</span></div>' +
        '<div class="k-red"><b>' + money(after, cur) + '</b><span>Balance after</span></div></div>' +
        (recovered ? '<p class="muted small" style="margin:6px 0 0">Recovered so far: ' + money(recovered, cur) + '</p>' : '') +
        '<div class="btns"><button class="btn small ghost" onclick="advAddMore(\'' + esc(g.empId) + '\')">＋ Add more</button></div>';
      html += '</div>';
    });
    html += '</div><p class="muted small center">Tap a <b>Status</b> to change a month, change the monthly deduction, pause or close that advance. <b>Add more</b> adds a new amount to a running advance (one balance, one deduction). ' +
      'Saving a new advance above instead keeps it separate, with its own deduction (both are deducted each month). <b>Change a month</b> sets a different amount (or no deduction) for one month only; the balance moves to later months. ' +
      'Pause skips every month until resumed. <b>Mark as repaid</b> closes it (also when repaid in cash); until then it shows as Active. Locked months keep what was actually deducted.</p>';
    adminBody(html);
    advEmpHint();
  }

  /** Every payment of an advance on its own row: date, amount, note (and the total when there are several). */
  function givenHtml(a, cur) {
    var list = a.given && a.given.length ? a.given : [{ date: a.dateGiven, amount: a.amount, note: a.note }];
    return '<table class="given"><tr><th>' + t('Date given') + '</th><th class="r">' + t('Amount') + '</th><th>' + t('Note') + '</th></tr>' +
      list.map(function (g) { return '<tr><td>' + esc(fmtDate(g.date)) + '</td><td class="r">' + money(g.amount, cur) + '</td><td class="muted">' + esc(g.note || '') + '</td></tr>'; }).join('') +
      (list.length > 1 ? '<tr class="tot"><td>' + t('Total') + '</td><td class="r">' + money(a.amount, cur) + '</td><td></td></tr>' : '') + '</table>';
  }

  /** Deduction status of one advance: "₹5,000/month from Oct 2026", Paused, Repaid, Closed. */
  function advStatusText(a, cur) {
    if (a.status === 'CLOSED') return '✓ Repaid (closed)';
    if (a.status === 'PAUSED') return '⏸ Paused';
    return 'Active · ' + money(a.monthly, cur) + '/month from ' + esc(monthName(a.startMonth)) + (a.changes && a.changes.length ? ' 📌' : '');
  }
  /** Everything that can be done with one advance (tap its Status). */
  function advManage(i) {
    var a = S.adv.list[i], cur = S.adv.currency;
    var html = '<div class="row"><h2 style="margin:0">' + esc(a.name) + '</h2><button class="x-btn" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<p class="muted small">Advance of ' + esc(fmtDate(a.dateGiven)) + ' · ' + money(a.amount, cur) + (a.note ? ' · ' + esc(a.note) : '') + '<br>' +
      advStatusText(a, cur) + ' · recovered ' + money(a.deductedBefore, cur) + ' · this month ' + money(a.thisMonth, cur) + ' · balance after ' + money(a.balanceAfter, cur) + '</p>' +
      (a.changes.length ? a.changes.map(function (c) {
        return '<div class="row small" style="padding:4px 0"><span>📌 <b>' + esc(monthName(c.month)) + ':</b> ' +
          (c.amount === 0 ? 'no deduction (skipped)' : 'deduct ' + money(c.amount, cur)) + (c.note ? ' <span class="muted">· ' + esc(c.note) + '</span>' : '') + '</span>' +
          (c.locked ? '<span class="muted">locked</span>' : '<button class="link" style="color:var(--red)" onclick="closeModal();clearAdvMonth(' + i + ',\'' + c.month + '\')">Undo</button>') + '</div>';
      }).join('') : '') +
      (a.repaid && a.status !== 'CLOSED' ? '<div class="msg ok">Fully recovered from salary. Mark it as repaid to close it.</div>' : '') +
      (a.status === 'CLOSED' ? '<button class="btn" onclick="openTopUp(' + i + ')">＋ Add more to this advance (opens it again)</button>' :
        '<button class="btn" onclick="openAdvMonth(' + i + ')">Change a month</button>' +
        '<button class="btn ghost" onclick="editAdvance(' + i + ')">Change monthly deduction</button>' +
        '<button class="btn ghost" onclick="openTopUp(' + i + ')">＋ Add more to this advance</button>' +
        (a.status === 'ACTIVE' ? '<button class="btn ghost" onclick="closeModal();advStatus(' + i + ',\'PAUSED\')">⏸ Pause deductions</button>' : '<button class="btn ghost" onclick="closeModal();advStatus(' + i + ',\'ACTIVE\')">▶ Resume deductions</button>') +
        '<button class="btn soft-red" onclick="closeModal();advStatus(' + i + ',\'CLOSED\')">✓ Mark as repaid (close)</button>');
    openModal(html);
  }
  /** "＋ Add more" on a card: adds to the employee's running advance (asks which one when there are several). */
  function advAddMore(empId) {
    var list = S.adv.list.map(function (a, i) { return { a: a, i: i }; }).filter(function (x) { return x.a.empId === empId; });
    var running = list.filter(function (x) { return x.a.status !== 'CLOSED'; });
    var pick = running.length ? running : list;
    if (pick.length === 1) return openTopUp(pick[0].i);
    var cur = S.adv.currency;
    openModal('<div class="row"><h2 style="margin:0">Add more – ' + esc(list[0].a.name) + '</h2><button class="x-btn" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<p class="muted small">Add the new amount to which advance? (To keep it completely separate, use "Give an advance" at the top.)</p>' +
      pick.map(function (x) {
        return '<button class="btn ghost" onclick="openTopUp(' + x.i + ')">Advance of ' + esc(fmtDate(x.a.dateGiven)) + ' · ' + money(x.a.amount, cur) + ' · ' + advStatusText(x.a, cur) + '</button>';
      }).join(''));
  }

  /** Tells the admin when the selected employee already has an advance running. */
  function advEmpHint() {
    var sel = $('avEmp'); if (!sel || !S.adv) return;
    var e = S.adv.employees.filter(function (x) { return x.id === sel.value; })[0];
    $('avHint').innerHTML = e && e.ongoing
      ? '<div class="msg info">' + esc(e.name) + ' already has an advance running (balance ' + money(e.ongoing, S.adv.currency) + '). ' +
        'Saving here makes a <b>separate</b> advance with its own deduction. To add to the existing one, use <b>＋ Add more</b> on it below.</div>'
      : '';
  }

  /** Adds more money to a running advance. */
  function openTopUp(i) {
    var a = S.adv.list[i], cur = S.adv.currency;
    openModal('<h2 style="margin-top:0">Add more – ' + esc(a.name) + '</h2>' +
      '<p class="muted small" style="margin-top:-6px">Advance ' + money(a.amount, cur) + ' · balance ' + money(a.balanceAfter + a.thisMonth, cur) + ' · ' + money(a.monthly, cur) + '/month</p>' +
      '<div class="grid2"><div class="field"><label>Extra amount given</label><input id="tuAmt" class="inp" inputmode="decimal" placeholder="e.g. 5000"></div>' +
      '<div class="field"><label>Date given</label><input id="tuDate" class="inp" type="date" value="' + todayLocal() + '"></div></div>' +
      '<div class="field"><label>Deduct per month from now</label><input id="tuMon" class="inp" inputmode="decimal" value="' + esc(a.monthly) + '"></div>' +
      '<div class="field"><label>Note (optional)</label><input id="tuNote" class="inp" placeholder="e.g. School fees"></div>' +
      '<button class="btn" id="tuBtn" onclick="saveTopUp(' + i + ')">Add to advance</button><button class="btn ghost" onclick="closeModal()">Cancel</button><div id="tuMsg"></div>');
  }
  function saveTopUp(i) {
    var a = S.adv.list[i];
    $('tuBtn').disabled = true;
    api('adminTopUpAdvance', S.token, a.id, { add: $('tuAmt').value, dateGiven: $('tuDate').value, monthly: $('tuMon').value, note: $('tuNote').value })
      .then(function (r) { closeModal(); renderAdvances(r); toast('Added to ' + a.name + '\'s advance'); })
      .catch(function (e) { $('tuBtn').disabled = false; $('tuMsg').innerHTML = errBox(e); });
  }

  function saveAdvance() {
    $('avBtn').disabled = true;
    api('adminSaveAdvance', S.token, { empId: $('avEmp').value, amount: $('avAmt').value, monthly: $('avMon').value,
      startMonth: $('avStart').value, dateGiven: $('avDate').value, note: $('avNote').value })
      .then(function (r) { renderAdvances(r); toast('Advance saved'); })
      .catch(function (e) { $('avBtn').disabled = false; $('avMsg').innerHTML = errBox(e); });
  }
  function editAdvance(i) {
    var a = S.adv.list[i];
    var v = prompt('New monthly deduction for ' + a.name + ':', a.monthly);
    if (v === null) return;
    api('adminSaveAdvance', S.token, { id: a.id, monthly: v, note: a.note }).then(renderAdvances).catch(function (e) { toast(e.message); });
  }
  /**
   * Skip the deduction or deduct a different amount for one month.
   * info = { id, name, amount, monthly, startMonth, balance, ym, fixedMonth, changed, currency }; done(result) runs after saving.
   */
  function openAdvMonthModal(info, done) {
    S.advModal = { info: info, done: done };
    var cur = info.currency;
    openModal('<h2 style="margin-top:0">' + esc(info.name) + ' – advance ' + money(info.amount, cur) + '</h2>' +
      '<p class="muted small" style="margin-top:-6px">Normal deduction: ' + money(info.monthly, cur) + '/month' +
      (info.balance !== undefined ? ' · balance ' + money(info.balance, cur) + ' before this month' : '') + '</p>' +
      (info.fixedMonth ? '<p><b>' + esc(monthName(info.ym)) + '</b></p><input id="amMonth" type="hidden" value="' + info.ym + '">'
        : '<div class="field"><label>Month</label><input id="amMonth" class="inp" type="month" min="' + info.startMonth + '" value="' + info.ym + '"></div>') +
      '<label class="check"><input type="radio" name="amKind" value="skip" checked onchange="$(\'amAmt\').disabled=true"> No deduction this month</label>' +
      '<label class="check"><input type="radio" name="amKind" value="amount" onchange="$(\'amAmt\').disabled=false;$(\'amAmt\').focus()"> Deduct a different amount</label>' +
      '<input id="amAmt" class="inp" inputmode="decimal" placeholder="e.g. 1000" disabled>' +
      '<div class="field"><label>Note (optional)</label><input id="amNote" class="inp" placeholder="e.g. Employee asked to skip – festival"></div>' +
      '<button class="btn" id="amBtn" onclick="saveAdvMonth()">Save</button>' +
      (info.changed ? '<button class="btn ghost" onclick="saveAdvMonth(true)">Back to normal deduction</button>' : '') +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><div id="amMsg"></div>');
  }
  function saveAdvMonth(reset) {
    var m = S.advModal;
    var skip = document.querySelector('input[name="amKind"]:checked').value === 'skip';
    var amt = reset ? '' : (skip ? 0 : $('amAmt').value);
    if (!reset && !skip && amt === '') { $('amMsg').innerHTML = errBox('Enter the amount to deduct.'); return; }
    $('amBtn').disabled = true;
    api('adminSetAdvanceMonth', S.token, m.info.id, $('amMonth').value, amt, reset ? '' : $('amNote').value)
      .then(function (r) { closeModal(); toast('Saved'); m.done(r); })
      .catch(function (e) { $('amBtn').disabled = false; $('amMsg').innerHTML = errBox(e); });
  }
  /** From the Advances screen (any month). */
  function openAdvMonth(i) {
    var a = S.adv.list[i];
    openAdvMonthModal({ id: a.id, name: a.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceAfter + a.thisMonth, ym: S.adv.currentMonth < a.startMonth ? a.startMonth : S.adv.currentMonth,
      currency: S.adv.currency }, renderAdvances);
  }
  /** From an employee's salary card (that month). */
  function changeMonthAdv(ai) {
    var m = S.viewMonth, a = m.advances[ai];
    openAdvMonthModal({ id: a.id, name: m.employee.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceBefore, ym: m.ym, fixedMonth: true, changed: a.changed, currency: m.currency },
      function () { if (S.reloadAfterEntry) S.reloadAfterEntry(); });
  }
  /** From the Monthly Summary (that month). */
  function changeSumAdv(ri, ai) {
    var r = S.summary, row = r.rows[ri], a = row.advances[ai];
    openAdvMonthModal({ id: a.id, name: row.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceBefore, ym: r.ym, fixedMonth: true, changed: a.changed, currency: r.currency },
      function () { loadSummary(r.ym); });
  }
  function clearAdvMonth(i, ym) {
    var a = S.adv.list[i];
    if (!confirm('Go back to the normal deduction for ' + monthName(ym) + '?')) return;
    api('adminSetAdvanceMonth', S.token, a.id, ym, '', '').then(renderAdvances).catch(function (e) { toast(e.message); });
  }

  function advStatus(i, status) {
    var a = S.adv.list[i];
    if (status === 'CLOSED' && !confirm('Mark this advance as repaid? It is closed and no more deductions will be made' + (a.balanceAfter + a.thisMonth > 0 ? ' (balance ' + money(a.balanceAfter + a.thisMonth, S.adv.currency) + ' still open — e.g. repaid in cash).' : '.'))) return;
    api('adminSetAdvanceStatus', S.token, a.id, status).then(renderAdvances).catch(function (e) { toast(e.message); });
  }

  /* ---------- PF ---------- */
  function loadAdminPf() {
    adminFetch('pf', 'adminEmployees', [], renderAdminPf);
  }

  function renderAdminPf(r) {
    S.pfList = r.list;
    var cur = r.currency, d = r.defaults;
    var html = '<div class="card"><p class="muted" style="margin:0;font-size:13px">Turn PF on/off for each employee and set the amounts. ' +
      'Leave a box blank to use the default (' + d.bank + '% of salary for Basic Salary, ' + d.employee + '% / ' + d.employer +
      '% of Basic Salary for PF). You can also type a % like <b>12%</b>.' +
      (r.showSplit ? '<br><b>In Bank</b> = Basic Salary − PF Employee. <b>In Cash</b> = Salary − Basic Salary.' : '') + '</p>' +
      '<div style="margin-top:10px">' + searchBox() + '</div></div>';
    r.list.forEach(function (e, i) {
      html += '<div class="card" data-q="' + esc((e.name + ' ' + e.id).toLowerCase()) + '"><div class="row"><div><div class="name"><b>' + esc(e.name) + '</b> <span class="muted">' + esc(e.id) + '</span></div>' +
        '<div class="sub muted" style="font-size:13px">Salary ' + money(e.salary, cur) + '</div></div>' +
        '<label class="switch"><input type="checkbox" id="pfOn-' + i + '"' + (e.pfActive ? ' checked' : '') + ' onchange="togglePfFields(' + i + ')"><span></span></label></div>' +
        '<div id="pfFields-' + i + '" class="' + (e.pfActive ? '' : 'hidden') + '"><div class="pf-grid">' +
        pfInput(i, 'bank', 'Basic Salary', e.bankSalaryRaw, e.bankSalary) +
        pfInput(i, 'emp', 'PF Employee', e.employeeRaw, e.employee) +
        pfInput(i, 'er', 'PF Employer', e.employerRaw, e.employer) + '</div>' +
        (r.showSplit ? '<p class="muted small" style="margin:8px 0 0">Currently: In Bank ' + money(e.bankSalary - e.employee, cur) + ' · In Cash ' + money(e.salary - e.bankSalary, cur) + '</p>' : '') + '</div>' +
        '<button class="btn small" style="margin-top:12px" onclick="savePf(' + i + ', this)">Save</button></div>';
    });
    adminBody(html);
  }
  function pfInput(i, key, label, raw, effective) {
    return '<div><label>' + label + '</label><input id="pf' + key + '-' + i + '" inputmode="decimal" value="' + esc(raw) + '" placeholder="' + esc(effective) + '"></div>';
  }
  function togglePfFields(i) { $('pfFields-' + i).classList.toggle('hidden', !$('pfOn-' + i).checked); }
  function savePf(i, btn) {
    var e = S.pfList[i];
    btn.disabled = true;
    api('adminSavePf', S.token, e.id, {
      active: $('pfOn-' + i).checked, bankSalary: $('pfbank-' + i).value, employee: $('pfemp-' + i).value, employer: $('pfer-' + i).value
    }).then(function (r) { renderAdminPf(r); toast('Saved PF for ' + e.name); })
      .catch(function (err) { btn.disabled = false; toast(err.message); });
  }

  /* ---------- Super admin: admins & permissions ---------- */
  function refreshAllApps() {
    if (!confirm('Reload the app on every phone (employees, admins, guards) the next time they use it?')) return;
    $('refreshAllBtn').disabled = true;
    api('superRefreshApps', S.token).then(function (r) { S.seenRefreshAt = r.refreshAt; store('att_reloaded', String(r.refreshAt)); toast('Done. Every phone will load the newest app.'); $('refreshAllBtn').disabled = false; })
      .catch(function (e) { $('refreshAllBtn').disabled = false; toast(e.message); });
  }
  function loadAdmins() {
    adminFetch('admins', 'superListAdmins', [], renderAdmins);
  }

  function renderAdmins(r) {
    S.superData = r;
    var nonAdmins = r.employees.filter(function (e) { return e.role === 'EMPLOYEE'; });
    var html = '<div class="card"><h2>🔄 Refresh everyone\'s app</h2><p class="muted small" style="margin:-6px 0 8px">After an update, press this so every phone loads the newest app. ' +
      'Phones reload by themselves the next time the app is used. Phones on a very old version are asked to close and reopen the app.</p>' +
      '<button class="btn ghost" id="refreshAllBtn" onclick="refreshAllApps()">🔄 Refresh all phones now</button></div>' +
      '<div class="card"><h2>Make an admin</h2>' +
      (nonAdmins.length ? '<div class="row" style="gap:8px"><select id="newAdmin" class="inp" style="flex:1">' +
        nonAdmins.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' (' + esc(e.id) + ')</option>'; }).join('') +
        '</select><button class="btn small" onclick="setRole($(\'newAdmin\').value, \'ADMIN\')">Make admin</button></div>' : '<p class="muted">Everyone is already an admin.</p>') +
      '<p class="muted small" style="margin:8px 0 0">Super admins are set in the Employees sheet (Role = SUPER_ADMIN). Admins can never change other admins or super admins, even with All employees. Super admins are also hidden from them.</p></div>';

    if (!r.admins.length) html += '<div class="card muted">No admins yet.</div>';
    r.admins.forEach(function (a, i) {
      var all = a.perms.employees === 'ALL', sel = all ? [] : a.perms.employees;
      html += '<div class="card"><div class="row"><div><b>' + esc(a.name) + '</b> <span class="muted">' + esc(a.id) + '</span>' +
        (a.configured ? '' : ' <span class="chip s-LATE">Not set yet</span>') + '</div>' +
        '<button class="link" style="color:var(--red)" onclick="setRole(\'' + esc(a.id) + '\', \'EMPLOYEE\')">Remove admin</button></div>' +
        '<div style="margin-top:10px">' + r.permissions.map(function (p) {
          return '<label class="perm"><input type="checkbox" class="perm-' + i + '" data-key="' + p.key + '"' + (a.perms[p.key] ? ' checked' : '') + '>' +
            '<span><b>' + esc(p.label) + '</b><br><small class="muted">' + esc(p.help) + '</small></span></label>';
        }).join('') + '</div>' +
        '<div class="field"><label>Employees this admin can manage</label>' +
        '<label class="check"><input type="radio" name="scope-' + i + '" value="ALL"' + (all ? ' checked' : '') + ' onchange="toggleScope(' + i + ')"> All employees</label>' +
        '<label class="check"><input type="radio" name="scope-' + i + '" value="SEL"' + (all ? '' : ' checked') + ' onchange="toggleScope(' + i + ')"> Only selected</label>' +
        '<div class="checklist' + (all ? ' hidden' : '') + '" id="scopeList-' + i + '">' + r.employees.filter(function (e) { return e.id !== a.id && e.role !== 'SUPER_ADMIN'; }).map(function (e) {
          return '<label><input type="checkbox" class="scope-' + i + '" value="' + esc(e.id) + '"' + (sel.indexOf(e.id) >= 0 ? ' checked' : '') + '> ' + esc(e.name) + ' <span class="muted">' + esc(e.id) + '</span></label>';
        }).join('') + '</div></div>' +
        '<button class="btn" onclick="savePerms(' + i + ', this)">Save permissions</button></div>';
    });
    adminBody(html);
  }

  function toggleScope(i) {
    var sel = document.querySelector('input[name="scope-' + i + '"]:checked').value;
    $('scopeList-' + i).classList.toggle('hidden', sel === 'ALL');
  }

  function savePerms(i, btn) {
    var a = S.superData.admins[i], perms = {};
    Array.prototype.forEach.call(document.querySelectorAll('.perm-' + i), function (c) { perms[c.getAttribute('data-key')] = c.checked; });
    perms.employees = document.querySelector('input[name="scope-' + i + '"]:checked').value === 'ALL' ? 'ALL' : checkedValues('scope-' + i);
    btn.disabled = true;
    api('superSavePermissions', S.token, a.id, perms)
      .then(function (r) { renderAdmins(r); toast('Permissions saved for ' + a.name); })
      .catch(function (e) { btn.disabled = false; toast(e.message); });
  }

  function setRole(id, role) {
    if (role === 'EMPLOYEE' && !confirm('Remove admin rights from ' + id + '?')) return;
    api('superSetRole', S.token, id, role)
      .then(function (r) { renderAdmins(r); toast(role === 'ADMIN' ? 'Admin added — now set their permissions' : 'Admin removed'); })
      .catch(function (e) { toast(e.message); });
  }

  function loadAudit() {
    adminLoading();
    api('superAuditLog', S.token).then(function (rows) {
      var html = '<div class="card"><h2>Recent admin activity</h2>';
      if (!rows.length) html += '<p class="muted">Nothing yet.</p>';
      rows.forEach(function (r) {
        html += '<div class="list-item"><div><div class="name">' + esc(r.action.replace(/_/g, ' ')) + ' <span class="muted" style="font-weight:400">' + esc(r.emp) + ' ' + esc(r.date) + '</span></div>' +
          '<div class="sub">' + esc(r.details) + '</div><div class="sub">by ' + esc(r.by) + ' · ' + esc(r.at) + '</div></div></div>';
      });
      adminBody(html + '<p class="muted small">Full history is in the "Audit Log" tab of the Sheet.</p></div>');
    }).catch(adminErr);
  }

  /* ---------------- Modal ---------------- */
  function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
  function closeModal() { stopCamera(); $('modal').classList.add('hidden'); }

  /* ---------------- Boot ---------------- */
  (function boot() {
    var setName = function (n) { $('coName').textContent = n; document.title = n + ' – Attendance'; };
    if (COMPANY && COMPANY.charAt(0) !== '<') setName(COMPANY); // '<' = not filled in (hosted page)
    S.token = load('att_token');
    // Logged in: the home screen brings the company name, so skip this extra call.
    if (!(COMPANY && COMPANY.charAt(0) !== '<') && !S.token) api('publicInfo').then(function (r) { setName(r.company); checkAppVersion(r); }).catch(function (e) { setName('Attendance'); $('loginMsg').innerHTML = errBox(e); });
    if (S.token) startApp(); else showLogin();
  })();
</script>
</body>
</html>
