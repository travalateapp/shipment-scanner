      (can('exportPayroll') ? '<button class="btn ghost" id="exportBtn" onclick="exportPayroll(\'' + ym + '\')">⬇ Download Excel</button>' : '') +
      '<button class="btn ghost" id="regBtn" onclick="downloadRegister(\'' + ym + '\')">⬇ Attendance register</button>' +
      '</div><div id="exportMsg"></div><div id="regMsg"></div></div>';
    html += '<div class="card"><h2>Employees</h2>' + searchBox();
    r.rows.forEach(function (e) {
      total += e.net;
      html += '<div class="list-item" data-q="' + esc((e.name + ' ' + e.id).toLowerCase()) + '" onclick="openEmployee(\'' + esc(e.id) + '\',\'' + ym + '\')" style="cursor:pointer">' +
        '<div><div class="name">' + esc(e.name) + ' <span class="muted" style="font-weight:400">' + esc(e.id) + '</span></div>' +
        '<div class="sub">P ' + e.present + ' · ½ ' + e.halfDay + ' · A ' + (e.absent + e.notJoined) + ' · Late ' + e.late + ' · OT ' + mins(e.otMin) + (e.pf ? ' · <span class="chip s-PF">PF</span>' : '') + '</div>' +
        (e.advance ? '<div class="sub">Advance − ' + money(e.advance, cur) + '</div>' : '') +
        (e.missedCheckouts ? '<div class="sub" style="color:var(--red)">⚠ ' + e.missedCheckouts + ' missed check-out(s)</div>' : '') + '</div>' +
        '<div class="right"><b>' + money(e.net, cur) + '</b>' + (e.pf
          ? (e.bank !== undefined ? '<div class="sub">🏦 ' + money(e.bank, cur) + ' · 💵 ' + money(e.cash, cur) + '</div>' : '') + '<div class="sub">PF ' + money(e.pfEmployee, cur) + ' + ' + money(e.pfEmployer, cur) + '</div>'
          : '<div class="sub">− ' + money(e.deduction, cur) + ' / + ' + money((e.otPay || 0) + (e.offDayPay || 0), cur) + '</div>') + '</div></div>';
    });
    html += '<div class="pay-line total"><span>Total payroll</span><span>' + money(total, cur) + '</span></div></div>';
    adminBody(html);
  }

  function lockMonth(ym) {
    if (!confirm('Lock ' + monthName(ym) + '? Salaries become final. Attendance, leave and advance changes for this month will be blocked.')) return;
    adminLoading();
    api('adminLockMonth', S.token, ym).then(function (r) { renderAdminMonth(r); toast('Month locked'); }).catch(adminErr);
  }
  function unlockMonth(ym) {
    if (!confirm('Unlock ' + monthName(ym) + '? Salaries will be recalculated from current data.')) return;
    adminLoading();

  /** Builds the payroll as an Excel file in the browser and downloads it. */
  /** Search box that hides the rows / cards (data-q = "name id") on the current admin screen that don't match. */
  function searchBox() {
    return '<input class="inp" style="margin-bottom:6px" placeholder="🔍 Search name or ID" oninput="filterRows(this.value)">';
  }
  function filterRows(q) {
    q = String(q || '').toLowerCase().trim();
    Array.prototype.forEach.call(document.querySelectorAll('#adminBody [data-q]'), function (el) {
      el.classList.toggle('hidden', !!q && el.getAttribute('data-q').indexOf(q) < 0);
    });
  }

  /** Muster roll: an In row and an Out row per employee, one column per day (times, or A / L / WO / H …), totals at the end. */
  function downloadRegister(ym) {
    var btn = $('regBtn'), label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing register…';
    $('regMsg').innerHTML = '';
    Promise.all([api('adminAttendanceRegister', S.token, ym), loadXlsx()]).then(function (res) {
      var r = res[0];
      var aoa = [[r.title], [r.status], [r.legend], [], r.header].concat(r.rows);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      var fixed = r.rowsPerEmployee === 2 ? 3 : 2;
      ws['!cols'] = r.header.map(function (h, i) { return { wch: i === 1 ? 24 : (i === 0 ? 8 : (i === 2 && fixed === 3 ? 5 : (/^\d/.test(h) ? 7 : 11))) }; });
      if (r.rowsPerEmployee === 2) {
        // Each employee has an In row and an Out row: merge the cells that are the same in both
        // (ID, name, totals, and days with a code such as A / WO / H instead of times).
        var merges = [];
        for (var k = 0; k + 1 < r.rows.length; k += 2) {
          var rowA = r.rows[k], rowB = r.rows[k + 1], at = 5 + k;
          for (var c = 0; c < r.header.length; c++) {
            if (c === 2) continue;
            if (rowA[c] === rowB[c]) merges.push({ s: { r: at, c: c }, e: { r: at + 1, c: c } });
          }
        }
        ws['!merges'] = merges;
      }
      ws['!freeze'] = { xSplit: fixed, ySplit: 5 };
      ws['!views'] = [{ state: 'frozen', xSplit: fixed, ySplit: 5 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Register ' + ym);
      if (NATIVE) NATIVE.saveFile(XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }), r.fileName,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      else XLSX.writeFile(wb, r.fileName);
      $('regMsg').innerHTML = '<div class="msg ok">Downloaded <b>' + esc(r.fileName) + '</b> (' + (r.rows.length / (r.rowsPerEmployee || 1)) + ' employees).</div>';
    }).catch(function (e) { $('regMsg').innerHTML = errBox(e); })
      .then(function () { var b = $('regBtn'); if (b) { b.disabled = false; b.innerHTML = label; } });
  }

  function exportPayroll(ym) {
    var btn = $('exportBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing Excel…';
    $('exportMsg').innerHTML = '';
    Promise.all([api('adminExportPayroll', S.token, ym), loadXlsx()]).then(function (res) {
      var r = res[0];
      var noSum = ['Emp ID', 'Name', 'Days Counted', 'PF', 'Per Day', 'Per Hour', 'Per Min'];
      var totals = r.header.map(function (h, i) {
        if (i === 0) return 'TOTAL';
        if (noSum.indexOf(h) >= 0) return '';
        var sum = 0, any = false;
        r.rows.forEach(function (row) { if (typeof row[i] === 'number') { sum += row[i]; any = true; } });
        return any ? Math.round(sum * 100) / 100 : '';
      });
      var aoa = [[r.title], [r.status], ['Generated ' + r.generated + ' · amounts in ' + r.currency], [], r.header]
        .concat(r.rows).concat([totals]);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = r.header.map(function (h) { return { wch: h === 'Name' ? 22 : Math.max(10, Math.min(18, h.length + 2)) }; });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 4, c: 0 }, e: { r: 4 + r.rows.length, c: r.header.length - 1 } }) };
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Payroll ' + ym);
      if (NATIVE) NATIVE.saveFile(XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }), r.fileName,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      else XLSX.writeFile(wb, r.fileName);
      $('exportMsg').innerHTML = '<div class="msg ok">Downloaded <b>' + esc(r.fileName) + '</b> (' + r.rows.length + ' employees). Check your Downloads folder.</div>';
    }).catch(function (e) {
      $('exportMsg').innerHTML = errBox(e);
    }).then(function () { var b = $('exportBtn'); if (b) { b.disabled = false; b.innerHTML = '⬇ Download Excel'; } });
  }

  /** Loads the Excel library (SheetJS) the first time it is needed. */
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = function () { resolve(); };
      sc.onerror = function () { reject(new Error('Could not load the Excel maker. Check the internet connection and try again.')); };
      document.head.appendChild(sc);
    });
  }

  function openEmployee(id, ym) {
    adminFetch('emp|' + id + '|' + ym, 'adminEmployeeMonth', [id, ym], function (m) { showEmployeeMonth(m); });
  }

  /** Draws an employee's month. quiet = after saving an entry: no spinner, the page keeps its scroll position. */
  function showEmployeeMonth(m, quiet) {
    var y = window.scrollY;
    S.empMonth = { id: m.employee.id, ym: m.ym };
    S.reloadAfterEntry = function () { openEmployee(m.employee.id, m.ym); };
    adminBody('<button class="btn small ghost" style="margin-bottom:12px" onclick="renderAdmin()">‹ Back</button>' +
      monthHtml(m, 'openEmployee', m.employee.id));

  }

  /* ---------- Requests & OT approvals ---------- */
  function loadAdminRequests() {
    adminFetch('req', 'adminRequests', [], renderAdminRequests);
  }

  function renderAdminRequests(r) {
    S.adminReqs = r;
    var html = '<div class="card"><h2>Pending requests (' + r.pending.length + ')</h2>';
    if (!r.pending.length) html += '<p class="muted">Nothing to approve.</p>';
    r.pending.forEach(function (q, i) {
      html += '<div class="list-item" style="display:block"><div class="row"><div class="name">' + esc(q.name) + ' <span class="muted" style="font-weight:400">' + esc(q.empId) + '</span></div>' + chip('PENDING') + '</div>' +
        '<div style="margin-top:4px">' + reqTitle(q) + '</div><div class="sub">' + esc(q.reason) + ' · sent ' + esc(q.created) + '</div>' +
 (q.type === 'ADVANCE' ? advApprovalFields(q, i, r) : '') +
        (q.type === 'LEAVE' && q.worked && q.worked.length ? '<div class="msg warn">⚠ ' + esc(q.name) + ' already worked on ' + q.worked.map(function (d) { return esc(fmtDate(d)); }).join(', ') +
          '. ' + (q.worked.length > 1 ? 'These days stay' : 'This day stays') + ' as worked; the leave is only put on the other days.</div>' : '') +
        (q.type === 'LEAVE' ? '<select id="aqLt-' + i + '" class="inp" style="margin-top:8px"><option value="">— Paid or Unpaid? —</option>' +
          '<option value="PAID"' + (q.leaveType === 'PAID' ? ' selected' : '') + '>Paid leave (no salary cut)</option>' +
          '<option value="UNPAID"' + (q.leaveType === 'UNPAID' ? ' selected' : '') + '>Unpaid leave (salary cut, counted as absent)</option></select>' : '') +
        '<input id="aqRm-' + i + '" class="inp" style="margin-top:8px" placeholder="Remark (optional)">' +
        '<div class="btns"><button class="btn green" onclick="decideRequest(' + i + ',true,this)">Approve</button>' +
        '<button class="btn soft-red" onclick="decideRequest(' + i + ',false,this)">Reject</button></div></div>';
    });
    html += '</div>';

    if (r.otApproval) {
      html += '<div class="card"><h2>OT waiting for approval (' + r.ot.length + ')</h2>';
      if (!r.ot.length) html += '<p class="muted">No OT to approve.</p>';
      r.ot.forEach(function (o) {
        html += '<div class="list-item"><div><div class="name">' + esc(o.name) + '</div><div class="sub">' + esc(fmtDate(o.date)) + ' · ' + esc(o.in) + ' → ' + esc(o.out) + '</div></div>' +
          '<div class="right"><b style="color:var(--ot)">' + mins(o.otMin) + '</b><div><button class="link" style="color:var(--green)" onclick="decideOt(\'' + esc(o.empId) + '\',\'' + o.date + '\',true)">Approve</button> · ' +
          '<button class="link" style="color:var(--red)" onclick="decideOt(\'' + esc(o.empId) + '\',\'' + o.date + '\',false)">Reject</button></div></div></div>';
      });
      html += '</div>';
    }

    if (r.recent.length) {
      html += '<div class="card"><h2>Recently decided</h2>';
      r.recent.forEach(function (q) {
        html += '<div class="list-item"><div><div class="name">' + esc(q.name) + '</div><div class="sub">' + reqTitle(q) + '</div>' +
          '<div class="sub">by ' + esc(q.decidedBy) + ' · ' + esc(q.decidedAt) + (q.remark ? ' · ' + esc(q.remark) : '') + '</div></div><div class="right">' + chip(q.status) + '</div></div>';
      });
      html += '</div>';
    }
    adminBody(html);
  }

  /** Amount / deduction / start month, and whether to add to a running advance. */
  function advApprovalFields(q, i, r) {
    var cur = r.currency, running = q.running || [];
    return '<div class="grid2"><div class="field"><label>Amount</label><input id="aqAmt-' + i + '" class="inp" inputmode="decimal" value="' + esc(q.amount) + '"></div>' +
      '<div class="field"><label>Deduct per month</label><input id="aqMon-' + i + '" class="inp" inputmode="decimal" value="' + esc(q.monthly || '') + '" placeholder="e.g. 2000"></div></div>' +
      (running.length
        ? '<div class="msg info">' + esc(q.name) + ' already has ' + running.length + ' advance(s) running.</div>' +
          '<div class="field"><label>Approve as</label><select id="aqMode-' + i + '" class="inp" onchange="$(\'aqStartBox-' + i + '\').classList.toggle(\'hidden\', this.value!==\'NEW\')">' +
          running.map(function (a) { return '<option value="ADD:' + esc(a.id) + '">Add to running advance' + (a.note ? ' – ' + esc(a.note) : '') + ' (balance ' + money(a.balance, cur) + ')</option>'; }).join('') +
          '<option value="NEW">New separate advance</option></select></div>'
        : '<input type="hidden" id="aqMode-' + i + '" value="NEW">') +
      '<div class="field' + (running.length ? ' hidden' : '') + '" id="aqStartBox-' + i + '"><label>Start deducting from</label><input id="aqStart-' + i + '" class="inp" type="month" value="' + r.currentMonth + '"></div>';
  }

  function decideRequest(i, approve, btn) {
    var q = S.adminReqs.pending[i];
    if (!approve && !confirm('Reject this request?')) return;
    var lt = $('aqLt-' + i) ? $('aqLt-' + i).value : null;
    if (approve && q.type === 'LEAVE' && !lt) { toast('Choose Paid or Unpaid leave first.'); $('aqLt-' + i).focus(); return; }
    btn.disabled = true;
    var adv = null;
    if (q.type === 'ADVANCE') {
      var mode = $('aqMode-' + i).value;
      adv = { amount: $('aqAmt-' + i).value, monthly: $('aqMon-' + i).value, startMonth: $('aqStart-' + i).value,
        mode: mode === 'NEW' ? 'NEW' : 'ADD', advanceId: mode === 'NEW' ? '' : mode.slice(4) };
    }
    api('adminDecideRequest', S.token, q.id, approve, $('aqRm-' + i).value, lt, adv)
      .then(function (r) { renderAdminRequests(r); toast(approve ? 'Approved' : 'Rejected'); })
      .catch(function (e) { btn.disabled = false; toast(e.message); });
  }

  function decideOt(empId, date, approve) {
    api('adminDecideOt', S.token, empId, date, approve).then(function () {
      toast(approve ? 'OT approved' : 'OT rejected');
      closeModal();
      if (S.reloadAfterEntry) S.reloadAfterEntry(); else loadAdminRequests();
    }).catch(function (e) { toast(e.message); });
  }

  /* ---------- Entries (back-dated attendance) ---------- */
  function loadEntries() {
    adminLoading();
    api('adminEntryOptions', S.token).then(function (o) {
      S.reloadAfterEntry = null;
      var empOpts = o.employees.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' (' + esc(e.id) + ')</option>'; }).join('');
      var first = todayLocal().slice(0, 8) + '01', yest = o.bulkMaxDate;
      if (first < o.minDate) first = o.minDate;
      if (first > yest) first = yest;
      var shift = (S.home && S.home.shiftStart) || '09:30';
      var html = '<div class="card"><h2>One day</h2>' +
        '<div class="field"><label>Employee</label><select id="enEmp" class="inp">' + empOpts + '</select></div>' +
        '<div class="field"><label>Date</label><input id="enDate" class="inp" type="date" min="' + o.minDate + '" max="' + o.maxDate + '" value="' + yest + '"></div>' +
        '<div class="btns"><button class="btn" onclick="openEntryEditor($(\'enEmp\').value, $(\'enDate\').value)">Add / Edit entry</button>' +
        '<button class="btn ghost" onclick="openEmployee($(\'enEmp\').value, $(\'enDate\').value.slice(0,7))">📅 Calendar</button></div></div>';

      html += '<div class="card"><h2>Fill many days</h2><p class="muted" style="font-size:13px;margin:0">Use this to enter the days before the app started (up to yesterday). ' +
        'Fill everyone as present, then fix absent / late / half days one by one.</p>' +
        '<div class="field"><label>Employees <button class="link" onclick="checkAll(\'bulkEmp\', true)">All</button> · <button class="link" onclick="checkAll(\'bulkEmp\', false)">None</button></label>' +
        '<div class="checklist">' + o.employees.map(function (e) {
          return '<label><input type="checkbox" class="bulkEmp" value="' + esc(e.id) + '" checked> ' + esc(e.name) + ' <span class="muted">' + esc(e.id) + '</span></label>';
        }).join('') + '</div></div>' +
        '<div class="grid2"><div class="field"><label>From</label><input id="bkFrom" class="inp" type="date" min="' + o.minDate + '" max="' + yest + '" value="' + first + '"></div>' +
        '<div class="field"><label>To</label><input id="bkTo" class="inp" type="date" min="' + o.minDate + '" max="' + yest + '" value="' + yest + '"></div>' +
        '<div class="field"><label>Check-in</label><input id="bkIn" class="inp" type="time" value="' + shift + '"></div>' +
        '<div class="field"><label>Check-out</label><input id="bkOut" class="inp" type="time" value="' + addMinutes(shift, ((S.home && S.home.standardHours) || 9) * 60) + '"></div></div>' +
        '<div class="field"><label>Status</label>' + statusSelect('bkStatus', '') + '</div>' +
        '<div class="field"><label>Note</label><input id="bkNote" class="inp" placeholder="e.g. Before app start"></div>' +
        '<label class="check"><input type="checkbox" id="bkSkip" checked> Skip weekly offs &amp; holidays</label>' +
        '<label class="check"><input type="checkbox" id="bkOver"> Overwrite days that already have an entry</label>' +
        '<button class="btn" id="bkBtn" onclick="bulkFill()">Fill days</button><div id="bkMsg"></div></div>';
      adminBody(html);
    }).catch(adminErr);
  }

  function statusSelect(id, val) {
    var o = [['', 'Auto (from times)'], ['PRESENT', 'Present'], ['HALF_DAY', 'Half Day'], ['ABSENT', 'Absent'], ['LEAVE', 'Paid Leave']];
    return '<select id="' + id + '" class="inp">' + o.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === val ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>';
  }

  function bulkFill() {
    var ids = checkedValues('bulkEmp'), from = $('bkFrom').value, to = $('bkTo').value;
    if (!ids.length) return toast('Select at least one employee');
    var status = $('bkStatus').value;
    var what = status ? $('bkStatus').selectedOptions[0].text : $('bkIn').value + '–' + $('bkOut').value;
    if (!confirm('Fill ' + ids.length + ' employee(s) from ' + from + ' to ' + to + ' as ' + what + '?')) return;
    $('bkBtn').disabled = true; $('bkMsg').innerHTML = '';
    api('adminBulkEntry', S.token, {
      empIds: ids, from: from, to: to, in: status ? '' : $('bkIn').value, out: status ? '' : $('bkOut').value,
      override: status, note: $('bkNote').value, skipOff: $('bkSkip').checked, overwrite: $('bkOver').checked
    }).then(function (r) {
      $('bkMsg').innerHTML = '<div class="msg ok">Done: ' + r.added + ' added, ' + r.updated + ' updated, ' + r.skipped + ' skipped (already had an entry or before joining).</div>';
    }).catch(function (e) { $('bkMsg').innerHTML = errBox(e); })
      .then(function () { $('bkBtn').disabled = false; });
  }

  function openEntryEditor(empId, date) {
    if (!date) return toast('Choose a date');
    var name = S.entry && S.entry.empId === empId ? S.entry.name : '';
    openModal(entryHead(empId, name, date) + '<div class="center" style="padding:30px 0"><div class="spinner"></div></div>');
    api('adminGetEntry', S.token, empId, date).then(function (en) { renderEntryEditor(en); })
      .catch(function (e) { openModal(entryHead(empId, name, date) + errBox(e)); });
  }

  /** Name, ‹ date › arrows to move to the previous / next day, and ✕ to close. */
  function entryHead(empId, name, date) {
    var prev = addDaysLocal(date, -1), next = addDaysLocal(date, 1), today = todayLocal();
    var min = S.viewMonth && S.viewMonth.minDate || '';
    var go = function (d, on) { return '<button class="day-arrow"' + (on ? ' onclick="openEntryEditor(\'' + esc(empId) + '\',\'' + d + '\')"' : ' disabled') + '>' + (d < date ? '‹' : '›') + '</button>'; };
    return '<div class="row" style="align-items:flex-start"><h2 style="margin:0">' + esc(name) + ' <span class="muted" style="font-weight:400">' + esc(empId) + '</span></h2>' +
      '<button class="x-btn" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<div class="day-nav">' + go(prev, !min || prev >= min) + '<b>' + esc(fmtDate(date)) + '</b>' + go(next, next <= today) + '</div>';
  }

  function renderEntryEditor(en, msg) {
    S.entry = en;
    var html = entryHead(en.empId, en.name, en.date) +
      '<p style="margin:4px 0 0">' + (en.offType ? chip(en.offType) : '') + ' ' +
      (en.exists ? (chip(en.day.status) + lateChip(en.day.late)) : '<span class="chip s-NOT_MARKED">No entry yet</span>') + '</p>' +
      (en.flags ? '<p>' + flagChips(en.flags, en.markedBy) + '</p>' : '') +
      (en.hasSelfie ? '<p class="muted small">This day was marked from the app (has selfie &amp; location). Changes keep them.</p>' : '') +
      '<div class="grid2"><div class="field"><label>Check-in</label><input id="edIn" class="inp" type="time" value="' + esc(en.in) + '"></div>' +
      '<div class="field"><label>Check-out</label><input id="edOut" class="inp" type="time" value="' + esc(en.out) + '"></div></div>' +
      '<div class="field"><label>Status</label>' + statusSelect('edStatus', en.override) + '</div>' +
      '<p class="muted small" style="margin:6px 0 0">"Auto" works out Present / Half Day / Late / OT from the times. Present / Half Day keep the late mark; Leave / Absent remove it.</p>' +
      (en.otNeedsApproval ? '<div class="field"><label>OT approval</label><select id="edOt" class="inp">' +
        [['', 'Not decided'], ['YES', 'Approved'], ['NO', 'Rejected']].map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === en.otApproved ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select></div>' : '') +
      '<div class="field"><label>Note</label><input id="edNote" class="inp" value="' + esc(en.note) + '" placeholder="Reason (optional)"></div>' +
      '<button class="btn" id="edSave" onclick="saveEntry()">Save</button>' +
      (en.exists ? '<button class="btn soft-red" id="edDel" onclick="deleteEntry()">Delete entry</button>' : '') +
      '<div id="edMsg">' + (msg ? '<div class="msg ok">' + msg + '</div>' : '') + '</div>';
    openModal(html);
  }

  /** The calendar this entry belongs to, if it is open behind the popup. */
  function entryMonth(en) {
    return S.empMonth && S.empMonth.id === en.empId && document.querySelector('#adminBody #cal') ? S.empMonth.ym : null;
  }

  /** After saving / deleting: the popup stays open; the calendar behind it is redrawn in place. */
  function afterEntryChange(en, r, msg) {
    var ym = entryMonth(en);
    if (ym && r && r.month) { renderEntryEditor(r.entry, msg); showEmployeeMonth(r.month, true); return; }
    renderEntryEditor(r && r.entry ? r.entry : r, msg);
    if (S.reloadAfterEntry) S.reloadAfterEntry();
  }

  function saveEntry() {
    var en = S.entry;
    $('edSave').disabled = true; $('edSave').innerHTML = '<span class="spinner"></span> Saving…';
    var data = { empId: en.empId, date: en.date, in: $('edIn').value, out: $('edOut').value, override: $('edStatus').value, note: $('edNote').value };
    if ($('edOt')) data.otApproved = $('edOt').value;
    api('adminSaveEntry', S.token, data, entryMonth(en))
      .then(function (r) { afterEntryChange(en, r, '✓ Saved ' + esc(fmtDate(en.date))); })
      .catch(function (e) { $('edSave').disabled = false; $('edSave').innerHTML = 'Save'; $('edMsg').innerHTML = errBox(e); });
  }

  function deleteEntry() {
    var en = S.entry;
    if (!confirm('Delete the entry of ' + en.name + ' for ' + fmtDate(en.date) + '?')) return;
    $('edDel').disabled = true;
    api('adminDeleteEntry', S.token, en.empId, en.date, entryMonth(en))
      .then(function (r) {
        if (r === true) return api('adminGetEntry', S.token, en.empId, en.date).then(function (e2) { afterEntryChange(en, e2, '✓ Entry deleted'); });
        afterEntryChange(en, r, '✓ Entry deleted');
      })
      .catch(function (e) { $('edDel').disabled = false; $('edMsg').innerHTML = errBox(e); });
  }

  /* ---------- Employees ---------- */
  function loadStaff() {
    adminFetch('staff', 'adminStaff', [], renderStaff);
  }

  function renderStaff(r) {
    // Alphabetical by name (the form opens by position in this sorted list).
    (r.list || []).sort(function (a, b) { return a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }) || a.id.localeCompare(b.id); });
    S.staff = r;
    var html = '<button class="btn" style="margin:0 0 14px" onclick="openStaffForm(-1)">＋ Add employee</button><div class="card"><h2>Employees</h2>';
    r.list.forEach(function (e, i) {
      html += '<div class="list-item"><div><div class="name">' + esc(e.name) + ' <span class="muted" style="font-weight:400">' + esc(e.id) + '</span></div>' +
        '<div class="sub">' + (e.gender ? (e.gender === 'F' ? '♀ Female · ' : '♂ Male · ') : '') + money(e.salary, '₹') + '/month' + (function () {
          var next = (e.increments || []).filter(function (x) { return x.month > ymNow(); })[0];
          return next ? ' → ' + money(next.newSalary, '₹') + ' from ' + esc(monthName(next.month)) : '';
        })() + ' · joined ' + esc(fmtDate(e.joinDate)) + (e.phone ? ' · ' + esc(e.phone) : '') + '</div>' +
        (!e.active && e.periods && e.periods.length && e.periods[e.periods.length - 1].to ? '<div class="sub">Left on ' + esc(fmtDate(e.periods[e.periods.length - 1].to)) + '</div>' : '') +
        (e.gender ? '' : (e.role === 'GUARD' ? '' : '<div class="sub" style="color:var(--orange)">Gender not set</div>')) +
        (e.shiftStart || e.hourlyOt === false || e.morningOt === false || e.anywhere ? '<div class="sub">' + [e.shiftStart ? '⏰ ' + esc(e.shiftStart) + '–' + esc(e.shiftEnd) : '',
          e.hourlyOt === false ? 'no hourly OT' : (e.morningOt === false ? 'evening OT only' : ''), e.anywhere ? '📍 anywhere' : ''].filter(String).join(' · ') + '</div>' : '') + '</div>' +
        '<div class="right">' + (e.active ? '' : chip('CLOSED').replace('Closed', 'Inactive')) + (e.role !== 'EMPLOYEE' ? ' <span class="chip s-PF">' + esc(e.role.replace('_', ' ')) + '</span>' : '') +
        '<div><button class="link" onclick="openStaffForm(' + i + ')">Edit</button></div></div></div>';
    });
    html += '</div>';
    adminBody(html);
  }

  function openStaffForm(i) {
    var isNew = i < 0, e = isNew ? { id: '', name: '', salary: '', joinDate: todayLocal(), phone: '', active: true, role: 'EMPLOYEE' } : S.staff.list[i];
    var html = '<h2 style="margin-top:0">' + (isNew ? 'Add employee' : esc(e.name)) + '</h2>' +
      (isNew ? '<div class="field"><label>Employee ID</label><input id="sfId" class="inp" autocapitalize="characters" placeholder="e.g. E010"></div>' : '') +
      '<div class="field"><label>Name</label><input id="sfName" class="inp" value="' + esc(e.name) + '"></div>' +
      '<div class="grid2"><div class="field"><label>' + (isNew ? 'Monthly salary' : 'Current salary') + '</label><input id="sfSalary" class="inp" inputmode="decimal" value="' + esc(e.salary) + '"' +
        (isNew ? '' : ' readonly style="background:var(--bg)"') + '></div>' +
      '<div class="field"><label>Join date</label><input id="sfJoin" class="inp" type="date" value="' + esc(e.joinDate) + '"></div></div>' +
      '<div class="grid2"><div class="field"><label>Phone</label><input id="sfPhone" class="inp" inputmode="tel" value="' + esc(e.phone) + '"></div>' +
      '<div class="field"><label>Gender</label><select id="sfGender" class="inp"><option value="">— Not set —</option>' +
        '<option value="M"' + (e.gender === 'M' ? ' selected' : '') + '>Male</option><option value="F"' + (e.gender === 'F' ? ' selected' : '') + '>Female</option></select></div></div>' +
      (isNew ? '<div class="field"><label>PIN (4–6 digits)</label><input id="sfPin" class="inp" inputmode="numeric"></div>' : '') +
      (S.staff.canSetRole && e.role !== 'SUPER_ADMIN' ? '<div class="field"><label>Role</label><select id="sfRole" class="inp"><option value="EMPLOYEE"' + (e.role === 'EMPLOYEE' ? ' selected' : '') + '>Employee</option><option value="ADMIN"' + (e.role === 'ADMIN' ? ' selected' : '') + '>Admin</option><option value="GUARD"' + (e.role === 'GUARD' ? ' selected' : '') + '>Guard (only marks others)</option></select></div>' : '') +
      (e.role === 'GUARD' ? '' : '<div class="card" style="background:var(--bg);margin:14px 0 0;padding:12px"><b>Work timing</b>' +
        '<p class="muted small" style="margin:4px 0 0">Leave empty for the company shift. With an own shift, late marks, early leaving and OT use these times.</p>' +
        '<div class="grid2"><div class="field"><label>Shift start</label><input id="sfShiftStart" class="inp" type="time" value="' + esc(e.shiftStart || '') + '"></div>' +
        '<div class="field"><label>Shift end</label><input id="sfShiftEnd" class="inp" type="time" value="' + esc(e.shiftEnd || '') + '"></div></div>' +
        '<label class="check" style="margin-top:8px"><input type="checkbox" id="sfHourlyOt"' + (e.hourlyOt === false ? '' : ' checked') + ' onchange="$(\'sfMorningOt\').disabled=!this.checked"> Hourly OT on working days (untick = only Sunday / week-off work is paid extra)</label>' +
        '<label class="check"><input type="checkbox" id="sfMorningOt"' + (e.morningOt === false ? '' : ' checked') + (e.hourlyOt === false ? ' disabled' : '') + '> Morning OT: coming before the shift start counts as OT (untick = only evening OT, after the shift end)</label></div>') +
      (e.role === 'GUARD' ? '' : '<label class="check" style="margin-top:10px"><input type="checkbox" id="sfAnywhere"' + (e.anywhere ? ' checked' : '') + '> Can mark from anywhere (outstation): no office distance check, location still recorded</label>') +
      (isNew ? '' : '<label class="check" style="margin-top:10px"><input type="checkbox" id="sfActive"' + (e.active ? ' checked' : '') + ' onchange="staffActiveChanged(' + i + ')"> Active (untick when someone leaves the company)</label>' +
        '<div id="sfActiveDate" class="field hidden"><label id="sfActiveLabel"></label><input id="sfActiveOn" class="inp" type="date"></div>' +
        periodsHtml(e)) +
      '<button class="btn" id="sfSave" onclick="saveStaff(' + i + ')">Save</button>' +
      (isNew || e.role === 'GUARD' ? '' : incrementsHtml(e, i)) +
      (isNew ? '' : '<div class="card" style="background:var(--bg);margin-top:16px"><b>Reset PIN</b><div class="row" style="margin-top:8px"><input id="sfNewPin" class="inp" inputmode="numeric" placeholder="New PIN"><button class="btn small" onclick="resetPin(\'' + esc(e.id) + '\')">Reset</button></div></div>') +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><div id="sfMsg"></div>';
    openModal(html);
  }

  /** Unticking Active asks for the last working day; ticking it again asks for the first day back. */
  function staffActiveChanged(i) {
    var e = S.staff.list[i], on = $('sfActive').checked, changed = on !== e.active;
    $('sfActiveDate').classList.toggle('hidden', !changed);
    if (!changed) return;
    $('sfActiveLabel').textContent = on ? 'Active again from (salary and attendance start this day)' : 'Last working day';
    $('sfActiveOn').value = todayLocal();
    if (on) $('sfActiveOn').removeAttribute('max'); else $('sfActiveOn').max = todayLocal();
  }

  function periodsHtml(e) {
    var p = e.periods || [];
    if (p.length < 2 && e.active) return '';
    return '<p class="muted small" style="margin:8px 0 0">Employment: ' + p.map(function (x) {
      return esc(fmtDate(x.from)) + ' – ' + (x.to ? esc(fmtDate(x.to)) : 'now');
    }).join(' · ') + '</p>';
  }

  /** Salary increments: the original salary is never edited; each increment starts in its own month. */
  function incrementsHtml(e, i) {
    var inc = e.increments || [];
    var html = '<div class="card" style="background:var(--bg);margin-top:16px"><b>Salary increment</b>' +
      '<p class="muted small" style="margin:4px 0 0">Original salary ' + money(e.baseSalary, '₹') + '. The new salary applies from the chosen month; earlier months stay as they were. Use a minus amount for a decrease.</p>' +
      '<div class="grid2"><div class="field"><label>Increment (₹/month)</label><input id="inAmt" class="inp" inputmode="decimal" placeholder="e.g. 2000"></div>' +
      '<div class="field"><label>From month</label><input id="inMonth" class="inp" type="month" value="' + ymNow() + '"></div></div>' +
      '<div class="field"><label>Note (optional)</label><input id="inNote" class="inp" placeholder="e.g. Annual increment"></div>' +
      '<button class="btn small" style="margin-top:10px" id="inBtn" onclick="addIncrement(' + i + ')">＋ Add increment</button><div id="inMsg"></div>';
    if (inc.length) {
      html += '<div style="margin-top:10px">' + inc.map(function (x) {
        return '<div class="row small" style="padding:6px 0;border-top:1px dashed var(--line)"><span><b>' + (x.amount > 0 ? '+' : '−') + money(Math.abs(x.amount), '₹') +
          '</b> from ' + esc(monthName(x.month)) + ' → ' + money(x.newSalary, '₹') + (x.note ? ' <span class="muted">(' + esc(x.note) + ')</span>' : '') + '</span>' +
          (x.locked ? '<span class="chip s-LOCK">🔒</span>' : '<button class="link" style="color:var(--red)" onclick="deleteIncrement(' + i + ',' + x.row + ')">Remove</button>') + '</div>';
      }).join('') + '</div>';
    }
    return html + '</div>';
  }

  function reopenStaff(r, id) {
    renderStaff(r);
    var j = S.staff.list.findIndex(function (x) { return x.id === id; });
    if (j >= 0) openStaffForm(j);
  }
  function addIncrement(i) {
    var e = S.staff.list[i], amt = $('inAmt').value, month = $('inMonth').value;
    if (!month) return ($('inMsg').innerHTML = errBox('Choose the month the new salary starts.'));
    if (!confirm('Salary of ' + e.name + ' changes by ' + amt + ' from ' + monthName(month) + '. Months before stay as they were. Continue?')) return;
    $('inBtn').disabled = true;
    api('adminAddIncrement', S.token, e.id, { amount: amt, month: month, note: $('inNote').value })
      .then(function (r) { S.monthCache = {}; reopenStaff(r, e.id); toast('Increment added'); })
      .catch(function (err) { $('inBtn').disabled = false; $('inMsg').innerHTML = errBox(err); });
  }
  function deleteIncrement(i, row) {
    var e = S.staff.list[i];
    if (!confirm('Remove this increment of ' + e.name + '?')) return;
    api('adminDeleteIncrement', S.token, e.id, row).then(function (r) { S.monthCache = {}; reopenStaff(r, e.id); toast('Increment removed'); })
      .catch(function (err) { toast(err.message); });
  }

  function saveStaff(i) {
    var isNew = i < 0;
    var data = { isNew: isNew, id: isNew ? $('sfId').value : S.staff.list[i].id, name: $('sfName').value, salary: $('sfSalary').value,
      joinDate: $('sfJoin').value, phone: $('sfPhone').value };
    if (isNew) data.pin = $('sfPin').value;
    else {
      data.active = $('sfActive').checked;
      if (data.active !== S.staff.list[i].active) {
        if (!$('sfActiveOn').value) { $('sfMsg').innerHTML = errBox(data.active ? 'Choose the date they start again.' : 'Choose the last working day.'); return; }
        if (data.active) data.activeFrom = $('sfActiveOn').value; else data.leftOn = $('sfActiveOn').value;
      }
    }
    if ($('sfAnywhere')) data.anywhere = $('sfAnywhere').checked;
    if ($('sfGender')) data.gender = $('sfGender').value;
    if ($('sfShiftStart')) { data.shiftStart = $('sfShiftStart').value; data.shiftEnd = $('sfShiftEnd').value; data.hourlyOt = $('sfHourlyOt').checked; data.morningOt = $('sfMorningOt').checked; }
    if ($('sfRole')) data.role = $('sfRole').value;
    $('sfSave').disabled = true;
    api('adminSaveStaff', S.token, data).then(function (r) {
      var saved = (r.list || []).filter(function (e) { return e.id === String(data.id).trim().toUpperCase(); })[0];
      if (data.role && saved && saved.role !== data.role) {
        // An older Code.gs ignores roles it doesn't know (e.g. Guard) and keeps Employee.
        renderStaff(r);
        $('sfSave').disabled = false;
        $('sfMsg').innerHTML = errBox('The role was not saved: the Apps Script server is running older code. Paste the latest Code.gs ' +
          'into Apps Script, then Deploy → Manage deployments → ✏ Edit → New version → Deploy, and save again.');
        return;
      }
      closeModal(); renderStaff(r); toast('Saved');
    })
      .catch(function (e) { $('sfSave').disabled = false; $('sfMsg').innerHTML = errBox(e); });
  }

  function resetPin(id) {
    var pin = $('sfNewPin').value;
    api('adminResetPin', S.token, id, pin).then(function () { toast('PIN reset. Tell the employee their new PIN.'); $('sfNewPin').value = ''; })
      .catch(function (e) { $('sfMsg').innerHTML = errBox(e); });
  }

  /* ---------- Advances ---------- */
  function loadAdvances() {
    adminFetch('adv', 'adminAdvances', [], renderAdvances);
  }

  function renderAdvances(r) {
    S.adv = r;
    var cur = r.currency;
    var html = '<div class="card"><h2>Give an advance</h2>' +
      '<div class="field"><label>Employee</label><select id="avEmp" class="inp" onchange="advEmpHint()">' + r.employees.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' (' + esc(e.id) + ')' + (e.ongoing ? ' – advance running' : '') + '</option>'; }).join('') + '</select></div>' +
      '<div id="avHint"></div>' +
      '<div class="grid2"><div class="field"><label>Amount</label><input id="avAmt" class="inp" inputmode="decimal" placeholder="e.g. 10000"></div>' +
      '<div class="field"><label>Deduct per month</label><input id="avMon" class="inp" inputmode="decimal" placeholder="e.g. 2000"></div>' +
      '<div class="field"><label>Start deducting from</label><input id="avStart" class="inp" type="month" value="' + r.currentMonth + '"></div>' +
      '<div class="field"><label>Date given</label><input id="avDate" class="inp" type="date" value="' + todayLocal() + '"></div></div>' +
      '<div class="field"><label>Note</label><input id="avNote" class="inp" placeholder="e.g. Medical"></div>' +
      '<button class="btn" id="avBtn" onclick="saveAdvance()">Save advance</button><div id="avMsg"></div></div>';

    html += '<div class="card"><h2>Advances</h2>';
    if (!r.list.length) html += '<p class="muted">No advances yet.</p>';
    r.list.forEach(function (a, i) {
      var st = a.repaid ? '<span class="chip s-APPROVED">Repaid</span>' : chip(a.status);
      html += '<div class="list-item" style="display:block"><div class="row"><div class="name">' + esc(a.name) + ' <span class="muted" style="font-weight:400">' + esc(a.empId) + '</span></div>' + st + '</div>' +
        '<div class="sub">' + money(a.amount, cur) + ' given ' + esc(fmtDate(a.dateGiven)) + (a.note ? ' · ' + esc(a.note) : '') + '</div>' +
        '<div class="sub">' + money(a.monthly, cur) + '/month from ' + esc(monthName(a.startMonth)) + '</div>' +
        (a.topUps && a.topUps.length ? a.topUps.map(function (t) { return '<div class="sub">➕ ' + esc(t) + '</div>'; }).join('') : '') +
        '<div class="kv" style="margin-top:8px"><div><b>' + money(a.deductedBefore, cur) + '</b><span>Recovered</span></div>' +
        '<div' + (a.thisMonthChanged ? ' class="k-ot"' : '') + '><b>' + money(a.thisMonth, cur) + '</b><span>This month' + (a.thisMonthChanged ? ' (changed)' : '') + '</span></div>' +
        '<div class="k-red"><b>' + money(a.balanceAfter, cur) + '</b><span>Balance after</span></div></div>' +
        (a.changes.length ? '<div style="margin-top:8px">' + a.changes.map(function (c) {
          return '<div class="row small" style="padding:4px 0"><span>📌 <b>' + esc(monthName(c.month)) + ':</b> ' +
            (c.amount === 0 ? 'no deduction (skipped)' : 'deduct ' + money(c.amount, cur)) + (c.note ? ' <span class="muted">· ' + esc(c.note) + '</span>' : '') + '</span>' +
            (c.locked ? '<span class="muted">locked</span>' : '<button class="link" style="color:var(--red)" onclick="clearAdvMonth(' + i + ',\'' + c.month + '\')">Undo</button>') + '</div>';
        }).join('') + '</div>' : '') +
        (a.status === 'CLOSED' || (a.repaid && !a.changes.length) ? '<div class="btns"><button class="btn small ghost" onclick="openTopUp(' + i + ')">＋ Add more</button></div>' : '<div class="btns">' +
          '<button class="btn small" onclick="openAdvMonth(' + i + ')">Change a month</button>' +
          '<button class="btn small ghost" onclick="openTopUp(' + i + ')">＋ Add more</button>' +
          '<button class="btn small ghost" onclick="editAdvance(' + i + ')">Change monthly</button>' +
          (a.status === 'ACTIVE' ? '<button class="btn small ghost" onclick="advStatus(' + i + ',\'PAUSED\')">Pause</button>' : '<button class="btn small ghost" onclick="advStatus(' + i + ',\'ACTIVE\')">Resume</button>') +
          '<button class="btn small soft-red" onclick="advStatus(' + i + ',\'CLOSED\')">Close</button></div>') + '</div>';
    });
    html += '</div><p class="muted small center"><b>Add more</b> adds a new amount to a running advance (one balance, one deduction). ' +
      'Saving a new advance above instead keeps it separate, with its own deduction (both are deducted each month). <b>Change a month</b> sets a different amount (or no deduction) for one month only; the balance moves to later months. ' +
      'Pause skips every month until resumed. Close stops it for good (e.g. repaid in cash). Locked months keep what was actually deducted.</p>';
    adminBody(html);
    advEmpHint();
  }

  /** Tells the admin when the selected employee already has an advance running. */
  function advEmpHint() {
    var sel = $('avEmp'); if (!sel || !S.adv) return;
    var e = S.adv.employees.filter(function (x) { return x.id === sel.value; })[0];
    $('avHint').innerHTML = e && e.ongoing
      ? '<div class="msg info">' + esc(e.name) + ' already has an advance running (balance ' + money(e.ongoing, S.adv.currency) + '). ' +
        'Saving here makes a <b>separate</b> advance with its own deduction. To add to the existing one, use <b>＋ Add more</b> on it below.</div>'
      : '';
  }

  /** Adds more money to a running advance. */
  function openTopUp(i) {
    var a = S.adv.list[i], cur = S.adv.currency;
    openModal('<h2 style="margin-top:0">Add more – ' + esc(a.name) + '</h2>' +
      '<p class="muted small" style="margin-top:-6px">Advance ' + money(a.amount, cur) + ' · balance ' + money(a.balanceAfter + a.thisMonth, cur) + ' · ' + money(a.monthly, cur) + '/month</p>' +
      '<div class="grid2"><div class="field"><label>Extra amount given</label><input id="tuAmt" class="inp" inputmode="decimal" placeholder="e.g. 5000"></div>' +
      '<div class="field"><label>Date given</label><input id="tuDate" class="inp" type="date" value="' + todayLocal() + '"></div></div>' +
      '<div class="field"><label>Deduct per month from now</label><input id="tuMon" class="inp" inputmode="decimal" value="' + esc(a.monthly) + '"></div>' +
      '<div class="field"><label>Note (optional)</label><input id="tuNote" class="inp" placeholder="e.g. School fees"></div>' +
      '<button class="btn" id="tuBtn" onclick="saveTopUp(' + i + ')">Add to advance</button><button class="btn ghost" onclick="closeModal()">Cancel</button><div id="tuMsg"></div>');
  }
  function saveTopUp(i) {
    var a = S.adv.list[i];
    $('tuBtn').disabled = true;
    api('adminTopUpAdvance', S.token, a.id, { add: $('tuAmt').value, dateGiven: $('tuDate').value, monthly: $('tuMon').value, note: $('tuNote').value })
      .then(function (r) { closeModal(); renderAdvances(r); toast('Added to ' + a.name + '\'s advance'); })
      .catch(function (e) { $('tuBtn').disabled = false; $('tuMsg').innerHTML = errBox(e); });
  }

  function saveAdvance() {
    $('avBtn').disabled = true;
    api('adminSaveAdvance', S.token, { empId: $('avEmp').value, amount: $('avAmt').value, monthly: $('avMon').value,
      startMonth: $('avStart').value, dateGiven: $('avDate').value, note: $('avNote').value })
      .then(function (r) { renderAdvances(r); toast('Advance saved'); })
      .catch(function (e) { $('avBtn').disabled = false; $('avMsg').innerHTML = errBox(e); });
  }
  function editAdvance(i) {
    var a = S.adv.list[i];
    var v = prompt('New monthly deduction for ' + a.name + ':', a.monthly);
    if (v === null) return;
    api('adminSaveAdvance', S.token, { id: a.id, monthly: v, note: a.note }).then(renderAdvances).catch(function (e) { toast(e.message); });
  }
  /**
   * Skip the deduction or deduct a different amount for one month.
   * info = { id, name, amount, monthly, startMonth, balance, ym, fixedMonth, changed, currency }; done(result) runs after saving.
   */
  function openAdvMonthModal(info, done) {
    S.advModal = { info: info, done: done };
    var cur = info.currency;
    openModal('<h2 style="margin-top:0">' + esc(info.name) + ' – advance ' + money(info.amount, cur) + '</h2>' +
      '<p class="muted small" style="margin-top:-6px">Normal deduction: ' + money(info.monthly, cur) + '/month' +
      (info.balance !== undefined ? ' · balance ' + money(info.balance, cur) + ' before this month' : '') + '</p>' +
      (info.fixedMonth ? '<p><b>' + esc(monthName(info.ym)) + '</b></p><input id="amMonth" type="hidden" value="' + info.ym + '">'
        : '<div class="field"><label>Month</label><input id="amMonth" class="inp" type="month" min="' + info.startMonth + '" value="' + info.ym + '"></div>') +
      '<label class="check"><input type="radio" name="amKind" value="skip" checked onchange="$(\'amAmt\').disabled=true"> No deduction this month</label>' +
      '<label class="check"><input type="radio" name="amKind" value="amount" onchange="$(\'amAmt\').disabled=false;$(\'amAmt\').focus()"> Deduct a different amount</label>' +
      '<input id="amAmt" class="inp" inputmode="decimal" placeholder="e.g. 1000" disabled>' +
      '<div class="field"><label>Note (optional)</label><input id="amNote" class="inp" placeholder="e.g. Employee asked to skip – festival"></div>' +
      '<button class="btn" id="amBtn" onclick="saveAdvMonth()">Save</button>' +
      (info.changed ? '<button class="btn ghost" onclick="saveAdvMonth(true)">Back to normal deduction</button>' : '') +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><div id="amMsg"></div>');
  }
  function saveAdvMonth(reset) {
    var m = S.advModal;
    var skip = document.querySelector('input[name="amKind"]:checked').value === 'skip';
    var amt = reset ? '' : (skip ? 0 : $('amAmt').value);
    if (!reset && !skip && amt === '') { $('amMsg').innerHTML = errBox('Enter the amount to deduct.'); return; }
    $('amBtn').disabled = true;
    api('adminSetAdvanceMonth', S.token, m.info.id, $('amMonth').value, amt, reset ? '' : $('amNote').value)
      .then(function (r) { closeModal(); toast('Saved'); m.done(r); })
      .catch(function (e) { $('amBtn').disabled = false; $('amMsg').innerHTML = errBox(e); });
  }
  /** From the Advances screen (any month). */
  function openAdvMonth(i) {
    var a = S.adv.list[i];
    openAdvMonthModal({ id: a.id, name: a.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceAfter + a.thisMonth, ym: S.adv.currentMonth < a.startMonth ? a.startMonth : S.adv.currentMonth,
      currency: S.adv.currency }, renderAdvances);
  }
  /** From an employee's salary card (that month). */
  function changeMonthAdv(ai) {
    var m = S.viewMonth, a = m.advances[ai];
    openAdvMonthModal({ id: a.id, name: m.employee.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceBefore, ym: m.ym, fixedMonth: true, changed: a.changed, currency: m.currency },
      function () { if (S.reloadAfterEntry) S.reloadAfterEntry(); });
  }
  /** From the Monthly Summary (that month). */
  function changeSumAdv(ri, ai) {
    var r = S.summary, row = r.rows[ri], a = row.advances[ai];
    openAdvMonthModal({ id: a.id, name: row.name, amount: a.amount, monthly: a.monthly, startMonth: a.startMonth,
      balance: a.balanceBefore, ym: r.ym, fixedMonth: true, changed: a.changed, currency: r.currency },
      function () { loadSummary(r.ym); });
  }
  function clearAdvMonth(i, ym) {
    var a = S.adv.list[i];
    if (!confirm('Go back to the normal deduction for ' + monthName(ym) + '?')) return;
    api('adminSetAdvanceMonth', S.token, a.id, ym, '', '').then(renderAdvances).catch(function (e) { toast(e.message); });
  }

  function advStatus(i, status) {
    var a = S.adv.list[i];
    if (status === 'CLOSED' && !confirm('Close this advance? No more deductions will be made.')) return;
    api('adminSetAdvanceStatus', S.token, a.id, status).then(renderAdvances).catch(function (e) { toast(e.message); });
  }

  /* ---------- PF ---------- */
  function loadAdminPf() {
    adminFetch('pf', 'adminEmployees', [], renderAdminPf);
  }

  function renderAdminPf(r) {
    S.pfList = r.list;
    var cur = r.currency, d = r.defaults;
    var html = '<div class="card"><p class="muted" style="margin:0;font-size:13px">Turn PF on/off for each employee and set the amounts. ' +
      'Leave a box blank to use the default (' + d.bank + '% of salary for Basic Salary, ' + d.employee + '% / ' + d.employer +
      '% of Basic Salary for PF). You can also type a % like <b>12%</b>.' +
      (r.showSplit ? '<br><b>In Bank</b> = Basic Salary − PF Employee. <b>In Cash</b> = Salary − Basic Salary.' : '') + '</p>' +
      '<div style="margin-top:10px">' + searchBox() + '</div></div>';
    r.list.forEach(function (e, i) {
      html += '<div class="card" data-q="' + esc((e.name + ' ' + e.id).toLowerCase()) + '"><div class="row"><div><div class="name"><b>' + esc(e.name) + '</b> <span class="muted">' + esc(e.id) + '</span></div>' +
        '<div class="sub muted" style="font-size:13px">Salary ' + money(e.salary, cur) + '</div></div>' +
        '<label class="switch"><input type="checkbox" id="pfOn-' + i + '"' + (e.pfActive ? ' checked' : '') + ' onchange="togglePfFields(' + i + ')"><span></span></label></div>' +
        '<div id="pfFields-' + i + '" class="' + (e.pfActive ? '' : 'hidden') + '"><div class="pf-grid">' +
        pfInput(i, 'bank', 'Basic Salary', e.bankSalaryRaw, e.bankSalary) +
        pfInput(i, 'emp', 'PF Employee', e.employeeRaw, e.employee) +
        pfInput(i, 'er', 'PF Employer', e.employerRaw, e.employer) + '</div>' +
        (r.showSplit ? '<p class="muted small" style="margin:8px 0 0">Currently: In Bank ' + money(e.bankSalary - e.employee, cur) + ' · In Cash ' + money(e.salary - e.bankSalary, cur) + '</p>' : '') + '</div>' +
        '<button class="btn small" style="margin-top:12px" onclick="savePf(' + i + ', this)">Save</button></div>';
    });
    adminBody(html);
  }
  function pfInput(i, key, label, raw, effective) {
    return '<div><label>' + label + '</label><input id="pf' + key + '-' + i + '" inputmode="decimal" value="' + esc(raw) + '" placeholder="' + esc(effective) + '"></div>';
  }
  function togglePfFields(i) { $('pfFields-' + i).classList.toggle('hidden', !$('pfOn-' + i).checked); }
  function savePf(i, btn) {
    var e = S.pfList[i];
    btn.disabled = true;
    api('adminSavePf', S.token, e.id, {
      active: $('pfOn-' + i).checked, bankSalary: $('pfbank-' + i).value, employee: $('pfemp-' + i).value, employer: $('pfer-' + i).value
    }).then(function (r) { renderAdminPf(r); toast('Saved PF for ' + e.name); })
      .catch(function (err) { btn.disabled = false; toast(err.message); });
  }

  /* ---------- Super admin: admins & permissions ---------- */
  function loadAdmins() {
    adminFetch('admins', 'superListAdmins', [], renderAdmins);
  }

  function renderAdmins(r) {
    S.superData = r;
    var nonAdmins = r.employees.filter(function (e) { return e.role === 'EMPLOYEE'; });
    var html = '<div class="card"><h2>Make an admin</h2>' +
      (nonAdmins.length ? '<div class="row" style="gap:8px"><select id="newAdmin" class="inp" style="flex:1">' +
        nonAdmins.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' (' + esc(e.id) + ')</option>'; }).join('') +
        '</select><button class="btn small" onclick="setRole($(\'newAdmin\').value, \'ADMIN\')">Make admin</button></div>' : '<p class="muted">Everyone is already an admin.</p>') +
      '<p class="muted small" style="margin:8px 0 0">Super admins are set in the Employees sheet (Role = SUPER_ADMIN). Admins can never change other admins or super admins, even with All employees. Super admins are also hidden from them.</p></div>';

    if (!r.admins.length) html += '<div class="card muted">No admins yet.</div>';
    r.admins.forEach(function (a, i) {
      var all = a.perms.employees === 'ALL', sel = all ? [] : a.perms.employees;
      html += '<div class="card"><div class="row"><div><b>' + esc(a.name) + '</b> <span class="muted">' + esc(a.id) + '</span>' +
        (a.configured ? '' : ' <span class="chip s-LATE">Not set yet</span>') + '</div>' +
        '<button class="link" style="color:var(--red)" onclick="setRole(\'' + esc(a.id) + '\', \'EMPLOYEE\')">Remove admin</button></div>' +
        '<div style="margin-top:10px">' + r.permissions.map(function (p) {
          return '<label class="perm"><input type="checkbox" class="perm-' + i + '" data-key="' + p.key + '"' + (a.perms[p.key] ? ' checked' : '') + '>' +
            '<span><b>' + esc(p.label) + '</b><br><small class="muted">' + esc(p.help) + '</small></span></label>';
        }).join('') + '</div>' +
        '<div class="field"><label>Employees this admin can manage</label>' +
        '<label class="check"><input type="radio" name="scope-' + i + '" value="ALL"' + (all ? ' checked' : '') + ' onchange="toggleScope(' + i + ')"> All employees</label>' +
        '<label class="check"><input type="radio" name="scope-' + i + '" value="SEL"' + (all ? '' : ' checked') + ' onchange="toggleScope(' + i + ')"> Only selected</label>' +
        '<div class="checklist' + (all ? ' hidden' : '') + '" id="scopeList-' + i + '">' + r.employees.filter(function (e) { return e.id !== a.id && e.role !== 'SUPER_ADMIN'; }).map(function (e) {
          return '<label><input type="checkbox" class="scope-' + i + '" value="' + esc(e.id) + '"' + (sel.indexOf(e.id) >= 0 ? ' checked' : '') + '> ' + esc(e.name) + ' <span class="muted">' + esc(e.id) + '</span></label>';
        }).join('') + '</div></div>' +
        '<button class="btn" onclick="savePerms(' + i + ', this)">Save permissions</button></div>';
    });
    adminBody(html);
  }

  function toggleScope(i) {
    var sel = document.querySelector('input[name="scope-' + i + '"]:checked').value;
    $('scopeList-' + i).classList.toggle('hidden', sel === 'ALL');
  }

  function savePerms(i, btn) {
    var a = S.superData.admins[i], perms = {};
    Array.prototype.forEach.call(document.querySelectorAll('.perm-' + i), function (c) { perms[c.getAttribute('data-key')] = c.checked; });
    perms.employees = document.querySelector('input[name="scope-' + i + '"]:checked').value === 'ALL' ? 'ALL' : checkedValues('scope-' + i);
    btn.disabled = true;
    api('superSavePermissions', S.token, a.id, perms)
      .then(function (r) { renderAdmins(r); toast('Permissions saved for ' + a.name); })
      .catch(function (e) { btn.disabled = false; toast(e.message); });
  }

  function setRole(id, role) {
    if (role === 'EMPLOYEE' && !confirm('Remove admin rights from ' + id + '?')) return;
    api('superSetRole', S.token, id, role)
      .then(function (r) { renderAdmins(r); toast(role === 'ADMIN' ? 'Admin added — now set their permissions' : 'Admin removed'); })
      .catch(function (e) { toast(e.message); });
  }

  function loadAudit() {
    adminLoading();
    api('superAuditLog', S.token).then(function (rows) {
      var html = '<div class="card"><h2>Recent admin activity</h2>';
      if (!rows.length) html += '<p class="muted">Nothing yet.</p>';
      rows.forEach(function (r) {
        html += '<div class="list-item"><div><div class="name">' + esc(r.action.replace(/_/g, ' ')) + ' <span class="muted" style="font-weight:400">' + esc(r.emp) + ' ' + esc(r.date) + '</span></div>' +
          '<div class="sub">' + esc(r.details) + '</div><div class="sub">by ' + esc(r.by) + ' · ' + esc(r.at) + '</div></div></div>';
      });
      adminBody(html + '<p class="muted small">Full history is in the "Audit Log" tab of the Sheet.</p></div>');
    }).catch(adminErr);
  }

  /* ---------------- Modal ---------------- */
  function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
  function closeModal() { stopCamera(); $('modal').classList.add('hidden'); }

  /* ---------------- Boot ---------------- */
  (function boot() {
    var setName = function (n) { $('coName').textContent = n; document.title = n + ' – Attendance'; };
    if (COMPANY && COMPANY.charAt(0) !== '<') setName(COMPANY); // '<' = not filled in (hosted page)
    S.token = load('att_token');
    // Logged in: the home screen brings the company name, so skip this extra call.
    if (!(COMPANY && COMPANY.charAt(0) !== '<') && !S.token) api('publicInfo').then(function (r) { setName(r.company); checkAppVersion(r); }).catch(function (e) { setName('Attendance'); $('loginMsg').innerHTML = errBox(e); });
    if (S.token) startApp(); else showLogin();
  })();
</script>
</body>
</html>
