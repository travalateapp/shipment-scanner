<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--muted:#64748b;--line:#e2e8f0;--brand:#0f3460;--brand2:#16213e;--accent:#f8cb2e;
--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#182033;--ink:#e6ebf5;--muted:#94a3b8;--line:#2a3550;--brand:#3b82f6;--brand2:#0b1222;
--okbg:#12361f;--ok:#4ade80;--warnbg:#3a3010;--warn:#facc15;--badbg:#3d1414;--bad:#f87171;--infobg:#132a4d;--info:#93c5fd;--chip:#232d45}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .t{font-weight:700;font-size:15px;white-space:nowrap}.top .t span{color:var(--accent)}
.top .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--brand2);padding:0 8px;position:sticky;top:44px;z-index:19;scrollbar-width:none}
.nav button{background:none;border:0;color:#cbd5e1;padding:10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}.btn.g{background:#16a34a;color:#fff}.btn.r{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:block}
/* The two upload boxes are always the same width and height. */
.row.ups{align-items:stretch}.row.ups>.drop{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.drop.ok{border-color:#16a34a;background:var(--okbg)}
.drop.stale{border-color:#ca8a04;background:var(--warnbg)}
.drop input{display:none}.drop b{display:block;margin-bottom:2px}.drop span{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.conn summary{cursor:pointer;list-style:revert}.showLink{font-weight:400;font-size:12px;margin-left:6px}
.fmode{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.fmode>label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.fmode>label.on{border-color:var(--brand);background:var(--chip)}.fsub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px}.fsub .chip{padding:4px 10px}
.cwrap{display:flex;flex-direction:column;max-height:calc(90vh - 32px)}.cwrap>*{flex:0 0 auto}.cwrap #cWhList{flex:1 1 auto;min-height:96px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip b{margin-left:4px}#whChips .chip[data-wh]:not([data-wh=""]){touch-action:pan-y;-webkit-user-select:none;user-select:none}#whChips.dragmode .chip{cursor:grabbing}#whChips .chip.dragging{opacity:.55;outline:2px dashed var(--brand);outline-offset:2px}.chip b.sug{font-weight:500;font-style:italic;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px}.stat .v{font-size:20px;font-weight:800}.stat .k{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 6px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.line{display:grid;grid-template-columns:minmax(190px,1.9fr) repeat(8,minmax(52px,.58fr)) 92px minmax(56px,.6fr) minmax(70px,.7fr);gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.line.head{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
.line.head .srt{cursor:pointer;user-select:none}.line.head .srt:hover{color:var(--ink)}.line.head .srt.on{color:var(--brand)}
/* Each warehouse block's title + column headings stay pinned under the top bar

.whsec{position:relative}
/* Search: pick several SKUs (chips) from a suggestion list. */
.srch{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:25;max-height:280px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.sugg div:last-child{border-bottom:0}
.sugg div.on,.sugg div:hover{background:var(--chip)}
.sugg small{color:var(--muted)}
#calAddL{position:static;max-height:220px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.picks:empty{display:none}
.picks .chip{cursor:default}.picks .chip button{border:0;background:none;cursor:pointer;padding:0 0 0 6px;font-weight:700;color:inherit}
.whhead{position:sticky;top:var(--stickTop,86px);z-index:5;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.whhead .grp{margin:0;padding:10px 10px 6px!important}
/* Warehouse blocks collapse / expand by clicking their title. */
.grp.tgl{cursor:pointer;user-select:none}.grp.tgl .chev{display:inline-block;width:14px;color:var(--muted)}
.whsec.shut .line{display:none}.whsec.shut .whhead{position:static;box-shadow:none;border-bottom:1px solid var(--line)}
.whsec.shut .whhead .grp{padding-bottom:10px!important}
/* Send heading: "fill all" box + ↺ reset under the word Send. */
.sendH{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fillW{display:flex;gap:3px;align-items:center}
.line .fillQ{width:58px;padding:3px 5px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:right}
.fillR{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;line-height:1.2}
.fillR:hover{background:var(--chip)}
.line .nm{font-weight:600}.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.line input{padding:7px;text-align:right;font-weight:700}
.line.send{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.line.lock{opacity:.6}
/* The row you are typing in (Tab / click) is highlighted. */
.line:focus-within{box-shadow:inset 4px 0 0 var(--brand);background:color-mix(in srgb,var(--infobg) 70%,transparent)}
.line input.q:focus{outline:2px solid var(--brand);outline-offset:1px}
.line .over{border-color:var(--bad);background:var(--badbg)}
.lbl{display:none;font-size:10px;color:var(--muted)}
@media (max-width:760px){
 .line{grid-template-columns:1fr 1fr 1fr 88px;gap:6px 8px}
 .line.head{display:none}.line .nm{grid-column:1/-1}.lbl{display:block}
 .line .c-days,.line .c-max{display:none}
 .wrap{padding:10px 10px 90px}
}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar .sum{flex:1;font-size:13px}.bar .sum b{font-size:16px}
.msg{padding:9px 11px;border-radius:9px;margin:8px 0;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;color:var(--muted)}
.proj th,.proj td{white-space:nowrap}
.proj td:first-child,.proj th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.proj tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.proj td.z{color:var(--muted)}
.pwh tr.pm td{border-bottom:0;padding-bottom:2px}
.pwh tr.ps td{border-bottom:0;padding-top:1px;padding-bottom:1px;color:var(--muted)}
.pwh tr.ps.pl td{border-bottom:1px solid var(--line);padding-bottom:7px;color:var(--info)}
.pwh tr.tot2 td{font-weight:600}
.proj th.right,.proj td.right{text-align:right}
table.qct th.right,table.qct td.right{text-align:right}.qcPo summary{line-height:1.7}
.rmD{padding:2px 8px!important;color:var(--bad);font-weight:700;line-height:1.2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.scroll{overflow-x:auto}
.dScroll{max-height:max(320px,calc(100vh - 170px));overflow:auto}#dTab tr:first-child th{position:sticky;top:0;background:var(--card);z-index:2;box-shadow:0 1px 0 var(--line)}
#dTab tr.dTot th{position:sticky;top:var(--dTotTop,40px);background:var(--chip);z-index:2;font-weight:700;color:var(--ink);font-size:13px;box-shadow:0 1px 0 var(--line)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}.pager button[disabled]{opacity:.4;cursor:default}
.ro{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ro .h{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;background:var(--chip)}
.ro .h .w{font-weight:700;flex:1 1 220px}
.ro .b{padding:10px 12px;display:none}.ro.open .b{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.hidden{display:none!important}
/* A Send box not yet confirmed (the planner's suggestion): grey until clicked, typed in or filled. */
.line input.q.pend{color:var(--muted);font-weight:400;background:var(--chip)}
/* TI = Travalate Inventory stock; red when the plan sends more of the SKU (all warehouses) than TI has. */
.ti-c b{font-weight:700}.ti-c.tiover b{color:var(--bad)}.ti-c .tiw{display:block;font-size:10px;color:var(--bad)}.ti-c .tiw.ok{color:var(--muted)}
a.plk{color:var(--brand);font-weight:700;text-decoration:underline dotted;cursor:pointer}
/* Dashboard: sortable headings and the calendar. */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--ink)}th.sortable.on{color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw7{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cd{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--card);overflow:hidden}
.cd.empty{border:0;background:none;cursor:default}
.cd.past{background:var(--chip);opacity:.8}
.cd.today{border:2px solid var(--brand)}
.cd.sel{outline:2px solid var(--accent)}
.cdn{font-size:11px;font-weight:700;color:var(--muted)}
.cd.today .cdn{color:var(--brand)}
.cb{font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.ro{background:var(--infobg);color:var(--info)}.cb.ap{background:var(--okbg);color:var(--ok)}.cb.out{background:var(--badbg);color:var(--bad)}
.cb.ds{background:var(--chip);color:var(--ink)}.cb.ds.over{background:var(--badbg);color:var(--bad)}.cb.pk{background:var(--warnbg);color:var(--warn)}
.ld{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ld span{display:block;height:100%;background:var(--brand)}.ld.over span{background:var(--bad)}
.cd.off{background:repeating-linear-gradient(45deg,var(--card),var(--card) 6px,var(--chip) 6px,var(--chip) 12px)}
.calw{margin:4px 0;font-size:13px}.calw summary{cursor:pointer}.calw ul{margin:4px 0 6px;padding-left:20px}
.calinfo{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.calinfo ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.calinfo ul.rls{list-style:none;padding-left:0;margin-bottom:6px}
#remList{list-style:none;padding-left:0;margin:8px 0 0}
.rls li{padding:8px 0;border-bottom:1px solid var(--line)}.rls li:last-child{border-bottom:0}
.rl1{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}.rl1 .rlx{margin-left:auto}
.rl2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:6px}
.ag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.ag .agl{font-size:12px;color:var(--muted)}
.ag input[type=date]{width:140px;padding:4px 6px}
@media (max-width:760px){.cd{min-height:54px;padding:3px}.cb{font-size:9px;padding:1px 2px}}
#plTipBox{position:fixed;z-index:60;max-width:min(560px,calc(100vw - 16px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;font-weight:400;text-align:left;pointer-events:none;display:none}
.cfmWrap{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.cfmBox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(440px,100%);padding:18px 18px 14px}
.cfmMsg{white-space:pre-line;font-size:14px;line-height:1.5}.cfmIn{width:100%;margin-top:10px}.cfmErr{color:var(--bad);font-size:12px;min-height:16px;margin-top:4px}
.cfmBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
table.askq{border-collapse:collapse;width:100%;margin:6px 0 2px;font-size:11.5px;table-layout:auto}table.askq th,table.askq td{padding:3px 3px;border-bottom:1px solid var(--line);text-align:left}table.askq td.r,table.askq th.r{text-align:right;white-space:nowrap}table.askq th{font-size:10.5px;color:var(--muted)}table.askq td:first-child{word-break:break-word}
#plTipBox table{border-collapse:collapse;width:100%;margin-top:6px}#plTipBox th,#plTipBox td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}#plTipBox th{color:var(--muted);font-size:11px}#plTipBox .r{text-align:right}
.roShort{background:#fef3c7;color:#92400e;border-radius:4px;padding:0 4px}
.plTip,.dlTip,.shTip,.roTip,.hv{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}

#askBtn{position:fixed;right:16px;bottom:84px;z-index:40;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;font-size:14px}
#askBox{position:fixed;right:16px;bottom:136px;z-index:45;width:min(420px,calc(100vw - 32px));max-height:min(70vh,620px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);overflow:hidden}
#askBox .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}#askBox .ah button{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}

<body>
<div class="top"><div class="t">📦 Blinkit <span>Shipment Planner</span></div><div class="who" id="who"></div></div>
<div class="nav hidden" id="nav"></div>
<div class="wrap" id="app"><div class="card muted">Loading…</div></div>
<div id="bar" class="bar hidden"></div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="savePill" class="hidden" role="status" aria-live="polite"></div>
<div id="busy" class="hidden" role="status" aria-live="polite"><div class="bx"><span class="spin"></span><span id="busyT">Saving…</span></div></div>

<script>
/* ======================= CORE-START (pure planning logic, no page code) ======================= */
var PlanCore = (function () {
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

    if (!S.inv || !S.bulk) { S.plan = null; renderPlanOut(); return; }
    var s = S.boot.settings;
    var sm = skuMap();
    S.plan = PlanCore.computePlan(S.inv.rows, S.bulk.rows, {
      coverDays: S.cover || s.coverDays, minLine: s.minLine, roundTo: s.roundTo, skus: sm,
      openROs: S.boot.openROs, bulkAt: S.bulkAt, elapsed: (stockInfoNow() || {}).elapsed || 0,
      delivered: S.boot.delivered || [], stockDate: (stockInfoNow() || {}).stockDate || '', today: today()
    }).filter(function (r) { return !(sm[r.item] && sm[r.item].active === false); }); // Settings → SKUs: Active unticked = left out
    // What is on its way splits into Shipped (dispatch day today or earlier) and Planned (not shipped yet).
    var shp = shippedBy(S.boot.openROs);
    S.plan.forEach(function (r) { var tot = r.incoming + r.appIncoming; r.shipped = Math.min(tot, shp[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0); });
    var old = keepEdits ? S.edited || {} : {};
    S.edited = {}; S.final = {};
    if (!keepEdits || !S.confirmed) S.confirmed = {}; // a fresh plan starts with every Send box grey (suggested)
    S.plan.forEach(function (r) {
      var def = r.locked ? 0 : r.rec + (S.starters ? r.starter : 0);
      S.final[r.key] = old[r.key] !== undefined ? old[r.key] : def;
      if (old[r.key] !== undefined) S.edited[r.key] = old[r.key];
    });
    renderPlanOut();
    // A new plan updates the Dashboard; so does a plan brought back after a refresh (worked out again with the
    // current rules and RO Log), so the Dashboard never keeps an older calculation.
    if (!keepEdits || S.snapOnce) { S.snapOnce = false; saveSnapshot(); }
  }

  /**
   * After an RO is saved or changed anywhere (RO PDF, by hand, RO Log), the plan on New Plan is worked out again
   * with the new RO Log, and the Dashboard's copy is saved again. Quantities typed on the plan are kept.
   */
  /** Lines just saved (answer of a save): the Dashboard's list of delivered ROs follows. */
  function syncDelivered(rows) {
    if (!rows) return;
    var keys = {}; rows.forEach(function (r) { keys[r.key] = 1; });
    var upd = function (list) { return (list || []).filter(function (r) { return !keys[r.key]; }).concat(rows.filter(function (r) { return r.status === 'Delivered'; })); };
    if (S.dash) S.dash.delivered = upd(S.dash.delivered);
    if (S.boot) S.boot.delivered = upd(S.boot.delivered);
  }

  /* ---------------- Instant saves ----------------
   * RO changes (calendar, reminder, Planned pop-up, RO Log) show on the page at once; the save runs in the background,
   * one after the other, with a small "Saving…" / "✓ Saved" pill. When the last one is done the page takes the sheet's
   * own answer; if a save fails, it says so and the page reads the sheet again (undoing what was not saved). */
  var SQ = { n: 0, chain: Promise.resolve(), t: null };
  function savePill(state, text) {
    var el = $('savePill'); clearTimeout(SQ.t);
    el.className = state === 'busy' ? '' : state; el.innerHTML = state === 'busy' ? '<span class="spin"></span> ' + esc(text) : esc(text);
    if (state === 'ok') SQ.t = setTimeout(function () { el.classList.add('hidden'); }, 1600);
    if (state === 'bad') SQ.t = setTimeout(function () { el.classList.add('hidden'); }, 8000);
  }
  function bgSave(fn, args) {
    SQ.n++; savePill('busy', 'Saving' + (SQ.n > 1 ? ' ' + SQ.n + ' changes' : '') + '…');
    var p = SQ.chain.then(function () { return apiCall(fn, args); });
    SQ.chain = p.then(function () {}, function () {});
    return p.then(function (r) {
      SQ.n--;
      if (SQ.n > 0) { savePill('busy', 'Saving' + (SQ.n > 1 ? ' ' + SQ.n + ' changes' : '') + '…'); return r; }
      savePill('ok', '✓ Saved');
      adoptServer(r);
      if (r && r.warnings && r.warnings.length) toast(r.warnings.join(' '), 7000);
      return r;
    }, function (e) {
      SQ.n--;
      savePill('bad', '⚠ Not saved: ' + e.message);
      toast('Not saved: ' + e.message + ' — showing the sheet as it is.', 8000);
      if (SQ.n === 0) resyncFromSheet();
    });
  }
  /** The sheet's own answer after the last save (open ROs, changed lines). */
  function adoptServer(r) {
    if (!r) return;
    if (r.openROs) { S.boot.openROs = r.openROs; if (S.dash) S.dash.openROs = r.openROs; }
    if (r.rows) { mergeLogRows(r.rows); syncDelivered(r.rows); }
    redrawAfterSave();
  }
  function resyncFromSheet() {
    refreshBoot().then(function () {
      if (S.dash) S.dash.openROs = S.boot.openROs;
      if (S.tab === 'log') loadLog(); else redrawAfterSave();
    }, function () {});
  }
  function redrawAfterSave() {
    refreshPlanAfterRoChange();
    if (S.tab === 'log' && $('logOut')) drawLog();
    if (S.tab === 'dash' && S.calRedraw) S.calRedraw();
  }
  /**
   * Applies a change to the RO lines on the page at once (open ROs, RO Log list, delivered list): ch = { appt, roNo,
   * dispatch, status, deliveredOn, qty } as sent to the server, which works it out the same way.
   */
  function applyLocal(match, ch) {
    var seen = [], touched = [];
    [S.boot && S.boot.openROs, S.dash && S.dash.openROs, S.logRows, S.logAll].forEach(function (list) {
      (list || []).forEach(function (r) {
        if (!match(r) || seen.indexOf(r) >= 0) return;
        seen.push(r);
        if (ch.appt !== undefined) { var na = ch.appt || ''; if (na !== (r.appt || '') && r.dispatchFixed && ch.dispatch === undefined) r.dispatchFixed = false; r.appt = na; }
        if (ch.roNo !== undefined) r.roNo = ch.roNo;
        if (ch.dispatch !== undefined) { r.dispatch = ch.dispatch || ''; r.dispatchFixed = !!(ch.dispatch && r.appt); }
        if (ch.status === 'Shipped') { r.status = 'Created'; r.shippedOn = ch.shippedOn; r.dispatch = ch.shippedOn; r.dispatchFixed = true; if (r.deliveredOn) r.deliveredOn = ''; }
        else if (ch.status) { if (ch.status === 'Delivered') r.deliveredOn = ch.deliveredOn; else if (r.status === 'Delivered') r.deliveredOn = ''; if (ch.status === 'Created' && r.shippedOn) r.shippedOn = ''; r.status = ch.status; }
        if (ch.qty !== undefined) r.qty = ch.qty;
        if (ch.shortNote !== undefined) r.shortNote = ch.shortNote;
        if (!touched.some(function (t) { return t.key === r.key; })) touched.push(r);
      });
    });
    var open = function (r) { return r.status === 'Planned' || r.status === 'Created'; };
    var keep = function (list) {
      var out = (list || []).filter(open), keys = {};
      out.forEach(function (r) { keys[r.key] = 1; });
      touched.forEach(function (r) { if (open(r) && !keys[r.key]) out.push(r); }); // back to open (e.g. from Delivered)
      return out;
    };
    if (S.boot) S.boot.openROs = keep(S.boot.openROs);
    if (S.dash) S.dash.openROs = S.dash.openROs === undefined ? S.dash.openROs : keep(S.dash.openROs);
    syncDelivered(touched);
    return touched;
  }
  function inBatches(batches) { return function (r) { return batches.indexOf(r.batch) >= 0; }; }
  function refreshPlanAfterRoChange() {
    if (S.dash && S.boot && S.boot.openROs) S.dash.openROs = S.boot.openROs; // the Dashboard's calendar / Planned too
    if (!S.inv || !S.bulk) return;
    var keep = Object.keys(S.edited || {}).length > 0;
    recompute(keep);
    if (keep) saveSnapshot();
  }

  function saveSnapshot() {
    if (!can('Planner') || !S.plan) return;
    var rows = S.plan.filter(function (r) { return r.rate > 0 || r.position > 0; }).map(function (r) {
      return [r.wh, r.item, r.name, r.group, r.status, Math.round(r.rate * 10) / 10, r.position,
        r.daysAtStock == null ? '' : Math.round(r.daysAtStock * 10) / 10, r.rec, r.locked ? 'Yes' : '',
        r.whStock + r.dsStock, r.incoming + r.appIncoming, r.incoming, r.appIncoming, r.delivered || 0];
    });
    var items = {}; S.plan.forEach(function (r) { items[r.item] = { item: r.item, name: r.name }; });
    var units = 0, lines = 0; S.plan.forEach(function (r) { if (r.rec > 0) { units += r.rec; lines++; } });
    api('saveSnapshot', S.token, rows, { inventoryAt: S.inv.generatedAt, bulkAt: S.bulkAt, units: units, lines: lines,
      items: Object.keys(items).map(function (k) { return items[k]; }) })
      .then(function () { return refreshBoot(); })
      .then(function () {
        // New items may have been added to the SKU list: show their group if an admin set one meanwhile.
        var m = skuMap(); S.plan.forEach(function (r) { var x = m[r.item]; if (x) { r.sku = x.sku; r.group = x.group; r.tier = x.tier; } });
        if (S.tab === 'plan') renderPlanOut();
      }, function () { /* the plan works without it */ });
  }

  function visibleRows() {
    var f = S.filter, q = f.q.toLowerCase(), picks = f.picks || [];
    return S.plan.filter(function (r) {
      if (f.whs.length && f.whs.indexOf(r.wh) < 0) return false;
      if (f.group && (r.group || '?') !== f.group) return false;
      // Picked SKUs: show every line of just those SKUs (even ones with nothing to send);
      // the search text then only drives the suggestion list.
      if (picks.length) return picks.indexOf(Number(r.item)) >= 0;
      // "Lines to send": a line you changed yourself stays on screen even at 0, so a block filled or typed down to 0
      // keeps its heading (and its ↺ reset) instead of disappearing.
      // "New-listing starters only": the lines where the SKU is not live yet and gets a starter quantity.
      if (f.startersOnly) { if (!(r.starter > 0) || r.locked) return false; }
      else if (f.only && !(S.final[r.key] > 0) && !(r.locked && r.note) && !(S.edited && r.key in S.edited)) return false;
      if (q && (r.name + ' ' + r.sku + ' ' + r.item).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  /**
   * The lines that go into the RO file: with SKUs picked in the search box, only those SKUs (in the warehouses
   * ticked in Create ROs); without picks, every line with a quantity.
   */
  function inScope(r) { var p = (S.filter && S.filter.picks) || []; return !p.length || p.indexOf(Number(r.item)) >= 0; }
  function totals() {
    var byWh = {}, units = 0, lines = 0, bad = 0;
    S.plan.forEach(function (r) {
      if (!inScope(r)) return;
      var q = sendQ(r);
      if (q > 0) { units += q; lines++; (byWh[r.wh] = byWh[r.wh] || { units: 0, lines: 0 }); byWh[r.wh].units += q; byWh[r.wh].lines++; }
      if (q > r.max || (q > 0 && r.locked)) bad++;
    });
    return { byWh: byWh, units: units, lines: lines, bad: bad };
  }
  /*
   * What the warehouse chips and the plan heading show. A warehouse where nothing is picked yet (no Send box clicked,
   * typed or filled) shows its suggested units; once its plan is started it shows only what is picked there. Display
   * only: Create ROs, the bar and the file still count picked lines only (totals()).
   */
  function chipTotals() {
    var started = {}, byWh = {}, units = 0, lines = 0, sug = 0;
    S.plan.forEach(function (r) { if (isConfirmed(r.key)) started[r.wh] = 1; });
    S.plan.forEach(function (r) {
      if (!inScope(r)) return;
      var q = started[r.wh] ? sendQ(r) : (r.locked ? 0 : (S.final[r.key] || 0));
      if (q <= 0) return;
      var x = byWh[r.wh] = byWh[r.wh] || { units: 0, lines: 0, sug: !started[r.wh] };
      x.units += q; x.lines++; units += q; lines++; if (!started[r.wh]) sug += q;
    });
    return { byWh: byWh, units: units, lines: lines, sug: sug, anyStarted: Object.keys(started).length > 0 };
  }
  function chipB(x) { return x ? (x.sug ? '<b class="sug" title="Suggested: nothing picked in this warehouse yet">' : '<b title="Picked">') + fmt(x.units) + '</b>' : '<b>0</b>'; }
  function planHeadText(c) {
    return '2. Plan — ' + fmt(c.units) + ' units on ' + c.lines + ' lines' +
      (!c.sug ? '' : c.sug === c.units ? ' (suggested)' : ' (' + fmt(c.sug) + ' suggested in warehouses not started)');
  }

  /*
   * Warehouse chips can be dragged into a new order (mouse: press and move; touch: hold a moment, then move). The
   * order is kept on this device (bp_wh_order) and the warehouse blocks below, and the Create ROs list, follow it.
   */
  function wireChipDrag(box) {
    if (!box) return;
    var st = null;
    var chipAt = function (x, y) { var el = document.elementFromPoint(x, y); el = el && el.closest ? el.closest('#whChips .chip[data-wh]') : null; return el && el.getAttribute('data-wh') ? el : null; };
    var begin = function () { st.on = true; st.chip.classList.add('dragging'); box.classList.add('dragmode'); };
    var end = function () {
      if (st && st.timer) clearTimeout(st.timer);
      if (!st) return;
      var was = st.on, chip = st.chip;
      st = null;
      unlisten();
      if (!was) return;
      chip.classList.remove('dragging'); box.classList.remove('dragmode');
      S.chipDragged = true; setTimeout(function () { S.chipDragged = false; }, 400);
      var order = Array.prototype.map.call(box.querySelectorAll('.chip[data-wh]'), function (c) { return c.getAttribute('data-wh'); }).filter(Boolean);
      var old = (S.whOrder || []).filter(function (w) { return order.indexOf(w) < 0; }); // warehouses not in this plan keep their place after
      S.whOrder = order.concat(old);
      store('bp_wh_order', JSON.stringify(S.whOrder));
      renderPlanOut();
    };
    var noScroll = function (e) { if (st && st.on) e.preventDefault(); };
    var move = function (e) {
      if (!st || e.pointerId !== st.id) return;
      var moved = Math.abs(e.clientX - st.x) + Math.abs(e.clientY - st.y);
      if (!st.on) {
        if (st.touch) { if (moved > 8) { clearTimeout(st.timer); st = null; unlisten(); } return; } // a swipe: let it scroll
        if (moved < 6) return;

      }
      e.preventDefault();
      var over = chipAt(e.clientX, e.clientY);
      if (!over || over === st.chip) return;
      var r = over.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
      box.insertBefore(st.chip, after ? over.nextSibling : over);

    // While a chip is held, moves and the release are followed on the whole page (the pointer may leave the chips).
    var unlisten = function () {

      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      document.removeEventListener('touchmove', noScroll, { passive: false });

    box.addEventListener('pointerdown', function (e) {
      var c = e.target.closest('.chip[data-wh]');
      if (!c || !c.getAttribute('data-wh') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      if (st) end();
      st = { chip: c, id: e.pointerId, x: e.clientX, y: e.clientY, on: false, touch: e.pointerType !== 'mouse' };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', end);
      document.addEventListener('pointercancel', end);
      if (st.touch) {
        document.addEventListener('touchmove', noScroll, { passive: false });
        st.timer = setTimeout(function () { if (st) begin(); }, 350); // hold to drag; a quick swipe still scrolls
      }
    });
    box.addEventListener('contextmenu', function (e) { if (st && st.touch) e.preventDefault(); }); // long-press menu on phones
  }

  function renderPlanOut() {
    var out = $('planOut'); if (!out) return;

      out.innerHTML = (S.inv || S.bulk) ? '<div class="card muted">Now add the ' + (S.inv ? 'Bulk RO' : 'Inventory') + ' file.</div>' : '';
      $('bar').classList.add('hidden'); return;
    }

    whs.sort(whCmp);
    var locked = S.plan.filter(function (r) { return r.locked && r.note; });
    var noGroup = S.plan.filter(function (r) { return !r.group && sendQ(r) > 0; });
    var info = [];
    var si = stockInfoNow();
    if (si) info.push('Stock as of ' + prettyDate(si.stockDate) + ' (Inventory generated ' + prettyDate(String(S.inv.generatedAt).slice(0, 10)) + '). ' +
      (si.elapsed ? si.elapsed + ' day' + (si.elapsed > 1 ? 's' : '') + ' of sales since then are taken off: days count from today and the plan covers ' + (S.cover || S.boot.settings.coverDays) + ' days from today.' : ''));
    else info.push('The Inventory has no "generated at" date, so its stock is taken as of today.');
    var inApp = S.plan.reduce(function (a, r) { return a + r.appIncoming; }, 0);
    if (inApp) info.push('Counted ' + fmt(inApp) + ' units from the RO Log that Blinkit\'s file cannot show yet (Planned, or created after this file was downloaded).');
    var gapAll = S.plan.reduce(function (a, r) { return a + (r.blinkitGap || 0); }, 0);
    if (gapAll) info.push('Of these, ' + fmt(gapAll) + ' units are from ROs created on Blinkit before this Bulk RO file (in the last 3 days, or with no appointment yet) that its Incoming does not show yet — counted so they are not sent twice.');
    var c = chipTotals();
    var html = '<div class="card"><h2>' + planHeadText(c) + '</h2>' +
      '<div class="chips" id="whChips"><span class="chip' + (S.filter.whs.length ? '' : ' on') + '" data-wh="" title="All warehouses">All' + chipB({ units: c.units, sug: c.sug === c.units && c.units > 0 }) + '</span>' +
      whs.map(function (w) { return '<span class="chip' + (S.filter.whs.indexOf(w) >= 0 ? ' on' : '') + '" title="Click to add or remove this warehouse" data-wh="' + esc(w) + '">' + esc(w.replace(/ - Feeder( Warehouse)?| Feeder$/, '')) + chipB(c.byWh[w]) + '</span>'; }).join('') +
      '</div>' + (S.filter.whs.length ? '<div class="small muted" style="margin-top:4px">Showing ' + S.filter.whs.length + ' warehouse' + (S.filter.whs.length > 1 ? 's' : '') + ' · <span id="whPickU">' +
        fmt(S.filter.whs.reduce(function (a, w) { return a + (c.byWh[w] ? c.byWh[w].units : 0); }, 0)) + '</span> units — click more to add, click a ticked one to remove, <b>All</b> to clear. Drag a chip to change the warehouse order.' + (S.whOrder ? ' <a href="#" id="whOrderReset">↺ A–Z</a>' : '') + '</div>' : '<div class="small muted" style="margin-top:4px">Click warehouses to pick one or more. Drag a chip to move that warehouse up or down the list below' + (S.whOrder ? ' · <a href="#" id="whOrderReset">↺ A–Z order</a>' : '') + '.</div>') +
      '<div class="row" style="margin-top:10px">' +
      '<div><label class="f">Group</label><select id="fGroup"><option value="">' + esc(groupList().join(' + ')) + '</option>' + groupList().map(function (g) { return '<option value="' + g + '"' + (S.filter.group === g ? ' selected' : '') + '>' + esc(groupName(g)) + '</option>'; }).join('') + '<option value="?"' + (S.filter.group === '?' ? ' selected' : '') + '>No group set</option></select></div>' +
      '<div><label class="f">Show</label><select id="fOnly"><option value="0">All items</option><option value="1"' + (S.filter.only && !S.filter.startersOnly ? ' selected' : '') + '>Lines to send (+ locked)</option>' +
        '<option value="s"' + (S.filter.startersOnly ? ' selected' : '') + '>New-listing starters only</option></select></div>' +
      '<div class="srch"><label class="f">Search — pick one or more SKUs</label><input type="text" id="fQ" autocomplete="off" placeholder="SKU or item ID, Enter to add" value="' + esc(S.filter.q) + '"><div class="sugg hidden" id="fSugg"></div></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="bClr" title="Clear all filters">✕ Clear</button></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="bXls">⬇ Plan (Excel)</button></div></div>' +
      '<div class="picks" id="fPicks"></div>' +
      (S.filter.startersOnly ? '<div class="msg info">Showing only the <b>new-listing starter</b> lines: SKUs not live yet at that warehouse that sell 1+ a day elsewhere.' +
        (S.starters ? '' : ' <b>New-listing starters is set to No</b>, so their Send is 0 — set it to Yes above to add the starter quantities.') + '</div>' : '') +

      (noGroup.length ? '<div class="msg warn">' + noGroup.length + ' line(s) have no ' + groupList().join('/') + ' group, so they cannot be logged: ' + esc(noGroup.slice(0, 6).map(function (r) { return skuText(r.sku, r.item); }).join(', ')) + (noGroup.length > 6 ? '…' : '') + '. An admin sets it in Settings → SKUs.</div>' : '') +
      (locked.length ? '<details class="msg warn" id="lockedBox"' + (S.lockedOpen ? ' open' : '') + '><summary style="cursor:pointer"><b>Needed but locked on Blinkit (' + locked.length + ')</b> <span class="small">— click to ' + (S.lockedOpen ? 'hide' : 'show') + '</span></summary><div style="margin-top:6px">' + esc(locked.map(function (r) { return r.wh.replace(/ - Feeder( Warehouse)?| Feeder$/, '') + ' – ' + skuText(r.sku, r.item) + ' (' + r.note.match(/needed (\d+)/)[1] + ')'; }).join('; ')) + '</div></details>' : '') +

    $('whChips').onclick = function (e) {

      var w = c.getAttribute('data-wh'), list = S.filter.whs, i = list.indexOf(w);
      if (!w) list.length = 0; else if (i >= 0) list.splice(i, 1); else list.push(w);
      renderPlanOut();
    };
    wireChipDrag($('whChips'));
    if ($('whOrderReset')) $('whOrderReset').onclick = function (e) { e.preventDefault(); S.whOrder = null; store('bp_wh_order', null); renderPlanOut(); };
    $('fGroup').onchange = function () { S.filter.group = this.value; renderLines(); };
    $('fOnly').onchange = function () { S.filter.only = this.value === '1'; S.filter.onlyChosen = true; S.filter.startersOnly = this.value === 's'; renderPlanOut(); };
    initSkuPicker();
    $('bClr').onclick = function () { S.filter = { whs: [], group: '', only: false, q: '', picks: [] }; renderPlanOut(); };
    $('bXls').onclick = exportPlan;
    renderPicks();
    if ($('tiRe')) $('tiRe').onclick = function (e) { e.preventDefault(); S.ti = null; renderPlanOut(); loadTi(true); };
    loadTi(false);
    renderLines();
    renderBar();
  }

  // ---- Search: multi-SKU picker ----
  function skuChoices() {
    var seen = {}, out = [];
    S.plan.forEach(function (r) {
      var k = Number(r.item); if (seen[k]) return; seen[k] = 1;
      out.push({ item: k, sku: r.sku || '', name: r.name || '' });

  /**
   * The Excel files to make: "ALL" = one merged file, a group (TBI / TBO / TBG) = a file with only that group's lines.
   * The name says the group, and the warehouse when only one is ticked.
   */
  function roFiles(lines, kinds, whs) {
    var wh = whs.length === 1 ? '_' + whs[0].replace(/ - Feeder( Warehouse)?| Feeder$/, '').replace(/[^A-Za-z0-9]+/g, '') : '';
    var out = [];
    kinds.forEach(function (k) {
      var ls = k === 'ALL' ? lines : lines.filter(function (r) { return r.group === k; });
      if (!ls.length) return;
      out.push({ name: 'Blinkit_Bulk_RO_' + today() + wh + (k === 'ALL' ? '' : '_' + k) + '.xlsx', base: 'Blinkit_Bulk_RO_' + today() + wh, lines: ls,
        units: ls.reduce(function (a, r) { return a + sendQ(r); }, 0) });
    });
    return out;
  }
  /** One file: the Excel itself. Several (Merged / TBI / TBO / TBG): one ZIP folder holding them all, one download. */
  function downloadFiles(files) {
    if (files.length === 1) return downloadBlinkitFile(files[0].lines, files[0].name);
    var zip = new JSZip();
    return files.reduce(function (p, f) {
      return p.then(function () { return buildBlinkitFile(f.lines).then(function (blob) { zip.file(f.name, blob); }); });
    }, Promise.resolve()).then(function () {
      return zip.generateAsync({ type: 'blob', mimeType: 'application/zip', compression: 'DEFLATE' });
    }).then(function (blob) { saveBlob(blob, zipNameOf(files)); });
  }
  function zipNameOf(files) { return (files[0].base || 'Blinkit_Bulk_RO_' + today()) + '.zip'; }
  function downloadBlinkitFile(lines, name) {
    return buildBlinkitFile(lines).then(function (blob) { saveBlob(blob, name || 'Blinkit_Bulk_RO_' + today() + '.xlsx'); });
  }

  /** Blinkit's own Bulk RO file with RO Quantity and Shipping Address filled in for these lines (an Excel blob). */
  function buildBlinkitFile(lines) {
    var head = S.bulk.head;
    var qCol = PlanCore.colLetter(head.indexOf('RO Quantity')), aCol = PlanCore.colLetter(head.indexOf('Shipping Address'));
    var fills = {}; lines.forEach(function (r) { fills[r.row] = sendQ(r); });
    return JSZip.loadAsync(S.bulkBuf).then(function (zip) {
      return zip.file('xl/workbook.xml').async('string').then(function (wbx) {
        var m = wbx.match(/<sheet [^>]*name="Bulk RO"[^>]*r:id="([^"]+)"/) || wbx.match(/<sheet [^>]*r:id="([^"]+)"[^>]*name="Bulk RO"/);
        if (!m) throw new Error('The Bulk RO file looks different from usual (no "Bulk RO" sheet).');
        return zip.file('xl/_rels/workbook.xml.rels').async('string').then(function (rels) {
          var re = new RegExp('<Relationship [^>]*Id="' + m[1] + '"[^>]*>|<Relationship [^>]*Target="[^"]*"[^>]*Id="' + m[1] + '"[^>]*>');
          var rel = (rels.match(re) || [''])[0], tg = (rel.match(/Target="([^"]+)"/) || [])[1];
          if (!tg) throw new Error('Could not find the Bulk RO sheet inside the file.');
          var path = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, '');
          return zip.file(path).async('string').then(function (xml) {
            // Only the lines being ordered: Blinkit's other rows (other warehouses, items not ordered) are left out.
            var drop = {}; S.bulk.rows.forEach(function (b) { if (!fills[b.row]) drop[b.row] = 1; });
            zip.file(path, PlanCore.keepRowsXml(PlanCore.fillSheetXml(xml, fills, qCol, aCol, S.boot.settings.address), drop));
            return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
          });
        });
      });
    });
  }

  function saveBlob(blob, name) {
    // Inside the Android app the in-app browser cannot save downloads: hand the file to the app (→ Downloads).
    if (window.PlannerApp && window.PlannerApp.saveFile) {
      var rd = new FileReader();
      rd.onload = function () { window.PlannerApp.saveFile(String(rd.result).split(',')[1], name, blob.type || 'application/octet-stream'); };
      rd.readAsDataURL(blob);
      return;
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function exportPlan() {
    var rows = S.plan.map(function (r) {
      return { Warehouse: r.wh, Group: r.group, SKU: r.sku, 'Item ID': r.item, Status: r.status,
        'Sold 7d': r.s7, 'Sold 15d': r.s15, 'Sold 30d': r.s30, 'Per day': Math.round(r.rate * 10) / 10,
        'WH stock': r.whStock, 'Darkstore + transit': r.dsStock, 'Blinkit incoming': r.incoming, 'RO Log incoming': r.appIncoming,
        'Stock': r.whStock + r.dsStock, 'Delivered (awaiting GRN)': r.delivered || 0, 'Shipped': r.shipped || 0, 'Planned': r.incoming + r.appIncoming - (r.shipped || 0), 'Days now': r.daysNow == null ? '' : Math.max(0, Math.floor(r.daysNow)), 'Days since stock date': r.elapsed,
        Suggested: r.rec, Starter: r.starter, Send: sendQ(r), 'Blinkit max': r.max, 'TI stock': tiQty(r) == null ? '' : tiQty(r), 'TI free': tiFree(r) == null ? '' : tiFree(r), Note: r.note, Locked: r.locked ? r.remarks : '' };
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Plan');
    var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    saveBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'Blinkit_Plan_' + today() + '.xlsx');
  }

  /* ======================= Projections ======================= */
  /*
   * What the open ROs still need, per SKU: the total (default) or warehouse by warehouse (one column per warehouse),
   * with each SKU's monthly sale from the Inventory upload = the highest of 7-day sale / 7 × 30, 15-day sale / 15 × 30
   * and 30-day sale, all warehouses together.
   * "Not shipped yet" = status Created and the dispatch day is today or later (or not set yet).
   */
  /* ================= Swiggy / Zepto =================
   * Swiggy and Zepto raise their own POs, so nothing is created here. Their report files (Swiggy: Sales .xlsx + stock
   * "SOH" .csv; Zepto: Sales .csv + Inventory .csv) give each warehouse's sales per day and stock; their POs come from
   * the "Swiggy Planning" / "Zepto" tabs. Every line of a PO not shipped yet is marked by how long that warehouse's stock
   * lasts: Must send (runs out before a shipment could arrive: under the lead days), Send (under the days of cover) or
   * Can wait. Swiggy: stock and sales are counted per warehouse city (sales in a city without a Swiggy warehouse count
   * under the city in Settings → Swiggy / Zepto). Zepto: per Zepto warehouse (MUM, BLR, CHN, GUR), from the cities it
   * serves (same setting).
   */
  var QC_NAMES = { swiggy: 'Swiggy', zepto: 'Zepto' };
  function qcCity(s) { return String(s || '').trim().toLowerCase().replace(/[_\s]*\d+$/, '').replace(/\s+/g, ' '); }
  function qcTitle(s) { return String(s).replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }); }
  /** "warehouse: city, city" lines → { city: warehouse } (each warehouse also maps to itself). */
  function qcMap(text, upper) {
    var m = {};
    String(text || '').split(/\n/).forEach(function (ln) {
      var i = ln.indexOf(':'); if (i < 0) return;
      var w = qcCity(ln.slice(0, i)); if (!w) return;
      if (upper) w = w.toUpperCase();
      m[qcCity(ln.slice(0, i))] = w;
      ln.slice(i + 1).split(',').forEach(function (c) { c = qcCity(c); if (c) m[c] = w; });
    });
    return m;
  }
  function qcYmd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function qcDays(a, b) { return Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5); }
  function qcCsv(text) {
    text = String(text).replace(/^﻿/, '');
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }

  /** The table's data: rows per SKU with quantities per warehouse, its total, and the monthly sale. */
  var PROJ_X = 1.2; // next 30 days = monthly sale × 1.2
  /** Warehouse names compared loosely: "Pune P3 - Feeder Warehouse" = "Pune P3 Feeder" = "pune p3". */

    if (inv) inv.rows.forEach(function (x) {
      var t = sale[x.item] = sale[x.item] || { s7: 0, s15: 0, s30: 0, stock: 0, name: '' };
      t.s7 += x.s7 || 0; t.s15 += x.s15 || 0; t.s30 += x.s30 || 0; t.stock += x.sellable || 0; if (!t.name) t.name = x.name;
      var wk = whLoose(bulkName[x.whId] || x.whName), m = saleWh[x.item] = saleWh[x.item] || {};
      var u = m[wk] = m[wk] || { s7: 0, s15: 0, s30: 0 };
      u.s7 += x.s7 || 0; u.s15 += x.s15 || 0; u.s30 += x.s30 || 0;

    }

      var g = r.group || s.group || '';

      var x = by[r.item] = by[r.item] || { item: r.item, sku: r.sku || s.sku || '', name: r.name || s.name || (sale[r.item] || {}).name || '', group: g, wh: {}, total: 0, ros: {} };
      x.wh[r.wh] = (x.wh[r.wh] || 0) + r.qty; x.total += r.qty;

    var rows = Object.keys(by).map(function (k) {
      var x = by[k]; x.sale = monthlyOf(sale[x.item]); x.nRo = Object.keys(x.ros).length;

  /**

   */
  var PER_PAGE = 25;
  function page(key, n) {

    S[key] = Math.min(Math.max(1, S[key] || 1), pages);

      '<button class="btn sm" data-pg="' + (pg.p + 1) + '"' + (pg.p === pg.pages ? ' disabled' : '') + '>Next ›</button><button class="btn sm" data-pg="' + pg.pages + '"' + (pg.p === pg.pages ? ' disabled' : '') + ' title="Last page">»</button>';

    };

  /**
   * RO Log, instant: shown at once from what the page already has — the last read for these filters (kept on this
   * device), else the open ROs and the recent deliveries loaded with the app — then the fresh list from the sheet
   * replaces it quietly as soon as it arrives.
   */
  var CACHE_LOG = 'bp_cache_log';
  function logFits(f) {
    return function (r) { return (!f.from || !r.roDate || r.roDate >= f.from) && (!f.to || !r.roDate || r.roDate <= f.to) && (!f.wh || r.wh === f.wh) && logStatusFits(f.status, r); };
  }
  function localLogRows(f) {
    var by = {};
    ((S.boot && S.boot.openROs) || []).concat((S.boot && S.boot.delivered) || []).forEach(function (r) { by[r.key] = r; });
    return Object.keys(by).map(function (k) { return by[k]; }).filter(logFits(f));
  }
  function loadLog() {
    var f = S.logFilter, fk = JSON.stringify(f);

    if (!(S.logRows && S.logKey === fk)) {
      var c = cacheGet(CACHE_LOG);
      if (c && c.k === fk) { S.logRows = c.rows; S.logKey = fk; }
      else { S.logRows = localLogRows(f); S.logKey = fk; }
    }
    drawLog();
    st('<span class="spin" style="width:10px;height:10px;border-width:2px;vertical-align:-1px"></span> Updating from the sheet…');
    apiCall('listROs', [S.token, f]).then(function (rows) {
      if (JSON.stringify(S.logFilter) !== fk) return; // the filters changed meanwhile
      if (SQ.n > 0) { st(''); return; } // a save is on its way: the page's own copy is newer
      rows = (rows || []).filter(function (r) { return logStatusFits(f.status, r); }); // Planned / Shipped apart
      st(''); S.logRows = rows; S.logKey = fk; drawLog();
      try { if (JSON.stringify(rows).length < 1500000) cachePut(CACHE_LOG, { k: fk, rows: rows }); } catch (e) { /* too big to keep */ }
    }, function (e) { st(''); if (!S.logRows || !S.logRows.length) $('logOut').innerHTML = msgs([e.message], 'bad'); else toast(e.message, 5000); });
  }
  /** Saved lines back into the RO Log list (a line that no longer matches the filters drops out, as on a reload). */
  /** Every RO for the search: the whole RO Log (read once, again after 3 minutes) with the page's newer copies on top. */
  function logSearchRows() {
    if ((!S.logAll || Date.now() - S.logAllAt > 180000) && !S.logAllLoading) {
      S.logAllLoading = true;
      apiCall('listROs', [S.token, {}]).then(function (rows) { S.logAll = rows || []; S.logAllAt = Date.now(); S.logAllLoading = false; if (S.tab === 'log' && S.logQ) drawLog(); },
        function () { S.logAllLoading = false; });

    var by = {};
    (S.logAll || []).concat(localLogRows({}), S.logRows || []).forEach(function (r) { by[r.key] = r; });
    return Object.keys(by).map(function (k) { return by[k]; });

  function mergeLogRows(rows) {
    // The full list the search uses gets the saved lines too.
    if (S.logAll) { var ak = {}; S.logAll.forEach(function (r, i) { ak[r.key] = i; }); rows.forEach(function (r) { if (ak[r.key] !== undefined) S.logAll[ak[r.key]] = r; else S.logAll.push(r); }); }
    var f = S.logFilter || {}, keys = {};

    var fits = function (r) {
      return (!f.from || !r.roDate || r.roDate >= f.from) && (!f.to || !r.roDate || r.roDate <= f.to) && (!f.wh || r.wh === f.wh) && logStatusFits(f.status, r);
    };

  /**
   * One card per RO as it is on Blinkit. The app keeps one batch per group (each goes into its own TBI / TBO / TBG
   * block of the month tab), but batches created together with the Merged file, or carrying the same Blinkit RO
   * number for one warehouse, are one RO and are shown — and saved — together.

  function cardsOf(rows) {
    var b = {}, cards = {};
    rows.forEach(function (r) { (b[r.batch] = b[r.batch] || []).push(r); });
    Object.keys(b).forEach(function (id) {
      var r0 = b[id][0];

      (cards[key] = cards[key] || { key: key, batches: [], rows: [] }).batches.push(id);
      cards[key].rows = cards[key].rows.concat(b[id]);

    return Object.keys(cards).map(function (k) { return cards[k]; }).sort(function (x, y) {
      return (y.rows[0].roDate + y.rows[0].batch).localeCompare(x.rows[0].roDate + x.rows[0].batch);
    });

  /**

      .concat(Object.keys(whs).map(function (w) { return { v: w, n: askNorm(w), id: '', sub: 'warehouse', wh: 1 }; }));

      }

    }

    skus.forEach(function (s) {

      var head = '<b>' + esc(skuText(s.sku, s.item)) + '</b>' + (whs.length ? ' · ' + esc(whs.join(', ')) : ' · all warehouses');

function buildRoInvoiceHtml_(invoice, shipment) {
  const fmt = n => (Math.round((Number(n)||0) * 100) / 100).toFixed(2);

  // (page 1 only) and the totals/declaration block (last page only)  -

  // section is NEVER cut off or split apart from itself.
  const ROWS_PER_PAGE_WITH_HEADER = 11; // page 1 also carries the header block
  const ROWS_PER_PAGE_PLAIN       = 17; // subsequent pages, table only

  const allRowsHtml = invoice.rows.map(r => `
    <tr>
      <td>${r.blinkitItemId}</td>
      <td style="text-align:left">${r.description}</td>

      <td>₹${fmt(r.landingPrice)}</td>
      <td>₹${fmt(r.totalAmtInr)}</td>
    </tr>`);

  const tableHead = `<thead><tr>
        <th>Blinkit Item ID</th><th>Description of Goods/Services</th><th>UPC</th><th>HSN No</th>
        <th>MRP</th><th>Box</th><th>Units in Box</th><th>Total Units</th>
        <th>GST Rate</th><th>Landing Price</th><th>Total Amt INR<br>(Landing price x Total units)</th>
      </tr></thead>`;

  // Intra-state (Rajasthan → Rajasthan) shipments split tax into CGST +
  // SGST instead of a single IGST line  -  server already computed both
  // via buildRoInvoiceRows_, so this just picks which to display.
  const taxRowsHtml = invoice.taxType === 'CGST_SGST'
    ? `<tr><td>CGST</td><td>₹${fmt(invoice.totals.cgst)}</td></tr>
       <tr><td>SGST</td><td>₹${fmt(invoice.totals.sgst)}</td></tr>`
    : `<tr><td>IGST</td><td>₹${fmt(invoice.totals.igst)}</td></tr>`;

  const totalsBlockHtml = `
    <table class="ro-table" style="border-top:none">
      <tfoot>
        <tr class="ro-total-row">
          <td colspan="5" style="text-align:center">Total</td>
          <td>${invoice.totals.box}</td>
          <td></td>
          <td>${invoice.totals.totalUnits}</td>
          <td colspan="3"></td>

      </div>

  const lastChunk = chunks[chunks.length - 1];

      ${headerHtml}
      ${tableHtml}
      ${totalsHtml}

  });

}

/** HTML-attribute-safe escaping for values interpolated into
 *  `<td>`/`<option value="...">`/onclick-string-literal template
 *  contexts throughout this file (cancelled-invoice rows, the Live
 *  Inventory Snapshot table, the QZ Tray printer dropdown, etc.) — was
 *  called in 9 places but never actually defined anywhere in this
 *  file, which silently broke all of them (ReferenceError, caught by
 *  whichever try/catch or .catch() happened to wrap that call site —
 *  e.g. it's what made a successful QZ Tray connection still show as
 *  "QZ Tray not connected", since populating the printer <select> is
 *  what actually threw). */
function escAttr_(val) {
  return String(val == null ? '' : val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDDMMYYYY_(isoDate) {
  if (!isoDate) return '';
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d.getTime())) return isoDate;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return dd + '-' + mm + '-' + d.getFullYear();
}

/** Minimal Indian-numbering amount-in-words, e.g. 19960 -> "Nineteen
 *  Thousand Nine Hundred Sixty Only". Good enough for an invoice
 *  declaration line; not meant to handle paise/decimals. */
function numberToWords_(num) {
  if (!num || num <= 0) return 'Zero Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n) {
    if (n < 20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  }
  function threeDigit(n) {
    if (n < 100) return twoDigit(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + twoDigit(n%100) : '');
  }
  let n = Math.floor(num);
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const rest = n;
  let parts = [];
  if (crore) parts.push(threeDigit(crore) + ' Crore');
  if (lakh) parts.push(threeDigit(lakh) + ' Lakh');
  if (thousand) parts.push(threeDigit(thousand) + ' Thousand');
  if (rest) parts.push(threeDigit(rest));
  return (parts.join(' ') || 'Zero') + ' Only';
}

    function pdfBlob(invoice) {
      return new Promise(function (resolve, reject) {
        if (typeof html2canvas === 'undefined' || !window.jspdf) { reject(new Error('The PDF tools did not load (no internet?). Reload the page.')); return; }
        var stage = document.createElement('div');

        var pdf = new window.jspdf.jsPDF({ unit: 'in', format: 'a4', orientation: 'portrait' }), W = 8.27, H = 11.69, i = 0;
        (function next() {

          html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: el.scrollWidth, windowHeight: el.scrollHeight }).then(function (canvas) {
            if (i > 0) pdf.addPage('a4', 'portrait');

  /* ======================= Upload Blinkit R.O. PDFs ======================= */
  /** PDF text the way the Shipment Manager's extractPdfText_ builds it (text items grouped into lines by y). */
  function extractPdfText(buf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise.then(function (pdf) {

          var lineMap = {};
          content.items.forEach(function (item) {

  /**
   * The Dashboard's figures per warehouse + item from the last plan, brought up to date with the RO Log now: Has (stock +
   * delivered), Delivered, Shipped, Planned, Per day and Days. Used by the Dashboard and by 💬 Ask.
   */
  function dashCalc(d) {
    var rows = d.rows.map(function (r) { return { wh: r[0], item: r[1], name: r[2], group: r[3], status: r[4], rate: Number(r[5]) || 0, pos: Number(r[6]) || 0, days: r[7] === '' ? null : Number(r[7]), rec: Number(r[8]) || 0, locked: r[9] === 'Yes',
      // Has = stock (Total sellable); Planned = on ROs not received yet. A snapshot from before the split has only the sum.
      has: r[10] === '' || r[10] === undefined ? null : Number(r[10]), planned: r[11] === '' || r[11] === undefined ? null : Number(r[11]),
      // Planned's two parts (snapshots from before 21 Nov 2026 don't have them).
      plBlinkit: r[12] === '' || r[12] === undefined ? null : Number(r[12]), plLog: r[13] === '' || r[13] === undefined ? null : Number(r[13]),
      dlvPlan: Number(r[14]) || 0 }; });
    rows.forEach(function (r) { if (r.dlvPlan && r.has != null) { r.has += r.dlvPlan; r.delivAdj = r.dlvPlan; } });
    // ROs marked Delivered after this plan was made were still counted in its Planned (Blinkit's file / the RO Log
    // had them on their way). They are now at the warehouse: shown under Has instead, until the next plan.
    var dlv = {};
    // The whole RO quantity leaves Planned (Blinkit listed all of it); only what was shipped joins Has (a part not
    // sent, when shipped short, never comes).
    var dlvShip = {};
    (d.delivered || []).forEach(function (x) {
      if (!(x.updatedAt && x.updatedAt > d.meta.at)) return;
      var k = PlanCore.whNorm(x.wh) + '|' + Number(x.item), sq = x.shippedQty != null && x.shippedQty !== '' ? Number(x.shippedQty) : Number(x.qty) || 0;
      dlv[k] = (dlv[k] || 0) + Math.max(Number(x.qty) || 0, sq); dlvShip[k] = (dlvShip[k] || 0) + sq;
    });
    rows.forEach(function (r) {
      var kq = PlanCore.whNorm(r.wh) + '|' + Number(r.item), q = dlv[kq];
      if (!q || r.planned == null || !(r.planned > 0)) return;
      var a = Math.min(q, r.planned), got = Math.min(a, dlvShip[kq] || 0);
      r.planned -= a; r.has = (r.has || 0) + got; r.delivAdj = (r.delivAdj || 0) + got;
      if (r.plBlinkit != null) { var b = Math.min(a, r.plBlinkit); r.plBlinkit -= b; if (r.plLog != null) r.plLog = Math.max(0, r.plLog - (a - b)); }
    });
    // On its way splits into Shipped (dispatch day today or earlier) and Planned (not shipped yet), from the ROs now.
    var shp = shippedBy(d.openROs);
    rows.forEach(function (r) {
      if (r.planned == null || !(r.planned > 0)) { r.shipped = 0; return; }
      r.shipped = Math.min(r.planned, shp[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0); r.planned -= r.shipped;
    });
    // "Days" counts down every day from the stock date of the plan the dashboard was made from.
    var dsi = PlanCore.stockInfo(d.meta.inventoryAt, today()), el = dsi ? dsi.elapsed : 0;
    // Days = what is there (Has: stock + delivered) ÷ Per day − days passed. With what is on its way (Shipped + Planned)
    // it is r.daysAll, shown on hover; Suggested counts all of it, so nothing is ordered twice.
    rows.forEach(function (r) {
      if (r.days != null) r.days = r.days - el;
      r.daysAll = r.days;
      if (r.has != null && r.rate > 0) r.days = r.has / r.rate - el;
    });
    return { rows: rows, dsi: dsi, el: el };
  }

  function drawDash() {
    var d = S.dash, box = $('dashOut'); box.className = '';
    if (!d.meta || !d.rows.length) { box.className = 'card muted'; box.innerHTML = 'No data yet. Make a plan once (New Plan → upload the two files) and the dashboard fills from it.'; return; }
    var ageDays = Math.floor((Date.now() - d.meta.at) / 864e5);
    var cc = dashCalc(d), rows = cc.rows, dsi = cc.dsi, el = cc.el;
    // The Days hover: the sum itself, e.g. "Days = Has 395 (stock 54 + delivered 341) ÷ 37.0 per day − 1 day since the
    // stock date = 9.7".
    var daysWhy = function (r) {
      if (r.days == null || !(r.rate > 0)) return '';
      var has = r.has == null ? r.pos : r.has, dl = r.delivAdj || 0;
      return 'Days = Has ' + fmt(has) + (dl ? ' (stock ' + fmt(has - dl) + ' + delivered ' + fmt(dl) + ')' : '') + ' ÷ ' + fmt(r.rate, 1) + ' per day' +
        (el ? ' − ' + el + ' day' + (el === 1 ? '' : 's') + ' since the stock date' : '') + ' = ' + fmt(d0(r.days), 1) +
        (r.days < 0 ? ' (ran out about ' + fmt(-r.days, 1) + ' day(s) ago)' : '') +
        (r.daysAll != null && r.daysAll !== r.days ? '&#10;With Shipped + Planned on their way too: ' + fmt(d0(r.daysAll), 1) + ' days' : '');
    };
    var byWh = {};
    rows.forEach(function (r) {
      var w = byWh[r.wh] = byWh[r.wh] || { red: 0, amber: 0, items: 0, open: 0 };
      if (r.rate > 0) { w.items++; if (r.days < 7) w.red++; else if (r.days < 15) w.amber++; }
    });
    var whByNorm = {};
    Object.keys(byWh).forEach(function (w) { whByNorm[PlanCore.whNorm(w)] = w; });
    d.openROs.forEach(function (r) { var w = whByNorm[PlanCore.whNorm(r.wh)]; if (w) byWh[w].open += r.qty; });
    var whs = Object.keys(byWh).sort();
    // Sortable columns: click a heading for A→Z / lowest first, click again for Z→A / highest first.
    // Default: Per day, highest first (then fewest days). Empty values always go last.
    var COLS = [['wh', 'Warehouse', 't'], ['sku', 'SKU', 't'], ['item', 'Item ID', 'n'], ['group', 'Group', 't'], ['rate', 'Per day', 'n'],
      ['has', 'Has', 'n'], ['shipped', 'Shipped', 'n'], ['planned', 'Planned', 'n'], ['days', 'Days', 'n'], ['rec', 'Suggested', 'n']];
    var SUBS = { rate: 'avg. sale a day', has: 'stock + delivered', shipped: 'on the road', planned: 'RO made, not shipped', days: 'Has ÷ per day', rec: 'to send, all counted' };
    var srt = S.dashSort = S.dashSort || { col: 'rate', dir: -1 };
    var val = function (r, c) {
      if (c === 'sku') return skuOf(r.item) || '';
      if (c === 'has') return r.has == null ? r.pos : r.has;
      return r[c];
    };
    var isText = COLS.filter(function (c) { return c[0] === srt.col; })[0][2] === 't';
    var list = rows.filter(function (r) { return r.rate > 0 && (!S.dashWh || r.wh === S.dashWh); }).sort(function (a, b) {
      var x = val(a, srt.col), y = val(b, srt.col);
      var ex = x == null || x === '', ey = y == null || y === '';
      if (ex || ey) return ex && ey ? 0 : ex ? 1 : -1;
      var c = isText ? String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' }) : x - y;
      return c * srt.dir || b.rate - a.rate || (a.days == null ? 1e9 : a.days) - (b.days == null ? 1e9 : b.days);
    });
    // Search (Ctrl+F): every word must appear in the row's warehouse, SKU, item ID or group.
    // "Planned without RO": the part of Planned that no open RO in the RO Log explains (e.g. ROs made on Blinkit
    // directly, or never uploaded as a PDF). Planned is from the plan; the RO Log is as it is now.
    var openQty = {};
    (d.openROs || []).forEach(function (x) { if (x.status === 'Planned' || x.status === 'Created') { var k = PlanCore.whNorm(x.wh) + '|' + Number(x.item); openQty[k] = (openQty[k] || 0) + (Number(x.qty) || 0); } });
    var noRo = function (r) { var on = (r.planned || 0) + (r.shipped || 0); return on > 0 ? Math.max(0, on - (openQty[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0)) : 0; };
    var noRoCount = list.filter(function (r) { return noRo(r) > 0; }).length;
    var dashMatch = function (r) {
      if (S.dashNoRo && !(noRo(r) > 0)) return false;
      var words = String(S.dashQ || '').toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return true;
      var hay = (r.wh + ' ' + (skuOf(r.item) || '') + ' ' + r.item + ' ' + r.group).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    };
    var rowHtml = function (r) {
        var c = r.days < 7 ? 'bad' : r.days < 15 ? 'warn' : 'ok';

    var pagerHtml = function () {

      return '<button class="btn sm" data-pg="1"' + (pi.p === 1 ? ' disabled' : '') + ' title="First page">«</button><button class="btn sm" data-pg="' + (pi.p - 1) + '"' + (pi.p === 1 ? ' disabled' : '') + '>‹ Prev</button>' +

    var dashCountText = function () { var n = list.filter(dashMatch).length; return (S.dashQ || S.dashNoRo ? n + ' of ' + list.length + ' items match' + (S.dashNoRo ? ' (Planned without RO)' : '') : list.length + ' items') + ''; };
    var sortHint = COLS.filter(function (c) { return c[0] === srt.col; })[0][1] + ', ' + (isText ? (srt.dir > 0 ? 'A → Z' : 'Z → A') : (srt.dir > 0 ? 'lowest first' : 'highest first'));

      (d.meta.inventoryAt ? ' · Blinkit inventory of ' + esc(d.meta.inventoryAt) : '') + (dsi ? ' · stock as of ' + prettyDate(dsi.stockDate) + ', so Days count from today (' + el + ' day' + (el === 1 ? '' : 's') + ' of sales taken off)' : '') + '. ROs created since then are not counted here.</div>' +

          '<div><span class="pill bad">' + x.red + ' under 7d</span> <span class="pill warn">' + x.amber + ' 7–15d</span></div>' +

        COLS.map(function (c) {

    var redrawRows = function () { $('dRows').innerHTML = dashRows(); $('dTot').innerHTML = totHtml(); $('dCount').textContent = dashCountText(); $('dPager').innerHTML = pagerHtml(); };
    // The total row sticks right under the heading row.
    var h0 = $('dTab').querySelector('tr').getBoundingClientRect().height; if (h0) $('dTab').style.setProperty('--dTotTop', Math.round(h0) + 'px');
    $('dPager').onclick = function (e) {

  }

  /**
   * Dashboard: what makes up an item's "Planned" (stock on its way to the warehouse) at the time of the plan:
   * Blinkit's own Incoming (ROs already on Blinkit, from the Bulk RO file) + RO Log lines Blinkit could not show
   * yet (Planned, or Created after the Bulk RO file was downloaded). Below: that item's open ROs in the RO Log now.

  function showPlanned(d, r) {
    if (!r) return;
    var bulkAt = d.meta && d.meta.bulkAt;
    var ros = (d.openROs || []).filter(function (x) { return PlanCore.whNorm(x.wh) === PlanCore.whNorm(r.wh) && Number(x.item) === Number(r.item); })
      .sort(function (a, b) { return String(b.roDate).localeCompare(String(a.roDate)); });
    var counted = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Planned' || (x.status === 'Created' && (!bulkAt || !at || at > bulkAt)); };
    // RO Log part beyond the lines counted by time = recent ROs Blinkit's Incoming did not show yet (safety rule).
    var byTime = ros.reduce(function (a, x) { return a + (counted(x) ? x.qty : 0); }, 0);
    var gapLeft = r.plLog != null ? Math.max(0, r.plLog - byTime) : 0;
    var isRecent = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Created' && bulkAt && at && at <= bulkAt && (at >= bulkAt - 3 * 864e5 || (!x.appt && at >= bulkAt - 30 * 864e5)); };

    var html = '<h2>Planned ' + fmt(r.planned) + ' — ' + esc(skuText(skuOf(r.item), r.item)) + '</h2><div class="small muted">' + esc(r.wh) +

      (split ? '<table class="t" style="margin-top:10px"><tr><td>Incoming in <b>Blinkit\'s Bulk RO file</b> (ROs already on Blinkit)</td><td class="right"><b>' + fmt(r.plBlinkit) + '</b></td></tr>' +
        '<tr><td>From the <b>RO Log</b>, not in Blinkit\'s file yet (Planned, or created after the file was downloaded)</td><td class="right"><b>' + fmt(r.plLog) + '</b></td></tr>' +
        '<tr><th>Planned</th><th class="right">' + fmt(r.planned) + '</th></tr></table>'
        : '<div class="msg info">The split into Blinkit\'s Incoming and RO Log lines shows from the next plan on (New Plan saves it).</div>') +
      '<h3 style="margin-top:12px">Open ROs for this item here (RO Log, now)</h3>' +
      (ros.length ? '<div class="scroll"><table class="t"><tr><th>RO date</th><th>RO No.</th><th>Status</th><th class="right">Qty</th><th>Appointment</th><th>In the RO Log part?</th></tr>' +
        ros.map(function (x) {
          return '<tr><td>' + prettyDate(x.roDate) + '</td><td>' + (x.roNo ? roNoHtml(x.roNo, true) : '—') + '</td><td>' + roStatusPill(x.status, x.appt, x.shippedOn) + '</td><td class="right">' + fmt(x.qty) + '</td><td>' + apptCell(x) + '</td>' +
            '<td class="small">' + (counted(x) ? 'Yes' : gapLeft > 0 && isRecent(x) ? 'Yes — Blinkit\'s Incoming did not show it yet' : 'No — Blinkit\'s file already shows it') + '</td></tr>';
        }).join('') + '</table></div>'
        : '<div class="small muted">No open ROs for this item at this warehouse in the RO Log. ' + (split && r.plBlinkit ? 'The ' + fmt(r.plBlinkit) + ' are ROs on Blinkit that are not in the RO Log (e.g. made on Blinkit directly).' : '') + '</div>') +
      '<div class="small muted" style="margin-top:8px">ROs created or changed since the plan are listed here but not in the numbers above.</div>' +

    $('modalBox').style.maxWidth = '820px'; // wider: RO table with appointment boxes
    $('plOk').onclick = closeModal;
    // Appointment straight from here: saved like "Save RO" in the RO Log (RO Log + the RO heading in the month tab),

      var same = function (y) { return PlanCore.whNorm(y.wh) === PlanCore.whNorm(x.wh) && (x.merged ? y.merged === x.merged : x.roNo ? y.roNo === x.roNo : y.batch === x.batch); };
      var batches = []; (d.openROs || []).forEach(function (y) { if (same(y) && batches.indexOf(y.batch) < 0) batches.push(y.batch); });

  /**
   * Dashboard calendar — 51 days from 20 days ago, as a dispatch plan (Settings → Dispatch):
   *  🚚 load bar = units dispatched that day vs the daily capacity (red when over); 📦 packing days before a dispatch;
   *  📍 arrivals (appointment, or dispatch + shipping days); ⚠ items that run out before
   *  their next possible arrival; ⏳ ROs that expire without an appointment. Above the days: the warnings.
   *  Click a day for its details; a dispatch without an appointment can be moved to another day there.
   * ROs marked Delivered stay on it for 20 days after their delivery day: on their dispatch day (🚚, counted in the
   * load, no Move / ✕) and their delivery day (✅).
   * Follows the warehouse picked on the dashboard.
   */
  function initDashCal(d, rows, el) {
    var det = $('dCal'); if (!det) return;
    var KEEP_DLV = 20, DAYS = 51, start = addDays(today(), -KEEP_DLV), todayS = today(), c = dConf();
    var inWh = function (w) { return !S.dashWh || PlanCore.whNorm(w) === PlanCore.whNorm(S.dashWh); };
    var short = function (w) { return String(w).replace(/ - Feeder( Warehouse)?| Feeder$/, ''); };
    var dlab = function (k) { return new Date(k + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };
    var expiryOf = function (x) { var m = String(x.notes || '').match(/R\.O\. expiry (\d{1,2} [A-Za-z]{3} \d{4})/); if (!m) return ''; var t = new Date(m[1] + ' 12:00'); return isNaN(t) ? '' : t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); };
    var build = function () {
      var days = {}, warn = { gap: [], waiting: [], expiring: [], unsched: [] };
      var day = function (k) { return days[k] = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], dlv: [], load: 0 }; };
      // ✅ ROs marked Delivered: on their delivery day.
      // They stay for 20 days after delivery, also on the day they were dispatched (the day they were shipped, if known).
      roGroups(d.delivered || []).filter(function (x) { return inWh(x.wh) && x.lines[0] && x.lines[0].deliveredOn && x.lines[0].deliveredOn >= addDays(todayS, -KEEP_DLV); }).forEach(function (x) {
        x.done = true; day(x.lines[0].deliveredOn).dlv.push(x);
        var dd = x.shippedOn || dispatchOf(x);
        if (dd) { day(dd).disp.push(x); day(dd).load += x.units; }
      });
      // 🛵 Swiggy / Zepto POs (from their tabs): shipping day (counted in the load) and appointment day. Only when no
      // Blinkit warehouse is picked; their dates are changed in the sheet.
      if (!S.dashWh) qcCalItems().forEach(function (x) {
        if (x.ship) { day(x.ship).disp.push(x); day(x.ship).load += x.units; }
        if (x.appt) day(x.appt).arr.push(x);
      });
      var groups = roGroups(d.openROs).filter(function (x) { return inWh(x.wh); });
      groups.forEach(function (x) {
        var dd = dispatchOf(x), ar = arrivalOf(x), ex = expiryOf(x);
        if (x.roDate) day(x.roDate).ros.push(x);
        if (dd) {
          day(dd).disp.push(x); day(dd).load += x.units;
          var p = dd; for (var i = 0; i < c.pack; i++) { p = prevWorkDay(addDays(p, -1)); day(p).pack.push(x); }
        } else if (x.status === 'Created' || x.status === 'Planned') warn.unsched.push(x);
        if (ar) day(ar).arr.push(x);
        if (!x.appt && x.status === 'Created' && x.roDate && x.roDate <= addDays(todayS, -3)) warn.waiting.push(x);
        if (!x.appt && ex) { day(ex).exp.push(x); if (ex >= todayS && ex <= addDays(todayS, 5)) warn.expiring.push(x); }
      });
      // ⚠ An item that runs out before its next possible arrival (an open RO's arrival, or a new RO dispatched
      // after packing): shown on the day it runs out, with the days it would be out of stock.
      var arrOf = {};
      roGroups(d.openROs).forEach(function (x) { var ar = arrivalOf(x); if (!ar || ar < todayS) return; x.lines.forEach(function (l) { var k = PlanCore.whNorm(x.wh) + '|' + l.item; if (!arrOf[k] || ar < arrOf[k]) arrOf[k] = ar; }); });
      rows.forEach(function (r) {
        if (!(r.rate > 0) || r.days == null || !inWh(r.wh)) return;
        var out = addDays(todayS, Math.max(0, Math.floor(r.days)));
        var next = arrOf[PlanCore.whNorm(r.wh) + '|' + r.item] || addDays(nextWorkDay(addDays(todayS, c.pack)), transitOf(r.wh));
        if (out < next) {
          var gap = Math.round((new Date(next + 'T12:00:00') - new Date(out + 'T12:00:00')) / 864e5);
          var w = { r: r, out: out, next: next, gap: gap }; day(out).out.push(w); warn.gap.push(w);
        }
      });
      return { days: days, warn: warn };
    };
    var roLine = function (x, extra) {
      return '<li>' + esc(short(x.wh)) + ' · ' + esc(x.groups.join(' + ')) + ' · <b>' + fmt(x.units) + '</b> units' + (x.roNo ? ' · ' + roNoHtml(x.roNo) : '') + ' ' + roStatusPill(x.status, x.appt, x.shippedOn) + (extra || '') + '</li>';
    };
    var draw = function () {
      var B = build(), days = B.days, W = B.warn;
      var first = new Date(start + 'T12:00:00'), lead = (first.getDay() + 6) % 7; // weeks start on Monday
      var cells = '';
      for (var i = 0; i < lead; i++) cells += '<div class="cd empty"></div>';
      for (var j = 0; j < DAYS; j++) {
        var k = addDays(start, j), x = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], dlv: [], load: 0 };
        var dd = new Date(k + 'T12:00:00'), off = !isWorkDay(k), over = x.load > c.cap;
        cells += '<div class="cd' + (k < todayS ? ' past' : '') + (k === todayS ? ' today' : '') + (off ? ' off' : '') + (S.dashCalDay === k ? ' sel' : '') + '" data-d="' + k + '">' +
          '<div class="cdn">' + dd.getDate() + (dd.getDate() === 1 || j === 0 ? ' ' + dd.toLocaleDateString('en-IN', { month: 'short' }) : '') + '</div>' +
          (x.load ? '<div class="ld' + (over ? ' over' : '') + '" title="Dispatch ' + fmt(x.load) + ' of ' + fmt(c.cap) + ' units"><span style="width:' + Math.min(100, Math.round(x.load / c.cap * 100)) + '%"></span></div><span class="cb ds' + (over ? ' over' : '') + '">🚚 ' + fmt(x.load) + '</span>' : '') +
          (x.pack.length ? '<span class="cb pk" title="Packing">📦 ' + x.pack.length + '</span>' : '') +
          (x.arr.length ? '<span class="cb ap" title="Arrivals">📍 ' + x.arr.length + '</span>' : '') +
          (x.dlv.length ? '<span class="cb ap" title="Delivered">✅ ' + x.dlv.length + '</span>' : '') +
          (x.out.length ? '<span class="cb out" title="Run out before the next arrival">⚠ ' + x.out.length + '</span>' : '') +
          (x.exp.length ? '<span class="cb out" title="RO expires without appointment">⏳ ' + x.exp.length + '</span>' : '') + '</div>';

    var lastInfo = '';
