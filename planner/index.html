        bgSave('updateROLine', [S.token, k0, { shortNote: v0 }]);
        return;
      }
      if (!e.target.classList.contains('bSt')) return;
      e.target.closest('.ro').querySelector('.bDelW').classList.toggle('hidden', e.target.value !== 'Delivered');
    };
    box.onclick = function (e) {
      var ro = e.target.closest('.ro'); if (!ro) return;
      var c = cs[Number(ro.getAttribute('data-c'))];
      if (e.target.closest('.h')) { ro.classList.toggle('open'); S.openBatch = S.openBatch || {}; c.batches.forEach(function (b) { S.openBatch[b] = ro.classList.contains('open'); }); return; }
      var out = ro.querySelector('.bmsg');
      if (e.target.classList.contains('bSave')) {
        var ch = { appt: ro.querySelector('.bAp').value, roNo: ro.querySelector('.bNo').value.trim() };
        var st = ro.querySelector('.bSt').value; if (st) ch.status = st;
        if (st === 'Cancelled' && !confirm('Cancel the whole RO? Its quantities are taken out of the month tab.')) return;
        if (st === 'Delivered') {
          ch.deliveredOn = ro.querySelector('.bDel').value;
          if (!ch.deliveredOn) { ro.querySelector('.bmsg').innerHTML = msgs(['Enter the delivery date.'], 'bad'); return; }
        }
        var ds = ro.querySelector('.bDs');
        var cg0 = roGroups(c.rows)[0] || {};
        if (ds && ds.value !== dispatchOf(cg0)) {
          if (ds.value && !isWorkDay(ds.value)) { out.innerHTML = msgs([prettyDate(ds.value) + ' is not a dispatch day (Settings → Dispatch).'], 'bad'); return; }
          ch.dispatch = ds.value;
        }
        // Instant: the RO Log shows it at once; one request for the whole RO saves it in the background.
        mergeLogRows(applyLocal(inBatches(c.batches), ch)); drawLog(); refreshPlanAfterRoChange();
        bgSave('updateBatch', [S.token, c.batches, ch]);
      }
      var tr = e.target.closest('tr'); if (!tr) return;
      var k = tr.getAttribute('data-k');
      var btn = e.target, byKey = function (r) { return r.key === k; };
      if (btn.classList.contains('lSave')) {
        var nq = Math.round(Number(tr.querySelector('.lQ').value));
        if (!(nq > 0)) { out.innerHTML = msgs(['Quantity must be more than 0. To remove a line, cancel it.'], 'bad'); return; }
        mergeLogRows(applyLocal(byKey, { qty: nq })); drawLog(); refreshPlanAfterRoChange();
        bgSave('updateROLine', [S.token, k, { qty: nq }]);
      }
      if (btn.classList.contains('lCan')) {
        if (!confirm('Cancel this line? Its quantity is taken out of the month tab.')) return;
        mergeLogRows(applyLocal(byKey, { status: 'Cancelled' })); drawLog(); refreshPlanAfterRoChange();
        bgSave('updateROLine', [S.token, k, { status: 'Cancelled' }]);
      }
    };
  }

  /* ======================= 💬 Ask: answers from the RO Log (no AI) ======================= */
  /**
   * Finds the SKU and the warehouse named in a question ("Why was 2 in 1 Belt not sent in Mumbai?") and answers
   * from the RO Log (last 120 days): each RO with ordered / shipped / not-sent quantities, the "why not sent" note,
   * status and dates; plus what the last plan said about it (stock, suggested, locked).
   */
  var ASK = { rows: null, at: 0, log: [] };
  function initAsk() {
    if ($('askBtn')) return;
    var b = document.createElement('button'); b.id = 'askBtn'; b.textContent = '💬 Ask'; b.title = 'Ask about an SKU at a warehouse, e.g. why it was not sent';
    document.body.appendChild(b);
    b.onclick = function () { $('askBox') && !$('askBox').classList.contains('hidden') ? closeAsk() : openAsk(); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('askBox') && !$('askBox').classList.contains('hidden')) closeAsk(); });
  }
  function closeAsk() { $('askBox').classList.add('hidden'); }
  function openAsk() {
    var box = $('askBox');
    if (!box) {
      box = document.createElement('div'); box.id = 'askBox';
      box.innerHTML = '<div class="ah">💬 Ask the planner<button title="Close (Esc)">✕</button></div><div id="askMsgs"></div>' +
        '<form id="askF"><div id="askSug" class="sugg hidden" role="listbox"></div><input type="text" id="askQ" placeholder="e.g. Why was 2 in 1 Belt not sent in Mumbai?" autocomplete="off"><button class="btn p">Ask</button></form>';
      document.body.appendChild(box);
      box.querySelector('.ah button').onclick = closeAsk;
      $('askF').onsubmit = function (e) { e.preventDefault(); askSugHide(); var q = $('askQ').value.trim(); if (q) { $('askQ').value = ''; askQuestion(q); } };
      $('askQ').oninput = askSugShow;
      $('askQ').onblur = function () { setTimeout(askSugHide, 150); };
      $('askQ').onkeydown = function (e) {
        var sg = $('askSug'), items = sg.querySelectorAll('div'); if (sg.classList.contains('hidden') || !items.length) return;
        var on = sg.querySelector('div.on'), i = Array.prototype.indexOf.call(items, on);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault(); if (on) on.classList.remove('on');
          i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
          items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' });
        } else if ((e.key === 'Enter' || e.key === 'Tab') && on) { e.preventDefault(); askSugPick(on); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); askSugHide(); } // Esc closes the list first, then the box
      };
      $('askSug').onmousedown = function (e) { var d = e.target.closest('div[data-v]'); if (d) { e.preventDefault(); askSugPick(d); } };
      $('askMsgs').onclick = function (e) { var x = e.target.closest('.ex button'); if (x) askQuestion(x.textContent); };
      askSay('bot', 'Ask about an SKU, optionally at a warehouse. I answer from the RO Log (last 120 days) and the last plan.' +
        '<div class="ex" style="margin-top:6px"><button type="button">Why was 2 in 1 Belt not sent in Mumbai?</button><button type="button">What is not sent?</button><button type="button">When does 1323 arrive in Kundli?</button></div>');
    }
    box.classList.remove('hidden');
    setTimeout(function () { $('askQ').focus(); }, 0);
  }
  /**
   * Suggestions while typing: the last words typed are matched against the start of SKU names, item IDs and
   * warehouse names; picking one (click, Enter or Tab, arrows to move) completes those words.
   */
  function askSugHide() { var s = $('askSug'); if (s) s.classList.add('hidden'); }
  function askSugShow() {
    var inp = $('askQ'), sg = $('askSug'), v = inp.value, words = v.split(/\s+/);
    if (!/\S$/.test(v)) { askSugHide(); return; }
    var whs = {}; ((S.boot && S.boot.openROs) || []).concat((ASK.rows || [])).forEach(function (r) { whs[r.wh] = 1; });
    ((S.dash && S.dash.rows) || []).forEach(function (r) { whs[r[0]] = 1; });
    var cands = (S.boot.skus || []).map(function (s) { return { v: s.sku || String(s.item), n: askNorm(s.sku), id: String(s.item), sub: s.item + (s.group ? ' · ' + s.group : '') }; })
      .concat(Object.keys(whs).map(function (w) { return { v: w, n: askNorm(w), id: '', sub: 'warehouse', wh: 1 }; }));
    var found = [], seen = {}, startAt = -1;
    // Longest ending first: "2 in" finds "2 in 1 Belt"; a single word also matches any word of a warehouse name.
    for (var k = Math.min(4, words.length); k >= 1 && !found.length; k--) {
      var frag = words.slice(words.length - k).join(' '), nf = askNorm(frag);
      if (nf.length < 2 || (k === 1 && /^(why|was|not|the|in|at|of|is|to|did|sent|when|does|what)$/i.test(frag))) continue;
      cands.forEach(function (c) {
        var hit = (c.n && c.n.indexOf(nf) === 0) || (c.id && c.id.indexOf(nf) === 0) ||
          (k === 1 && c.wh && askWords(c.v).some(function (w) { return !ASK_WH_SKIP[w] && w.indexOf(nf) === 0; }));
        if (hit && !seen[c.v]) { seen[c.v] = 1; found.push(c); }
      });
      if (found.length) startAt = words.length - k;
    }
    found = found.filter(function (c) { return askNorm(c.v) !== askNorm(words.slice(startAt).join(' ')); }).slice(0, 8);
    if (!found.length) { askSugHide(); return; }
    sg.setAttribute('data-start', startAt);
    sg.innerHTML = found.map(function (c, i) { return '<div data-v="' + esc(c.v) + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(c.v) + ' <small>' + esc(c.sub) + '</small></div>'; }).join('');
    sg.classList.remove('hidden');
  }
  function askSugPick(d) {
    var inp = $('askQ'), words = inp.value.split(/\s+/), start = Number($('askSug').getAttribute('data-start'));
    inp.value = words.slice(0, start).concat([d.getAttribute('data-v')]).join(' ') + ' ';
    askSugHide(); inp.focus();
  }
  function askSay(who, html) {
    var m = $('askMsgs'), d = document.createElement('div'); d.className = who; d.innerHTML = html; m.appendChild(d); m.scrollTop = m.scrollHeight; return d;
  }
  /** RO Log rows of the last 120 days (read again after 3 minutes), with this page's newer open ROs on top. */
  function askRows() {
    if (ASK.rows && Date.now() - ASK.at < 180000) return Promise.resolve(askMerge(ASK.rows));
    return apiCall('listROs', [S.token, { from: addDays(today(), -120) }]).then(function (rows) { ASK.rows = rows || []; ASK.at = Date.now(); return askMerge(ASK.rows); });
  }
  function askMerge(rows) {
    var by = {}; rows.forEach(function (r) { by[r.key] = r; });
    ((S.boot && S.boot.openROs) || []).concat(S.logRows || []).forEach(function (r) { by[r.key] = Object.assign({}, by[r.key] || {}, r); });
    return Object.keys(by).map(function (k) { return by[k]; });
  }
  function askNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function askWords(s) { return String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
  var ASK_WH_SKIP = { feeder: 1, warehouse: 1, wh: 1, fc: 1, the: 1, and: 1, new: 1 };
  /** SKUs named in the question: the whole name (spaces / dots ignored), the item ID, or most of the name's words. */
  function askSkus(q) {
    var nq = askNorm(q), qw = askWords(q), skus = (S.boot.skus || []);
    var hit = skus.filter(function (s) { var n = askNorm(s.sku); return (n.length >= 3 && nq.indexOf(n) >= 0) || nq.indexOf(String(s.item)) >= 0; });
    if (hit.length) { var L0 = Math.max.apply(null, hit.map(function (s) { return askNorm(s.sku).length; })); return hit.filter(function (s) { return askNorm(s.sku).length === L0 || nq.indexOf(String(s.item)) >= 0; }); }
    var best = 0, out = [];
    skus.forEach(function (s) {
      var w = askWords(s.sku).filter(function (x) { return x.length >= 3; }); if (!w.length) return;
      var sc = w.filter(function (x) { return qw.indexOf(x) >= 0; }).length / w.length;
      if (sc > best) { best = sc; out = [s]; } else if (sc === best && sc > 0) out.push(s);
    });
    return best >= 0.5 ? out.slice(0, 5) : [];
  }
  /** Warehouses named in the question (any word of the name but "Feeder", "Warehouse"…). */
  function askWhs(q, rows) {
    var qw = askWords(q), names = {}, best = 0, out = [];
    rows.forEach(function (r) { names[r.wh] = 1; });
    ((S.dash && S.dash.rows) || []).forEach(function (r) { names[r[0]] = 1; });
    Object.keys(names).forEach(function (w) {
      var sc = askWords(w).filter(function (x) { return !ASK_WH_SKIP[x] && x.length >= 2 && qw.indexOf(x) >= 0; }).length;
      if (sc > best) { best = sc; out = [w]; } else if (sc === best && sc > 0) out.push(w);
    });
    return out;
  }
  function askRoLine(r) {
    var bits = [prettyDate(r.roDate) ? 'RO ' + prettyDate(r.roDate) : '', r.roNo ? '#' + esc(r.roNo) : 'no RO number yet', '<b>' + esc(stLabel(r.status, r.shippedOn)) + '</b>', 'ordered ' + fmt(r.qty)];
    if (r.shippedQty != null && r.shippedOn) bits.push('shipped ' + fmt(r.shippedQty) + ' on ' + prettyDate(r.shippedOn));
    if (r.status === 'Delivered' && r.deliveredOn) bits.push('delivered ' + prettyDate(r.deliveredOn));
    else if (r.status === 'Created' || r.status === 'Planned') { var d = dispatchOf(r); if (d && !r.shippedOn) bits.push('dispatch ' + prettyDate(d)); bits.push(r.appt ? 'appointment ' + prettyDate(r.appt) : 'no appointment yet'); }
    if (r.status === 'Cancelled') bits.push('cancelled' + (r.updatedBy ? ' by ' + esc(r.updatedBy) : '') + (r.updatedAt ? ' on ' + new Date(r.updatedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : ''));
    var s = bits.filter(Boolean).join(' · ');
    if (r.shortQty) s += '<br><span style="color:var(--bad)"><b>' + fmt(r.shortQty) + ' not sent</b></span> — ' + (r.shortNote ? 'Why: <b>' + esc(r.shortNote) + '</b>' : '<span class="muted">no reason noted yet (RO Log → this RO → "Why not sent?")</span>');
    if (r.notes) s += '<br><span class="muted">Note: ' + esc(r.notes) + '</span>';
    return s;
  }
  /** What the last plan says about an item at a warehouse (Dashboard snapshot). */
  function askPlanInfo(wh, item) {
    var d = S.dash; if (!d || !d.rows) return '';
    var r = d.rows.filter(function (x) { return PlanCore.whNorm(x[0]) === PlanCore.whNorm(wh) && Number(x[1]) === Number(item); })[0];
    if (!r) return '';
    var rate = Number(r[5]) || 0, has = Number(r[6]) || 0, rec = Number(r[8]) || 0, locked = r[9] === 'Yes';
    return 'Last plan: stock ' + fmt(has) + ', sells ' + fmt(rate, 1) + '/day' + (rate > 0 ? ' (~' + fmt(Math.max(0, Math.floor(has / rate))) + ' days)' : '') + ', suggested ' + fmt(rec) + (locked ? ' · <b>locked on Blinkit</b> (cannot be sent)' : '') + '.';
  }
  function askQuestion(q) {
    askSay('me', esc(q));
    var wait = askSay('bot', '<span class="spin"></span> Looking in the RO Log…');
    askRows().then(function (rows) { wait.innerHTML = askAnswer(q, rows); $('askMsgs').scrollTop = $('askMsgs').scrollHeight; },
      function (e) { wait.innerHTML = '<span style="color:var(--bad)">Could not read the RO Log: ' + esc(e.message) + '</span>'; });
  }
  function askAnswer(q, rows) {
    var ql = q.toLowerCase(), skus = askSkus(q), whs = askWhs(q, rows);
    var wantShort = /not sent|short|less|missing|why|kam|nahi|didn|did not/.test(ql);
    var inWh = function (r) { return !whs.length || whs.some(function (w) { return PlanCore.whNorm(w) === PlanCore.whNorm(r.wh); }); };
    if (!skus.length) {
      // No SKU: "what is not sent (in Mumbai)?" lists the not-sent lines; otherwise ask for an SKU.
      if (wantShort || /not sent|short/.test(ql)) {
        var sl = rows.filter(function (r) { return r.shortQty > 0 && inWh(r); }).sort(function (a, b) { return String(b.shippedOn).localeCompare(String(a.shippedOn)); });
        if (!sl.length) return 'Nothing short-shipped' + (whs.length ? ' at ' + esc(whs.join(', ')) : '') + ' in the last 120 days: every RO the Shipment Manager has a shipment for was sent in full.';
        return '<b>Not sent in full' + (whs.length ? ' · ' + esc(whs.join(', ')) : '') + '</b> (last 120 days):<ul>' + sl.slice(0, 15).map(function (r) { return '<li><b>' + esc(r.sku || r.item) + '</b> · ' + esc(r.wh) + '<br>' + askRoLine(r) + '</li>'; }).join('') + '</ul>' + (sl.length > 15 ? '…and ' + (sl.length - 15) + ' more.' : '');
      }
      return 'I could not find an SKU in that. Name the SKU (as in the SKU list, or its item ID), e.g. <i>Why was 2 in 1 Belt not sent in Mumbai?</i>';
    }
    var out = [];
    skus.forEach(function (s) {
      var mine = rows.filter(function (r) { return Number(r.item) === Number(s.item) && inWh(r); })
        .sort(function (a, b) { return String(b.roDate).localeCompare(String(a.roDate)); });
      var head = '<b>' + esc(skuText(s.sku, s.item)) + '</b>' + (whs.length ? ' · ' + esc(whs.join(', ')) : ' · all warehouses');
      if (!mine.length) {
        var why = whs.map(function (w) { return askPlanInfo(w, s.item); }).filter(Boolean).join('<br>');
        out.push(head + '<br>No RO for it' + (whs.length ? ' there' : '') + ' in the RO Log (last 120 days), so nothing was sent.' + (why ? '<br>' + why : ''));
        return;
      }
      var short = mine.filter(function (r) { return r.shortQty > 0; }), canc = mine.filter(function (r) { return r.status === 'Cancelled'; });
      var lead = '';
      if (wantShort) {
        if (short.length) lead = '<b style="color:var(--bad)">' + fmt(short.reduce(function (a, r) { return a + r.shortQty; }, 0)) + ' not sent</b> on ' + short.length + ' RO' + (short.length > 1 ? 's' : '') + '.' + (short.some(function (r) { return !r.shortNote; }) ? ' Where no reason is noted, add it in the RO Log.' : '');
        else if (canc.length) lead = 'Not sent because the line was <b>cancelled</b> (see below).';
        else if (mine.some(function (r) { return (r.status === 'Created' || r.status === 'Planned') && !r.shippedOn; })) lead = 'Not sent <b>yet</b>: the RO is still waiting to be shipped (see dispatch / appointment below).';
        else lead = 'Everything on its ROs was sent.';
      }
      var byWh = {};
      mine.forEach(function (r) { (byWh[r.wh] = byWh[r.wh] || []).push(r); });
      var body = Object.keys(byWh).map(function (w) {
        var info = askPlanInfo(w, s.item);
        return (Object.keys(byWh).length > 1 || !whs.length ? '<div style="margin-top:6px"><b>' + esc(w) + '</b></div>' : '') +
          '<ul>' + byWh[w].slice(0, 6).map(function (r) { return '<li>' + askRoLine(r) + '</li>'; }).join('') + '</ul>' + (byWh[w].length > 6 ? '<div class="small muted">…and ' + (byWh[w].length - 6) + ' older ROs.</div>' : '') +
          (info ? '<div class="small muted">' + info + '</div>' : '');
      }).join('');
      out.push(head + (lead ? '<br>' + lead : '') + body);
    });
    return out.join('<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">');
  }

  /* ======================= Upload Blinkit R.O. PDFs ======================= */
  /** PDF text the way the Shipment Manager's extractPdfText_ builds it (text items grouped into lines by y). */
  function extractPdfText(buf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise.then(function (pdf) {
      var raw = '', p = 0;
      var next = function () {
        if (++p > pdf.numPages) return raw;
        return pdf.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (content) {
          var lineMap = {};
          content.items.forEach(function (item) {
            var y = item.transform ? Math.round(item.transform[5] * 10) / 10 : 0;
            (lineMap[y] = lineMap[y] || []).push(item.str);
          });
          Object.keys(lineMap).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) { raw += lineMap[y].join(' ') + '\n'; });
          raw += '\n';
          return next();
        });
      };
      return next();
    });
  }

  function addPdfFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      var e = { name: f.name, state: 'reading' };
      S.pdfs.unshift(e); // newest upload on top
      var rd = new FileReader();
      rd.onload = function () {
        extractPdfText(rd.result).then(function (text) {
          var d = PlanCore.readRoPdf(text, S.boot.warehouses);
          if (!d.ok) { e.state = 'err'; e.msg = d.message; }
          else {
            e.state = 'ready'; e.d = d;
            if (S.pdfs.some(function (x) { return x !== e && x.d && x.d.roNo === d.roNo; })) { e.state = 'err'; e.msg = 'RO ' + d.roNo + ' is already in this list.'; }
          }
          drawPdfs();
        }, function (err) { e.state = 'err'; e.msg = 'Could not read the PDF: ' + (err && err.message || err); drawPdfs(); });
      };
      rd.readAsArrayBuffer(f);
    });
    drawPdfs();
  }

  function pdfMatch(e) { return e.d && e.d.wh ? PlanCore.matchPlannerRo(e.d, S.boot.openROs) : null; }

  function drawPdfs() {
    var box = $('pdfList'); if (!box) return;
    var m = skuMap();
    var ready = S.pdfs.filter(function (e) { return e.state === 'ready'; });
    $('pdfAll').classList.toggle('hidden', ready.length < 2);
    box.innerHTML = S.pdfs.map(function (e, i) {
      if (e.state === 'reading') return '<div class="ro"><div class="h"><span class="spin"></span> Reading ' + esc(e.name) + '…</div></div>';
      if (e.state === 'err') return '<div class="ro"><div class="h"><span class="w">' + esc(e.name) + '</span><button class="btn sm pX" data-i="' + i + '">Remove</button></div><div class="b" style="display:block">' + msgs([e.msg], 'bad') + '</div></div>';
      var d = e.d, mt = pdfMatch(e);
      var noGroup = d.lines.filter(function (l) { return !(m[l.item] && m[l.item].group); });
      var notes = [];
      if (!d.totalOk) notes.push(['bad', 'The items add up to ' + d.sum + ' but the PDF says Total Quantity ' + d.total + '. Check the PDF before saving.']);
      if (!d.wh) notes.push(['warn', 'Warehouse "' + d.whRaw + '" is not one of the sheet\'s warehouses — choose it below.']);
      if (noGroup.length) notes.push(['bad', 'No ' + groupList().join('/') + ' group yet for ' + noGroup.map(function (l) { return skuText((m[l.item] || {}).sku, l.item); }).join(', ') + '. An admin sets it in Settings → SKUs, then save.']);
      if (mt) notes.push(['info', 'This is the planner\'s RO of ' + prettyDate(mt.roDate) + ' for this warehouse: the RO number is added to it, no new RO.' +
        (mt.diffs.length ? ' Quantities change to the PDF\'s: ' + mt.diffs.map(function (x) { return skuText((m[x.item] || {}).sku, x.item) + ' ' + x.from + ' → ' + x.to; }).join(', ') + '.' : '')]);
      else if (d.wh && e.state === 'ready') notes.push(['info', 'Saved as a new RO (Planned) dated ' + prettyDate(d.roDate) + (S.pdfLogOnly ? ' — RO Log only (Log only is ticked).' : ' — into the RO Log and the month tab.')]);
      var done = e.state === 'saved' || e.state === 'skipped';
      // Collapsed by default (click the header to open). A PDF that needs something fixed opens by itself.
      var attention = !done && (!d.wh || noGroup.length > 0 || !d.totalOk);
      var isOpen = e.open !== undefined ? e.open : attention;
      var canSave = d.wh && !noGroup.length && e.state === 'ready';
      return '<div class="ro' + (isOpen ? ' open' : '') + '" data-i="' + i + '"><div class="h"><span class="chev" style="color:var(--muted)">' + (isOpen ? '▾' : '▸') + '</span><span class="w">RO ' + esc(d.roNo) + '</span>' +
        '<span class="small">' + esc(d.whRaw) + '</span><span class="small">RO ' + prettyDate(d.roDate) + (d.expiry ? ' · expires ' + prettyDate(d.expiry) : '') + '</span>' +
        '<span class="small"><b>' + fmt(d.sum) + '</b> units · ' + d.lines.length + ' items ' + (d.totalOk ? '✓' : '⚠') + '</span>' +
        (done ? '<span class="pill ' + (e.state === 'saved' ? 'ok' : 'warn') + '">' + (e.state === 'saved' ? 'Saved' : 'Skipped') + '</span>' :
          (attention ? '<span class="pill warn">' + (!d.wh ? 'choose warehouse' : noGroup.length ? 'SKU without group' : 'check total') + '</span>' : '') +
          '<span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm g pSave" data-i="' + i + '"' + (canSave ? '' : ' disabled') + '>' + (e.state === 'saving' ? '<span class="spin"></span>' : 'Save') + '</button>' +
          '<button class="btn sm pX" data-i="' + i + '">Remove</button></span>') + '</div><div class="b">' +
        (done ? msgs([e.msg], e.state === 'saved' ? 'ok' : 'warn') + msgs(e.warnings, 'warn') :
          '<div class="row"><div><label class="f">Warehouse</label><select class="pWh" data-i="' + i + '"><option value="">Choose…</option>' + (S.boot.warehouses || []).map(function (w) { return '<option' + (d.wh === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select></div></div>' +
          notes.map(function (n) { return '<div class="msg ' + n[0] + '">' + esc(n[1]) + '</div>'; }).join('')) +
        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th><th>Group</th><th class="right">Qty</th></tr>' + d.lines.map(function (l) {
          var x = m[l.item] || {};
          return '<tr><td>' + esc(x.sku || 'No SKU') + '</td><td>' + l.item + '</td><td>' + esc(x.group || '—') + '</td><td class="right">' + fmt(l.qty) + '</td></tr>';
        }).join('') + '</table></div></div></div>';
    }).join('');
  }

  function savePdf(i) {
    var e = S.pdfs[i]; if (!e || e.state !== 'ready' || !e.d.wh) return Promise.resolve();
    var mt = pdfMatch(e);
    e.state = 'saving'; drawPdfs();
    return api('importPdfRO', S.token, { roNo: e.d.roNo, roDate: e.d.roDate, roAt: e.d.roAt, expiry: e.d.expiry, wh: e.d.wh, lines: e.d.lines }, mt ? mt.batches : [], !!S.pdfLogOnly)
      .then(function (r) {
        if (r.skipped) { e.state = 'skipped'; e.msg = r.message; drawPdfs(); return; }
        S.boot.openROs = r.openROs;
        refreshPlanAfterRoChange();
        e.state = 'saved'; e.warnings = r.warnings;
        e.msg = r.matched ? 'RO number added to the planner\'s RO' + (r.changes.length ? '; quantities updated: ' + r.changes.join(', ') : '') + '.'
          : 'Saved: ' + r.batches.map(function (b) { return b.group + ' ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); }).join(', ') + '.';
        drawPdfs();
      }, function (err) { e.state = 'ready'; e.err = err.message; drawPdfs(); toast(err.message, 6000); });
  }

  function renderAdd() {
    var whs = S.boot.warehouses || [];
    var skus = (S.boot.skus || []).filter(function (s) { return s.active; });
    if (!S.manual.length) S.manual = [{ item: '', qty: '' }];
    S.pdfs = S.pdfs || [];
    $('app').innerHTML = '<div class="card"><h2>Upload Blinkit R.O. PDFs</h2>' +
      '<div class="small muted">Read the same way as in the Shipment Manager. Each RO goes into the RO Log and the month tab as <b>Planned</b>. A planner RO without an RO number gets the number instead of a second RO. An RO number already in the log is skipped.</div>' +
      '<label class="drop" style="margin-top:10px"><input type="file" accept="application/pdf,.pdf" multiple id="pdfIn"><b>Choose R.O. PDFs</b><span class="small muted">one or more</span></label>' +
      '<label class="small" style="display:block;margin-top:10px"><input type="checkbox" id="pdfLogOnly"' + (S.pdfLogOnly ? ' checked' : '') + '> <b>Log only</b> — these ROs are already typed into the month tab by hand (don\'t write them there again)</label>' +
      '<div style="margin:10px 0"><button class="btn g hidden" id="pdfAll">Save all</button></div><div id="pdfList"></div></div>' +
      '<details class="card"><summary style="cursor:pointer;font-weight:700">Add an RO by hand instead</summary><div style="margin-top:10px">' +
      '<div class="small muted">It goes into the RO Log and the month tab like the planner\'s ROs. Items of different groups (' + groupList().join(' / ') + ') split into one RO per group automatically.</div>' +
      '<div class="row" style="margin-top:10px">' +
      '<div><label class="f">Warehouse</label><select id="mWh"><option value="">Choose…</option>' + whs.map(function (w) { return '<option>' + esc(w) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f">RO date</label><input type="date" id="mDate" value="' + today() + '"></div>' +
      '<div><label class="f">Status</label><select id="mSt"><option value="Created">Planned (on Blinkit)</option><option value="Planned">Draft (not on Blinkit yet)</option></select></div></div>' +
      '<div class="row" style="margin-top:8px"><div><label class="f">Appointment (optional)</label><input type="date" id="mAp"></div>' +
      '<div><label class="f">Blinkit RO No. (optional)</label><input type="text" id="mNo"></div>' +
      '<div><label class="f">Notes</label><input type="text" id="mNote"></div></div>' +
      '<datalist id="skuList">' + skus.map(function (s) { return '<option value="' + s.item + '">' + esc(skuText(s.sku, s.item) + ' (' + (s.group || 'no group') + ')') + '</option>'; }).join('') + '</datalist>' +
      '<h3 style="margin-top:14px">Items</h3><div id="mLines"></div><button class="btn sm" id="mAdd">+ Add item</button>' +
      '<div id="mOut"></div><div style="margin-top:12px"><button class="btn g" id="mSave">Save RO</button></div></div></details>';
    if (typeof pdfjsLib === 'undefined') $('pdfList').innerHTML = msgs(['The PDF reader did not load (no internet?). Reload the page.'], 'bad');
    $('pdfIn').onchange = function () { addPdfFiles(this.files); this.value = ''; };
    $('pdfLogOnly').onchange = function () { S.pdfLogOnly = this.checked; drawPdfs(); };
    $('pdfAll').onclick = function () {
      var idx = S.pdfs.map(function (e, i) { return e.state === 'ready' && e.d.wh ? i : -1; }).filter(function (i) { return i >= 0; });
      idx.reduce(function (p, i) { return p.then(function () { return savePdf(i); }); }, Promise.resolve());
    };
    $('pdfList').onclick = function (ev) {
      var i = Number(ev.target.getAttribute('data-i'));
      if (ev.target.classList.contains('pSave')) { savePdf(i); return; }
      if (ev.target.classList.contains('pX')) { S.pdfs.splice(i, 1); drawPdfs(); return; }
      // Click on a card's header (not on its buttons): open / close it.
      var h = ev.target.closest('.ro .h'); if (!h || ev.target.closest('button,select,a')) return;
      var card = h.closest('.ro'), e = S.pdfs[Number(card.getAttribute('data-i'))]; if (!e || !e.d) return;
      e.open = !card.classList.contains('open'); drawPdfs();
    };
    $('pdfList').onchange = function (ev) {
      if (!ev.target.classList.contains('pWh')) return;
      var e = S.pdfs[Number(ev.target.getAttribute('data-i'))]; e.d.wh = ev.target.value; drawPdfs();
    };
    drawPdfs();
    var hint = function (item) {
      var s = skuMap()[Number(item)];
      return s ? esc(skuText(s.sku, s.item) + ' · ' + (s.group ? groupName(s.group) : 'no group — set it in Settings')) : (item ? 'Not in the SKU list' : '');
    };
    var draw = function () {
      $('mLines').innerHTML = S.manual.map(function (l, i) {
        return '<div class="row" style="margin-bottom:6px" data-i="' + i + '"><div style="flex:3 1 220px"><input type="text" class="mi" list="skuList" placeholder="Item ID or pick from the list" value="' + esc(l.item) + '">' +
          '<div class="small muted mh">' + hint(l.item) + '</div></div>' +
          '<div style="flex:1 1 90px"><input type="number" class="mq" min="1" placeholder="Qty" value="' + esc(l.qty) + '"></div>' +
          '<div style="flex:0 0 auto"><button class="btn sm r mx">✕</button></div></div>';
      }).join('');
    };
    draw();
    $('mLines').oninput = function (e) {
      var i = Number(e.target.closest('[data-i]').getAttribute('data-i'));
      if (e.target.classList.contains('mi')) S.manual[i].item = e.target.value.trim();
      if (e.target.classList.contains('mq')) S.manual[i].qty = e.target.value;
    };
    $('mLines').onchange = function (e) {
      if (e.target.classList.contains('mi')) e.target.closest('[data-i]').querySelector('.mh').innerHTML = hint(e.target.value.trim());
    };
    $('mLines').onclick = function (e) {
      if (!e.target.classList.contains('mx')) return;
      S.manual.splice(Number(e.target.closest('[data-i]').getAttribute('data-i')), 1);
      if (!S.manual.length) S.manual.push({ item: '', qty: '' }); draw();
    };
    $('mAdd').onclick = function () { S.manual.push({ item: '', qty: '' }); draw(); };
    $('mSave').onclick = function () {
      var m = skuMap(), wh = $('mWh').value;
      var lines = S.manual.filter(function (l) { return Number(l.item) && Number(l.qty) > 0; });
      var err = [];
      if (!wh) err.push('Choose the warehouse.');
      if (!lines.length) err.push('Add at least one item with a quantity.');
      lines.forEach(function (l) { var s = m[Number(l.item)]; if (!s) err.push('Item ' + l.item + ' is not in the SKU list.'); else if (!s.group) err.push('Item ' + l.item + ' has no ' + groupList().join('/') + ' group.'); });
      if (err.length) { $('mOut').innerHTML = msgs(err, 'bad'); return; }
      $('mSave').disabled = true;
      api('createROs', S.token, {
        lines: lines.map(function (l) { var s = m[Number(l.item)]; return { wh: wh, item: Number(l.item), sku: s.sku, name: s.name, group: s.group, qty: Number(l.qty) }; }),
        roDate: $('mDate').value || today(), status: $('mSt').value, source: 'Manual', appt: $('mAp').value, roNo: $('mNo').value.trim(), notes: $('mNote').value
      }).then(function (res) {
        S.boot.openROs = res.openROs; S.manual = [];
        refreshPlanAfterRoChange();
        $('mSave').disabled = false;
        $('mOut').innerHTML = msgs(res.batches.map(function (b) { return 'Saved ' + b.wh + ' ' + b.group + ': ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); }), 'ok') + msgs(res.warnings, 'warn');
        draw();
      }, function (e) { $('mSave').disabled = false; $('mOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Dashboard ======================= */
  function renderDash() {
    $('app').innerHTML = '<div id="dashOut" class="card muted">Loading…</div>';
    S.dashWh = S.dashWh || '';
    var last = S.dash || cacheGet(CACHE_DASH), shown = '';
    if (last) { S.dash = last; shown = JSON.stringify(last); drawDash(); }
    api('getDashboard', S.token).then(function (d) {
      var js = JSON.stringify(d);
      cachePut(CACHE_DASH, d);
      if (S.tab !== 'dash' || !$('dashOut')) { S.dash = d; return; }
      if (js === shown) return; // nothing changed: keep the screen as it is
      if (SQ.n > 0 && S.dash) { d.openROs = S.dash.openROs; d.delivered = S.dash.delivered; } // instant saves still running
      S.dash = d; drawDash();
    }, function (e) { if (!last) $('dashOut').innerHTML = msgs([e.message], 'bad'); else toast('Could not refresh the Dashboard: ' + e.message, 5000); });
  }

  function drawDash() {
    var d = S.dash, box = $('dashOut'); box.className = '';
    if (!d.meta || !d.rows.length) { box.className = 'card muted'; box.innerHTML = 'No data yet. Make a plan once (New Plan → upload the two files) and the dashboard fills from it.'; return; }
    var rows = d.rows.map(function (r) { return { wh: r[0], item: r[1], name: r[2], group: r[3], status: r[4], rate: Number(r[5]) || 0, pos: Number(r[6]) || 0, days: r[7] === '' ? null : Number(r[7]), rec: Number(r[8]) || 0, locked: r[9] === 'Yes',
      // Has = stock (Total sellable); Planned = on ROs not received yet. A snapshot from before the split has only the sum.
      has: r[10] === '' || r[10] === undefined ? null : Number(r[10]), planned: r[11] === '' || r[11] === undefined ? null : Number(r[11]),
      // Planned's two parts (snapshots from before 21 Nov 2026 don't have them).
      plBlinkit: r[12] === '' || r[12] === undefined ? null : Number(r[12]), plLog: r[13] === '' || r[13] === undefined ? null : Number(r[13]),
      dlvPlan: Number(r[14]) || 0 }; });
    rows.forEach(function (r) { if (r.dlvPlan && r.has != null) { r.has += r.dlvPlan; r.delivAdj = r.dlvPlan; } });
    // ROs marked Delivered after this plan was made were still counted in its Planned (Blinkit's file / the RO Log
    // had them on their way). They are now at the warehouse: shown under Has instead, until the next plan.
    var dlv = {};
    (d.delivered || []).forEach(function (x) { if (x.updatedAt && x.updatedAt > d.meta.at) { var k = PlanCore.whNorm(x.wh) + '|' + Number(x.item); dlv[k] = (dlv[k] || 0) + x.qty; } });
    rows.forEach(function (r) {
      var q = dlv[PlanCore.whNorm(r.wh) + '|' + Number(r.item)];
      if (!q || r.planned == null || !(r.planned > 0)) return;
      var a = Math.min(q, r.planned);
      r.planned -= a; r.has = (r.has || 0) + a; r.delivAdj = (r.delivAdj || 0) + a;
      if (r.plBlinkit != null) { var b = Math.min(a, r.plBlinkit); r.plBlinkit -= b; if (r.plLog != null) r.plLog = Math.max(0, r.plLog - (a - b)); }
    });
    // On its way splits into Shipped (dispatch day today or earlier) and Planned (not shipped yet), from the ROs now.
    var shp = shippedBy(d.openROs);
    rows.forEach(function (r) {
      if (r.planned == null || !(r.planned > 0)) { r.shipped = 0; return; }
      r.shipped = Math.min(r.planned, shp[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0); r.planned -= r.shipped;
    });
    var ageDays = Math.floor((Date.now() - d.meta.at) / 864e5);
    // "Days" counts down every day from the stock date of the plan the dashboard was made from.
    var dsi = PlanCore.stockInfo(d.meta.inventoryAt, today()), el = dsi ? dsi.elapsed : 0;
    // Days = what is there (Has: stock + delivered) ÷ Per day − days passed. With what is on its way (Shipped + Planned)
    // it is r.daysAll, shown on hover; Suggested counts all of it, so nothing is ordered twice.
    rows.forEach(function (r) {
      if (r.days != null) r.days = r.days - el;
      r.daysAll = r.days;
      if (r.has != null && r.rate > 0) r.days = r.has / r.rate - el;
    });
    var byWh = {};
    rows.forEach(function (r) {
      var w = byWh[r.wh] = byWh[r.wh] || { red: 0, amber: 0, items: 0, open: 0 };
      if (r.rate > 0) { w.items++; if (r.days < 7) w.red++; else if (r.days < 15) w.amber++; }
    });
    var whByNorm = {};
    Object.keys(byWh).forEach(function (w) { whByNorm[PlanCore.whNorm(w)] = w; });
    d.openROs.forEach(function (r) { var w = whByNorm[PlanCore.whNorm(r.wh)]; if (w) byWh[w].open += r.qty; });
    var whs = Object.keys(byWh).sort();
    // Sortable columns: click a heading for A→Z / lowest first, click again for Z→A / highest first.
    // Default: Per day, highest first (then fewest days). Empty values always go last.
    var COLS = [['wh', 'Warehouse', 't'], ['sku', 'SKU', 't'], ['item', 'Item ID', 'n'], ['group', 'Group', 't'], ['rate', 'Per day', 'n'],
      ['has', 'Has', 'n'], ['shipped', 'Shipped', 'n'], ['planned', 'Planned', 'n'], ['days', 'Days', 'n'], ['rec', 'Suggested', 'n']];
    var SUBS = { rate: 'avg. sale a day', has: 'stock + delivered', shipped: 'on the road', planned: 'RO made, not shipped', days: 'Has ÷ per day', rec: 'to send, all counted' };
    var srt = S.dashSort = S.dashSort || { col: 'rate', dir: -1 };
    var val = function (r, c) {
      if (c === 'sku') return skuOf(r.item) || '';
      if (c === 'has') return r.has == null ? r.pos : r.has;
      return r[c];
    };
    var isText = COLS.filter(function (c) { return c[0] === srt.col; })[0][2] === 't';
    var list = rows.filter(function (r) { return r.rate > 0 && (!S.dashWh || r.wh === S.dashWh); }).sort(function (a, b) {
      var x = val(a, srt.col), y = val(b, srt.col);
      var ex = x == null || x === '', ey = y == null || y === '';
      if (ex || ey) return ex && ey ? 0 : ex ? 1 : -1;
      var c = isText ? String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' }) : x - y;
      return c * srt.dir || b.rate - a.rate || (a.days == null ? 1e9 : a.days) - (b.days == null ? 1e9 : b.days);
    });
    // Search (Ctrl+F): every word must appear in the row's warehouse, SKU, item ID or group.
    // "Planned without RO": the part of Planned that no open RO in the RO Log explains (e.g. ROs made on Blinkit
    // directly, or never uploaded as a PDF). Planned is from the plan; the RO Log is as it is now.
    var openQty = {};
    (d.openROs || []).forEach(function (x) { if (x.status === 'Planned' || x.status === 'Created') { var k = PlanCore.whNorm(x.wh) + '|' + Number(x.item); openQty[k] = (openQty[k] || 0) + (Number(x.qty) || 0); } });
    var noRo = function (r) { var on = (r.planned || 0) + (r.shipped || 0); return on > 0 ? Math.max(0, on - (openQty[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0)) : 0; };
    var noRoCount = list.filter(function (r) { return noRo(r) > 0; }).length;
    var dashMatch = function (r) {
      if (S.dashNoRo && !(noRo(r) > 0)) return false;
      var words = String(S.dashQ || '').toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return true;
      var hay = (r.wh + ' ' + (skuOf(r.item) || '') + ' ' + r.item + ' ' + r.group).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    };
    var rowHtml = function (r) {
        var c = r.days < 7 ? 'bad' : r.days < 15 ? 'warn' : 'ok';
        return '<tr><td>' + esc(r.wh) + '</td><td>' + esc(skuOf(r.item) || 'No SKU') + (r.locked ? ' <span class="pill">locked</span>' : '') + '</td><td>' + r.item + '</td><td>' + esc(r.group) + '</td><td class="right">' + fmt(r.rate, 1) + '</td><td class="right">' + fmt(r.has == null ? r.pos : r.has) + (r.delivAdj ? ' <span class="small muted hv" title="' + fmt(r.delivAdj) + ' units delivered, waiting for Blinkit\'s GRN (not in Blinkit\'s stock yet): counted under Has">(+' + fmt(r.delivAdj) + ' delivered)</span>' : '') + '</td><td class="right">' + (r.shipped ? fmt(r.shipped) : '<span class="muted">–</span>') + '</td><td class="right">' + (r.planned == null ? '–' : r.planned || noRo(r) > 0 ? (noRo(r) > 0 ? '<span class="pill warn" title="Planned with no open RO in the RO Log">' + fmt(noRo(r)) + ' without RO</span> ' : '') + '<a href="#" class="plk plTip" data-wh="' + esc(r.wh) + '" data-it="' + r.item + '" data-n="' + (r.planned || 0) + '">' + fmt(r.planned) + '</a>' : '') + '</td><td class="right"><span class="pill hv ' + c + '" title="Has lasts ' + fmt(d0(r.days), 1) + ' day(s)' + (r.days != null && r.days < 0 ? ' (ran out about ' + fmt(-r.days, 1) + ' day(s) ago)' : '') + (r.daysAll != null && r.daysAll !== r.days ? '; counting what is on its way (Shipped + Planned): ' + fmt(d0(r.daysAll), 1) : '') + '">' + fmt(d0(r.days), 1) + '</span></td><td class="right">' + (r.rec ? fmt(r.rec) : '') + '</td></tr>';
    };
    var dashRows = function () { var m = list.filter(dashMatch); return m.length ? m.slice(0, 300).map(rowHtml).join('') : '<tr><td colspan="10" class="muted">No item matches the search.</td></tr>'; };
    var dashCountText = function () { var n = list.filter(dashMatch).length; return (S.dashQ || S.dashNoRo ? n + ' of ' + list.length + ' items match' + (S.dashNoRo ? ' (Planned without RO)' : '') : list.length + ' items') + (n > 300 ? ' · first 300 shown' : ''); };
    var sortHint = COLS.filter(function (c) { return c[0] === srt.col; })[0][1] + ', ' + (isText ? (srt.dir > 0 ? 'A → Z' : 'Z → A') : (srt.dir > 0 ? 'lowest first' : 'highest first'));
    box.innerHTML = '<div class="card"><h2>Days of cover</h2><div class="small muted">From the plan made ' + new Date(d.meta.at).toLocaleString('en-IN') + ' by ' + esc(d.meta.by) +
      (d.meta.inventoryAt ? ' · Blinkit inventory of ' + esc(d.meta.inventoryAt) : '') + (dsi ? ' · stock as of ' + prettyDate(dsi.stockDate) + ', so Days count from today (' + el + ' day' + (el === 1 ? '' : 's') + ' of sales taken off)' : '') + '. ROs created since then are not counted here.</div>' +
      (ageDays >= 2 ? '<div class="msg warn">This is ' + ageDays + ' days old — upload fresh files in New Plan.</div>' : '') +
      '<div class="stats" style="margin-top:10px">' + whs.map(function (w) {
        var x = byWh[w];
        return '<div class="stat" style="cursor:pointer;' + (S.dashWh === w ? 'outline:2px solid var(--brand)' : '') + '" data-wh="' + esc(w) + '"><div class="k">' + esc(w) + '</div>' +
          '<div><span class="pill bad">' + x.red + ' under 7d</span> <span class="pill warn">' + x.amber + ' 7–15d</span></div>' +
          '<div class="small muted" style="margin-top:4px">' + (x.open ? fmt(x.open) + ' units in open ROs' : 'no open ROs') + '</div></div>';
      }).join('') + '</div></div>' +
      '<details class="card" id="dCal"' + (S.dashCalOpen ? ' open' : '') + '><summary style="cursor:pointer;font-weight:700">📅 Calendar <span class="small muted" style="font-weight:400">— dispatch plan, last 7 days + next 30: 🚚 load per day, 📦 packing, 📍 arrivals, ⚠ warnings' + (S.dashWh ? ' · ' + esc(S.dashWh) : '') + '</span></summary><div id="dCalBody"></div></details>' +
      '<div class="card"><div class="row" style="align-items:center;margin-bottom:8px"><h3 style="flex:1 1 300px;margin:0">' + (S.dashWh ? esc(S.dashWh) + ' — ' : '') + 'Items <span class="small muted">(sorted by ' + esc(sortHint) + ' — click a heading to sort' + (S.dashWh ? ' · <a href="#" id="dAll">show all</a>' : '') + ')</span></h3>' +
        '<div style="flex:0 0 auto"><label class="chip' + (S.dashNoRo ? ' on' : '') + '" title="Items whose Planned (on its way) has no open RO in the RO Log"><input type="checkbox" id="dNoRo"' + (S.dashNoRo ? ' checked' : '') + ' style="display:none">Planned without RO <b>' + noRoCount + '</b></label></div>' +
        '<div style="flex:0 1 280px"><input type="search" id="dQ" placeholder="🔍 Search (Ctrl+F)" title="SKU, item ID, warehouse or group — several words narrow it down" value="' + esc(S.dashQ || '') + '" autocomplete="off"></div></div><div class="scroll"><table class="t" id="dTab"><tr>' +
        COLS.map(function (c) {

    box.querySelector('.stats').onclick = function (e) { var s = e.target.closest('.stat'); if (!s) return; var w = s.getAttribute('data-wh'); S.dashWh = S.dashWh === w ? '' : w; drawDash(); };

    $('dQ').onkeydown = function (e) { if (e.key === 'Escape') { this.value = ''; this.oninput(); } };
    $('dTab').querySelector('tr').onclick = function (e) {

    initDashCal(d, rows, el);

      var wh = a.getAttribute('data-wh'), it = Number(a.getAttribute('data-it'));

    if ($('dAll')) $('dAll').onclick = function (e) { e.preventDefault(); S.dashWh = ''; drawDash(); };
  }

  /**
   * Dashboard: what makes up an item's "Planned" (stock on its way to the warehouse) at the time of the plan:
   * Blinkit's own Incoming (ROs already on Blinkit, from the Bulk RO file) + RO Log lines Blinkit could not show
   * yet (Planned, or Created after the Bulk RO file was downloaded). Below: that item's open ROs in the RO Log now.
   */
  function showPlanned(d, r) {
    if (!r) return;
    var bulkAt = d.meta && d.meta.bulkAt;
    var ros = (d.openROs || []).filter(function (x) { return PlanCore.whNorm(x.wh) === PlanCore.whNorm(r.wh) && Number(x.item) === Number(r.item); })
      .sort(function (a, b) { return String(b.roDate).localeCompare(String(a.roDate)); });
    var counted = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Planned' || (x.status === 'Created' && (!bulkAt || !at || at > bulkAt)); };
    // RO Log part beyond the lines counted by time = recent ROs Blinkit's Incoming did not show yet (safety rule).
    var byTime = ros.reduce(function (a, x) { return a + (counted(x) ? x.qty : 0); }, 0);
    var gapLeft = r.plLog != null ? Math.max(0, r.plLog - byTime) : 0;
    var isRecent = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Created' && bulkAt && at && at <= bulkAt && (at >= bulkAt - 3 * 864e5 || (!x.appt && at >= bulkAt - 30 * 864e5)); };
    var split = r.plBlinkit != null && r.plLog != null;
    var html = '<h2>Planned ' + fmt(r.planned) + ' — ' + esc(skuText(skuOf(r.item), r.item)) + '</h2><div class="small muted">' + esc(r.wh) +
      ' · stock on its way to the warehouse, at the time of the plan (' + new Date(d.meta.at).toLocaleString('en-IN') + ')</div>' +
      (split ? '<table class="t" style="margin-top:10px"><tr><td>Incoming in <b>Blinkit\'s Bulk RO file</b> (ROs already on Blinkit)</td><td class="right"><b>' + fmt(r.plBlinkit) + '</b></td></tr>' +
        '<tr><td>From the <b>RO Log</b>, not in Blinkit\'s file yet (Planned, or created after the file was downloaded)</td><td class="right"><b>' + fmt(r.plLog) + '</b></td></tr>' +
        '<tr><th>Planned</th><th class="right">' + fmt(r.planned) + '</th></tr></table>'
        : '<div class="msg info">The split into Blinkit\'s Incoming and RO Log lines shows from the next plan on (New Plan saves it).</div>') +
      '<h3 style="margin-top:12px">Open ROs for this item here (RO Log, now)</h3>' +
      (ros.length ? '<div class="scroll"><table class="t"><tr><th>RO date</th><th>RO No.</th><th>Status</th><th class="right">Qty</th><th>Appointment</th><th>In the RO Log part?</th></tr>' +
        ros.map(function (x) {
          return '<tr><td>' + prettyDate(x.roDate) + '</td><td>' + esc(x.roNo || '—') + '</td><td>' + roStatusPill(x.status, x.appt, x.shippedOn) + '</td><td class="right">' + fmt(x.qty) + '</td><td>' + apptCell(x) + '</td>' +
            '<td class="small">' + (counted(x) ? 'Yes' : gapLeft > 0 && isRecent(x) ? 'Yes — Blinkit\'s Incoming did not show it yet' : 'No — Blinkit\'s file already shows it') + '</td></tr>';
        }).join('') + '</table></div>'
        : '<div class="small muted">No open ROs for this item at this warehouse in the RO Log. ' + (split && r.plBlinkit ? 'The ' + fmt(r.plBlinkit) + ' are ROs on Blinkit that are not in the RO Log (e.g. made on Blinkit directly).' : '') + '</div>') +
      '<div class="small muted" style="margin-top:8px">ROs created or changed since the plan are listed here but not in the numbers above.</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn p" id="plOk">Close</button></div>';

    $('modalBox').style.maxWidth = '820px'; // wider: RO table with appointment boxes
    $('plOk').onclick = closeModal;
    // Appointment straight from here: saved like "Save RO" in the RO Log (RO Log + the RO heading in the month tab),

    $('modalBox').onclick = function (e) {
      var b = e.target.closest('.apSave'); if (!b) return;
      var x = ros[Number(b.getAttribute('data-i'))], val = $('modalBox').querySelector('.apIn[data-i="' + b.getAttribute('data-i') + '"]').value;

  /**
   * Dashboard calendar — 38 days from 7 days ago, as a dispatch plan (Settings → Dispatch):
   *  🚚 load bar = units dispatched that day vs the daily capacity (red when over); 📦 packing days before a dispatch;
   *  📍 arrivals (appointment, or dispatch + shipping days); ⚠ items that run out before
   *  their next possible arrival; ⏳ ROs that expire without an appointment. Above the days: the warnings.
   *  Click a day for its details; a dispatch without an appointment can be moved to another day there.
   * Follows the warehouse picked on the dashboard.
   */
  function initDashCal(d, rows, el) {
    var det = $('dCal'); if (!det) return;
    var DAYS = 38, start = addDays(today(), -7), todayS = today(), c = dConf();
    var inWh = function (w) { return !S.dashWh || PlanCore.whNorm(w) === PlanCore.whNorm(S.dashWh); };
    var short = function (w) { return String(w).replace(/ - Feeder( Warehouse)?| Feeder$/, ''); };
    var dlab = function (k) { return new Date(k + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };
    var expiryOf = function (x) { var m = String(x.notes || '').match(/R\.O\. expiry (\d{1,2} [A-Za-z]{3} \d{4})/); if (!m) return ''; var t = new Date(m[1] + ' 12:00'); return isNaN(t) ? '' : t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); };
    var build = function () {
      var days = {}, warn = { gap: [], waiting: [], expiring: [], unsched: [] };
      var day = function (k) { return days[k] = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], dlv: [], load: 0 }; };
      // ✅ ROs marked Delivered: on their delivery day.
      roGroups(d.delivered || []).filter(function (x) { return inWh(x.wh) && x.lines[0] && x.lines[0].deliveredOn; }).forEach(function (x) { day(x.lines[0].deliveredOn).dlv.push(x); });
      var groups = roGroups(d.openROs).filter(function (x) { return inWh(x.wh); });
      groups.forEach(function (x) {
        var dd = dispatchOf(x), ar = arrivalOf(x), ex = expiryOf(x);
        if (x.roDate) day(x.roDate).ros.push(x);
        if (dd) {
          day(dd).disp.push(x); day(dd).load += x.units;
          var p = dd; for (var i = 0; i < c.pack; i++) { p = prevWorkDay(addDays(p, -1)); day(p).pack.push(x); }
        } else if (x.status === 'Created' || x.status === 'Planned') warn.unsched.push(x);
        if (ar) day(ar).arr.push(x);
        if (!x.appt && x.status === 'Created' && x.roDate && x.roDate <= addDays(todayS, -3)) warn.waiting.push(x);
        if (!x.appt && ex) { day(ex).exp.push(x); if (ex >= todayS && ex <= addDays(todayS, 5)) warn.expiring.push(x); }
      });
      // ⚠ An item that runs out before its next possible arrival (an open RO's arrival, or a new RO dispatched
      // after packing): shown on the day it runs out, with the days it would be out of stock.
      var arrOf = {};
      roGroups(d.openROs).forEach(function (x) { var ar = arrivalOf(x); if (!ar || ar < todayS) return; x.lines.forEach(function (l) { var k = PlanCore.whNorm(x.wh) + '|' + l.item; if (!arrOf[k] || ar < arrOf[k]) arrOf[k] = ar; }); });
      rows.forEach(function (r) {
        if (!(r.rate > 0) || r.days == null || !inWh(r.wh)) return;
        var out = addDays(todayS, Math.max(0, Math.floor(r.days)));
        var next = arrOf[PlanCore.whNorm(r.wh) + '|' + r.item] || addDays(nextWorkDay(addDays(todayS, c.pack)), transitOf(r.wh));
        if (out < next) {
          var gap = Math.round((new Date(next + 'T12:00:00') - new Date(out + 'T12:00:00')) / 864e5);
          var w = { r: r, out: out, next: next, gap: gap }; day(out).out.push(w); warn.gap.push(w);
        }
      });
      return { days: days, warn: warn };
    };
    var roLine = function (x, extra) {
      return '<li>' + esc(short(x.wh)) + ' · ' + esc(x.groups.join(' + ')) + ' · <b>' + fmt(x.units) + '</b> units' + (x.roNo ? ' · #' + esc(x.roNo) : '') + ' ' + roStatusPill(x.status, x.appt, x.shippedOn) + (extra || '') + '</li>';
    };
    var draw = function () {
      var B = build(), days = B.days, W = B.warn;
      var first = new Date(start + 'T12:00:00'), lead = (first.getDay() + 6) % 7; // weeks start on Monday
      var cells = '';
      for (var i = 0; i < lead; i++) cells += '<div class="cd empty"></div>';
      for (var j = 0; j < DAYS; j++) {
        var k = addDays(start, j), x = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], dlv: [], load: 0 };
        var dd = new Date(k + 'T12:00:00'), off = !isWorkDay(k), over = x.load > c.cap;
        cells += '<div class="cd' + (k < todayS ? ' past' : '') + (k === todayS ? ' today' : '') + (off ? ' off' : '') + (S.dashCalDay === k ? ' sel' : '') + '" data-d="' + k + '">' +

      '<div><label class="f">Company</label><input type="text" id="sCo" value="' + esc(s.company) + '"></div></div>' +
      '<div id="sOut"></div><div style="margin-top:10px"><button class="btn p" id="sSave">Save settings</button></div></div>' +
      '<div class="card"><h2>Dispatch</h2><div class="small muted">Used by the Dashboard calendar (load per day, packing, arrivals, warnings) and to give new ROs their dispatch days. An RO with an appointment is dispatched on appointment − shipping days (shipping days = lead days − packing days).</div>' +
        '<div class="row" style="margin-top:8px"><div><label class="f">Units a day (capacity)</label><input type="number" id="dpCap" min="1" value="' + esc(s.dispatchCap || 2800) + '"></div>' +
        '<div><label class="f">Packing days</label><input type="number" id="dpPack" min="0" max="10" value="' + esc(s.packDays == null ? 2 : s.packDays) + '"></div>' +
        '<div><label class="f">Lead days (incl. packing)</label><input type="number" id="dpLead" min="1" max="60" value="' + esc(s.leadDays || 15) + '"></div>' +
        '<div><label class="f">Short lead days</label><input type="number" id="dpShort" min="1" max="60" value="' + esc(s.shortLeadDays || 4) + '"></div></div>' +
        '<div class="row" style="margin-top:8px"><div style="flex:2 1 300px"><label class="f">Warehouses with the short lead days (comma separated)</label><input type="text" id="dpShortWh" value="' + esc(s.shortLeadWh || '') + '"></div>' +
        '<div style="flex:2 1 300px"><label class="f">Dispatch days</label><div class="chips">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (w) { return '<label class="chip"><input type="checkbox" class="dpDay" value="' + w + '"' + (String(s.dispatchDays || 'Mon,Tue,Wed,Thu,Fri,Sat').indexOf(w) >= 0 ? ' checked' : '') + '> ' + w + '</label>'; }).join('') + '</div></div></div>' +
        '<div id="dpOut"></div><div style="margin-top:10px"><button class="btn p" id="dpSave">Save dispatch settings</button></div></div>' +
      '<div class="card"><h2>Travalate Inventory (TI)</h2><div class="small muted">Gives New Plan its <b>TI</b> column: your current stock per SKU, read from the Travalate Inventory app (the same connection the Shipment Manager uses). ' +
        'The shared secret is the Inventory app\'s <code>SHARED_SECRET</code>; it is kept only in this script\'s settings, never on GitHub.</div>' +
        '<div class="row" style="margin-top:8px"><div style="flex:3 1 300px"><label class="f">Inventory web-app link (/exec)</label><input type="text" id="tiUrl" placeholder="Loading…"></div>' +
        '<div><label class="f">Shared secret</label><input type="password" id="tiSec" autocomplete="off" placeholder="…"></div>' +
        '<div style="flex:0 0 auto"><button class="btn p" id="tiSave">Save &amp; test</button></div></div><div id="tiOut"></div></div>' +
      '<div class="card"><h2>Shipment Manager</h2><div class="small muted">When an RO is marked <b>Delivered</b>, the planner takes the quantities <b>actually shipped</b> from the Shipment Manager (tab BLINKIT_PO, by RO number and item) and counts them as <b>Delivered</b> until Blinkit\'s stock shows them (GRN). ' +
        'Paste the Shipment Manager\'s Google Sheet link; the Google account the planner runs as must be able to open it.</div>' +
        '<div class="row" style="margin-top:8px"><div style="flex:3 1 300px"><label class="f">Shipment Manager sheet link</label><input type="text" id="shUrl" placeholder="Loading…"></div>' +
        '<div style="flex:0 0 auto"><button class="btn p" id="shSave">Save &amp; test</button></div><div style="flex:0 0 auto"><button class="btn" id="shSync" title="Take shipment dates and shipped quantities now">Sync now</button></div></div>' +
        '<div class="small muted" style="margin-top:6px">Every 30 minutes (when the planner is opened, or by a time-driven trigger on <code>syncFromShipmentManager</code>), each RO with a shipment in the Shipment Manager gets the shipment <b>date as its dispatch day</b> and the <b>shipped quantities</b> (an item not shipped is cancelled; the month tab follows). It is checked again for 2 days after the shipment is first found.</div><div id="shOut"></div></div>' +
      '<div class="card"><h2>Month tabs</h2><div class="small muted">Newest month tabs: ' + esc((S.boot.months || []).join(', ')) + '.<br>' +
      '<b>Start new month</b> creates the tab (copy of the newest month, columns D–H emptied, columns I onwards kept as they are) if it does not exist yet, then copies in open ROs from the last ' + s.carryDays + ' days of the old month. ' +
      'If you create the tab yourself, this only does the copying-in.</div>' +
      '<div class="row" style="margin-top:10px"><div><label class="f">Month</label><input type="month" id="sMonth" value="' + nextMonth + '"></div>' +
      '<div style="flex:0 0 auto"><button class="btn p" id="sStartM">Start new month</button></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="sSync">Sync month tabs</button></div></div><div id="mOut2"></div></div>' +
      '<div class="card"><h2>SKUs</h2><div class="small muted">Group decides the ' + esc(groupList().join(' / ')) + ' block an item goes into. New items from Blinkit are added here automatically with no group.</div>' +
      '<div class="row" style="margin:8px 0"><div style="flex:0 0 auto"><button class="btn" id="kFromTab">Take groups &amp; tiers from the month tab</button></div><div class="small muted" style="align-self:center">Reads each item\'s block (group) and tier from the newest month tab, and lists SKUs that are in two groups of the same warehouse. Shows the changes before saving.</div></div><div id="kTabOut"></div>' +
      '<div class="row" style="margin:8px 0"><div><input type="text" id="kQ" placeholder="Search"></div><div style="flex:0 0 auto"><label class="small"><input type="checkbox" id="kNo"> only items with no group</label></div></div>' +
      '<div class="scroll"><table class="t" id="kTab"></table></div><div id="kOut"></div><div style="margin-top:10px"><button class="btn p" id="kSave">Save SKU changes</button></div></div>';
    api('getTiLink', S.token).then(function (t) {
      $('tiUrl').value = t.url; $('tiSec').placeholder = t.hasSecret ? 'saved — leave empty to keep it' : 'not set yet';
    }, function (e) { $('tiOut').innerHTML = msgs([e.message], 'bad'); });
    api('getShipLink', S.token).then(function (t) { $('shUrl').value = t.url; $('shUrl').placeholder = 'https://docs.google.com/spreadsheets/d/…'; }, function (e) { $('shOut').innerHTML = msgs([e.message], 'bad'); });
    $('shSync').onclick = function () {
      busy(true, 'Syncing with the Shipment Manager…');
      api('syncShipments', S.token, true).then(function (r) {
        busy(false); applyShipSync(r);
        $('shOut').innerHTML = msgs([r.skipped ? r.skipped : 'Synced: ' + (r.ros || 0) + ' RO(s) found in the Shipment Manager; ' + (r.dates || 0) + ' dispatch day(s), ' + (r.qty || 0) + ' quantity(ies) updated' + (r.short ? ', ' + r.short + ' line(s) shipped short (red in the month tab)' : '') + '.'], r.skipped ? 'warn' : 'ok') + msgs(r.warnings, 'warn');
      }, function (e) { busy(false); $('shOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('shSave').onclick = function () {
      var b = this; b.disabled = true;
      api('saveShipLink', S.token, $('shUrl').value.trim()).then(function (r) {
        b.disabled = false; $('shOut').innerHTML = msgs(['Connected: ' + r.pos + ' PO lines in BLINKIT_PO.' + (r.filled ? ' Shipped quantities filled in for ' + r.filled + ' recently delivered RO line(s).' : '')], 'ok');
      }, function (e) { b.disabled = false; $('shOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('tiSave').onclick = function () {
      var b = this; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      api('saveTiLink', S.token, $('tiUrl').value.trim(), $('tiSec').value).then(function (r) {
        b.disabled = false; b.textContent = 'Save & test'; $('tiSec').value = ''; $('tiSec').placeholder = 'saved — leave empty to keep it';
        S.ti = null; $('tiOut').innerHTML = msgs(['Connected: ' + r.skus + ' SKUs in Travalate Inventory (' + r.monthLabel + ').'], 'ok');
      }, function (e) { b.disabled = false; b.textContent = 'Save & test'; $('tiOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('dpSave').onclick = function () {
      var days = Array.prototype.filter.call(document.querySelectorAll('.dpDay'), function (x) { return x.checked; }).map(function (x) { return x.value; });
      if (!days.length) { $('dpOut').innerHTML = msgs(['Tick at least one dispatch day.'], 'bad'); return; }
      api('saveSettings', S.token, { dispatchCap: Number($('dpCap').value), packDays: Number($('dpPack').value), leadDays: Number($('dpLead').value),
        shortLeadDays: Number($('dpShort').value), shortLeadWh: $('dpShortWh').value.trim(), dispatchDays: days.join(',') })
        .then(function (st) { S.boot.settings = st; $('dpOut').innerHTML = msgs(['Saved.'], 'ok'); }, function (e) { $('dpOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('sSave').onclick = function () {
      api('saveSettings', S.token, { coverDays: Number($('sCover').value), minLine: Number($('sMin').value), roundTo: Number($('sRound').value),
        carryDays: Number($('sCarry').value), address: $('sAddr').value.trim(), starters: $('sStart').value === '1', company: $('sCo').value.trim() })
        .then(function (st) { S.boot.settings = st; S.starters = st.starters; S.cover = null; $('sOut').innerHTML = msgs(['Saved.'], 'ok'); }, function (e) { $('sOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('sStartM').onclick = function () {
      var b = this; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      api('startMonth', S.token, $('sMonth').value).then(function (r) {
        b.disabled = false; b.textContent = 'Start new month';
        $('mOut2').innerHTML = msgs([(r.created ? 'Created tab ' : 'Tab ') + r.tab + '. Copied in ' + r.carried + ' open RO line(s) from the old month, wrote ' + r.written + ' line(s) of this month.'], 'ok') + msgs(r.warnings, 'warn');
        refreshBoot();
      }, function (e) { b.disabled = false; b.textContent = 'Start new month'; $('mOut2').innerHTML = msgs([e.message], 'bad'); });
    };
    $('sSync').onclick = function () {
      api('syncMonthTabs', S.token).then(function (r) { $('mOut2').innerHTML = msgs([(r.ros ? 'Wrote ' + r.ros + ' RO(s) into their month tab.' : 'Everything is already in its month tab.') + (r.headings ? ' Updated ' + r.headings + ' RO heading(s).' : '')], 'ok') + msgs(r.warnings, 'warn'); }, function (e) { $('mOut2').innerHTML = msgs([e.message], 'bad'); });
    };
    var edits = {};
    var draw = function () {
      var q = $('kQ').value.toLowerCase(), only = $('kNo').checked;
      var list = (S.boot.skus || []).filter(function (s) { return (!only || !s.group) && (!q || (s.item + ' ' + s.sku + ' ' + s.name).toLowerCase().indexOf(q) >= 0); });
      $('kTab').innerHTML = '<tr><th>Item ID</th><th>SKU</th><th>Group</th><th>Tier</th><th title="Name of this SKU in Travalate Inventory, only if it is different">TI SKU</th><th>Active</th></tr>' + list.map(function (s) {
        var e = edits[s.item] || s;
        return '<tr data-i="' + s.item + '"><td>' + s.item + '</td><td><input type="text" data-f="sku" value="' + esc(e.sku) + '" style="min-width:110px">' +
          (!s.sku && s.name ? '<div class="small muted">New on Blinkit — give it a SKU: ' + esc(s.name.replace(/^Travalate /, '')) + '</div>' : '') + '</td>' +
          '<td><select data-f="group"><option value="">—</option>' + groupList().map(function (g) { return '<option' + (e.group === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></td>' +
          '<td><input type="text" data-f="tier" value="' + esc(e.tier) + '" style="width:70px"></td>' +
          '<td><input type="text" data-f="tiSku" value="' + esc(e.tiSku || '') + '" placeholder="' + esc(e.sku || '') + '" style="min-width:110px"></td>' +
          '<td><input type="checkbox" data-f="active"' + (e.active ? ' checked' : '') + '></td></tr>';
      }).join('');
    };
    draw();
    $('kQ').oninput = draw; $('kNo').onchange = draw;
    $('kTab').onchange = function (e) {
      var tr = e.target.closest('tr[data-i]'); if (!tr) return;
      var id = Number(tr.getAttribute('data-i'));
      var base = edits[id] || Object.assign({}, (S.boot.skus || []).filter(function (s) { return s.item === id; })[0]);
      var f = e.target.getAttribute('data-f');
      base[f] = f === 'active' ? e.target.checked : e.target.value;
      edits[id] = base;
    };
    var afterSkus = function (skus) {
      S.boot.skus = skus; edits = {}; draw();
      if (S.plan) recompute(true); // new groups/tiers, and SKUs set inactive drop out of the plan
    };
    var clashHtml = function (r) {
      if (!r.clashes || !r.clashes.length) return msgs(['No SKU is listed in two groups of the same warehouse in ' + r.tab + '.'], 'ok');
      return '<div class="msg warn"><b>' + r.clashes.length + ' SKU(s) are listed in two groups of the same warehouse in ' + esc(r.tab) + '.</b> Remove the extra row in the sheet, or the RO quantity can land in the wrong block.</div>' +
        '<div class="scroll"><table class="t"><tr><th>Warehouse</th><th>SKU · Item ID</th><th>Listed in</th></tr>' +
        r.clashes.map(function (c) { return '<tr><td>' + esc(c.wh) + '</td><td>' + esc(skuText(c.sku, c.item)) + '</td><td><b>' + esc(c.groups) + '</b></td></tr>'; }).join('') + '</table></div>';
    };
    var chg = function (a, b) { return a === b ? esc(b || '—') : '<span class="muted">' + esc(a || '—') + ' →</span> <b>' + esc(b || '—') + '</b>'; };
    $('kFromTab').onclick = function () {
      var b = this; b.disabled = true;
      api('groupsFromMonthTab', S.token, false).then(function (r) {
        b.disabled = false;
        if (!r.tab) { $('kTabOut').innerHTML = msgs(['No month tab with items found.'], 'warn'); return; }
        var html = '';
        if (!r.changes.length) html += msgs(['Every SKU already has the same group and tier as in ' + r.tab + '.'], 'ok');
        else {
          html += '<div class="msg info">' + r.changes.length + ' SKU(s) have a different group or tier in <b>' + esc(r.tab) + '</b>:</div>' +
            '<div class="scroll"><table class="t"><tr><th>SKU · Item ID</th><th>Group</th><th>Tier</th><th>In the tab</th></tr>' +
            r.changes.map(function (c) { return '<tr><td>' + esc(skuText(c.sku, c.item)) + '</td><td>' + chg(c.from, c.to) + '</td><td>' + chg(c.fromTier, c.toTier) + '</td><td class="small muted">' + esc(c.where) + '</td></tr>'; }).join('') +
            '</table></div><div style="margin:8px 0"><button class="btn p" id="kFromTabOk">Save these ' + r.changes.length + ' change(s)</button></div>';
        }
        $('kTabOut').innerHTML = html + clashHtml(r);
        if (!r.changes.length) return;
        $('kFromTabOk').onclick = function () {
          this.disabled = true;
          api('groupsFromMonthTab', S.token, true).then(function (r2) {
            afterSkus(r2.skus); $('kTabOut').innerHTML = msgs(['Saved ' + r2.changes.length + ' group / tier change(s) from ' + r2.tab + '.'], 'ok') + clashHtml(r2);
          }, function (e) { $('kTabOut').innerHTML = msgs([e.message], 'bad'); });
        };
      }, function (e) { b.disabled = false; $('kTabOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('kSave').onclick = function () {
      var rows = Object.keys(edits).map(function (k) { return edits[k]; });
      if (!rows.length) { $('kOut').innerHTML = msgs(['No changes.'], 'info'); return; }
      api('saveSkus', S.token, rows).then(function (skus) {
        afterSkus(skus); $('kOut').innerHTML = msgs(['Saved ' + rows.length + ' SKU(s).'], 'ok');
      }, function (e) { $('kOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Users (admin) ======================= */
  function renderUsers() {
    $('app').innerHTML = '<div class="card"><h2>Users</h2><div class="small muted">Admin: everything. Planner: plans, creates and edits ROs. Viewer: dashboard and RO Log only.</div><div class="scroll"><table class="t" id="uTab"><tr><td class="muted">Loading…</td></tr></table></div><div id="uOut"></div></div>' +
      '<div class="card"><h2>Add a user</h2><div class="row"><div><label class="f">User ID</label><input type="text" id="nId"></div><div><label class="f">Name</label><input type="text" id="nName"></div>' +
      '<div><label class="f">Role</label><select id="nRole"><option>Planner</option><option>Viewer</option><option>Admin</option></select></div><div><label class="f">PIN (4–8 digits)</label><input type="text" id="nPin" inputmode="numeric"></div>' +
      '<div style="flex:0 0 auto"><button class="btn p" id="nAdd">Add</button></div></div><div id="nOut"></div></div>';
    var load_ = function () {
      api('listUsers', S.token).then(function (us) {
        $('uTab').innerHTML = '<tr><th>User ID</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>' + us.map(function (u) {
          return '<tr data-u="' + esc(u.id) + '"><td>' + esc(u.id) + '</td><td><input type="text" class="uN" value="' + esc(u.name) + '"></td><td><select class="uR">' + ['Admin', 'Planner', 'Viewer'].map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select></td>' +
            '<td><input type="checkbox" class="uA"' + (u.active ? ' checked' : '') + '></td><td class="nowrap"><button class="btn sm uS">Save</button> <button class="btn sm uP">New PIN</button></td></tr>';
        }).join('');
      }, function (e) { $('uOut').innerHTML = msgs([e.message], 'bad'); });
    };
    load_();
    $('uTab').onclick = function (e) {
      var tr = e.target.closest('tr[data-u]'); if (!tr) return;
      var id = tr.getAttribute('data-u');
      if (e.target.classList.contains('uS')) api('saveUser', S.token, { id: id, name: tr.querySelector('.uN').value, role: tr.querySelector('.uR').value, active: tr.querySelector('.uA').checked }).then(function () { toast('Saved'); load_(); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); });
      if (e.target.classList.contains('uP')) { var p = prompt('New PIN for ' + id + ' (4–8 digits):'); if (p) api('resetUserPin', S.token, id, p).then(function () { toast('PIN changed'); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); }); }
    };
    $('nAdd').onclick = function () {
      api('saveUser', S.token, { id: $('nId').value.trim(), name: $('nName').value.trim(), role: $('nRole').value, pin: $('nPin').value.trim() })
        .then(function () { $('nOut').innerHTML = msgs(['User added.'], 'ok'); ['nId', 'nName', 'nPin'].forEach(function (i) { $(i).value = ''; }); load_(); }, function (e) { $('nOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Account ======================= */
  function renderAccount() {
    $('app').innerHTML = '<div class="card" style="max-width:420px"><h2>' + esc(S.boot.user.name || S.boot.user.id) + '</h2><div class="small muted">' + esc(S.boot.user.id) + ' · ' + esc(S.boot.user.role) + '</div>' +
      '<h3 style="margin-top:14px">Change PIN</h3><label class="f">Current PIN</label><input type="password" id="aOld" inputmode="numeric"><div style="height:6px"></div>' +
      '<label class="f">New PIN (4–8 digits)</label><input type="password" id="aNew" inputmode="numeric"><div id="aOut"></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn p" id="aSave">Change PIN</button><button class="btn r" id="aOut2">Log out</button></div></div>';
    $('aSave').onclick = function () { api('changePin', S.token, $('aOld').value, $('aNew').value).then(function () { $('aOut').innerHTML = msgs(['PIN changed.'], 'ok'); }, function (e) { $('aOut').innerHTML = msgs([e.message], 'bad'); }); };
    $('aOut2').onclick = function () { api('logout', S.token).catch(function () {}); clearCaches(); store('bp_token', null); S.token = null; S.boot = null; showLogin(); };
  }

  // Leaving or reloading the page: save the draft at once (typing is saved with a short delay).
  window.addEventListener('pagehide', function () {
    if (draftTimer && (S.bulk || S.inv)) {
      clearTimeout(draftTimer);
      store(DRAFT_STATE, JSON.stringify({ user: draftUser(), edited: S.edited || {}, confirmed: S.confirmed || {}, filter: S.filter, cover: S.cover || null,
        starters: S.starters, invFromSheet: !!(S.inv && S.inv.fromSheet) }));
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.plan && S.draftOk === false && Object.keys(S.edited || {}).length) { e.preventDefault(); e.returnValue = ''; }
  });

  // Android app's Back button: close a pop-up, else go back to the Dashboard; '' = nothing left (app may exit).
  window.appBack = function () {
    if (!$('modal').classList.contains('hidden')) { closeModal(); return 'handled'; }
    if (S.boot && S.tab !== 'dash' && $('nav') && !$('nav').classList.contains('hidden')) { go('dash'); return 'handled'; }
    return '';
  };

  /** Outside Apps Script (GitHub Pages copy, Android app) the page needs the planner's link once. */
  function showSetup(note) {
    $('app').innerHTML = '<div class="card login"><h2>Connect the planner</h2>' + (note ? msgs([note], 'warn') : '') +
      '<div class="small muted">Paste the planner\'s web-app link (Apps Script → Deploy → Manage deployments → Web app URL, ending in /exec) or just its Deployment ID (AKfycb…). Asked only once.</div>' +
      '<div style="height:8px"></div><input type="text" id="setupId" placeholder="https://script.google.com/macros/s/AKfycb…/exec" autocomplete="off">' +
      '<div style="height:10px"></div><button class="btn p" id="setupGo" style="width:100%">Continue</button></div>';
    $('setupGo').onclick = function () {
      var v = $('setupId').value.trim(), m = v.match(/\/macros\/s\/([A-Za-z0-9_-]+)/), id = m ? m[1] : v;
      if (!/^[A-Za-z0-9_-]{40,}$/.test(id)) { showSetup('That does not look like the planner link or a Deployment ID.'); return; }
      store('bp_api', id); showLogin();
    };
  }

  /* ---------------- start ---------------- */
  if (typeof XLSX === 'undefined' || typeof JSZip === 'undefined') {
    $('app').innerHTML = '<div class="card msg bad">Could not load the Excel tools (no internet?). Reload the page.</div>';
  } else if (!IN_APPS_SCRIPT && !serverUrl()) {
    showSetup();
  } else if (S.token && cacheGet(CACHE_BOOT)) {
    // Opens at once with the last data; the fresh copy follows (the screens read it as soon as it is there).
    S.boot = cacheGet(CACHE_BOOT);
    startApp();
    var role0 = S.boot.user.role;
    refreshBoot().then(function (b) { if (b.user.role !== role0) startApp(); }, function () { /* keeps the last data; a save reports any problem */ });
  } else if (S.token) {
    refreshBoot().then(startApp, function (e) { if (S.token) $('app').innerHTML = msgs([e.message + ' — reload the page to try again.'], 'bad'); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
