<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinkit Shipment Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--muted:#64748b;--line:#e2e8f0;--brand:#0f3460;--brand2:#16213e;--accent:#f8cb2e;
--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#182033;--ink:#e6ebf5;--muted:#94a3b8;--line:#2a3550;--brand:#3b82f6;--brand2:#0b1222;
--okbg:#12361f;--ok:#4ade80;--warnbg:#3a3010;--warn:#facc15;--badbg:#3d1414;--bad:#f87171;--infobg:#132a4d;--info:#93c5fd;--chip:#232d45}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .t{font-weight:700;font-size:15px;white-space:nowrap}.top .t span{color:var(--accent)}
.top .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--brand2);padding:0 8px;position:sticky;top:44px;z-index:19;scrollbar-width:none}
.nav button{background:none;border:0;color:#cbd5e1;padding:10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}.btn.g{background:#16a34a;color:#fff}.btn.r{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:block}
.drop.ok{border-color:#16a34a;background:var(--okbg)}
.drop.stale{border-color:#ca8a04;background:var(--warnbg)}
.drop input{display:none}.drop b{display:block;margin-bottom:2px}.drop span{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip b{margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px}.stat .v{font-size:20px;font-weight:800}.stat .k{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 6px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.line{display:grid;grid-template-columns:minmax(200px,2.2fr) repeat(5,minmax(62px,.7fr)) 92px minmax(70px,.7fr);gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.line.head{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
.line .nm{font-weight:600}.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.line input{padding:7px;text-align:right;font-weight:700}
.line.send{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.line.lock{opacity:.6}
.line .over{border-color:var(--bad);background:var(--badbg)}
.lbl{display:none;font-size:10px;color:var(--muted)}
@media (max-width:760px){
 .line{grid-template-columns:1fr 1fr 1fr 88px;gap:6px 8px}
 .line.head{display:none}.line .nm{grid-column:1/-1}.lbl{display:block}
 .line .c-days,.line .c-max{display:none}
 .wrap{padding:10px 10px 90px}
}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar .sum{flex:1;font-size:13px}.bar .sum b{font-size:16px}
.msg{padding:9px 11px;border-radius:9px;margin:8px 0;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;color:var(--muted)}
.scroll{overflow-x:auto}
.ro{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ro .h{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;background:var(--chip)}
.ro .h .w{font-weight:700;flex:1 1 220px}
.ro .b{padding:10px 12px;display:none}.ro.open .b{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
.login{max-width:360px;margin:40px auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(127,127,127,.35);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div class="t">📦 Blinkit <span>Shipment Planner</span></div><div class="who" id="who"></div></div>
<div class="nav hidden" id="nav"></div>
<div class="wrap" id="app"><div class="card muted">Loading…</div></div>
<div id="bar" class="bar hidden"></div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>

<script>
/* ======================= CORE-START (pure planning logic, no page code) ======================= */
var PlanCore = (function () {
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /** Finds the header row (the one containing all names) and turns the rows below it into objects. */
  function tableFrom(rows, must) {
    for (var h = 0; h < Math.min(rows.length, 10); h++) {
      var head = (rows[h] || []).map(function (x) { return String(x == null ? '' : x).trim(); });
      if (must.every(function (m) { return head.indexOf(m) >= 0; })) {
        var out = [];
        for (var i = h + 1; i < rows.length; i++) {
          var r = rows[i]; if (!r || !r.length) continue;
          var o = { __row: i + 1 };
          head.forEach(function (k, j) { if (k) o[k] = r[j]; });
          out.push(o);
        }
        return { head: head, rows: out, headRow: h };
      }
    }
    return null;
  }

  /** Blinkit "Stock On Hand" (Inventory) download. */
  function parseInventory(sheetRows) {
    var t = tableFrom(sheetRows, ['Item ID', 'Warehouse Facility ID', 'Total sellable', 'Last 7 days']);
    if (!t) return null;
    var first = String((sheetRows[0] || [])[0] || '');
    var m = first.match(/generated at\s+(.+)$/i);
    return {
      generatedAt: m ? m[1].trim() : '',
      rows: t.rows.filter(function (r) { return num(r['Item ID']); }).map(function (r) {
        return {
          item: num(r['Item ID']), name: String(r['Item Name'] || ''), whId: num(r['Warehouse Facility ID']),
          whName: String(r['Warehouse Facility Name'] || ''), sellable: num(r['Total sellable']),
          warehouse: num(r['Warehouse']), between: num(r['In-between']), darkstore: num(r['Darkstore']),
          s7: num(r['Last 7 days']), s15: num(r['Last 15 days']), s30: num(r['Last 30 days'])
        };
      })
    };
  }

  /** Blinkit "SELLER_BULK_SHIPMENT_INPUT" (Bulk RO) download. */
  function parseBulk(sheetRows) {
    var t = tableFrom(sheetRows, ['Warehouse ID', 'Item ID', 'Max Inventory', 'RO Quantity']);
    if (!t) return null;
    return {
      head: t.head,
      rows: t.rows.filter(function (r) { return num(r['Item ID']) && num(r['Warehouse ID']); }).map(function (r) {
        return {
          row: r.__row, whId: num(r['Warehouse ID']), whName: String(r['Warehouse Name'] || '').trim(), item: num(r['Item ID']),
          name: String(r['Item Name'] || ''), sellable: num(r['Sellable Quantity']), incoming: num(r['Incoming Quantity']),
          min: num(r['Suggested Min Inventory']), max: num(r['Max Inventory']),
          locked: String(r['Lock Status'] || '').toUpperCase() === 'LOCKED', remarks: String(r['Remarks'] || '').trim()
        };
      })
    };
  }

  function median(a) {
    a = a.slice().sort(function (x, y) { return x - y; });
    var n = a.length; if (!n) return 0;
    return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }

  /**
   * The plan for every warehouse × item row of the Bulk RO file.
   * o = { coverDays, minLine, roundTo, skus: {item: {sku, group, tier}}, openROs: [...], bulkAt: ms }
   *  - stock now = "Total sellable" of the Inventory file (warehouse + in-between + darkstore)
   *  - incoming  = Blinkit "Incoming Quantity" + RO Log lines Blinkit cannot know yet
   *                (Planned, or Created on Blinkit — R.O. PDF time, else app save time — after the Bulk file was downloaded)
   *  - daily rate: recent weeks weigh most; recently listed items use only the days they were listed;
   *    when stock ran low the last 7 days understate demand, so a longer average is used.
   */
  function computePlan(inv, bulk, o) {
    var COVER = o.coverDays || 26, MIN = o.minLine || 10, RT = o.roundTo || 5, skus = o.skus || {};
    var invAt = {};
    inv.forEach(function (r) { invAt[r.whId + '|' + r.item] = r; });
    var rates = {};
    bulk.forEach(function (b) {
      var x = invAt[b.whId + '|' + b.item];
      if (x && x.s30 > 0) (rates[b.item] = rates[b.item] || []).push(0.5 * x.s7 / 7 + 0.3 * x.s15 / 15 + 0.2 * x.s30 / 30);
    });
    var med = {};
    Object.keys(rates).forEach(function (k) { med[k] = median(rates[k]); });
    var extra = {};
    (o.openROs || []).forEach(function (r) {
      // A Created RO is in Blinkit's Incoming once Blinkit has it: from the R.O. time printed on its PDF when known,
      // otherwise from when it was saved in the app.
      var at = r.blinkitAt || r.createdAt;
      var count = r.status === 'Planned' || (r.status === 'Created' && (!o.bulkAt || !at || at > o.bulkAt));
      if (count) extra[r.wh + '|' + r.item] = (extra[r.wh + '|' + r.item] || 0) + num(r.qty);
    });

    return bulk.map(function (b) {
      var x = invAt[b.whId + '|' + b.item] || null;
      var s7 = x ? x.s7 : 0, s15 = x ? x.s15 : 0, s30 = x ? x.s30 : 0;
      var wh = x ? x.warehouse : 0, ds = x ? x.sellable - x.warehouse : 0, inc = b.incoming, app = extra[b.whName + '|' + b.item] || 0;
      var pos = wh + ds + inc + app;
      var r7 = s7 / 7, r15 = s15 / 15, r30 = s30 / 30, drr, status, kind;
      if (s30 === 0) { drr = 0; status = pos === 0 ? 'Not live here' : 'In stock, no sales yet'; kind = pos === 0 ? 'notlive' : 'nosale'; }
      else if (s7 === s30) { drr = r7; status = 'New listing (≤7 days)'; kind = 'new'; }
      else if (s30 - s15 <= 0.1 * s30) { drr = 0.6 * r7 + 0.4 * r15; status = 'New listing (≤15 days)'; kind = 'new'; }
      else {
        drr = 0.5 * r7 + 0.3 * r15 + 0.2 * r30; status = 'Established'; kind = 'est';
        if (wh + ds < 7 * r30 && r7 < 0.8 * r30) { drr = Math.max(drr, 0.5 * r15 + 0.5 * r30); status = 'Ran low – longer average used'; kind = 'low'; }
      }
      var target = drr * COVER, need = Math.max(0, target - pos), rec = 0, note = '';
      if (need >= MIN / 2) { rec = Math.ceil(need / RT) * RT; if (rec < MIN) rec = MIN; }
      if (rec > b.max) { note = 'Capped at Blinkit max ' + b.max + ' (needed ' + rec + ')'; rec = b.max >= RT ? Math.floor(b.max / RT) * RT : b.max; }
      var starter = 0;
      if (kind === 'notlive' && !b.locked && b.min > 0 && med[b.item] >= 1) {
        starter = Math.min(b.min, b.max, Math.max(MIN, Math.ceil(med[b.item] * COVER * 0.5 / RT) * RT));
      }
      if (b.locked) { if (rec > 0) note = 'Locked – needed ' + rec + ': ' + b.remarks; rec = 0; starter = 0; }
      var s = skus[b.item] || {};
      return {
        key: b.whId + '|' + b.item, row: b.row, whId: b.whId, wh: b.whName, item: b.item, name: b.name,
        sku: s.sku || '', group: s.group || '', tier: s.tier || '',
        s7: s7, s15: s15, s30: s30, status: status, kind: kind, rate: drr,
        whStock: wh, dsStock: ds, incoming: inc, appIncoming: app, position: pos,
        daysNow: drr > 0 ? pos / drr : null, target: target, min: b.min, max: b.max,
        rec: rec, starter: starter, note: note, locked: b.locked, remarks: b.remarks
      };
    });
  }

  function colLetter(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function colIndex(s) { var n = 0; for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64); return n; }
  function xmlEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /**
   * Fills RO Quantity and Shipping Address into the sheet XML of Blinkit's own file, so everything else
   * in it (dropdowns, hidden sheets, instructions) stays exactly as Blinkit made it.
   * fills = { rowNumber: qty }
   */
  function fillSheetXml(xml, fills, qtyCol, addrCol, address) {
    var qi = colIndex(qtyCol), ai = colIndex(addrCol);
    Object.keys(fills).forEach(function (rn) {
      var cellQ = '<c r="' + qtyCol + rn + '"><v>' + Math.round(fills[rn]) + '</v></c>';
      var cellA = '<c r="' + addrCol + rn + '" t="inlineStr"><is><t>' + xmlEsc(address) + '</t></is></c>';
      var re = new RegExp('(<row r="' + rn + '"[^>]*?)(/>|>([\\s\\S]*?)</row>)');
      var m = xml.match(re);
      if (!m) return;
      var cells = [];
      if (m[3] !== undefined) {
        var cre = /<c r="([A-Z]+)\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g, c;
        while ((c = cre.exec(m[3]))) {
          var ci = colIndex(c[1]);
          if (ci !== qi && ci !== ai) cells.push({ i: ci, x: c[0] });
        }
      }
      cells.push({ i: qi, x: cellQ }, { i: ai, x: cellA });
      cells.sort(function (a, b) { return a.i - b.i; });
      var open = m[1].replace(/\s*\/$/, '');
      xml = xml.replace(m[0], open + '>' + cells.map(function (c) { return c.x; }).join('') + '</row>');
    });
    return xml;
  }


  /* ---- Blinkit R.O. PDF ----
   * parseBlinkitRoPdf_ and its helpers below are copied unchanged from the Shipment Manager (ShipmentManager.gs),
   * so both apps read Blinkit R.O. PDFs the same way. Keep them in step when one changes. */
  function parseBlinkitRoPdf_(rawText) {
    try {
      const text = rawText.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
      const poMatch = text.match(/R\.O\.?\s*Number\s*[:\-]\s*(\d{10,16})/i);
      if (!poMatch) return { success:false, message:"Could not find the R.O. Number in the extracted text. Please check the file is the correct Blinkit PO PDF." };
      const poNumber = poMatch[1].trim();
      // "date" sometimes lands on a different line than "R.O. expiry" itself
      // (column-header word-wrap artifacts), so don't require them adjacent —
      // just look for the date value within a short window after "expiry".
      const expiryMatch = text.match(/R\.O\.?\s*expiry\b[\s\S]{0,20}?:\s*([A-Za-z]+\.?\s+\d{1,2},?\s*\d{4})/i);
      const expiryDate = expiryMatch ? expiryMatch[1].trim() : "";

      let rows = parseRoRowsByLine_(text);
      if (!rows.length) rows = parseRoRowsByGluedAnchor_(text);

      rows.sort((a,b)=>a.itemCode.localeCompare(b.itemCode));
      if (!rows.length) return {success:false,message:"PDF text extracted but no item rows could be parsed. Raw text shown below.",poNumber,expiryDate,rawText:text.slice(0,3000)};
      return {success:true,poNumber,expiryDate,rows};
    } catch(err) {
      return {success:false,message:"Parse error: "+err.message};
    }
  }

  /** Primary strategy: one line per item, e.g.
   *  " 1   10254670   42033 74217751 Travalate 2-  18.00 0.00 0. 39.66 260.00 100 1299.00 26000.00"
   *  Item Code is anchored directly (serial + Item Code + HSN-first-chunk +
   *  UPC-first-chunk), then Qty is read as the 3rd-from-last number on that
   *  same line — Landing Rate, Qty, MRP, Total Amt is always the trailing
   *  order, regardless of how much description text precedes the numbers. */
  /** Some R.O. PDFs (observed on the Jaipur warehouse's layout) render the
   *  Item Code column one character narrower than usual, so its LAST digit
   *  wraps onto the row's continuation line instead of staying on the main
   *  line — landing right in front of that line's other wrapped fragments
   *  (HSN's last 3 digits, UPC's last 5 digits, description continuation).
   *  Item Codes are always 8 digits (10 + 6 more), so a 7-digit capture on
   *  the main line means this wrap happened; the continuation line's very
   *  first token (a lone digit followed by non-digit content) is that
   *  missing 8th digit. Every other field needed (Qty, Landing Rate, Total
   *  Amt) already lives complete on the main line regardless, so nothing
   *  else about the existing per-line strategy needs to change. */
  function parseRoRowsByLine_(text) {
    const lines = text.split('\n');
    const lineRe = /^\s*\d{1,2}\s+(10\d{5,6})\s+\d{5}\s+\d{7,8}\s+(.*)$/;
    const wrappedDigitRe = /^\s*(\d)(?=\D|$)/;
    const rows = [];
    lines.forEach((line, idx) => {
      const m = line.match(lineRe);
      if (!m) return;
      let itemCode = m[1];
      if (itemCode.length === 7) {
        const cm = (lines[idx + 1] || '').match(wrappedDigitRe);
        if (cm) itemCode += cm[1];
      }
      if (itemCode.length !== 8) return; // still incomplete — don't guess further
      const nums = (m[2].match(/\d+\.\d+|\d+/g) || []).map(Number);
      if (nums.length < 5) return;
      const landingRate = nums[nums.length - 4];
      const qty = Math.round(nums[nums.length - 3]);
      const totalAmt = nums[nums.length - 1];
      // Sanity-check against the invoice arithmetic (Total Amt = Landing
      // Rate × Qty) so a row with unexpected extra numbers earlier in the
      // description doesn't silently produce a wrong Qty.
      const expected = landingRate * qty;
      if (qty > 0 && landingRate > 0 && Math.abs(expected - totalAmt) < Math.max(1, totalAmt * 0.02)) {
        if (!rows.find(r => r.itemCode === itemCode)) rows.push({ itemCode, qty });
      }
    });
    return rows;
  }

  /** Fallback strategy for when PDF.js collapses whitespace entirely instead
   *  of preserving line structure (columns glued into one run of characters
   *  with zero separators). Anchors on Item Code + HSN + UPC glued together
   *  with no leading serial number — deliberately NOT capturing the row's
   *  serial digit(s), since when a row runs straight into the next with no
   *  paragraph break, a leading serial capture can "steal" trailing digits
   *  off the PREVIOUS row's Total Amt. Then recovers Qty from
   *  Total Amt = Landing Rate × Qty using decimal points, which survive
   *  extraction more reliably than spaces do. */
  function parseRoRowsByGluedAnchor_(text) {
    const startIdx = text.search(/#\s*Item\s*Code/i);
    const endIdx = text.search(/Total\s*Quantity\s*:/i);
    const tableText = (startIdx >= 0 ? text.slice(startIdx) : text)
      .slice(0, endIdx >= 0 ? (endIdx - (startIdx >= 0 ? startIdx : 0)) : undefined);

    const rowRe = /(10\d{6})\s*(\d{5}\s*\d{3})\s*(742177\d{1,2}\s*\d{3,4})/g;
    const anchors = [];
    let m;
    while ((m = rowRe.exec(tableText)) !== null) {
      anchors.push({ matchStart: m.index, matchEnd: m.index + m[0].length, itemCode: m[1] });
    }

    const rows = [];
    for (let a = 0; a < anchors.length; a++) {
      const cur = anchors[a];
      const chunkEnd = a + 1 < anchors.length ? anchors[a+1].matchStart : tableText.length;
      let chunk = tableText.slice(cur.matchEnd, chunkEnd);

      // The NEXT row's serial number always leaks onto the tail of this
      // chunk (glued on with zero separator, or just separated by a
      // newline) since we stopped anchoring on it. We know its exact
      // expected value (row a+2, 1-indexed) so we can strip it precisely
      // instead of guessing.
      if (a + 1 < anchors.length) {
        const nextSerial = String(a + 2);
        chunk = chunk.replace(new RegExp('\\s*' + nextSerial.replace(/\d/g, '\\$&') + '\\s*$'), '');
      }

      const qty = extractQtyFromRowChunk_(chunk);
      if (cur.itemCode && qty > 0 && !rows.find(r => r.itemCode === cur.itemCode)) {
        rows.push({ itemCode: cur.itemCode, qty });
      }
    }
    return rows;
  }

  /** Recovers Qty from one row's trailing numeric block using
   *  Total Amt = Landing Rate × Qty, reading Landing Rate and Total Amt off
   *  their decimal points (the last 4 periods in the chunk: TaxAmt's,
   *  LandingRate's, MRP's, TotalAmt's — in that fixed column order) rather
   *  than trying to isolate Qty's digits directly, which is ambiguous when
   *  Qty is glued straight onto MRP with no separator.
   *  Tries both 1- and 2-decimal-digit interpretations at each boundary,
   *  because Blinkit occasionally prints a trailing-zero-free amount like
   *  "71.7" instead of "71.70", which would otherwise misalign every field
   *  after it. Returns 0 if no interpretation resolves to a clean qty. */
  function extractQtyFromRowChunk_(chunk) {
    const dots = [];
    for (let i = 0; i < chunk.length; i++) if (chunk[i] === '.') dots.push(i);
    if (dots.length < 4) return 0;
    const d = dots.slice(-4); // [TaxAmt, LandingRate, MRP, TotalAmt] dots, in order
    const segBeforeLanding = chunk.slice(d[0]+1, d[1]).replace(/\s+/g,''); // TaxAmt's decimals + LandingRate's integer part
    const segBeforeMrp     = chunk.slice(d[1]+1, d[2]).replace(/\s+/g,''); // LandingRate's decimals + (ambiguous Qty+MRP-integer, unused)
    const segBeforeTotal   = chunk.slice(d[2]+1, d[3]).replace(/\s+/g,''); // MRP's decimals + TotalAmt's integer part
    const afterTotal       = chunk.slice(d[3]+1).replace(/\s+/g,'');       // TotalAmt's decimals

    let best = 0, bestIsStandard = false;
    for (const skipTax of [2,1]) {
      if (segBeforeLanding.length <= skipTax) continue;

        if (segBeforeMrp.length < skipLanding) continue;

        if (!landingRate) continue;
        for (const skipMrp of [2,1]) {
          if (segBeforeTotal.length <= skipMrp) continue;
          const totalInt = segBeforeTotal.slice(skipMrp);
          for (const decLen of [2,1]) {
            if (afterTotal.length < decLen) continue;
            const totalAmt = parseFloat(totalInt + '.' + afterTotal.slice(0, decLen));
            if (!totalAmt) continue;

            const qty = Math.round(qtyRaw);

              // when it's valid; otherwise take the first valid fallback found.
              if (isStandard) return qty;
              if (!best) { best = qty; bestIsStandard = isStandard; }
            }
          }
        }
      }
    }
    return best;
  }

  var MONTHS3 = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  /** "Oct. 28, 2026" / "June 24, 2026" → "2026-10-28" ('' when it cannot be read). */
  /** "Oct. 28, 2026, 2:50 p.m." (India time) → epoch ms; also "noon" / "midnight". 0 when it cannot be read. */
  function pdfDateTime(s) {
    var m = String(s || '').match(/([A-Za-z]+)\.?\s+(\d{1,2}),?\s*(\d{4}),?\s*(?:(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m\.?|(noon|midnight))/i);
    if (!m) return 0;
    var mi = MONTHS3.indexOf(m[1].slice(0, 3).toLowerCase());
    if (mi < 0) return 0;
    var h, mm = 0;
    if (m[7]) h = m[7].toLowerCase() === 'noon' ? 12 : 0;

  }
  function pdfDate(s) {
    var m = String(s || '').match(/([A-Za-z]+)\.?\s+(\d{1,2}),?\s*(\d{4})/);
    if (!m) return '';

  }
  function whKey(s) { return String(s || '').toLowerCase().replace(/^\s*bcpl\s*-\s*/, '').replace(/warehouse/g, '').replace(/[^a-z0-9]/g, ''); }
  /** "BCPL - Jaipur J3 Feeder warehouse" → "Jaipur J3 - Feeder" (one of the sheet's warehouse names), or ''. */
  function matchWarehouse(raw, names) {
    var k = whKey(raw);

    return (names || []).filter(function (n) { return whKey(n) === k; })[0] || '';
  }

  /**
   * Everything the RO PDF upload needs from the PDF's text (as Shipment Manager's extractPdfText_ makes it):
   * the parser's R.O. number, expiry and item rows, plus the warehouse, the R.O. date and the PDF's own total.
   */

    var p = parseBlinkitRoPdf_(text || '');
    if (!p.success) return { ok: false, message: p.message || 'Could not read this PDF.' };
    var whRaw = ((text.match(/BCPL\s*-\s*([^\n]+)/) || [])[1] || '').trim();
    var total = Number((text.match(/Total\s*Quantity\s*:\s*(\d+)/i) || [])[1] || 0);
    var lines = p.rows.map(function (r) { return { item: Number(r.itemCode), qty: r.qty }; });
    var sum = lines.reduce(function (a, l) { return a + l.qty; }, 0);
    return {
      ok: true, roNo: p.poNumber, expiry: pdfDate(p.expiryDate),
      roDate: pdfDate((text.match(/\bDate\s*:\s*([A-Za-z]+\.?\s+\d{1,2},?\s*\d{4})/) || [])[1]),
      roAt: pdfDateTime((text.match(/\bDate\s*:\s*([^\n]+)/) || [])[1]),
      whRaw: whRaw, wh: matchWarehouse(whRaw, warehouses), lines: lines, sum: sum, total: total,
      totalOk: !total || total === sum

  }

  /**
   * The planner's open RO this PDF is: same warehouse, no RO number yet, created on one day, and exactly the
   * same items (quantities may differ — the PDF's win). Returns { batches, roDate, diffs } or null.
   */
  function matchPlannerRo(pdf, openROs) {
    var byDay = {};
    (openROs || []).forEach(function (r) {
      if (r.wh !== pdf.wh || r.roNo || r.status === 'Cancelled') return;
      (byDay[r.roDate] = byDay[r.roDate] || []).push(r);

    var want = {};
    pdf.lines.forEach(function (l) { want[l.item] = (want[l.item] || 0) + l.qty; });

    for (var i = 0; i < days.length; i++) {
      var rs = byDay[days[i]], have = {};

      var diffs = wk.filter(function (k) { return have[k] !== want[k]; }).map(function (k) { return { item: Number(k), from: have[k], to: want[k] }; });
      return { batches: batches, roDate: days[i], diffs: diffs };
    }

  }

  return { parseInventory: parseInventory, parseBulk: parseBulk, computePlan: computePlan, fillSheetXml: fillSheetXml,
    colLetter: colLetter, median: median, readRoPdf: readRoPdf, matchPlannerRo: matchPlannerRo, matchWarehouse: matchWarehouse };
})();

</script>

<script>
(function () {

      '<div id="lerr"></div><div style="height:10px"></div><button class="btn p" id="lb" style="width:100%">Log in</button></div>';

        r.daysNow == null ? '' : Math.round(r.daysNow * 10) / 10, r.rec, r.locked ? 'Yes' : '',
        r.whStock + r.dsStock, r.incoming + r.appIncoming];
    });
    var items = {}; S.plan.forEach(function (r) { items[r.item] = { item: r.item, name: r.name }; });
    var units = 0, lines = 0; S.plan.forEach(function (r) { if (r.rec > 0) { units += r.rec; lines++; } });
    api('saveSnapshot', S.token, rows, { inventoryAt: S.inv.generatedAt, bulkAt: S.bulkAt, units: units, lines: lines,
      items: Object.keys(items).map(function (k) { return items[k]; }) })
      .then(function () { return refreshBoot(); })
      .then(function () {
        // New items may have been added to the SKU list: show their group if an admin set one meanwhile.
        var m = skuMap(); S.plan.forEach(function (r) { var x = m[r.item]; if (x) { r.sku = x.sku; r.group = x.group; r.tier = x.tier; } });
        if (S.tab === 'plan') renderPlanOut();
      }, function () { /* the plan works without it */ });
  }

  function visibleRows() {
    var f = S.filter, q = f.q.toLowerCase();
    return S.plan.filter(function (r) {
      if (f.wh && r.wh !== f.wh) return false;
      if (f.group && (r.group || '?') !== f.group) return false;
      if (f.only && !(S.final[r.key] > 0) && !(r.locked && r.note)) return false;
      if (q && (r.name + ' ' + r.sku + ' ' + r.item).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function totals() {
    var byWh = {}, units = 0, lines = 0, bad = 0;
    S.plan.forEach(function (r) {
      var q = S.final[r.key] || 0;
      if (q > 0) { units += q; lines++; (byWh[r.wh] = byWh[r.wh] || { units: 0, lines: 0 }); byWh[r.wh].units += q; byWh[r.wh].lines++; }
      if (q > r.max || (q > 0 && r.locked)) bad++;
    });
    return { byWh: byWh, units: units, lines: lines, bad: bad };
  }

  function renderPlanOut() {
    var out = $('planOut'); if (!out) return;
    if (!S.plan) {
      out.innerHTML = (S.inv || S.bulk) ? '<div class="card muted">Now add the ' + (S.inv ? 'Bulk RO' : 'Inventory') + ' file.</div>' : '';
      $('bar').classList.add('hidden'); return;
    }
    var t = totals(), whs = [];
    S.plan.forEach(function (r) { if (whs.indexOf(r.wh) < 0) whs.push(r.wh); });
    whs.sort();
    var locked = S.plan.filter(function (r) { return r.locked && r.note; });
    var noGroup = S.plan.filter(function (r) { return !r.group && (S.final[r.key] || 0) > 0; });
    var info = [];
    var inApp = S.plan.reduce(function (a, r) { return a + r.appIncoming; }, 0);
    if (inApp) info.push('Counted ' + fmt(inApp) + ' units from the RO Log that Blinkit\'s file cannot show yet (Planned, or created after this file was downloaded).');
    var html = '<div class="card"><h2>2. Plan — ' + fmt(t.units) + ' units on ' + t.lines + ' lines</h2>' +
      '<div class="chips" id="whChips"><span class="chip' + (S.filter.wh ? '' : ' on') + '" data-wh="">All<b>' + fmt(t.units) + '</b></span>' +
      whs.map(function (w) { var x = t.byWh[w]; return '<span class="chip' + (S.filter.wh === w ? ' on' : '') + '" data-wh="' + esc(w) + '">' + esc(w.replace(/ - Feeder( Warehouse)?| Feeder$/, '')) + '<b>' + (x ? fmt(x.units) : 0) + '</b></span>'; }).join('') +
      '</div><div class="row" style="margin-top:10px">' +
      '<div><label class="f">Group</label><select id="fGroup"><option value="">TBI + TBO</option><option value="TBI"' + (S.filter.group === 'TBI' ? ' selected' : '') + '>' + esc(groupName('TBI')) + '</option><option value="TBO"' + (S.filter.group === 'TBO' ? ' selected' : '') + '>' + esc(groupName('TBO')) + '</option><option value="?"' + (S.filter.group === '?' ? ' selected' : '') + '>No group set</option></select></div>' +
      '<div><label class="f">Show</label><select id="fOnly"><option value="1">Lines to send (+ locked)</option><option value="0"' + (S.filter.only ? '' : ' selected') + '>All items</option></select></div>' +
      '<div><label class="f">Search</label><input type="text" id="fQ" placeholder="SKU or item ID" value="' + esc(S.filter.q) + '"></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="bXls">⬇ Plan (Excel)</button></div></div>' +
      msgs(info, 'info') +
      (noGroup.length ? '<div class="msg warn">' + noGroup.length + ' line(s) have no TBI/TBO group, so they cannot be logged: ' + esc(noGroup.slice(0, 6).map(function (r) { return skuText(r.sku, r.item); }).join(', ')) + (noGroup.length > 6 ? '…' : '') + '. An admin sets it in Settings → SKUs.</div>' : '') +
      (locked.length ? '<div class="msg warn"><b>Needed but locked on Blinkit (' + locked.length + '):</b> ' + esc(locked.map(function (r) { return r.wh.replace(/ - Feeder( Warehouse)?| Feeder$/, '') + ' – ' + skuText(r.sku, r.item) + ' (' + r.note.match(/needed (\d+)/)[1] + ')'; }).join('; ')) + '</div>' : '') +
      '</div><div class="card" style="padding:0 0 4px" id="lines"></div>';
    out.innerHTML = html;
    $('whChips').onclick = function (e) { var c = e.target.closest('.chip'); if (!c) return; S.filter.wh = c.getAttribute('data-wh'); renderPlanOut(); };
    $('fGroup').onchange = function () { S.filter.group = this.value; renderLines(); };
    $('fOnly').onchange = function () { S.filter.only = this.value === '1'; renderLines(); };
    $('fQ').oninput = function () { S.filter.q = this.value; renderLines(); };
    $('bXls').onclick = exportPlan;
    renderLines();
    renderBar();
  }

  function statusPill(r) {
    var cls = { est: '', low: 'warn', new: 'info', nosale: '', notlive: '' }[r.kind] || '';
    return '<span class="pill ' + cls + '">' + esc(r.status) + '</span>';
  }

  function renderLines() {
    var rows = visibleRows(), box = $('lines'); if (!box) return;
    if (!rows.length) { box.innerHTML = '<div class="muted" style="padding:16px">Nothing to show with these filters.</div>'; return; }
    var groups = {};
    rows.forEach(function (r) { var k = r.wh + '||' + (r.group || '?'); (groups[k] = groups[k] || []).push(r); });
    var head = '<div class="line head"><div>SKU · Item ID</div><div class="right">Sold 7d / 30d</div><div class="right">Per day</div><div class="right">Has now</div><div class="right c-days">Days now</div><div class="right c-max">Blinkit max</div><div class="right">Send</div><div class="right">Days after</div></div>';
    var html = '';
    Object.keys(groups).sort().forEach(function (k) {
      var rs = groups[k], p = k.split('||');
      rs.sort(function (a, b) { return (S.final[b.key] || 0) - (S.final[a.key] || 0) || (a.daysNow || 999) - (b.daysNow || 999); });
      var u = rs.reduce(function (a, r) { return a + (S.final[r.key] || 0); }, 0);
      html += '<div class="grp" style="padding:0 10px"><span>' + esc(p[0]) + ' · ' + esc(p[1] === '?' ? 'No group' : groupName(p[1])) + '</span><span>' + fmt(u) + ' units</span></div>' + head;
      rs.forEach(function (r) {
        var q = S.final[r.key] || 0, after = r.rate > 0 ? (r.position + q) / r.rate : null;
        var over = q > r.max || (q > 0 && r.locked);
        var inc = r.incoming + r.appIncoming;
        html += '<div class="line' + (q > 0 ? ' send' : '') + (r.locked ? ' lock' : '') + '" data-k="' + esc(r.key) + '">' +
          '<div class="nm">' + (r.sku ? esc(r.sku) : '<span class="pill warn">No SKU</span>') + ' <span class="muted" style="font-weight:400">· ' + r.item + '</span> ' + statusPill(r) +
          '<small>' + (r.tier ? esc(r.tier) + ' · ' : '') +
          'stock ' + fmt(r.whStock + r.dsStock) + (inc ? ' + incoming ' + fmt(inc) : '') +
          (r.note ? ' · <b>' + esc(r.note) + '</b>' : (r.locked ? ' · Locked: ' + esc(r.remarks) : '')) +
          (r.starter && !r.locked ? ' · starter ' + r.starter : '') + '</small></div>' +
          '<div class="right"><span class="lbl">Sold 7d / 30d</span>' + fmt(r.s7) + ' / ' + fmt(r.s30) + '</div>' +
          '<div class="right"><span class="lbl">Per day</span>' + fmt(r.rate, 1) + '</div>' +
          '<div class="right"><span class="lbl">Has now</span>' + fmt(r.position) + '</div>' +
          '<div class="right c-days">' + (r.daysNow == null ? '–' : fmt(r.daysNow, 1)) + '</div>' +
          '<div class="right c-max">' + fmt(r.max) + '</div>' +
          '<div><span class="lbl">Send (max ' + fmt(r.max) + ')</span><input type="number" min="0" step="1" inputmode="numeric" class="q' + (over ? ' over' : '') + '" value="' + (q || '') + '" placeholder="0"' + (r.locked || !can('Planner') ? ' disabled' : '') + '></div>' +
          '<div class="right"><span class="lbl">Days after</span>' + (after == null ? '–' : fmt(after, 1)) + '</div></div>';
      });
    });
    box.innerHTML = html;
    box.oninput = function (e) {
      if (!e.target.classList.contains('q')) return;
      var k = e.target.closest('.line').getAttribute('data-k');
      var v = Math.max(0, Math.round(Number(e.target.value) || 0));
      S.final[k] = v; S.edited[k] = v;
      var r = S.plan.filter(function (x) { return x.key === k; })[0];
      e.target.classList.toggle('over', v > r.max);
      e.target.closest('.line').classList.toggle('send', v > 0);
      renderBar();
    };
  }

  function renderBar() {
    if (!S.plan || !can('Planner')) { $('bar').classList.add('hidden'); return; }
    var t = totals();
    $('bar').innerHTML = '<div class="sum"><b>' + fmt(t.units) + '</b> units · ' + t.lines + ' lines · ' + Object.keys(t.byWh).length + ' warehouses' +
      (t.bad ? ' · <span style="color:var(--bad)">' + t.bad + ' above Blinkit max</span>' : '') + '</div>' +
      '<button class="btn g" id="bCreate"' + (t.lines && !t.bad ? '' : ' disabled') + '>Create RO file</button>';
    $('bar').classList.remove('hidden');
    $('bCreate').onclick = openCreate;
  }

  function openCreate() {
    var t = totals();
    var whs = Object.keys(t.byWh).sort();
    openModal('<h2>Create ROs</h2><div class="small muted">Saves these lines in the RO Log, writes them into the month tab (next free column D–H of each warehouse block) and downloads Blinkit\'s Bulk RO file, ready to upload.</div>' +
      '<div style="margin:10px 0">' + whs.map(function (w) {
        return '<label style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" class="cw" value="' + esc(w) + '" checked> <span style="flex:1">' + esc(w) + '</span><b>' + fmt(t.byWh[w].units) + '</b><span class="small muted">' + t.byWh[w].lines + ' lines</span></label>';
      }).join('') + '</div>' +
      '<div class="row"><div><label class="f">RO date</label><input type="date" id="cDate" value="' + today() + '"></div>' +
      '<div><label class="f">Status</label><select id="cStatus"><option>Created</option><option>Planned</option></select></div></div>' +
      '<div class="small muted" style="margin-top:6px">Created = you will upload the file to Blinkit now. Planned = not on Blinkit yet (still counted in the next plan).</div>' +
      '<div id="cOut"></div><div class="row" style="margin-top:12px"><button class="btn" id="cNo">Cancel</button><button class="btn g" id="cGo">Save &amp; download file</button></div>');
    $('cNo').onclick = closeModal;
    $('cGo').onclick = function () {
      var pick = Array.prototype.filter.call(document.querySelectorAll('.cw'), function (c) { return c.checked; }).map(function (c) { return c.value; });
      var lines = S.plan.filter(function (r) { return (S.final[r.key] || 0) > 0 && pick.indexOf(r.wh) >= 0; });
      if (!lines.length) return;
      var noGroup = lines.filter(function (r) { return !r.group; });
      if (noGroup.length) { $('cOut').innerHTML = msgs([noGroup.length + ' line(s) have no TBI/TBO group. Set it in Settings → SKUs (admin), then try again.'], 'bad'); return; }
      $('cGo').disabled = true; $('cGo').innerHTML = '<span class="spin"></span> Saving…';
      api('createROs', S.token, {
        lines: lines.map(function (r) { return { wh: r.wh, item: r.item, sku: r.sku, name: r.name, group: r.group, qty: S.final[r.key] }; }),
        roDate: $('cDate').value || today(), status: $('cStatus').value, source: 'Plan'
      }).then(function (res) {
        S.boot.openROs = res.openROs;
        return downloadBlinkitFile(lines).then(function () { return res; });
      }).then(function (res) {
        var ok = res.batches.map(function (b) { return b.wh + ' ' + b.group + ': ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); });
        $('modalBox').innerHTML = '<h2>✅ Saved — file downloaded</h2>' + msgs(ok, 'ok') + msgs(res.warnings, 'warn') +
          '<div class="msg info">Upload the downloaded file on Blinkit (Bulk RO upload). Then add the RO number and appointment in the RO Log.</div>' +
          '<div class="row" style="margin-top:10px"><button class="btn" id="cAgain">Download file again</button><button class="btn p" id="cDone">Done</button></div>';
        $('cAgain').onclick = function () { downloadBlinkitFile(lines); };
        $('cDone').onclick = function () { closeModal(); recompute(false); };
      }, function (e) {
        $('cGo').disabled = false; $('cGo').textContent = 'Save & download file';
        $('cOut').innerHTML = msgs([e.message], 'bad') + '<button class="btn sm" id="cOnly">Download the file without saving</button>';
        $('cOnly').onclick = function () { downloadBlinkitFile(lines); };
      });
    };
  }

  /** Blinkit's own Bulk RO file with RO Quantity and Shipping Address filled in for these lines. */
  function downloadBlinkitFile(lines) {
    var head = S.bulk.head;
    var qCol = PlanCore.colLetter(head.indexOf('RO Quantity')), aCol = PlanCore.colLetter(head.indexOf('Shipping Address'));
    var fills = {}; lines.forEach(function (r) { fills[r.row] = S.final[r.key]; });
    return JSZip.loadAsync(S.bulkBuf).then(function (zip) {
      return zip.file('xl/workbook.xml').async('string').then(function (wbx) {
        var m = wbx.match(/<sheet [^>]*name="Bulk RO"[^>]*r:id="([^"]+)"/) || wbx.match(/<sheet [^>]*r:id="([^"]+)"[^>]*name="Bulk RO"/);
        if (!m) throw new Error('The Bulk RO file looks different from usual (no "Bulk RO" sheet).');
        return zip.file('xl/_rels/workbook.xml.rels').async('string').then(function (rels) {
          var re = new RegExp('<Relationship [^>]*Id="' + m[1] + '"[^>]*>|<Relationship [^>]*Target="[^"]*"[^>]*Id="' + m[1] + '"[^>]*>');
          var rel = (rels.match(re) || [''])[0], tg = (rel.match(/Target="([^"]+)"/) || [])[1];
          if (!tg) throw new Error('Could not find the Bulk RO sheet inside the file.');
          var path = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, '');
          return zip.file(path).async('string').then(function (xml) {
            zip.file(path, PlanCore.fillSheetXml(xml, fills, qCol, aCol, S.boot.settings.address));
            return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
          });
        });
      });
    }).then(function (blob) { saveBlob(blob, 'Blinkit_Bulk_RO_' + today() + '.xlsx'); });
  }

  function saveBlob(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function exportPlan() {
    var rows = S.plan.map(function (r) {
      return { Warehouse: r.wh, Group: r.group, SKU: r.sku, 'Item ID': r.item, Status: r.status,
        'Sold 7d': r.s7, 'Sold 15d': r.s15, 'Sold 30d': r.s30, 'Per day': Math.round(r.rate * 10) / 10,
        'WH stock': r.whStock, 'Darkstore + transit': r.dsStock, 'Blinkit incoming': r.incoming, 'RO Log incoming': r.appIncoming,
        'Has now': r.position, 'Days now': r.daysNow == null ? '' : Math.round(r.daysNow * 10) / 10,
        Suggested: r.rec, Starter: r.starter, Send: S.final[r.key] || 0, 'Blinkit max': r.max, Note: r.note, Locked: r.locked ? r.remarks : '' };
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Plan');
    XLSX.writeFile(wb, 'Blinkit_Plan_' + today() + '.xlsx');
  }

  /* ======================= RO Log ======================= */
  function renderLog() {
    var f = S.logFilter = S.logFilter || { from: addDays(today(), -45), to: '', wh: '', status: '' };
    var whs = S.boot.warehouses || [];
    $('app').innerHTML = '<div class="card"><h2>RO Log</h2><div class="row">' +
      '<div><label class="f">From</label><input type="date" id="gFrom" value="' + f.from + '"></div>' +
      '<div><label class="f">To</label><input type="date" id="gTo" value="' + f.to + '"></div>' +
      '<div><label class="f">Warehouse</label><select id="gWh"><option value="">All</option>' + whs.map(function (w) { return '<option' + (f.wh === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f">Status</label><select id="gSt"><option value="">All</option>' + ['Planned', 'Created', 'Delivered', 'Cancelled'].map(function (s) { return '<option' + (f.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
      '</div></div><div id="logOut" class="muted card">Loading…</div>';
    ['gFrom', 'gTo', 'gWh', 'gSt'].forEach(function (id) {

    });

  function loadLog() {
    var f = S.logFilter;
    api('listROs', S.token, f).then(function (rows) { S.logRows = rows; drawLog(); }, function (e) { $('logOut').innerHTML = msgs([e.message], 'bad'); });
  }

  function batchesOf(rows) {
    var b = {};
    rows.forEach(function (r) { (b[r.batch] = b[r.batch] || []).push(r); });
    return Object.keys(b).map(function (k) { return b[k]; }).sort(function (x, y) { return (y[0].roDate + y[0].batch).localeCompare(x[0].roDate + x[0].batch); });
  }

  function batchStatus(rs) {
    var st = {}; rs.forEach(function (r) { st[r.status] = 1; });
    var k = Object.keys(st); return k.length === 1 ? k[0] : 'Mixed';
  }

  function drawLog() {
    var box = $('logOut'); if (!box) return;
    var bs = batchesOf(S.logRows || []);
    if (!bs.length) { box.className = 'card muted'; box.innerHTML = 'No ROs for these filters.'; return; }
    box.className = '';
    var open = S.openBatch || {};
    var pc = { Planned: 'info', Created: 'warn', Delivered: 'ok', Cancelled: 'bad', Mixed: '' };
    box.innerHTML = bs.map(function (rs) {
      var r0 = rs[0], st = batchStatus(rs);
      var units = rs.reduce(function (a, r) { return a + (r.status === 'Cancelled' ? 0 : r.qty); }, 0);
      var edit = can('Planner');
      return '<div class="ro' + (open[r0.batch] ? ' open' : '') + '" data-b="' + esc(r0.batch) + '"><div class="h">' +
        '<span class="w">' + esc(r0.wh) + ' · ' + esc(r0.group) + '</span><span class="pill ' + pc[st] + '">' + st + '</span>' +
        '<span class="small">RO ' + prettyDate(r0.roDate) + '</span><span class="small"><b>' + fmt(units) + '</b> units · ' + rs.length + ' lines</span>' +
        (r0.appt ? '<span class="small">app ' + prettyDate(r0.appt) + '</span>' : '') + (r0.roNo ? '<span class="small">#' + esc(r0.roNo) + '</span>' : '') +
        (r0.tabs ? '<span class="small muted">' + esc(r0.tabs) + '</span>' : '<span class="pill warn">not in a month tab</span>') + '</div><div class="b">' +
        (edit ? '<div class="row"><div><label class="f">Status (whole RO)</label><select class="bSt"><option value="">— keep —</option>' + ['Planned', 'Created', 'Delivered', 'Cancelled'].map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select></div>' +
          '<div><label class="f">Appointment</label><input type="date" class="bAp" value="' + esc(r0.appt) + '"></div>' +
          '<div><label class="f">Blinkit RO No.</label><input type="text" class="bNo" value="' + esc(r0.roNo) + '"></div>' +
          '<div style="flex:0 0 auto"><button class="btn p bSave">Save RO</button></div></div>' : '') +
        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th><th class="right">Qty</th><th>Status</th>' + (edit ? '<th></th>' : '') + '</tr>' +
        rs.map(function (r) {
          return '<tr data-k="' + esc(r.key) + '"><td>' + esc(r.sku || 'No SKU') + '<div class="small muted">by ' + esc(r.createdBy) + (r.source && r.source !== 'Plan' ? ' · ' + esc(r.source === 'PDF' ? 'from PDF' : 'manual') : '') + '</div></td><td>' + r.item + '</td>' +
            '<td class="right">' + (edit && r.status !== 'Cancelled' ? '<input type="number" class="lQ" min="1" value="' + r.qty + '" style="width:80px;text-align:right">' : fmt(r.qty)) + '</td>' +
            '<td><span class="pill ' + pc[r.status] + '">' + r.status + '</span></td>' +
            (edit ? '<td class="nowrap">' + (r.status !== 'Cancelled' ? '<button class="btn sm lSave">Save</button> <button class="btn sm r lCan">Cancel line</button>' : '') + '</td>' : '') + '</tr>';
        }).join('') + '</table></div><div class="bmsg"></div></div></div>';
    }).join('');
    box.onclick = function (e) {
      var ro = e.target.closest('.ro'); if (!ro) return;
      var b = ro.getAttribute('data-b');
      if (e.target.closest('.h')) { ro.classList.toggle('open'); (S.openBatch = S.openBatch || {})[b] = ro.classList.contains('open'); return; }
      var out = ro.querySelector('.bmsg');
      var done = function (r) { out.innerHTML = msgs(r && r.warnings, 'warn'); toast('Saved'); refreshBoot(); loadLog(); };
      var err = function (er) { out.innerHTML = msgs([er.message], 'bad'); };
      if (e.target.classList.contains('bSave')) {
        var ch = { appt: ro.querySelector('.bAp').value, roNo: ro.querySelector('.bNo').value.trim() };
        var st = ro.querySelector('.bSt').value; if (st) ch.status = st;
        if (st === 'Cancelled' && !confirm('Cancel the whole RO? Its quantities are taken out of the month tab.')) return;
        e.target.disabled = true; api('updateBatch', S.token, b, ch).then(done, err);
      }
      var tr = e.target.closest('tr'); if (!tr) return;
      var k = tr.getAttribute('data-k');
      if (e.target.classList.contains('lSave')) { e.target.disabled = true; api('updateROLine', S.token, k, { qty: Number(tr.querySelector('.lQ').value) }).then(done, err); }
      if (e.target.classList.contains('lCan')) { if (!confirm('Cancel this line? Its quantity is taken out of the month tab.')) return; e.target.disabled = true; api('updateROLine', S.token, k, { status: 'Cancelled' }).then(done, err); }
    };
  }

  /* ======================= Upload Blinkit R.O. PDFs ======================= */
  /** PDF text the way the Shipment Manager's extractPdfText_ builds it (text items grouped into lines by y). */
  function extractPdfText(buf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise.then(function (pdf) {
      var raw = '', p = 0;
      var next = function () {
        if (++p > pdf.numPages) return raw;
        return pdf.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (content) {
          var lineMap = {};
          content.items.forEach(function (item) {
            var y = item.transform ? Math.round(item.transform[5] * 10) / 10 : 0;
            (lineMap[y] = lineMap[y] || []).push(item.str);
          });
          Object.keys(lineMap).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) { raw += lineMap[y].join(' ') + '\n'; });
          raw += '\n';
          return next();
        });
      };
      return next();
    });
  }

  function addPdfFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      var e = { name: f.name, state: 'reading' };
      S.pdfs.push(e);
      var rd = new FileReader();
      rd.onload = function () {
        extractPdfText(rd.result).then(function (text) {
          var d = PlanCore.readRoPdf(text, S.boot.warehouses);
          if (!d.ok) { e.state = 'err'; e.msg = d.message; }
          else {
            e.state = 'ready'; e.d = d;
            if (S.pdfs.some(function (x) { return x !== e && x.d && x.d.roNo === d.roNo; })) { e.state = 'err'; e.msg = 'RO ' + d.roNo + ' is already in this list.'; }
          }
          drawPdfs();
        }, function (err) { e.state = 'err'; e.msg = 'Could not read the PDF: ' + (err && err.message || err); drawPdfs(); });
      };
      rd.readAsArrayBuffer(f);
    });
    drawPdfs();
  }

  function pdfMatch(e) { return e.d && e.d.wh ? PlanCore.matchPlannerRo(e.d, S.boot.openROs) : null; }

  function drawPdfs() {
    var box = $('pdfList'); if (!box) return;
    var m = skuMap();
    var ready = S.pdfs.filter(function (e) { return e.state === 'ready'; });
    $('pdfAll').classList.toggle('hidden', ready.length < 2);
    box.innerHTML = S.pdfs.map(function (e, i) {
      if (e.state === 'reading') return '<div class="ro"><div class="h"><span class="spin"></span> Reading ' + esc(e.name) + '…</div></div>';
      if (e.state === 'err') return '<div class="ro"><div class="h"><span class="w">' + esc(e.name) + '</span><button class="btn sm pX" data-i="' + i + '">Remove</button></div><div class="b" style="display:block">' + msgs([e.msg], 'bad') + '</div></div>';
      var d = e.d, mt = pdfMatch(e);
      var noGroup = d.lines.filter(function (l) { return !(m[l.item] && m[l.item].group); });
      var notes = [];
      if (!d.totalOk) notes.push(['bad', 'The items add up to ' + d.sum + ' but the PDF says Total Quantity ' + d.total + '. Check the PDF before saving.']);
      if (!d.wh) notes.push(['warn', 'Warehouse "' + d.whRaw + '" is not one of the sheet\'s warehouses — choose it below.']);
      if (noGroup.length) notes.push(['bad', 'No TBI/TBO group yet for ' + noGroup.map(function (l) { return skuText((m[l.item] || {}).sku, l.item); }).join(', ') + '. An admin sets it in Settings → SKUs, then save.']);
      if (mt) notes.push(['info', 'This is the planner\'s RO of ' + prettyDate(mt.roDate) + ' for this warehouse: the RO number is added to it, no new RO.' +
        (mt.diffs.length ? ' Quantities change to the PDF\'s: ' + mt.diffs.map(function (x) { return skuText((m[x.item] || {}).sku, x.item) + ' ' + x.from + ' → ' + x.to; }).join(', ') + '.' : '')]);
      else if (d.wh && e.state === 'ready') notes.push(['info', 'Saved as a new RO (Created) dated ' + prettyDate(d.roDate) + (S.pdfLogOnly ? ' — RO Log only (Log only is ticked).' : ' — into the RO Log and the month tab.')]);
      var done = e.state === 'saved' || e.state === 'skipped';
      return '<div class="ro open"><div class="h"><span class="w">RO ' + esc(d.roNo) + '</span>' +
        '<span class="small">' + esc(d.whRaw) + '</span><span class="small">RO ' + prettyDate(d.roDate) + (d.expiry ? ' · expires ' + prettyDate(d.expiry) : '') + '</span>' +
        '<span class="small"><b>' + fmt(d.sum) + '</b> units · ' + d.lines.length + ' items ' + (d.totalOk ? '✓' : '⚠') + '</span>' +
        (done ? '<span class="pill ' + (e.state === 'saved' ? 'ok' : 'warn') + '">' + (e.state === 'saved' ? 'Saved' : 'Skipped') + '</span>' : '') + '</div><div class="b">' +
        (done ? msgs([e.msg], e.state === 'saved' ? 'ok' : 'warn') + msgs(e.warnings, 'warn') :
          '<div class="row"><div><label class="f">Warehouse</label><select class="pWh" data-i="' + i + '"><option value="">Choose…</option>' + (S.boot.warehouses || []).map(function (w) { return '<option' + (d.wh === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select></div>' +
          '<div style="flex:0 0 auto"><button class="btn g pSave" data-i="' + i + '"' + (d.wh && !noGroup.length && e.state === 'ready' ? '' : ' disabled') + '>' + (e.state === 'saving' ? '<span class="spin"></span>' : 'Save') + '</button> <button class="btn pX" data-i="' + i + '">Remove</button></div></div>' +
          notes.map(function (n) { return '<div class="msg ' + n[0] + '">' + esc(n[1]) + '</div>'; }).join('')) +
        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th><th>Group</th><th class="right">Qty</th></tr>' + d.lines.map(function (l) {
          var x = m[l.item] || {};
          return '<tr><td>' + esc(x.sku || 'No SKU') + '</td><td>' + l.item + '</td><td>' + esc(x.group || '—') + '</td><td class="right">' + fmt(l.qty) + '</td></tr>';
        }).join('') + '</table></div></div></div>';
    }).join('');
  }

  function savePdf(i) {
    var e = S.pdfs[i]; if (!e || e.state !== 'ready' || !e.d.wh) return Promise.resolve();
    var mt = pdfMatch(e);
    e.state = 'saving'; drawPdfs();
    return api('importPdfRO', S.token, { roNo: e.d.roNo, roDate: e.d.roDate, roAt: e.d.roAt, expiry: e.d.expiry, wh: e.d.wh, lines: e.d.lines }, mt ? mt.batches : [], !!S.pdfLogOnly)
      .then(function (r) {
        if (r.skipped) { e.state = 'skipped'; e.msg = r.message; drawPdfs(); return; }
        S.boot.openROs = r.openROs;
        e.state = 'saved'; e.warnings = r.warnings;
        e.msg = r.matched ? 'RO number added to the planner\'s RO' + (r.changes.length ? '; quantities updated: ' + r.changes.join(', ') : '') + '.'
          : 'Saved: ' + r.batches.map(function (b) { return b.group + ' ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); }).join(', ') + '.';
        drawPdfs();
      }, function (err) { e.state = 'ready'; e.err = err.message; drawPdfs(); toast(err.message, 6000); });
  }

  function renderDash() {

      S.dash = d; S.dashWh = S.dashWh || ''; drawDash();

  function drawDash() {
    var d = S.dash, box = $('dashOut'); box.className = '';
    if (!d.meta || !d.rows.length) { box.className = 'card muted'; box.innerHTML = 'No data yet. Make a plan once (New Plan → upload the two files) and the dashboard fills from it.'; return; }
    var rows = d.rows.map(function (r) { return { wh: r[0], item: r[1], name: r[2], group: r[3], status: r[4], rate: Number(r[5]) || 0, pos: Number(r[6]) || 0, days: r[7] === '' ? null : Number(r[7]), rec: Number(r[8]) || 0, locked: r[9] === 'Yes',
      // Has = stock (Total sellable); Planned = on ROs not received yet. A snapshot from before the split has only the sum.
      has: r[10] === '' || r[10] === undefined ? null : Number(r[10]), planned: r[11] === '' || r[11] === undefined ? null : Number(r[11]) }; });
    var ageDays = Math.floor((Date.now() - d.meta.at) / 864e5);
    var byWh = {};
    rows.forEach(function (r) {
      var w = byWh[r.wh] = byWh[r.wh] || { red: 0, amber: 0, items: 0, open: 0 };
      if (r.rate > 0) { w.items++; if (r.days < 7) w.red++; else if (r.days < 15) w.amber++; }
    });
    d.openROs.forEach(function (r) { if (byWh[r.wh]) byWh[r.wh].open += r.qty; });
    var whs = Object.keys(byWh).sort();
    var list = rows.filter(function (r) { return r.rate > 0 && (!S.dashWh || r.wh === S.dashWh); }).sort(function (a, b) { return a.days - b.days; });
    box.innerHTML = '<div class="card"><h2>Days of cover</h2><div class="small muted">From the plan made ' + new Date(d.meta.at).toLocaleString('en-IN') + ' by ' + esc(d.meta.by) +
      (d.meta.inventoryAt ? ' · Blinkit inventory of ' + esc(d.meta.inventoryAt) : '') + '. ROs created since then are not counted here.</div>' +
      (ageDays >= 2 ? '<div class="msg warn">This is ' + ageDays + ' days old — upload fresh files in New Plan.</div>' : '') +
      '<div class="stats" style="margin-top:10px">' + whs.map(function (w) {
        var x = byWh[w];
        return '<div class="stat" style="cursor:pointer;' + (S.dashWh === w ? 'outline:2px solid var(--brand)' : '') + '" data-wh="' + esc(w) + '"><div class="k">' + esc(w) + '</div>' +
          '<div><span class="pill bad">' + x.red + ' under 7d</span> <span class="pill warn">' + x.amber + ' 7–15d</span></div>' +
          '<div class="small muted" style="margin-top:4px">' + (x.open ? fmt(x.open) + ' units in open ROs' : 'no open ROs') + '</div></div>';
      }).join('') + '</div></div>' +
      '<div class="card"><h3>' + (S.dashWh ? esc(S.dashWh) + ' — ' : '') + 'items by days of cover <span class="small muted">(lowest first' + (S.dashWh ? ' · <a href="#" id="dAll">show all</a>' : '') + ')</span></h3><div class="scroll"><table class="t"><tr><th>Warehouse</th><th>SKU</th><th>Item ID</th><th>Group</th><th class="right">Per day</th><th class="right">Has</th><th class="right">Planned</th><th class="right">Days</th><th class="right">Suggested</th></tr>' +
      list.slice(0, 300).map(function (r) {
        var c = r.days < 7 ? 'bad' : r.days < 15 ? 'warn' : 'ok';
        return '<tr><td>' + esc(r.wh) + '</td><td>' + esc(skuOf(r.item) || 'No SKU') + (r.locked ? ' <span class="pill">locked</span>' : '') + '</td><td>' + r.item + '</td><td>' + esc(r.group) + '</td><td class="right">' + fmt(r.rate, 1) + '</td><td class="right">' + fmt(r.has == null ? r.pos : r.has) + '</td><td class="right">' + (r.planned == null ? '–' : r.planned ? fmt(r.planned) : '') + '</td><td class="right"><span class="pill ' + c + '">' + fmt(r.days, 1) + '</span></td><td class="right">' + (r.rec ? fmt(r.rec) : '') + '</td></tr>';
      }).join('') + '</table></div></div>';
    box.querySelector('.stats').onclick = function (e) { var s = e.target.closest('.stat'); if (!s) return; var w = s.getAttribute('data-wh'); S.dashWh = S.dashWh === w ? '' : w; drawDash(); };
    if ($('dAll')) $('dAll').onclick = function (e) { e.preventDefault(); S.dashWh = ''; drawDash(); };
  }

      var b = this; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      api('startMonth', S.token, $('sMonth').value).then(function (r) {
        b.disabled = false; b.textContent = 'Start new month';
        $('mOut2').innerHTML = msgs([(r.created ? 'Created tab ' : 'Tab ') + r.tab + '. Copied in ' + r.carried + ' open RO line(s) from the old month, wrote ' + r.written + ' line(s) of this month.'], 'ok') + msgs(r.warnings, 'warn');
        refreshBoot();
      }, function (e) { b.disabled = false; b.textContent = 'Start new month'; $('mOut2').innerHTML = msgs([e.message], 'bad'); });
    };
    $('sSync').onclick = function () {
      api('syncMonthTabs', S.token).then(function (r) { $('mOut2').innerHTML = msgs([r.ros ? 'Wrote ' + r.ros + ' RO(s) into their month tab.' : 'Everything is already in its month tab.'], 'ok') + msgs(r.warnings, 'warn'); }, function (e) { $('mOut2').innerHTML = msgs([e.message], 'bad'); });
    };
    var edits = {};
    var draw = function () {
      var q = $('kQ').value.toLowerCase(), only = $('kNo').checked;
      var list = (S.boot.skus || []).filter(function (s) { return (!only || !s.group) && (!q || (s.item + ' ' + s.sku + ' ' + s.name).toLowerCase().indexOf(q) >= 0); });
      $('kTab').innerHTML = '<tr><th>Item ID</th><th>SKU</th><th>Group</th><th>Tier</th><th>Active</th></tr>' + list.map(function (s) {
        var e = edits[s.item] || s;
        return '<tr data-i="' + s.item + '"><td>' + s.item + '</td><td><input type="text" data-f="sku" value="' + esc(e.sku) + '" style="min-width:110px">' +
          (!s.sku && s.name ? '<div class="small muted">New on Blinkit — give it a SKU: ' + esc(s.name.replace(/^Travalate /, '')) + '</div>' : '') + '</td>' +
          '<td><select data-f="group"><option value="">—</option><option' + (e.group === 'TBI' ? ' selected' : '') + '>TBI</option><option' + (e.group === 'TBO' ? ' selected' : '') + '>TBO</option></select></td>' +
          '<td><input type="text" data-f="tier" value="' + esc(e.tier) + '" style="width:70px"></td>' +
          '<td><input type="checkbox" data-f="active"' + (e.active ? ' checked' : '') + '></td></tr>';
      }).join('');
    };
    draw();
    $('kQ').oninput = draw; $('kNo').onchange = draw;
    $('kTab').onchange = function (e) {
      var tr = e.target.closest('tr[data-i]'); if (!tr) return;
      var id = Number(tr.getAttribute('data-i'));
      var base = edits[id] || Object.assign({}, (S.boot.skus || []).filter(function (s) { return s.item === id; })[0]);
      var f = e.target.getAttribute('data-f');
      base[f] = f === 'active' ? e.target.checked : e.target.value;
      edits[id] = base;
    };
    $('kSave').onclick = function () {
      var rows = Object.keys(edits).map(function (k) { return edits[k]; });
      if (!rows.length) { $('kOut').innerHTML = msgs(['No changes.'], 'info'); return; }
      api('saveSkus', S.token, rows).then(function (skus) {
        S.boot.skus = skus; edits = {}; draw(); $('kOut').innerHTML = msgs(['Saved ' + rows.length + ' SKU(s).'], 'ok');
        if (S.plan) { var m = skuMap(); S.plan.forEach(function (r) { var x = m[r.item]; if (x) { r.sku = x.sku; r.group = x.group; r.tier = x.tier; } }); }
      }, function (e) { $('kOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Users (admin) ======================= */
  function renderUsers() {
    $('app').innerHTML = '<div class="card"><h2>Users</h2><div class="small muted">Admin: everything. Planner: plans, creates and edits ROs. Viewer: dashboard and RO Log only.</div><div class="scroll"><table class="t" id="uTab"><tr><td class="muted">Loading…</td></tr></table></div><div id="uOut"></div></div>' +
      '<div class="card"><h2>Add a user</h2><div class="row"><div><label class="f">User ID</label><input type="text" id="nId"></div><div><label class="f">Name</label><input type="text" id="nName"></div>' +
      '<div><label class="f">Role</label><select id="nRole"><option>Planner</option><option>Viewer</option><option>Admin</option></select></div><div><label class="f">PIN (4–8 digits)</label><input type="text" id="nPin" inputmode="numeric"></div>' +
      '<div style="flex:0 0 auto"><button class="btn p" id="nAdd">Add</button></div></div><div id="nOut"></div></div>';
    var load_ = function () {
      api('listUsers', S.token).then(function (us) {
        $('uTab').innerHTML = '<tr><th>User ID</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>' + us.map(function (u) {
          return '<tr data-u="' + esc(u.id) + '"><td>' + esc(u.id) + '</td><td><input type="text" class="uN" value="' + esc(u.name) + '"></td><td><select class="uR">' + ['Admin', 'Planner', 'Viewer'].map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select></td>' +
            '<td><input type="checkbox" class="uA"' + (u.active ? ' checked' : '') + '></td><td class="nowrap"><button class="btn sm uS">Save</button> <button class="btn sm uP">New PIN</button></td></tr>';
        }).join('');
      }, function (e) { $('uOut').innerHTML = msgs([e.message], 'bad'); });
    };
    load_();
    $('uTab').onclick = function (e) {
      var tr = e.target.closest('tr[data-u]'); if (!tr) return;
      var id = tr.getAttribute('data-u');
      if (e.target.classList.contains('uS')) api('saveUser', S.token, { id: id, name: tr.querySelector('.uN').value, role: tr.querySelector('.uR').value, active: tr.querySelector('.uA').checked }).then(function () { toast('Saved'); load_(); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); });
      if (e.target.classList.contains('uP')) { var p = prompt('New PIN for ' + id + ' (4–8 digits):'); if (p) api('resetUserPin', S.token, id, p).then(function () { toast('PIN changed'); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); }); }
    };
    $('nAdd').onclick = function () {
      api('saveUser', S.token, { id: $('nId').value.trim(), name: $('nName').value.trim(), role: $('nRole').value, pin: $('nPin').value.trim() })
        .then(function () { $('nOut').innerHTML = msgs(['User added.'], 'ok'); ['nId', 'nName', 'nPin'].forEach(function (i) { $(i).value = ''; }); load_(); }, function (e) { $('nOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Account ======================= */
  function renderAccount() {
    $('app').innerHTML = '<div class="card" style="max-width:420px"><h2>' + esc(S.boot.user.name || S.boot.user.id) + '</h2><div class="small muted">' + esc(S.boot.user.id) + ' · ' + esc(S.boot.user.role) + '</div>' +
      '<h3 style="margin-top:14px">Change PIN</h3><label class="f">Current PIN</label><input type="password" id="aOld" inputmode="numeric"><div style="height:6px"></div>' +
      '<label class="f">New PIN (4–8 digits)</label><input type="password" id="aNew" inputmode="numeric"><div id="aOut"></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn p" id="aSave">Change PIN</button><button class="btn r" id="aOut2">Log out</button></div></div>';
    $('aSave').onclick = function () { api('changePin', S.token, $('aOld').value, $('aNew').value).then(function () { $('aOut').innerHTML = msgs(['PIN changed.'], 'ok'); }, function (e) { $('aOut').innerHTML = msgs([e.message], 'bad'); }); };
    $('aOut2').onclick = function () { api('logout', S.token).catch(function () {}); store('bp_token', null); S.token = null; S.boot = null; showLogin(); };
  }

  window.addEventListener('beforeunload', function (e) {
    if (S.plan && Object.keys(S.edited || {}).length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------------- start ---------------- */
  if (typeof XLSX === 'undefined' || typeof JSZip === 'undefined') {
    $('app').innerHTML = '<div class="card msg bad">Could not load the Excel tools (no internet?). Reload the page.</div>';
  } else if (S.token) {
    refreshBoot().then(startApp, function (e) { if (S.token) $('app').innerHTML = msgs([e.message + ' — reload the page to try again.'], 'bad'); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
