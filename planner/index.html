<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinkit Shipment Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--muted:#64748b;--line:#e2e8f0;--brand:#0f3460;--brand2:#16213e;--accent:#f8cb2e;
--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#182033;--ink:#e6ebf5;--muted:#94a3b8;--line:#2a3550;--brand:#3b82f6;--brand2:#0b1222;
--okbg:#12361f;--ok:#4ade80;--warnbg:#3a3010;--warn:#facc15;--badbg:#3d1414;--bad:#f87171;--infobg:#132a4d;--info:#93c5fd;--chip:#232d45}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .t{font-weight:700;font-size:15px;white-space:nowrap}.top .t span{color:var(--accent)}
.top .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--brand2);padding:0 8px;position:sticky;top:44px;z-index:19;scrollbar-width:none}
.nav button{background:none;border:0;color:#cbd5e1;padding:10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}.btn.g{background:#16a34a;color:#fff}.btn.r{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:block}
/* The two upload boxes are always the same width and height. */
.row.ups{align-items:stretch}.row.ups>.drop{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.drop.ok{border-color:#16a34a;background:var(--okbg)}
.drop.stale{border-color:#ca8a04;background:var(--warnbg)}
.drop input{display:none}.drop b{display:block;margin-bottom:2px}.drop span{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip b{margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px}.stat .v{font-size:20px;font-weight:800}.stat .k{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 6px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.line{display:grid;grid-template-columns:minmax(190px,1.9fr) repeat(8,minmax(52px,.58fr)) 92px minmax(56px,.6fr) minmax(70px,.7fr);gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.line.head{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
.line.head .srt{cursor:pointer;user-select:none}.line.head .srt:hover{color:var(--ink)}.line.head .srt.on{color:var(--brand)}
/* Each warehouse block's title + column headings stay pinned under the top bar
   while scrolling through that block, and scroll away when the next block starts. */
.whsec{position:relative}
/* Search: pick several SKUs (chips) from a suggestion list. */
.srch{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:25;max-height:280px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.sugg div:last-child{border-bottom:0}
.sugg div.on,.sugg div:hover{background:var(--chip)}
.sugg small{color:var(--muted)}
#calAddL{position:static;max-height:220px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.picks:empty{display:none}
.picks .chip{cursor:default}.picks .chip button{border:0;background:none;cursor:pointer;padding:0 0 0 6px;font-weight:700;color:inherit}
.whhead{position:sticky;top:var(--stickTop,86px);z-index:5;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.whhead .grp{margin:0;padding:10px 10px 6px!important}
/* Warehouse blocks collapse / expand by clicking their title. */
.grp.tgl{cursor:pointer;user-select:none}.grp.tgl .chev{display:inline-block;width:14px;color:var(--muted)}
.whsec.shut .line{display:none}.whsec.shut .whhead{position:static;box-shadow:none;border-bottom:1px solid var(--line)}
.whsec.shut .whhead .grp{padding-bottom:10px!important}
/* Send heading: "fill all" box + ↺ reset under the word Send. */
.sendH{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fillW{display:flex;gap:3px;align-items:center}
.line .fillQ{width:58px;padding:3px 5px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:right}
.fillR{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;line-height:1.2}
.fillR:hover{background:var(--chip)}
.line .nm{font-weight:600}.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.line input{padding:7px;text-align:right;font-weight:700}
.line.send{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.line.lock{opacity:.6}
/* The row you are typing in (Tab / click) is highlighted. */
.line:focus-within{box-shadow:inset 4px 0 0 var(--brand);background:color-mix(in srgb,var(--infobg) 70%,transparent)}
.line input.q:focus{outline:2px solid var(--brand);outline-offset:1px}
.line .over{border-color:var(--bad);background:var(--badbg)}
.lbl{display:none;font-size:10px;color:var(--muted)}
@media (max-width:760px){
 .line{grid-template-columns:1fr 1fr 1fr 88px;gap:6px 8px}
 .line.head{display:none}.line .nm{grid-column:1/-1}.lbl{display:block}
 .line .c-days,.line .c-max{display:none}
 .wrap{padding:10px 10px 90px}
}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar .sum{flex:1;font-size:13px}.bar .sum b{font-size:16px}
.msg{padding:9px 11px;border-radius:9px;margin:8px 0;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;color:var(--muted)}
.proj th,.proj td{white-space:nowrap}
.proj td:first-child,.proj th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.proj tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.proj td.z{color:var(--muted)}
.pwh tr.pm td{border-bottom:0;padding-bottom:2px}
.pwh tr.ps td{border-bottom:0;padding-top:1px;padding-bottom:1px;color:var(--muted)}
.pwh tr.ps.pl td{border-bottom:1px solid var(--line);padding-bottom:7px;color:var(--info)}
.pwh tr.tot2 td{font-weight:600}
.proj th.right,.proj td.right{text-align:right}
.rmD{padding:2px 8px!important;color:var(--bad);font-weight:700;line-height:1.2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.scroll{overflow-x:auto}
.ro{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ro .h{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;background:var(--chip)}
.ro .h .w{font-weight:700;flex:1 1 220px}
.ro .b{padding:10px 12px;display:none}.ro.open .b{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.hidden{display:none!important}
/* A Send box not yet confirmed (the planner's suggestion): grey until clicked, typed in or filled. */
.line input.q.pend{color:var(--muted);font-weight:400;background:var(--chip)}
/* TI = Travalate Inventory stock; red when the plan sends more of the SKU (all warehouses) than TI has. */
.ti-c b{font-weight:700}.ti-c.tiover b{color:var(--bad)}.ti-c .tiw{display:block;font-size:10px;color:var(--bad)}.ti-c .tiw.ok{color:var(--muted)}
a.plk{color:var(--brand);font-weight:700;text-decoration:underline dotted;cursor:pointer}
/* Dashboard: sortable headings and the calendar. */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--ink)}th.sortable.on{color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw7{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cd{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--card);overflow:hidden}
.cd.empty{border:0;background:none;cursor:default}
.cd.past{background:var(--chip);opacity:.8}
.cd.today{border:2px solid var(--brand)}
.cd.sel{outline:2px solid var(--accent)}
.cdn{font-size:11px;font-weight:700;color:var(--muted)}
.cd.today .cdn{color:var(--brand)}
.cb{font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.ro{background:var(--infobg);color:var(--info)}.cb.ap{background:var(--okbg);color:var(--ok)}.cb.out{background:var(--badbg);color:var(--bad)}
.cb.ds{background:var(--chip);color:var(--ink)}.cb.ds.over{background:var(--badbg);color:var(--bad)}.cb.pk{background:var(--warnbg);color:var(--warn)}
.ld{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ld span{display:block;height:100%;background:var(--brand)}.ld.over span{background:var(--bad)}
.cd.off{background:repeating-linear-gradient(45deg,var(--card),var(--card) 6px,var(--chip) 6px,var(--chip) 12px)}
.calw{margin:4px 0;font-size:13px}.calw summary{cursor:pointer}.calw ul{margin:4px 0 6px;padding-left:20px}
.calinfo{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.calinfo ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.calinfo ul.rls{list-style:none;padding-left:0;margin-bottom:6px}
#remList{list-style:none;padding-left:0;margin:8px 0 0}
.rls li{padding:8px 0;border-bottom:1px solid var(--line)}.rls li:last-child{border-bottom:0}
.rl1{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}.rl1 .rlx{margin-left:auto}
.rl2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:6px}
.ag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.ag .agl{font-size:12px;color:var(--muted)}
.ag input[type=date]{width:140px;padding:4px 6px}
@media (max-width:760px){.cd{min-height:54px;padding:3px}.cb{font-size:9px;padding:1px 2px}}
#plTipBox{position:fixed;z-index:60;max-width:min(560px,calc(100vw - 16px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;font-weight:400;text-align:left;pointer-events:none;display:none}
#plTipBox table{border-collapse:collapse;width:100%;margin-top:6px}#plTipBox th,#plTipBox td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}#plTipBox th{color:var(--muted);font-size:11px}#plTipBox .r{text-align:right}
.plTip,.hv{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.hsub{display:block;font-size:9px;font-weight:400;color:var(--muted);line-height:1.15;margin-top:1px;white-space:normal}
#askBtn{position:fixed;right:16px;bottom:84px;z-index:40;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;font-size:14px}
#askBox{position:fixed;right:16px;bottom:136px;z-index:45;width:min(420px,calc(100vw - 32px));max-height:min(70vh,620px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);overflow:hidden}
#askBox .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}#askBox .ah button{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
#askMsgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#askMsgs .me{align-self:flex-end;background:var(--brand);color:#fff;border-radius:12px 12px 2px 12px;padding:7px 10px;max-width:85%}
#askMsgs .bot{align-self:flex-start;background:var(--chip);border-radius:12px 12px 12px 2px;padding:8px 10px;max-width:95%}
#askMsgs .bot ul{margin:4px 0 0 16px;padding:0}#askMsgs .bot li{margin:2px 0}
#askMsgs .ex{display:flex;flex-wrap:wrap;gap:6px}#askMsgs .ex button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
#askF{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);position:relative}#askF input{flex:1}
#askSug{top:auto;bottom:100%;margin:0 0 4px;left:8px;right:8px}
.shortNote{margin-top:4px;width:100%;min-width:180px;font-size:12px;padding:4px 6px}
#savePill{position:fixed;left:14px;bottom:84px;z-index:96;background:#111827;color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
#savePill.ok{background:var(--ok)}#savePill.bad{background:var(--bad)}
#busy{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:progress}
#busy .bx{background:var(--card);color:var(--ink);padding:14px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
.login{max-width:360px;margin:40px auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(127,127,127,.35);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div class="top"><div class="t">📦 Blinkit <span>Shipment Planner</span></div><div class="who" id="who"></div></div>
<div class="nav hidden" id="nav"></div>
<div class="wrap" id="app"><div class="card muted">Loading…</div></div>
<div id="bar" class="bar hidden"></div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="savePill" class="hidden" role="status" aria-live="polite"></div>
<div id="busy" class="hidden" role="status" aria-live="polite"><div class="bx"><span class="spin"></span><span id="busyT">Saving…</span></div></div>

<script>
/* ======================= CORE-START (pure planning logic, no page code) ======================= */
var PlanCore = (function () {
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /** Finds the header row (the one containing all names) and turns the rows below it into objects. */
  function tableFrom(rows, must) {
    for (var h = 0; h < Math.min(rows.length, 10); h++) {
      var head = (rows[h] || []).map(function (x) { return String(x == null ? '' : x).trim(); });
      if (must.every(function (m) { return head.indexOf(m) >= 0; })) {
        var out = [];
        for (var i = h + 1; i < rows.length; i++) {
          var r = rows[i]; if (!r || !r.length) continue;
          var o = { __row: i + 1 };
          head.forEach(function (k, j) { if (k) o[k] = r[j]; });
          out.push(o);
        }
        return { head: head, rows: out, headRow: h };
      }
    }
    return null;
  }

  /** Blinkit "Stock On Hand" (Inventory) download. */
  function parseInventory(sheetRows) {
    var t = tableFrom(sheetRows, ['Item ID', 'Warehouse Facility ID', 'Total sellable', 'Last 7 days']);
    if (!t) return null;
    var first = String((sheetRows[0] || [])[0] || '');
    var m = first.match(/generated at\s+(.+)$/i);
    return {
      generatedAt: m ? m[1].trim() : '',
      rows: t.rows.filter(function (r) { return num(r['Item ID']); }).map(function (r) {
        return {
          item: num(r['Item ID']), name: String(r['Item Name'] || ''), whId: num(r['Warehouse Facility ID']),
          whName: String(r['Warehouse Facility Name'] || ''), sellable: num(r['Total sellable']),
          warehouse: num(r['Warehouse']), between: num(r['In-between']), darkstore: num(r['Darkstore']),
          s7: num(r['Last 7 days']), s15: num(r['Last 15 days']), s30: num(r['Last 30 days'])
        };
      })
    };
  }

  /** Blinkit "SELLER_BULK_SHIPMENT_INPUT" (Bulk RO) download. */
  function parseBulk(sheetRows) {
    var t = tableFrom(sheetRows, ['Warehouse ID', 'Item ID', 'Max Inventory', 'RO Quantity']);
    if (!t) return null;
    return {
      head: t.head,
      rows: t.rows.filter(function (r) { return num(r['Item ID']) && num(r['Warehouse ID']); }).map(function (r) {
        return {
          row: r.__row, whId: num(r['Warehouse ID']), whName: String(r['Warehouse Name'] || '').trim(), item: num(r['Item ID']),
          name: String(r['Item Name'] || ''), sellable: num(r['Sellable Quantity']), incoming: num(r['Incoming Quantity']),
          min: num(r['Suggested Min Inventory']), max: num(r['Max Inventory']),
          locked: String(r['Lock Status'] || '').toUpperCase() === 'LOCKED', remarks: String(r['Remarks'] || '').trim()
        };
      })
    };
  }

  /**
   * Blinkit's Inventory "generated at 2026-10-29 09:58:28" counts the stock as of the day before (28 Oct).
   * Returns { stockDate: 'yyyy-mm-dd', elapsed: whole days from the stock date to todayStr }, or null.
   */
  function stockInfo(generatedAt, todayStr) {
    var m = String(generatedAt || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    var t = String(todayStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);

  /** Reads a Blinkit Inventory or Bulk RO .xlsx. Returns 'bulk' or 'inv'; throws if it is neither. */

  /**
   * Works out the plan with the RO Log as it is right now (not the copy read when the page was opened), so ROs
   * added or changed elsewhere (another device, another person, the RO Log tab itself) are always counted.
   */
  function freshPlan(keepEdits) {
    if (!S.inv || !S.bulk) { recompute(keepEdits); return; }
    if ($('planOut') && !S.plan) $('planOut').innerHTML = '<div class="card muted"><span class="spin"></span> Reading the latest RO Log…</div>';
    refreshBoot().then(function () { recompute(keepEdits); }, function (e) {
      recompute(keepEdits);

    });
  }

  function skuMap() { var m = {}; (S.boot.skus || []).forEach(function (s) { m[s.item] = s; }); return m; }

  function recompute(keepEdits) {
    if (!S.inv || !S.bulk) { S.plan = null; renderPlanOut(); return; }
    var s = S.boot.settings;

    S.plan = PlanCore.computePlan(S.inv.rows, S.bulk.rows, {
      coverDays: S.cover || s.coverDays, minLine: s.minLine, roundTo: s.roundTo, skus: sm,
      openROs: S.boot.openROs, bulkAt: S.bulkAt, elapsed: (stockInfoNow() || {}).elapsed || 0,
      delivered: S.boot.delivered || [], stockDate: (stockInfoNow() || {}).stockDate || '', today: today()

  /**

    if (S.boot) S.boot.delivered = upd(S.boot.delivered);

  /* ---------------- Instant saves ----------------
   * RO changes (calendar, reminder, Planned pop-up, RO Log) show on the page at once; the save runs in the background,
   * one after the other, with a small "Saving…" / "✓ Saved" pill. When the last one is done the page takes the sheet's
   * own answer; if a save fails, it says so and the page reads the sheet again (undoing what was not saved). */
  var SQ = { n: 0, chain: Promise.resolve(), t: null };
  function savePill(state, text) {

    if (state === 'ok') SQ.t = setTimeout(function () { el.classList.add('hidden'); }, 1600);
    if (state === 'bad') SQ.t = setTimeout(function () { el.classList.add('hidden'); }, 8000);
  }
  function bgSave(fn, args) {
    SQ.n++; savePill('busy', 'Saving' + (SQ.n > 1 ? ' ' + SQ.n + ' changes' : '') + '…');
    var p = SQ.chain.then(function () { return apiCall(fn, args); });

      if (SQ.n > 0) { savePill('busy', 'Saving' + (SQ.n > 1 ? ' ' + SQ.n + ' changes' : '') + '…'); return r; }
      savePill('ok', '✓ Saved');

      if (r && r.warnings && r.warnings.length) toast(r.warnings.join(' '), 7000);
      return r;
    }, function (e) {
      SQ.n--;
      savePill('bad', '⚠ Not saved: ' + e.message);

  }
  /** The sheet's own answer after the last save (open ROs, changed lines). */

  /**
   * Applies a change to the RO lines on the page at once (open ROs, RO Log list, delivered list): ch = { appt, roNo,
   * dispatch, status, deliveredOn, qty } as sent to the server, which works it out the same way.
   */
  function applyLocal(match, ch) {
    var seen = [], touched = [];
    [S.boot && S.boot.openROs, S.dash && S.dash.openROs, S.logRows].forEach(function (list) {
      (list || []).forEach(function (r) {
        if (!match(r) || seen.indexOf(r) >= 0) return;

        if (ch.roNo !== undefined) r.roNo = ch.roNo;

  function inBatches(batches) { return function (r) { return batches.indexOf(r.batch) >= 0; }; }
  function refreshPlanAfterRoChange() {

  function saveSnapshot() {

      return [r.wh, r.item, r.name, r.group, r.status, Math.round(r.rate * 10) / 10, r.position,

  function visibleRows() {

      if (f.group && (r.group || '?') !== f.group) return false;
      // Picked SKUs: show every line of just those SKUs (even ones with nothing to send);
      // the search text then only drives the suggestion list.
      if (picks.length) return picks.indexOf(Number(r.item)) >= 0;
      // "Lines to send": a line you changed yourself stays on screen even at 0, so a block filled or typed down to 0
      // keeps its heading (and its ↺ reset) instead of disappearing.

  function totals() {
    var byWh = {}, units = 0, lines = 0, bad = 0;

      if (q > 0) { units += q; lines++; (byWh[r.wh] = byWh[r.wh] || { units: 0, lines: 0 }); byWh[r.wh].units += q; byWh[r.wh].lines++; }

  function renderPlanOut() {

      (si.elapsed ? si.elapsed + ' day' + (si.elapsed > 1 ? 's' : '') + ' of sales since then are taken off: days count from today and the plan covers ' + (S.cover || S.boot.settings.coverDays) + ' days from today.' : ''));

    if (gapAll) info.push('Of these, ' + fmt(gapAll) + ' units are from ROs created on Blinkit before this Bulk RO file (in the last 3 days, or with no appointment yet) that its Incoming does not show yet — counted so they are not sent twice.');
    var html = '<div class="card"><h2>2. Plan — ' + fmt(t.units) + ' units on ' + t.lines + ' lines</h2>' +
      '<div class="chips" id="whChips"><span class="chip' + (S.filter.whs.length ? '' : ' on') + '" data-wh="" title="All warehouses">All<b>' + fmt(t.units) + '</b></span>' +
      whs.map(function (w) { var x = t.byWh[w]; return '<span class="chip' + (S.filter.whs.indexOf(w) >= 0 ? ' on' : '') + '" title="Click to add or remove this warehouse" data-wh="' + esc(w) + '">' + esc(w.replace(/ - Feeder( Warehouse)?| Feeder$/, '')) + '<b>' + (x ? fmt(x.units) : 0) + '</b></span>'; }).join('') +
      '</div>' + (S.filter.whs.length ? '<div class="small muted" style="margin-top:4px">Showing ' + S.filter.whs.length + ' warehouse' + (S.filter.whs.length > 1 ? 's' : '') + ' · <span id="whPickU">' +

    var blocks = [];

    Object.keys(groups).sort().forEach(function (k) {
      var rs = groups[k], p = k.split('||');

      var sug = function (r) { return r.locked ? 0 : r.rec + (S.starters ? r.starter : 0); };
      rs.sort(function (a, b) { return sug(b) - sug(a) || (a.daysNow == null ? 999 : a.daysNow) - (b.daysNow == null ? 999 : b.daysNow) || a.item - b.item; });
      if (S.lineSort) rs = sortLines(rs); // a clicked heading: the same order in every block
      var gi = blocks.push(rs.map(function (r) { return r.key; })) - 1;
      var shut = !!(S.shut && S.shut[k]);
      html += '<section class="whsec' + (shut ? ' shut' : '') + '" data-sk="' + esc(k) + '"><div class="whhead"><div class="grp tgl" style="padding:0 10px" title="Click to collapse / expand this block"><span><span class="chev">' + (shut ? '▸' : '▾') + '</span> ' + esc(p[0]) + ' · ' + esc(p[1] === '?' ? 'No group' : groupName(p[1])) + '</span><span class="blkSum">' + blkSumText(rs.map(function (r) { return r.key; })) + '</span></div>' + head(gi) + '</div>';
      rs.forEach(function (r) {
        var q = S.final[r.key] || 0, after = daysAfter(r, q);
        var over = q > r.max || (q > 0 && r.locked);
        var inc = r.incoming + r.appIncoming - (r.shipped || 0); // planned, not shipped yet
        html += '<div class="line' + (q > 0 ? ' send' : '') + (r.locked ? ' lock' : '') + '" data-k="' + esc(r.key) + '">' +
          '<div class="nm">' + (r.sku ? esc(r.sku) : '<span class="pill warn">No SKU</span>') + ' <span class="muted" style="font-weight:400">· ' + r.item + '</span> ' + statusPill(r) +
          '<small>' + [r.tier ? esc(r.tier) : '', r.daysOnHand != null && r.daysOnHand < 60 ? 'runs out ~' + prettyDate(addDays(today(), Math.max(0, Math.floor(r.daysOnHand)))) : '',
            r.note ? '<b>' + esc(r.note) + '</b>' : r.locked ? 'Locked: ' + esc(r.remarks) : '', r.starter && !r.locked ? 'starter ' + r.starter : '']
            .filter(Boolean).join(' · ') + '</small></div>' +
          '<div class="right"><span class="lbl">Sold 7d / 30d</span>' + fmt(r.s7) + ' / ' + fmt(r.s30) + '</div>' +
          '<div class="right"><span class="lbl">Per day</span>' + fmt(r.rate) + '</div>' +
          '<div class="right"><span class="lbl">Stock</span>' + fmt(r.whStock + r.dsStock) + '</div>' +
          '<div class="right"><span class="lbl">Delivered</span>' + (r.delivered ? fmt(r.delivered) : '<span class="muted">0</span>') + '</div>' +
          '<div class="right"><span class="lbl">Shipped</span>' + (r.shipped ? fmt(r.shipped) : '<span class="muted">0</span>') + '</div>' +
          '<div class="right"><span class="lbl">Planned</span>' + (inc || r.appIncoming || r.incoming ? '<span class="plTip" data-k="' + esc(r.key) + '" data-wh="' + esc(r.wh) + '" data-it="' + r.item + '" data-n="' + inc + '">' + fmt(inc) + '</span>' : '<span class="muted">0</span>') + '</div>' +
          '<div class="right c-days">' + (r.daysOnHand == null ? fmtDays(r.daysOnHand) : '<span class="hv" title="Stock + Delivered last ' + fmtDays(r.daysOnHand) + ' day(s); counting what is on its way (Shipped + Planned): ' + fmtDays(r.daysNow) + '">' + fmtDays(r.daysOnHand) + '</span>') + '</div>' +
          '<div class="right c-max">' + fmt(r.max) + '</div>' +
          '<div><span class="lbl">Send (max ' + fmt(r.max) + ')</span><input type="number" min="0" step="1" inputmode="numeric" class="q' + (over ? ' over' : '') + (isConfirmed(r.key) ? '' : ' pend') + '" value="' + (q || '') + '" placeholder="0"' + (r.locked || !can('Planner') ? ' disabled' : '') + '></div>' +
          tiCell(r) +
          '<div class="right"><span class="lbl">Days after</span><span class="dAfter">' + fmtDays(after) + '</span></div></div>';
      });
      html += '</section>';
    });
    box.innerHTML = '<div class="small" style="padding:10px 10px 0;text-align:right">' + (S.lineSort ? '<a href="#" id="sortReset" title="Back to the planner\'s order: biggest suggestion first">↺ Default order</a> · ' : '') + '<a href="#" id="shutAll">Collapse all</a> · <a href="#" id="openAll">Expand all</a></div>' + html;
    if ($('sortReset')) $('sortReset').onclick = function (e) { e.preventDefault(); S.lineSort = null; store('bp_line_sort', null); renderLines(); };
    setStickTop();
    var setShut = function (sec, on) {
      S.shut = S.shut || {};
      S.shut[sec.getAttribute('data-sk')] = on;
      sec.classList.toggle('shut', on);
      sec.querySelector('.chev').textContent = on ? '▸' : '▾';
    };
    $('shutAll').onclick = function (e) { e.preventDefault(); Array.prototype.forEach.call(box.querySelectorAll('.whsec'), function (x) { setShut(x, true); }); };
    $('openAll').onclick = function (e) { e.preventDefault(); Array.prototype.forEach.call(box.querySelectorAll('.whsec'), function (x) { setShut(x, false); }); };
    var byKey = {}; S.plan.forEach(function (r) { byKey[r.key] = r; });
    var fillBlock = function (gi, v) {
      blocks[gi].forEach(function (k) {
        var r = byKey[k]; if (!r || r.locked) return;
        var q = Math.min(v, r.max); // never above Blinkit's max for that line
        S.final[k] = q; S.edited[k] = q;
      });
      renderLines(); renderBar(); toast('Filled ' + v + ' in every Send box of this block' + (blocks[gi].some(function (k) { return byKey[k] && v > byKey[k].max; }) ? ' (Blinkit max where lower)' : '') + '.');
    };
    var resetBlock = function (gi) {
      blocks[gi].forEach(function (k) {
        var r = byKey[k]; if (!r) return;
        delete S.edited[k];
        if (S.confirmed) delete S.confirmed[k]; // back to a grey suggestion
        S.final[k] = r.locked ? 0 : r.rec + (S.starters ? r.starter : 0);
      });
      renderLines(); renderBar(); toast('Quantities of this block are back to the suggestion.');
    };
    box.onkeydown = function (e) {
      if (!e.target.classList.contains('fillQ') || e.key !== 'Enter') return;
      e.preventDefault();
      if (e.target.value === '') return;
      fillBlock(Number(e.target.getAttribute('data-g')), Math.max(0, Math.round(Number(e.target.value) || 0)));
    };
    box.onclick = function (e) {
      var t = e.target.closest('.tgl');
      if (t) {
        var sec = t.closest('.whsec'), on = !sec.classList.contains('shut');
        setShut(sec, on);
        // Collapsing a block that is pinned at the top: bring its heading back into view.
        if (on && sec.getBoundingClientRect().top < 0) sec.scrollIntoView({ block: 'start' });
        return;
      }
      var sh = e.target.closest('.srt');
      if (sh) {
        var key = sh.getAttribute('data-s');
        // Same heading again: flip the direction. New heading: its natural first direction.
        S.lineSort = S.lineSort && S.lineSort.key === key ? { key: key, dir: -S.lineSort.dir } : { key: key, dir: LINE_SORT_UP[key] ? 1 : -1 };
        store('bp_line_sort', JSON.stringify(S.lineSort));
        var y = sh.getBoundingClientRect().top, sec0 = sh.closest('.whsec').getAttribute('data-sk');
        renderLines();
        // Keep the clicked block's heading where it was on screen.
        var same = box.querySelector('.whsec[data-sk="' + (window.CSS && CSS.escape ? CSS.escape(sec0) : sec0) + '"] .line.head');
        if (same) window.scrollBy(0, same.getBoundingClientRect().top - y);
        return;
      }
      var b = e.target.closest('.fillR'); if (!b) return;
      resetBlock(Number(b.getAttribute('data-g')));
    };
    box.oninput = function (e) {
      if (!e.target.classList.contains('q')) return;
      var k = e.target.closest('.line').getAttribute('data-k');
      var v = Math.max(0, Math.round(Number(e.target.value) || 0));
      S.final[k] = v; S.edited[k] = v;
      var r = S.plan.filter(function (x) { return x.key === k; })[0];
      e.target.classList.toggle('over', v > r.max);
      e.target.closest('.line').classList.toggle('send', v > 0);
      var da = e.target.closest('.line').querySelector('.dAfter'); if (da) da.textContent = fmtDays(daysAfter(r, v));
      refreshTiCells(r.item);
      renderBar();
    };
  }

  // Pinned warehouse headers sit just below the sticky top bar + tab row.
  function setStickTop() {
    var nav = document.querySelector('.nav'), top = document.querySelector('.top');
    // On a phone the top bar is taller (name, role, build on 3 lines): the tab row sticks right below it.
    if (nav && top) nav.style.top = top.offsetHeight + 'px';
    var h = (top ? top.offsetHeight : 0) + (nav && nav.offsetParent ? nav.offsetHeight : 0);
    if (h) document.documentElement.style.setProperty('--stickTop', h + 'px');
  }
  window.addEventListener('resize', setStickTop);

  // Ctrl+F (⌘F) jumps to the page's own search box: Dashboard → item search, New Plan → SKU search.
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || String(e.key).toLowerCase() !== 'f') return;
    var box = S.tab === 'dash' ? $('dQ') : S.tab === 'plan' ? $('fQ') : null;
    if (!box) return;
    e.preventDefault();
    box.focus(); box.select();
  });

  // Tabbing through the Send boxes: keep the focused box clear of the fixed bottom bar and of the
  // pinned warehouse heading at the top, by scrolling just enough.
  document.addEventListener('focusin', function (e) {
    var el = e.target;
    if (!el || !el.classList || !el.classList.contains('q')) return;
    // Clicking (or tabbing) into a Send box confirms it: it turns normal and now counts in TI's "sending".
    var ln = el.closest('.line'), ck = ln && ln.getAttribute('data-k');
    if (ck && S.plan && !isConfirmed(ck)) {
      (S.confirmed = S.confirmed || {})[ck] = true;
      el.classList.remove('pend');
      var rr = S.plan.filter(function (x) { return x.key === ck; })[0];
      if (rr) refreshTiCells(rr.item);
      saveDraftState();
    }
    requestAnimationFrame(function () { keepVisible(el); }); // after the browser's own scroll-into-view
  });
  function keepVisible(el) {
    var line = el.closest('.line') || el;
    var r = line.getBoundingClientRect(), gap = 8;
    var bar = $('bar'), barTop = bar && !bar.classList.contains('hidden') ? bar.getBoundingClientRect().top : window.innerHeight;
    var sec = line.closest('.whsec'), head = sec && sec.querySelector('.whhead');
    // Where the heading sits once pinned: just under the top bar, its own height tall (it may be mid-scroll now).
    var stick = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stickTop')) || 0;
    var headBottom = stick + (head ? head.offsetHeight : 0);
    // Keep the row in the middle part of the visible area: once it comes within ~2 rows of the bottom bar
    // or the pinned heading, scroll so it sits in the middle again (the rows around it stay visible too).
    var margin = Math.min(2 * r.height + gap, (barTop - headBottom) / 4);
    if (r.bottom > barTop - margin || r.top < headBottom + margin) {
      var mid = (headBottom + barTop) / 2;
      window.scrollBy(0, (r.top + r.bottom) / 2 - mid);
    }
  }

  function renderBar() {
    saveDraftState();
    if (!S.plan || !can('Planner')) { $('bar').classList.add('hidden'); return; }
    var t = totals();
    // Keep the warehouse chips' unit totals in step with every change (typing, fill, ↺).
    Array.prototype.forEach.call(document.querySelectorAll('#whChips .chip'), function (c) {
      var w = c.getAttribute('data-wh'), b = c.querySelector('b');
      if (b) b.textContent = fmt(w ? (t.byWh[w] ? t.byWh[w].units : 0) : t.units);
    });
    // …and each block heading's units / lines, and the picked-warehouses total under the chips.
    Array.prototype.forEach.call(document.querySelectorAll('#lines .whsec'), function (sec) {
      var el = sec.querySelector('.blkSum'); if (!el) return;
      el.textContent = blkSumText(Array.prototype.map.call(sec.querySelectorAll('.line[data-k]'), function (l) { return l.getAttribute('data-k'); }));
    });
    var wu = $('whPickU');
    if (wu) wu.textContent = fmt(S.filter.whs.reduce(function (a, w) { return a + (t.byWh[w] ? t.byWh[w].units : 0); }, 0));
    var h2 = document.querySelector('#planOut h2');
    if (h2) h2.textContent = '2. Plan — ' + fmt(t.units) + ' units on ' + t.lines + ' lines';
    $('bar').innerHTML = '<div class="sum"><b>' + fmt(t.units) + '</b> units · ' + t.lines + ' lines · ' + Object.keys(t.byWh).length + ' warehouses' +
      (t.bad ? ' · <span style="color:var(--bad)">' + t.bad + ' above Blinkit max</span>' : '') + '</div>' +
      '<button class="btn g" id="bCreate"' + (t.lines && !t.bad ? '' : ' disabled') + '>Create RO file</button>';
    $('bar').classList.remove('hidden');
    $('bCreate').onclick = openCreate;
  }

      '<div class="small" style="margin-top:10px"><a href="#" id="cAll">Select all</a> · <a href="#" id="cNone">Select none</a></div>' +

        return '<label style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" class="cw" value="' + esc(w) + '"' + (pre.indexOf(w) >= 0 ? ' checked' : '') + '> <span style="flex:1">' + esc(w) + '</span><b>' + fmt(t.byWh[w].units) + '</b><span class="small muted">' + t.byWh[w].lines + ' lines</span></label>';

      '<div class="row"><div><label class="f">RO date</label><input type="date" id="cDate" value="' + today() + '"></div>' +
      '<div><label class="f">Status</label><select id="cStatus"><option value="Created">Planned (upload to Blinkit now)</option><option value="Planned">Draft (not on Blinkit yet)</option></select></div></div>' +
      '<div class="small muted" style="margin-top:6px">Planned = you will upload the file to Blinkit now. Draft = not on Blinkit yet (still counted in the next plan). It shows as Shipped by itself once the Shipment Manager has its shipment.</div>' +
      '<div style="margin-top:10px"><label class="f">Excel file(s) to download</label><div class="chips" id="cFiles">' +
        '<label class="chip"><input type="checkbox" class="cf" value="ALL" checked> Merged (all groups)</label>' +
        groupList().map(function (g) { return '<label class="chip"><input type="checkbox" class="cf" value="' + g + '"> ' + g + ' only</label>'; }).join('') +
      '</div><div class="small muted" style="margin-top:4px">The file(s) have only the ticked warehouses and the SKUs being ordered. A group file is made only when that group has lines.</div></div>' +
      '<div id="cOut"></div><div class="row" style="margin-top:12px"><button class="btn" id="cNo">Cancel</button><button class="btn g" id="cGo">Save &amp; download file</button></div>');
    $('cNo').onclick = closeModal;
    var tickAll = function (on) { return function (e) { e.preventDefault(); Array.prototype.forEach.call(document.querySelectorAll('.cw'), function (c) { c.checked = on; }); }; };
    $('cAll').onclick = tickAll(true); $('cNone').onclick = tickAll(false);
    $('cGo').onclick = function () {
      var pick = Array.prototype.filter.call(document.querySelectorAll('.cw'), function (c) { return c.checked; }).map(function (c) { return c.value; });
      if (!pick.length) { $('cOut').innerHTML = msgs(['Tick at least one warehouse.'], 'warn'); return; }
      var lines = S.plan.filter(function (r) { return (S.final[r.key] || 0) > 0 && pick.indexOf(r.wh) >= 0; });
      if (!lines.length) return;
      var noGroup = lines.filter(function (r) { return !r.group; });
      if (noGroup.length) { $('cOut').innerHTML = msgs([noGroup.length + ' line(s) have no ' + groupList().join('/') + ' group. Set it in Settings → SKUs (admin), then try again.'], 'bad'); return; }
      var fileKinds = Array.prototype.filter.call(document.querySelectorAll('.cf'), function (c) { return c.checked; }).map(function (c) { return c.value; });
      if (!fileKinds.length) { $('cOut').innerHTML = msgs(['Tick at least one Excel file (Merged, or a group).'], 'warn'); return; }
      var files = roFiles(lines, fileKinds, pick);
      if (!files.length) { $('cOut').innerHTML = msgs(['None of the ticked groups has lines in the ticked warehouses.'], 'warn'); return; }
      $('cGo').disabled = true; $('cGo').innerHTML = '<span class="spin"></span> Saving…';
      api('createROs', S.token, {
        lines: lines.map(function (r) { return { wh: r.wh, item: r.item, sku: r.sku, name: r.name, group: r.group, qty: S.final[r.key] }; }),
        roDate: $('cDate').value || today(), status: $('cStatus').value, source: 'Plan',
        merged: fileKinds.indexOf('ALL') >= 0 // one Blinkit file per warehouse = one RO in the RO Log
      }).then(function (res) {
        S.boot.openROs = res.openROs;
        // Give the new ROs dispatch days: next working days after packing, within the daily capacity, most urgent
        // warehouse first (fewest days of cover left compared with its lead time).
        var newIds = {}; res.batches.forEach(function (b) { newIds[b.batch] = 1; });
        var todo = roGroups(res.openROs.filter(function (r) { return newIds[r.batch]; })).filter(function (x) { return !x.appt; });
        var urg = function (x) {
          var m = 999; lines.forEach(function (r) { if (r.wh === x.wh && r.daysNow != null) m = Math.min(m, r.daysNow); });
          return m - leadOf(x.wh);
        };
        var sp = spreadDispatch(todo, res.openROs, urg);
        res.dispatchPlan = sp.plan;
        return (Object.keys(sp.dates).length ? api('setDispatchDates', S.token, sp.dates).then(function (r2) { S.boot.openROs = r2.openROs; }, function (e) { res.dispatchErr = e.message; }) : Promise.resolve())
          .then(function () { return downloadFiles(files); }).then(function () { return res; });

            res.dispatchPlan.map(function (x) { return esc(x.wh) + ' · ' + esc(x.groups.join(' + ')) + ' · ' + fmt(x.units) + ' units → <b>' + new Date(x.day + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + '</b>'; }).join('<br>') + '</div>' : '') +
          (res.dispatchErr ? msgs(['Dispatch days could not be saved: ' + res.dispatchErr], 'warn') : '') +
          '<div class="msg info">Upload the downloaded file' + (files.length > 1 ? 's' : '') + ' on Blinkit (Bulk RO upload). Then add the RO number and appointment in the RO Log.' +

          '<div class="row" style="margin-top:6px"><button class="btn p" id="cDone">Done</button></div>';

        $('cDone').onclick = function () { closeModal(); freshPlan(false); };

        $('cGo').disabled = false; $('cGo').textContent = 'Save & download file';

  /**
   * The Excel files to make: "ALL" = one merged file, a group (TBI / TBO / TBG) = a file with only that group's lines.
   * The name says the group, and the warehouse when only one is ticked.
   */
  function roFiles(lines, kinds, whs) {
    var wh = whs.length === 1 ? '_' + whs[0].replace(/ - Feeder( Warehouse)?| Feeder$/, '').replace(/[^A-Za-z0-9]+/g, '') : '';
    var out = [];
    kinds.forEach(function (k) {
      var ls = k === 'ALL' ? lines : lines.filter(function (r) { return r.group === k; });
      if (!ls.length) return;
      out.push({ name: 'Blinkit_Bulk_RO_' + today() + wh + (k === 'ALL' ? '' : '_' + k) + '.xlsx', lines: ls,
        units: ls.reduce(function (a, r) { return a + (S.final[r.key] || 0); }, 0) });
    });
    return out;
  }
  /** Downloads the files one after another (a short pause so the browser takes each one). */
  function downloadFiles(files) {
    return files.reduce(function (p, f, i) {
      return p.then(function () { return downloadBlinkitFile(f.lines, f.name); })
        .then(function () { return i < files.length - 1 ? new Promise(function (r) { setTimeout(r, 700); }) : null; });
    }, Promise.resolve());
  }

  /** Blinkit's own Bulk RO file with RO Quantity and Shipping Address filled in for these lines. */
  function downloadBlinkitFile(lines, name) {
    var head = S.bulk.head;
    var qCol = PlanCore.colLetter(head.indexOf('RO Quantity')), aCol = PlanCore.colLetter(head.indexOf('Shipping Address'));

  function saveBlob(blob, name) {

    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ======================= Projections ======================= */
  /*
   * What the open ROs still need, per SKU: the total (default) or warehouse by warehouse (one column per warehouse),
   * with each SKU's monthly sale from the Inventory upload = the highest of 7-day sale / 7 × 30, 15-day sale / 15 × 30
   * and 30-day sale, all warehouses together.
   * "Not shipped yet" = status Created and the dispatch day is today or later (or not set yet).
   */
  function renderProj() {
    var P = S.proj = S.proj || { view: 'total', scope: 'created', group: '', q: '' };
    $('app').innerHTML = '<div class="card"><h2>Projections</h2>' +
      '<div class="row" style="align-items:flex-end">' +
        '<div style="flex:0 0 auto"><label class="f">View</label><div class="seg" id="pView"><button data-v="total" class="' + (P.view === 'total' ? 'on' : '') + '">Total</button><button data-v="wh" class="' + (P.view === 'wh' ? 'on' : '') + '">Warehouse-wise</button></div></div>' +
        '<div><label class="f">ROs</label><select id="pScope">' +
          '<option value="created"' + (P.scope === 'created' ? ' selected' : '') + '>Planned, not shipped yet</option>' +
          '<option value="createdAll"' + (P.scope === 'createdAll' ? ' selected' : '') + '>Planned + Shipped (not delivered)</option>' +
          '<option value="open"' + (P.scope === 'open' ? ' selected' : '') + '>Planned + Draft, not shipped yet</option></select></div>' +
        '<div><label class="f">Group</label><select id="pGroup"><option value="">All groups</option>' + groupList().map(function (g) { return '<option value="' + g + '"' + (P.group === g ? ' selected' : '') + '>' + esc(groupName(g)) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f">Search</label><input type="text" id="pQ" autocomplete="off" placeholder="SKU, item ID or name" value="' + esc(P.q) + '"></div>' +
        '<div style="flex:0 0 auto"><button class="btn" id="pXls">⬇ Excel</button></div>' +
      '</div><div class="small muted" id="pNote" style="margin-top:8px"></div></div>' +
      '<div class="card" style="padding:0" id="pOut"><div class="muted" style="padding:14px">Loading…</div></div>';
    $('pView').onclick = function (e) { var v = e.target.getAttribute('data-v'); if (!v) return; P.view = v; Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); drawProj(); };
    $('pScope').onchange = function () { P.scope = this.value; drawProj(); };
    $('pGroup').onchange = function () { P.group = this.value; drawProj(); };
    $('pQ').oninput = function () { P.q = this.value; drawProj(); };
    $('pXls').onclick = exportProj;
    drawProj();
    // The latest open ROs and the Inventory's sales, then drawn again.
    refreshBoot().then(function () { if (S.tab === 'proj') drawProj(); }, function () {});
    loadTi(false);
    if (!S.bulk && !S.dash && !S.projDashLoading) {
      var cd = cacheGet(CACHE_DASH);
      if (cd) S.dash = cd;
      S.projDashLoading = true;
      api('getDashboard', S.token).then(function (d) { S.dash = d; cachePut(CACHE_DASH, d); S.projDashLoading = false; if (S.tab === 'proj') drawProj(); },
        function () { S.projDashLoading = false; });
    }
    if (!S.inv && !S.projInv && !S.projInvLoading) {
      S.projInvLoading = true;
      api('getSheetInventory', S.token).then(function (rows) {
        S.projInv = PlanCore.parseInventory(rows); S.projInvLoading = false; if (S.tab === 'proj') drawProj();
      }, function (e) { S.projInvLoading = false; S.projInvErr = e.message; if (S.tab === 'proj') drawProj(); });
    }
  }

  /** The table's data: rows per SKU with quantities per warehouse, its total, and the monthly sale. */
  var PROJ_X = 1.2; // next 30 days = monthly sale × 1.2
  /** Warehouse names compared loosely: "Pune P3 - Feeder Warehouse" = "Pune P3 Feeder" = "pune p3". */
  function whLoose(s) { return String(s || '').toLowerCase().replace(/feeder|warehouse/g, '').replace(/[^a-z0-9]/g, ''); }
  function monthlyOf(t) { return t ? Math.round(Math.max(t.s7 / 7 * 30, t.s15 / 15 * 30, t.s30)) : null; }
  function projData() {
    var P = S.proj, td = today(), sm = skuMap();
    var lines = (S.boot.openROs || []).filter(function (r) {
      if (r.status === 'Planned') { if (P.scope !== 'open') return false; }
      else if (r.status !== 'Created') return false;
      if (P.scope === 'createdAll') return true;
      return !isShipped(r); // not shipped yet (Shipment Manager; without it, dispatch day not reached)
    });
    var inv = S.inv || S.projInv, sale = {}, saleWh = {}, stockWh = {};
    // The Inventory names a warehouse by its facility; with the Bulk RO file on New Plan the exact names are known.
    var bulkName = {}; if (S.bulk) S.bulk.rows.forEach(function (b) { bulkName[b.whId] = b.whName; });
    if (inv) inv.rows.forEach(function (x) {
      var t = sale[x.item] = sale[x.item] || { s7: 0, s15: 0, s30: 0, stock: 0, name: '' };
      t.s7 += x.s7 || 0; t.s15 += x.s15 || 0; t.s30 += x.s30 || 0; t.stock += x.sellable || 0; if (!t.name) t.name = x.name;
      var wk = whLoose(bulkName[x.whId] || x.whName), m = saleWh[x.item] = saleWh[x.item] || {};
      var u = m[wk] = m[wk] || { s7: 0, s15: 0, s30: 0 };
      u.s7 += x.s7 || 0; u.s15 += x.s15 || 0; u.s30 += x.s30 || 0;
      var sw = stockWh[x.item] = stockWh[x.item] || {}; sw[wk] = (sw[wk] || 0) + (x.sellable || 0);
    });
    // Blinkit incoming (ROs Blinkit already shows, on their way): the Bulk RO file on New Plan, else the last plan's copy.
    var incWh = {}, incTot = {}, incSrc = '';
    var addInc = function (item, wh, q) { if (!q) return; var m = incWh[item] = incWh[item] || {}, k = whLoose(wh); m[k] = (m[k] || 0) + q; incTot[item] = (incTot[item] || 0) + q; };
    if (S.bulk) {
      incSrc = 'bulk';
      var notSent = {}; (S.boot.openROs || []).forEach(function (r) { if (r.shortQty && r.status === 'Created') { var k = whLoose(r.wh) + '|' + Number(r.item); notSent[k] = (notSent[k] || 0) + Number(r.shortQty); } });
      S.bulk.rows.forEach(function (b) { addInc(b.item, b.whName, Math.max(0, (b.incoming || 0) - (notSent[whLoose(b.whName) + '|' + Number(b.item)] || 0))); });
    }
    else if (S.dash && S.dash.rows && S.dash.rows.some(function (r) { return r[12] !== '' && r[12] != null; })) {
      incSrc = 'plan'; S.dash.rows.forEach(function (r) { addInc(Number(r[1]), r[0], Number(r[12]) || 0); });
    }
    var by = {}, whs = [], ros = {};
    lines.forEach(function (r) {
      var s = sm[r.item] || {};
      var g = r.group || s.group || '';
      if (P.group && g !== P.group) return;
      var x = by[r.item] = by[r.item] || { item: r.item, sku: r.sku || s.sku || '', name: r.name || s.name || (sale[r.item] || {}).name || '', group: g, wh: {}, total: 0, ros: {} };
      x.wh[r.wh] = (x.wh[r.wh] || 0) + r.qty; x.total += r.qty;
      x.ros[r.merged ? 'M' + r.merged + r.wh : r.roNo ? r.roNo : r.batch] = 1;
      if (whs.indexOf(r.wh) < 0) whs.push(r.wh);
      ros[r.merged ? 'M' + r.merged + r.wh : r.roNo ? r.roNo : r.batch] = 1;
    });
    whs.sort();
    var q = String(P.q || '').trim().toLowerCase();
    var rows = Object.keys(by).map(function (k) {
      var x = by[k]; x.sale = monthlyOf(sale[x.item]); x.nRo = Object.keys(x.ros).length;
      x.proj = x.sale == null ? null : Math.round(x.sale * PROJ_X);
      x.blinkit = sale[x.item] ? sale[x.item].stock : (inv ? 0 : null); // current inventory: Total sellable today, all warehouses
      x.inc = incSrc ? incTot[x.item] || 0 : null;                       // Blinkit incoming, all warehouses
      x.ti = tiQty({ item: x.item, sku: x.sku });                          // Travalate Inventory stock
      // Per warehouse (warehouse-wise view): that warehouse's monthly sale and its next-30-days projection.
      x.saleWh = {}; x.projWh = {}; x.stockWh = {}; x.incWh = {};
      whs.forEach(function (w) {
        x.stockWh[w] = inv ? ((stockWh[x.item] || {})[whLoose(w)] || 0) : null;
        x.incWh[w] = incSrc ? ((incWh[x.item] || {})[whLoose(w)] || 0) : null;
        var t = (saleWh[x.item] || {})[whLoose(w)];
        x.saleWh[w] = t ? monthlyOf(t) : (inv ? 0 : null);
        x.projWh[w] = x.saleWh[w] == null ? null : Math.round(x.saleWh[w] * PROJ_X);
      });
      return x;
    })
      .filter(function (x) { return !q || (x.sku + ' ' + x.item + ' ' + x.name).toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { return b.total - a.total || String(a.sku).localeCompare(String(b.sku)); });
    // Warehouses with open ROs that the Inventory does not name the same way (their sale cannot be shown).
    var invWh = {}; if (inv) inv.rows.forEach(function (x) { invWh[whLoose(bulkName[x.whId] || x.whName)] = 1; });
    var unmatched = inv ? whs.filter(function (w) { return !invWh[whLoose(w)]; }) : [];
    return { rows: rows, whs: whs, nRo: Object.keys(ros).length, hasSale: !!inv, invAt: inv ? inv.generatedAt : '', unmatched: unmatched, incSrc: incSrc };
  }

        tot.stockWh[w] = (tot.stockWh[w] || 0) + (x.stockWh[w] || 0); tot.incWh[w] = (tot.incWh[w] || 0) + (x.incWh[w] || 0);

      '<div><label class="f">Status</label><select id="gSt"><option value="">All</option>' + ST_OPTS.map(function (o) { return '<option value="' + o[0] + '"' + (f.status === o[0] ? ' selected' : '') + '>' + o[1].replace(' (on Blinkit)', ' / Shipped') + '</option>'; }).join('') + '</select></div>' +
      '</div><div class="small muted" style="margin-top:8px"><b>From / To</b> = RO date. <b>Status:</b> ' +

    ['gFrom', 'gTo', 'gWh', 'gSt'].forEach(function (id) {

    });

  }

  function loadLog() {
    var f = S.logFilter, fk = JSON.stringify(f);
    // Shown at once from the last read for these filters; the fresh list replaces it as soon as it arrives.
    if (S.logRows && S.logKey === fk) drawLog();
    api('listROs', S.token, f).then(function (rows) {
      if (JSON.stringify(S.logFilter) !== fk) return; // the filters changed meanwhile

  }
  /** Saved lines back into the RO Log list (a line that no longer matches the filters drops out, as on a reload). */
  function mergeLogRows(rows) {
    var f = S.logFilter || {}, keys = {};
    rows.forEach(function (r) { keys[r.key] = 1; });
    var fits = function (r) {
      return (!f.from || !r.roDate || r.roDate >= f.from) && (!f.to || !r.roDate || r.roDate <= f.to) && (!f.wh || r.wh === f.wh) && (!f.status || r.status === f.status);
    };
    var at = {};
    (S.logRows || []).forEach(function (r, i) { at[r.key] = i; });
    var out = (S.logRows || []).slice();
    rows.forEach(function (r) { if (at[r.key] !== undefined) out[at[r.key]] = r; else out.push(r); });
    S.logRows = out.filter(function (r) { return !keys[r.key] || fits(r); });
  }

  /**
   * One card per RO as it is on Blinkit. The app keeps one batch per group (each goes into its own TBI / TBO / TBG
   * block of the month tab), but batches created together with the Merged file, or carrying the same Blinkit RO
   * number for one warehouse, are one RO and are shown — and saved — together.

  function cardsOf(rows) {
    var b = {}, cards = {};
    rows.forEach(function (r) { (b[r.batch] = b[r.batch] || []).push(r); });
    Object.keys(b).forEach(function (id) {
      var r0 = b[id][0];
      var key = r0.merged ? 'M|' + r0.merged + '|' + r0.wh : r0.roNo ? 'N|' + PlanCore.whNorm(r0.wh) + '|' + r0.roNo : 'B|' + id;
      (cards[key] = cards[key] || { key: key, batches: [], rows: [] }).batches.push(id);
      cards[key].rows = cards[key].rows.concat(b[id]);
    });
    return Object.keys(cards).map(function (k) { return cards[k]; }).sort(function (x, y) {
      return (y.rows[0].roDate + y.rows[0].batch).localeCompare(x.rows[0].roDate + x.rows[0].batch);
    });
  }

  function batchStatus(rs) {
    var st = {}; rs.forEach(function (r) { st[r.status] = 1; });
    var k = Object.keys(st); return k.length === 1 ? k[0] : 'Mixed';
  }

  function drawLog() {

          '<div class="bDelW hidden"><label class="f">Delivered on</label><input type="date" class="bDel" value="' + today() + '" max="' + today() + '"></div>' +

          '<div><label class="f">Blinkit RO No.</label><input type="text" class="bNo" value="' + esc(r0.roNo) + '"></div>' +

        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th>' + (multi ? '<th>Group</th>' : '') + '<th class="right">Qty</th><th>Status</th>' + (edit ? '<th></th>' : '') + '</tr>' +

        }).join('') + '</table></div><div class="bmsg"></div></div></div>';
    }).join('');
    box.onchange = function (e) {

        var tr0 = e.target.closest('tr'), k0 = tr0.getAttribute('data-k'), v0 = e.target.value.trim();
