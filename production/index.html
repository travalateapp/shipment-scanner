<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Travalate Production</title>
<style>
:root{--blue:#1a73e8;--blue2:#0d47a1;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f6fb;--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--err:#b91c1c;--errbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:12.5px;opacity:.9;text-align:right}
.top button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
#menuBtn{font-size:18px;padding:4px 10px}
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{display:none}
.main{flex:1;min-width:0;padding:14px;max-width:760px;margin:0 auto;width:100%}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.drawer.open{display:block}
.drawer .panel{background:#fff;width:270px;max-width:85%;height:100%;overflow:auto;padding:10px 0;box-shadow:2px 0 16px rgba(0,0,0,.2)}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;border-left:3px solid transparent}
.nav a:hover{background:#f1f5fb}
.nav a.on{background:#e8f0fe;color:var(--blue2);border-left-color:var(--blue)}
.nav .badge{margin-left:auto}
.nav .sep{height:1px;background:var(--line);margin:8px 14px}
@media(min-width:980px){
  #menuBtn{display:none}
  .side{display:block;width:240px;background:#fff;border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding-top:8px}
  .main{max-width:1200px;padding:20px 26px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2>.card{margin-bottom:0}
}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(15,35,80,.07)}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
h1.page{font-size:19px;margin:2px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1.page small{font-size:13px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 6px rgba(15,35,80,.07);cursor:default}
.tile[onclick]{cursor:pointer}
.tile .n{font-size:24px;font-weight:800;margin-top:2px}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tile.warn .n{color:var(--warn)}.tile.err .n{color:var(--err)}.tile.ok .n{color:var(--ok)}.tile.info .n{color:var(--info)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.row>.fix{flex:0 0 auto}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cfd6e4;border-radius:9px;background:#fff;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd5fb;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:9px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-size:14.5px;white-space:nowrap}
.btn.block{display:flex;width:100%;margin-top:12px;padding:13px}
.btn.sec{background:#eef2f8;color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}.btn.warn{background:#d97706}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f8;color:#374151;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.err{background:var(--errbg);color:var(--err)}.pill.info{background:var(--infobg);color:var(--info)}
.msg{padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px;margin-bottom:10px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.err{background:var(--errbg);color:var(--err)}.msg.info{background:var(--infobg);color:var(--info)}
.muted{color:var(--muted);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafbfd}
.tbl td{padding:9px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f7faff}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list .it{padding:11px 2px;border-bottom:1px solid #f0f2f6;display:flex;gap:10px;align-items:flex-start}
.list .it:last-child{border-bottom:none}
.list .it .grow{flex:1;min-width:0}
.list .it b{font-size:14.5px}
.neg{color:var(--err)}.pos{color:var(--ok)}
.big{font-size:28px;font-weight:800}
.lines .ln{display:grid;grid-template-columns:1fr 82px 82px 34px;gap:6px;margin-bottom:6px;align-items:center}
.lines .ln.claim{grid-template-columns:1fr 90px 34px}
.lines .hdr{font-size:12px;color:var(--muted);font-weight:700}
.x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer}
.photo{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:#000;margin-top:8px}
.login{max-width:380px;margin:9vh auto 0;padding:0 16px}
.login .logo{text-align:center;font-weight:800;font-size:22px;color:var(--blue2);margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.sheet{border-radius:14px}}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.sheet .hd b{flex:1;font-size:17px}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border-color:#cbd5e1;border-top-color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;display:none;max-width:90%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:600;font-size:14px}.chk input{width:auto}
.slip{border:1px solid var(--line);border-radius:10px;padding:16px}
.slip .sh{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:7px 12px;border-radius:999px;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 1px 4px rgba(15,35,80,.08)}
.tabs a.on{background:var(--blue);color:#fff}
.blind{background:#fff7ed;border:1px dashed #fb923c;color:#9a3412;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:8px}
@media print{.top,.side,.no-print,#toast{display:none!important}body{background:#fff}.main{padding:0;max-width:none}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* =====================================================================
 * Karigar Production App — front end. Works from the Apps Script /exec link (google.script.run) and from
 * GitHub Pages (?id=<deployment ID>, then fetch() to the /exec URL, no Google login needed).
 * ===================================================================== */
var IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var S = { token: null, profile: null, view: null, data: {} };
var store = {
  get: function (k) { try { return localStorage.getItem('prod_' + k); } catch (e) { return null; } },
  set: function (k, v) { try { if (v === null) localStorage.removeItem('prod_' + k); else localStorage.setItem('prod_' + k, v); } catch (e) { /* private mode */ } }
};

function apiUrl() {
  var q = new URLSearchParams(location.search);
  if (q.get('url')) store.set('url', q.get('url'));
  if (q.get('id')) { store.set('url', 'https://script.google.com/macros/s/' + q.get('id').trim() + '/exec'); }
  return store.get('url');
}

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var done = function (txt) {
      var r; try { r = typeof txt === 'string' ? JSON.parse(txt) : txt; } catch (e) { return reject(new Error('The server did not answer properly. Try again.')); }
      if (r.ok) return resolve(r.result);
      if (r.error === 'SESSION_EXPIRED') { logoutLocal(); return reject(new Error('Please log in again.')); }
      reject(new Error(r.error));
    };
    if (IN_GAS) { google.script.run.withSuccessHandler(done).withFailureHandler(reject).api(fn, args); return; }
    var url = apiUrl();
    if (!url) return reject(new Error('Open the app with its full link (…?id=YOUR_DEPLOYMENT_ID).'));
    var rid = Math.random().toString(36).slice(2) + Date.now().toString(36);
    var attempt = function (n) {
      fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, args: args, rid: rid }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.text(); }).then(done)
        .catch(function (e) { if (n < 2) setTimeout(function () { attempt(n + 1); }, 1200 * (n + 1)); else reject(new Error('No internet or the server is not reachable.')); });
    };
    attempt(0);
  });
}

/* ---------- small helpers ---------- */
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function cur() { return (S.profile && S.profile.currency) || '₹'; }
function money(n) { if (n === null || n === undefined || n === '') return '–'; var neg = n < 0; n = Math.abs(Number(n)); return (neg ? '−' : '') + cur() + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function num(n) { return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }
function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ''; }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 2600); }
function busy(btn, on) { if (!btn) return; if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; } else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; } }
function fail(e, btn) { busy(btn, false); toast(e.message || String(e)); }
function d(ds) { if (!ds) return ''; var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return Number(ds.slice(8, 10)) + ' ' + m[Number(ds.slice(5, 7)) - 1] + (ds.length > 10 ? ' ' + ds.slice(11, 16) : ''); }
function can(p) { return S.profile && S.profile.kind === 'S' && (S.profile.role === 'SUPER' || S.profile.perms.indexOf(p) >= 0); }
function isSuper() { return S.profile && S.profile.role === 'SUPER'; }
function opts(list, sel, label, value) { return list.map(function (x) { var v = value ? value(x) : x.id; return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(label ? label(x) : x.name) + '</option>'; }).join(''); }
function itemOpts(items, sel) { return '<option value="">Choose item…</option>' + items.map(function (i) { return '<option value="' + esc(i.code) + '"' + (i.code === sel ? ' selected' : '') + '>' + esc(i.code) + (i.type === 'PART' ? ' (part)' : '') + '</option>'; }).join(''); }
var STATUS = { COUNT1: ['Waiting for count 1', 'warn'], COUNT2: ['Waiting for count 2', 'info'], MISMATCH: ['Counts differ', 'err'], LOCKED: ['Locked', 'ok'] };
function statusPill(s) { var x = STATUS[s] || [s, '']; return '<span class="pill ' + x[1] + '">' + esc(x[0]) + '</span>'; }
function invPill(s) { return s === 'DONE' ? '<span class="pill ok">In inventory</span>' : s === 'PENDING' ? '<span class="pill err">Not in inventory yet</span>' : s === 'NONE' ? '<span class="pill">Parts only</span>' : ''; }

/* ---------- shell ---------- */
function menu() {
  var p = S.profile;
  if (p.kind === 'K') return [['home', '🏠', 'Home'], ['handover', '📦', 'Hand over goods'], ['work', '🧾', 'My work'], ['slip', '💰', 'Payslips'], ['pin', '🔑', 'Change PIN']];
  var m = [];
  if (can('reports')) m.push(['dash', '📊', 'Dashboard']);
  if (can('count') || can('reports')) m.push(['count', '✅', 'Count goods']);
  if (can('count') || can('reports')) m.push(['batches', '📦', 'Batches']);
  if (can('orders') || can('reports') || can('issue')) m.push(['orders', '🧵', 'Work orders']);
  if (can('issue') || can('confirm') || can('reports')) m.push(['material', '🧰', 'Material issue']);
  if (can('reports') || can('issue') || can('confirm')) m.push(['balance', '⚖️', 'Material balance']);
  m.push(['-']);
  if (can('approve') || can('reports')) m.push(['payroll', '💰', 'Payroll']);
  if (can('advances') || can('approve')) m.push(['advances', '🤝', 'Advances']);
  if (can('masters') || can('reports')) m.push(['karigars', '👷', 'Karigars & rates']);
  if (can('masters') || can('reports')) m.push(['items', '🏷️', 'Items & materials']);
  if (isSuper()) { m.push(['-']); m.push(['staff', '🛡️', 'Staff & permissions']); m.push(['log', '📜', 'Change log']); }
  m.push(['pin', '🔑', 'Change PIN']);
  return m;
}
function navHtml() {
  return '<div class="nav">' + menu().map(function (x) {
    if (x[0] === '-') return '<div class="sep"></div>';
    return '<a class="' + (S.view === x[0] ? 'on' : '') + '" onclick="go(\'' + x[0] + '\')"><span>' + x[1] + '</span>' + esc(x[2]) + '</a>';
  }).join('') + '<div class="sep"></div><a onclick="logout()"><span>🚪</span>Log out</a></div>';
}
function shell() {
  var p = S.profile;
  $('app').innerHTML = '<div class="top"><button id="menuBtn" onclick="openDrawer()">☰</button><div class="t">' + esc(p.company) + ' · Production</div>' +
    '<div class="who">' + esc(p.name) + '<br><span style="opacity:.8">' + esc(p.id) + (p.kind === 'K' ? ' · Karigar' : p.role === 'SUPER' ? ' · Super admin' : ' · Staff') + '</span></div></div>' +
    '<div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>' +
    '<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel" id="drawerNav"></div></div>';
}
function openDrawer() { $('drawer').classList.add('open'); }
function closeDrawer() { $('drawer').classList.remove('open'); }
function go(view, arg) {
  S.view = view; S.arg = arg; closeDrawer();
  $('side').innerHTML = navHtml(); $('drawerNav').innerHTML = navHtml();
  var v = VIEWS[view] || VIEWS.home;
  $('main').innerHTML = '<div class="card muted" style="text-align:center;padding:30px"><span class="spinner dark"></span></div>';
  try { history.replaceState(null, '', '#' + view); } catch (e) { /* ignore */ }
  window.scrollTo(0, 0);
  v(arg);
}
function render(html) { $('main').innerHTML = html; }
function modal(title, body) {
  closeModal();
  var o = document.createElement('div'); o.className = 'overlay'; o.id = 'modal';
  o.innerHTML = '<div class="sheet"><div class="hd"><b>' + esc(title) + '</b><button class="x" onclick="closeModal()">×</button></div>' + body + '</div>';
  o.addEventListener('click', function (e) { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal() { var m = $('modal'); if (m) m.remove(); }

/* ---------- login ---------- */
function loginView(msg) {
  $('app').innerHTML = '<div class="login"><div class="logo">🧵 ' + esc(S.company || 'Travalate') + '</div><div class="muted" style="text-align:center;margin-bottom:18px">Production · Karigar app</div>' +
    '<div class="card">' + (msg ? '<div class="msg err">' + esc(msg) + '</div>' : '') +
    '<label class="f">Your ID</label><input id="lid" autocapitalize="characters" placeholder="e.g. K001" value="' + esc(store.get('lastId') || '') + '">' +
    '<label class="f">PIN</label><input id="lpin" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key===\'Enter\')doLogin(document.getElementById(\'lbtn\'))">' +
    '<button class="btn block" id="lbtn" onclick="doLogin(this)">Log in</button></div></div>';
}
function doLogin(btn) {
  busy(btn, true);
  api('login', val('lid'), val('lpin')).then(function (r) {
    S.token = r.token; S.profile = r.profile; store.set('token', r.token); store.set('lastId', r.profile.id);
    start();
  }).catch(function (e) { busy(btn, false); loginView(e.message); });
}
function logoutLocal() { S.token = null; store.set('token', null); loginView(); }
function logout() { var t = S.token; logoutLocal(); api('logout', t).catch(function () {}); }
function start() {
  shell();
  var h = (location.hash || '').slice(1);
  var ok = menu().some(function (m) { return m[0] === h; });
  go(ok ? h : (S.profile.kind === 'K' ? 'home' : can('reports') ? 'dash' : menu()[0][0]));
}

/* ======================= KARIGAR ======================= */
var VIEWS = {};
VIEWS.home = function () {
  api('getHome', S.token).then(function (r) {
    var p = r.pay;
    render('<h1 class="page">Namaste, ' + esc(S.profile.name) + ' 🙏</h1>' +
      '<div class="card"><div class="muted">This pay period · ' + esc(r.period.label) + '</div>' +
      '<div class="big" style="margin:6px 0 2px">' + money(p.net) + '</div><div class="muted">Earned ' + money(p.earned) + (p.advance ? ' · Advance cut ' + money(p.advance) : '') + ' · ' + p.good + ' good pieces</div>' +
      (p.lines.length ? '<table class="tbl" style="margin-top:10px"><tr><th>Item</th><th class="r">Good</th><th class="r">Rate</th><th class="r">Amount</th></tr>' +
        p.lines.map(function (l) { return '<tr><td>' + esc(l.item) + '</td><td class="r">' + l.good + '</td><td class="r">' + (l.rate === null ? '<span class="pill warn">No rate</span>' : money(l.rate)) + '</td><td class="r">' + money(l.amount) + '</td></tr>'; }).join('') + '</table>' : '') +
      '<button class="btn block" onclick="go(\'handover\')">📦 Hand over finished goods</button></div>' +
      (r.orders.length ? '<div class="card"><h2>🧵 My work orders</h2><div class="list">' + r.orders.map(function (o) {
        return '<div class="it"><div class="grow"><b>' + esc(o.item) + '</b><div class="muted">' + o.id + ' · given ' + d(o.date) + '</div></div><div style="text-align:right"><b>' + o.received + ' / ' + o.qty + '</b><div class="muted">' + o.remaining + ' to make</div></div></div>';
      }).join('') + '</div></div>' : '') +
      (r.balances.length ? '<div class="card"><h2>🧰 Material with me</h2><table class="tbl"><tr><th>Material</th><th class="r">Given</th><th class="r">Used</th><th class="r">With me</th></tr>' + r.balances.map(function (b) {
        return '<tr><td>' + esc(b.materialName) + '</td><td class="r">' + num(b.issued - b.returned) + '</td><td class="r">' + num(b.used) + '</td><td class="r ' + (b.balance < 0 ? 'neg' : '') + '"><b>' + num(b.balance) + '</b> ' + esc(b.unit) + '</td></tr>';
      }).join('') + '</table></div>' : '') +
      (r.batches.length ? '<div class="card"><h2>📦 Recent hand-overs</h2><div class="list">' + r.batches.map(batchRow).join('') + '</div></div>' : ''));
  }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + '</div>'); });
};
function batchRow(b) {
  return '<div class="it" onclick="showBatch(\'' + b.id + '\')" style="cursor:pointer"><div class="grow"><b>' + esc(b.id) + '</b> ' + statusPill(b.status) + ' ' + invPill(b.inventory) +
    '<div class="muted">' + esc(b.karigar) + ' · ' + (b.finalDate ? 'counted ' + d(b.finalDate) : 'from ' + d(b.createdAt)) + '</div></div>' +

function paid(k, btn) {
  var t = new Date(), ds = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
  modal('Mark as paid', '<label class="f">Date paid</label><input type="date" id="pdD" value="' + ds + '"><button class="btn block ok" id="pdB">Save</button>');
  $('pdB').onclick = function () { busy(this, true); api('markPaid', S.token, S.data.pay.period.key, k, val('pdD')).then(function () { closeModal(); toast('Marked as paid'); go('payroll', S.data.pay.period.key); }).catch(function (e) { fail(e, $('pdB')); }); };
}
function adminSlip(k) { api('payslip', S.token, S.data.pay.period.key, k).then(function (r) { modal('Payslip', slipHtml(r)); }).catch(function (e) { toast(e.message); }); }
function payCsv() {
  var r = S.data.pay, rows = [['Karigar ID', 'Karigar', 'Good', 'Rejected', 'Earned', 'Advance', 'Net', 'Status', 'Paid date']];
  r.list.forEach(function (p) { rows.push([p.karigarId, p.name, p.good, p.rejected, p.earned, p.advance, p.net, p.status, p.paidDate || '']); });
  rows.push(['', 'Total', '', '', r.earned, r.advance, r.net, '', '']);
  var csv = rows.map(function (x) { return x.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var name = 'Karigar payroll ' + r.period.label + '.csv';
  if (window.AttendanceApp && AttendanceApp.saveFile) { AttendanceApp.saveFile(btoa(unescape(encodeURIComponent('﻿' + csv))), name, 'text/csv'); return; }
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = name; a.click();
}

  $('amB').onclick = function () { busy(this, true); api('topUpAdvance', S.token, id, { add: val('amA'), note: val('amN') }).then(function () { closeModal(); go('advances'); }).catch(function (e) { fail(e, $('amB')); }); };
}
function advStatus(id, st) { api('setAdvanceStatus', S.token, id, st).then(function () { closeModal(); go('advances'); }).catch(function (e) { toast(e.message); }); }

/* ---------- karigars & rates ---------- */
VIEWS.karigars = function () {
  api('karigarList', S.token).then(function (r) {
    S.data.kl = r;
    render('<h1 class="page">👷 Karigars & rates</h1>' +
      (r.canEdit ? '<div class="card"><h2>Add a karigar</h2><div class="row"><input id="kN" placeholder="Name"><input id="kP" placeholder="Phone"></div><div class="row" style="margin-top:8px"><input id="kI" placeholder="ID (blank = automatic)"><input id="kPin" inputmode="numeric" placeholder="PIN (4–8 digits)"><button class="btn fix" onclick="addKarigar(this)">Add</button></div></div>' : '') +
      '<div class="card scroll"><table class="tbl"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Joined</th><th>Status</th><th></th></tr>' + r.list.map(function (k) {
        return '<tr><td><b>' + esc(k.id) + '</b></td><td>' + esc(k.name) + '</td><td>' + esc(k.phone) + '</td><td>' + d(k.joined) + '</td><td>' + (k.active ? '<span class="pill ok">active</span>' : '<span class="pill">inactive</span>') + '</td>' +
          '<td style="white-space:nowrap"><button class="btn sm" onclick="rates(\'' + k.id + '\')">Rates</button> ' + (r.canEdit ? '<button class="btn sec sm" onclick="editKarigar(\'' + k.id + '\')">Edit</button>' : '') + '</td></tr>';
      }).join('') + '</table></div>');
  }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + '</div>'); });
};
function addKarigar(btn) { busy(btn, true); api('saveKarigar', S.token, { name: val('kN'), phone: val('kP'), newId: val('kI'), pin: val('kPin') }).then(function () { toast('Karigar added'); go('karigars'); }).catch(function (e) { fail(e, btn); }); }
function editKarigar(id) {
  var k = S.data.kl.list.filter(function (x) { return x.id === id; })[0];
  modal('Edit ' + k.id, '<label class="f">Name</label><input id="ekN" value="' + esc(k.name) + '"><label class="f">Phone</label><input id="ekP" value="' + esc(k.phone) + '"><label class="f">Note</label><input id="ekO" value="' + esc(k.note) + '">' +
    '<div class="chk"><input type="checkbox" id="ekA"' + (k.active ? ' checked' : '') + '> Active</div><button class="btn block" id="ekB">Save</button>' +
    '<h3>Reset PIN</h3><div class="row"><input id="ekPin" inputmode="numeric" placeholder="New PIN"><button class="btn sec fix" id="ekR">Reset</button></div>');
  $('ekB').onclick = function () { busy(this, true); api('saveKarigar', S.token, { id: id, name: val('ekN'), phone: val('ekP'), note: val('ekO'), active: $('ekA').checked }).then(function () { closeModal(); go('karigars'); }).catch(function (e) { fail(e, $('ekB')); }); };
  $('ekR').onclick = function () { busy(this, true); api('resetPin', S.token, id, val('ekPin')).then(function () { busy($('ekR'), false); toast('PIN reset'); }).catch(function (e) { fail(e, $('ekR')); }); };
}
function rates(id) {
  api('rateList', S.token, id).then(function (r) {
    var k = S.data.kl.list.filter(function (x) { return x.id === id; })[0];
    var t = new Date(), ds = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    modal('Rates · ' + k.name,
      '<table class="tbl"><tr><th>Item</th><th class="r">Rate today</th></tr>' + r.items.map(function (i) { return '<tr><td>' + esc(i.code) + (i.type === 'PART' ? ' <span class="pill">part</span>' : '') + '</td><td class="r">' + (i.rate === null ? '<span class="muted">–</span>' : '<b>' + money(i.rate) + '</b>') + '</td></tr>'; }).join('') + '</table>' +
      (r.canEdit ? '<h3>Set a new rate</h3><select id="rtI">' + itemOpts(r.items) + '</select><div class="row" style="margin-top:8px"><input id="rtR" type="number" step="any" inputmode="decimal" placeholder="Rate per piece"><input id="rtF" type="date" value="' + ds + '"></div><input id="rtN" style="margin-top:8px" placeholder="Note (e.g. new design)"><button class="btn block" id="rtB">Save rate</button>' : '') +
      '<h3>Rate history</h3>' + (r.history.map(function (h) { return '<div class="muted">' + esc(h.item) + ': <b>' + money(h.rate) + '</b> from ' + d(h.from) + ' · set by ' + esc(h.setBy.replace(/^\S+ /, '')) + ' ' + esc(h.setAt) + (h.note ? ' · ' + esc(h.note) : '') + '</div>'; }).join('') || '<div class="muted">No rates yet.</div>'));
    if ($('rtB')) $('rtB').onclick = function () { busy(this, true); api('saveRate', S.token, { karigarId: id, item: val('rtI'), rate: val('rtR'), from: val('rtF'), note: val('rtN') }).then(function () { toast('Rate saved'); rates(id); }).catch(function (e) { fail(e, $('rtB')); }); };
  }).catch(function (e) { toast(e.message); });
}

/* ---------- items, materials, BOM ---------- */
VIEWS.items = function () {
  api('itemList', S.token).then(function (r) {
    S.data.il = r;
    var mats = {}; r.materials.forEach(function (m) { mats[m.code] = m; });
    render('<h1 class="page">🏷️ Items & materials</h1>' +
      (r.canEdit ? '<div class="card"><h2>Add an item</h2><div class="row"><select id="itT" onchange="itType()"><option value="SKU">Inventory SKU (added to the Inventory App)</option><option value="PART">Part (paid, not in inventory)</option></select></div>' +
        '<div class="row" style="margin-top:8px"><input id="itC" list="invSkus" placeholder="SKU from the Inventory App"><datalist id="invSkus"></datalist><input id="itN" placeholder="Description (optional)"><button class="btn fix" onclick="addItem(this)">Add</button></div><div class="muted" id="itHint" style="margin-top:6px">Loading the SKU list from the Inventory App…</div></div>' : '') +
      '<div class="card scroll"><h2>Items</h2><table class="tbl"><tr><th>Code</th><th>Type</th><th>Material per piece (BOM)</th><th>Status</th><th></th></tr>' + r.list.map(function (i) {
        return '<tr><td><b>' + esc(i.code) + '</b>' + (i.name ? '<div class="muted">' + esc(i.name) + '</div>' : '') + '</td><td>' + (i.type === 'SKU' ? '<span class="pill info">Inventory SKU</span>' : '<span class="pill">Part</span>') + '</td>' +
          '<td>' + (i.bom.map(function (b) { var m = mats[b.material] || { name: b.material, unit: '' }; return esc(m.name) + ' <b>' + num(b.qty) + '</b> ' + esc(m.unit); }).join('<br>') || '<span class="pill warn">No BOM</span>') + '</td>' +
          '<td>' + (i.active ? '<span class="pill ok">active</span>' : '<span class="pill">inactive</span>') + '</td><td style="white-space:nowrap">' + (r.canEdit ? '<button class="btn sm" onclick="bomForm(\'' + esc(i.code).replace(/'/g, "\\'") + '\')">BOM</button> <button class="btn sec sm" onclick="toggleItem(\'' + esc(i.code).replace(/'/g, "\\'") + '\')">' + (i.active ? 'Deactivate' : 'Activate') + '</button>' : '') + '</td></tr>';
      }).join('') + '</table></div>' +
      '<div class="card scroll"><h2>Raw materials</h2>' + (r.canEdit ? '<div class="row" style="margin-bottom:8px"><input id="mtC" placeholder="Code (e.g. LEA-BLK)"><input id="mtN" placeholder="Name"><input id="mtU" placeholder="Unit (sq ft, m, pcs)"><button class="btn fix" onclick="addMat(this)">Add</button></div>' : '') +
      '<table class="tbl"><tr><th>Code</th><th>Name</th><th>Unit</th></tr>' + r.materials.map(function (m) { return '<tr><td><b>' + esc(m.code) + '</b></td><td>' + esc(m.name) + '</td><td>' + esc(m.unit) + '</td></tr>'; }).join('') + '</table></div>');
    if (r.canEdit) api('inventorySkus', S.token).then(function (skus) {
      $('invSkus').innerHTML = skus.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
      $('itHint').textContent = skus.length + ' SKUs in the Inventory App. Start typing to pick one.';
    }).catch(function (e) { if ($('itHint')) $('itHint').textContent = 'Inventory App not reachable: ' + e.message; });
  }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + '</div>'); });
};
function itType() { $('itC').placeholder = val('itT') === 'SKU' ? 'SKU from the Inventory App' : 'Part name (e.g. Shoulder Belt)'; }
function addItem(btn) { busy(btn, true); api('saveItem', S.token, { code: val('itC'), name: val('itN'), type: val('itT') }).then(function () { toast('Item added'); go('items'); }).catch(function (e) { fail(e, btn); }); }
function toggleItem(code) { var i = S.data.il.list.filter(function (x) { return x.code === code; })[0]; api('saveItem', S.token, { code: i.code, name: i.name, type: i.type, active: !i.active, checkInventory: false }).then(function () { go('items'); }).catch(function (e) { toast(e.message); }); }
function addMat(btn) { busy(btn, true); api('saveMaterial', S.token, { code: val('mtC'), name: val('mtN'), unit: val('mtU') }).then(function () { go('items'); }).catch(function (e) { fail(e, btn); }); }
function bomForm(code) {
  var i = S.data.il.list.filter(function (x) { return x.code === code; })[0];
  modal('Material per piece · ' + code, '<div class="muted" style="margin-bottom:8px">How much of each material one piece uses. Used to check every karigar\'s material (no wastage allowed).</div><div class="lines" id="bomLines"></div><button class="btn sec sm" onclick="addBomLine()">+ Add material</button><button class="btn block" id="bomB">Save</button>');
  (i.bom.length ? i.bom : [{}]).forEach(function (b) { addBomLine(b.material, b.qty); });
  $('bomB').onclick = function () {
    var lines = Array.prototype.map.call(document.querySelectorAll('#bomLines .ln'), function (ln) { return { material: ln.children[0].value, qty: Number(ln.children[1].value) }; });
    busy(this, true); api('saveBom', S.token, code, lines).then(function () { closeModal(); go('items'); }).catch(function (e) { fail(e, $('bomB')); });
  };
}
function addBomLine(mat, qty) {
  var div = document.createElement('div'); div.className = 'ln claim';
  div.innerHTML = '<select><option value="">Material…</option>' + S.data.il.materials.map(function (m) { return '<option value="' + esc(m.code) + '"' + (m.code === mat ? ' selected' : '') + '>' + esc(m.name) + ' (' + esc(m.unit) + ')</option>'; }).join('') + '</select><input type="number" step="any" inputmode="decimal" placeholder="Per piece" value="' + (qty || '') + '"><button class="x" onclick="this.parentNode.remove()">×</button>';
  $('bomLines').appendChild(div);
}

/* ---------- staff & log (super admin) ---------- */
VIEWS.staff = function () {
  api('staffList', S.token).then(function (r) {
    S.data.sl = r;
    render('<h1 class="page">🛡️ Staff & permissions</h1><div class="card"><button class="btn" onclick="staffForm()">+ Add staff</button></div>' +
      '<div class="card scroll"><table class="tbl"><tr><th>ID</th><th>Name</th><th>Role</th><th>Permissions</th><th>Status</th><th></th></tr>' + r.list.map(function (s) {
        return '<tr><td><b>' + esc(s.id) + '</b></td><td>' + esc(s.name) + '</td><td>' + (s.role === 'SUPER' ? '<span class="pill info">Super admin</span>' : 'Staff') + '</td><td class="muted">' + (s.role === 'SUPER' ? 'Everything' : s.perms.map(function (p) { return esc(r.perms[p]); }).join('<br>')) + '</td>' +
          '<td>' + (s.active ? '<span class="pill ok">active</span>' : '<span class="pill">inactive</span>') + '</td><td><button class="btn sec sm" onclick="staffForm(\'' + s.id + '\')">Edit</button></td></tr>';
      }).join('') + '</table></div>');
  }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + '</div>'); });
};
function staffForm(id) {
  var s = id ? S.data.sl.list.filter(function (x) { return x.id === id; })[0] : { perms: [], active: true, role: 'ADMIN' };
  modal(id ? 'Edit ' + id : 'Add staff',
    (id ? '' : '<label class="f">ID</label><input id="sfI" placeholder="e.g. S005"><label class="f">PIN</label><input id="sfP" inputmode="numeric">') +
    '<label class="f">Name</label><input id="sfN" value="' + esc(s.name || '') + '"><label class="f">Phone</label><input id="sfPh" value="' + esc(s.phone || '') + '">' +
    '<label class="f">Role</label><select id="sfR"><option value="ADMIN">Staff (chosen permissions)</option><option value="SUPER"' + (s.role === 'SUPER' ? ' selected' : '') + '>Super admin (everything)</option></select>' +
    '<label class="f">Permissions</label>' + Object.keys(S.data.sl.perms).map(function (p) { return '<div class="chk"><input type="checkbox" class="sfC" value="' + p + '"' + (s.perms.indexOf(p) >= 0 ? ' checked' : '') + '> ' + esc(S.data.sl.perms[p]) + '</div>'; }).join('') +
    (id ? '<div class="chk"><input type="checkbox" id="sfA"' + (s.active ? ' checked' : '') + '> Active</div><h3>Reset PIN</h3><div class="row"><input id="sfRp" inputmode="numeric" placeholder="New PIN"><button class="btn sec fix" id="sfRb">Reset</button></div>' : '') +
    '<button class="btn block" id="sfB">Save</button>');
  $('sfB').onclick = function () {
    var perms = Array.prototype.filter.call(document.querySelectorAll('.sfC'), function (c) { return c.checked; }).map(function (c) { return c.value; });
    busy(this, true);
    api('saveStaff', S.token, { id: id, newId: val('sfI'), pin: val('sfP'), name: val('sfN'), phone: val('sfPh'), role: val('sfR'), perms: perms, active: id ? $('sfA').checked : true })
      .then(function () { closeModal(); go('staff'); }).catch(function (e) { fail(e, $('sfB')); });
  };
  if ($('sfRb')) $('sfRb').onclick = function () { api('resetPin', S.token, id, val('sfRp')).then(function () { toast('PIN reset'); }).catch(function (e) { toast(e.message); }); };
}
VIEWS.log = function () {
  api('changeLog', S.token, S.data.logQ || '').then(function (r) {
    render('<h1 class="page">📜 Change log <small>everything that was entered or changed</small></h1><div class="row" style="margin-bottom:12px"><input id="lgQ" placeholder="Search (batch, karigar ID…)" value="' + esc(S.data.logQ || '') + '"><button class="btn fix" onclick="S.data.logQ=val(\'lgQ\');go(\'log\')">Search</button></div>' +
      '<div class="card scroll"><table class="tbl"><tr><th>When</th><th>Who</th><th>What</th><th>Ref</th><th>Details</th></tr>' + r.map(function (l) {
        return '<tr><td style="white-space:nowrap">' + esc(l.at) + '</td><td>' + esc(l.by) + '</td><td><span class="pill">' + esc(l.action) + '</span></td><td>' + esc(l.ref) + '</td><td>' + esc(l.details) + '</td></tr>';
      }).join('') + '</table></div>');
  }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + '</div>'); });
};

/* ---------- boot ---------- */
(function boot() {
  apiUrl();
  S.token = store.get('token');
  if (!S.token) {
    api('publicInfo').then(function (r) { S.company = r.company; loginView(); }).catch(function () { loginView(); });
    loginView();
    return;
  }
  $('app').innerHTML = '<div class="login"><div class="card" style="text-align:center;padding:30px"><span class="spinner dark"></span></div></div>';
  api('getHome', S.token).then(function (r) { S.profile = r.profile; start(); }).catch(function (e) { loginView(e.message === 'Please log in again.' ? '' : e.message); });
})();
</script>
</body>
</html>
