<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinkit Shipment Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--muted:#64748b;--line:#e2e8f0;--brand:#0f3460;--brand2:#16213e;--accent:#f8cb2e;
--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#182033;--ink:#e6ebf5;--muted:#94a3b8;--line:#2a3550;--brand:#3b82f6;--brand2:#0b1222;
--okbg:#12361f;--ok:#4ade80;--warnbg:#3a3010;--warn:#facc15;--badbg:#3d1414;--bad:#f87171;--infobg:#132a4d;--info:#93c5fd;--chip:#232d45}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .t{font-weight:700;font-size:15px;white-space:nowrap}.top .t span{color:var(--accent)}
.top .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--brand2);padding:0 8px;position:sticky;top:44px;z-index:19;scrollbar-width:none}
.nav button{background:none;border:0;color:#cbd5e1;padding:10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}.btn.g{background:#16a34a;color:#fff}.btn.r{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:block}
/* The two upload boxes are always the same width and height. */
.row.ups{align-items:stretch}.row.ups>.drop{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.drop.ok{border-color:#16a34a;background:var(--okbg)}
.drop.stale{border-color:#ca8a04;background:var(--warnbg)}
.drop input{display:none}.drop b{display:block;margin-bottom:2px}.drop span{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip b{margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px}.stat .v{font-size:20px;font-weight:800}.stat .k{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 6px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.line{display:grid;grid-template-columns:minmax(200px,2.2fr) repeat(5,minmax(62px,.7fr)) 92px minmax(56px,.6fr) minmax(70px,.7fr);gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.line.head{font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
/* Each warehouse block's title + column headings stay pinned under the top bar
   while scrolling through that block, and scroll away when the next block starts. */
.whsec{position:relative}
/* Search: pick several SKUs (chips) from a suggestion list. */
.srch{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:25;max-height:280px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.sugg div:last-child{border-bottom:0}
.sugg div.on,.sugg div:hover{background:var(--chip)}
.sugg small{color:var(--muted)}
#calAddL{position:static;max-height:220px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.picks:empty{display:none}
.picks .chip{cursor:default}.picks .chip button{border:0;background:none;cursor:pointer;padding:0 0 0 6px;font-weight:700;color:inherit}
.whhead{position:sticky;top:var(--stickTop,86px);z-index:5;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.whhead .grp{margin:0;padding:10px 10px 6px!important}
/* Warehouse blocks collapse / expand by clicking their title. */
.grp.tgl{cursor:pointer;user-select:none}.grp.tgl .chev{display:inline-block;width:14px;color:var(--muted)}
.whsec.shut .line{display:none}.whsec.shut .whhead{position:static;box-shadow:none;border-bottom:1px solid var(--line)}
.whsec.shut .whhead .grp{padding-bottom:10px!important}
/* Send heading: "fill all" box + ↺ reset under the word Send. */
.sendH{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fillW{display:flex;gap:3px;align-items:center}
.line .fillQ{width:58px;padding:3px 5px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:right}
.fillR{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;line-height:1.2}
.fillR:hover{background:var(--chip)}
.line .nm{font-weight:600}.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.line input{padding:7px;text-align:right;font-weight:700}
.line.send{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.line.lock{opacity:.6}
/* The row you are typing in (Tab / click) is highlighted. */
.line:focus-within{box-shadow:inset 4px 0 0 var(--brand);background:color-mix(in srgb,var(--infobg) 70%,transparent)}
.line input.q:focus{outline:2px solid var(--brand);outline-offset:1px}
.line .over{border-color:var(--bad);background:var(--badbg)}
.lbl{display:none;font-size:10px;color:var(--muted)}
@media (max-width:760px){
 .line{grid-template-columns:1fr 1fr 1fr 88px;gap:6px 8px}
 .line.head{display:none}.line .nm{grid-column:1/-1}.lbl{display:block}
 .line .c-days,.line .c-max{display:none}
 .wrap{padding:10px 10px 90px}
}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar .sum{flex:1;font-size:13px}.bar .sum b{font-size:16px}
.msg{padding:9px 11px;border-radius:9px;margin:8px 0;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;color:var(--muted)}
.scroll{overflow-x:auto}
.ro{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ro .h{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;background:var(--chip)}
.ro .h .w{font-weight:700;flex:1 1 220px}
.ro .b{padding:10px 12px;display:none}.ro.open .b{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.hidden{display:none!important}
/* A Send box not yet confirmed (the planner's suggestion): grey until clicked, typed in or filled. */
.line input.q.pend{color:var(--muted);font-weight:400;background:var(--chip)}
/* TI = Travalate Inventory stock; red when the plan sends more of the SKU (all warehouses) than TI has. */
.ti-c b{font-weight:700}.ti-c.tiover b{color:var(--bad)}.ti-c .tiw{display:block;font-size:10px;color:var(--bad)}.ti-c .tiw.ok{color:var(--muted)}
a.plk{color:var(--brand);font-weight:700;text-decoration:underline dotted;cursor:pointer}
/* Dashboard: sortable headings and the calendar. */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--ink)}th.sortable.on{color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw7{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cd{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--card);overflow:hidden}
.cd.empty{border:0;background:none;cursor:default}
.cd.past{background:var(--chip);opacity:.8}
.cd.today{border:2px solid var(--brand)}
.cd.sel{outline:2px solid var(--accent)}
.cdn{font-size:11px;font-weight:700;color:var(--muted)}
.cd.today .cdn{color:var(--brand)}
.cb{font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.ro{background:var(--infobg);color:var(--info)}.cb.ap{background:var(--okbg);color:var(--ok)}.cb.out{background:var(--badbg);color:var(--bad)}
.cb.ds{background:var(--chip);color:var(--ink)}.cb.ds.over{background:var(--badbg);color:var(--bad)}.cb.pk{background:var(--warnbg);color:var(--warn)}
.ld{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ld span{display:block;height:100%;background:var(--brand)}.ld.over span{background:var(--bad)}
.cd.off{background:repeating-linear-gradient(45deg,var(--card),var(--card) 6px,var(--chip) 6px,var(--chip) 12px)}
.calw{margin:4px 0;font-size:13px}.calw summary{cursor:pointer}.calw ul{margin:4px 0 6px;padding-left:20px}
.calinfo{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.calinfo ul{margin:4px 0 0;padding-left:18px;font-size:13px}
@media (max-width:760px){.cd{min-height:54px;padding:3px}.cb{font-size:9px;padding:1px 2px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
.login{max-width:360px;margin:40px auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(127,127,127,.35);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div class="t">📦 Blinkit <span>Shipment Planner</span></div><div class="who" id="who"></div></div>
<div class="nav hidden" id="nav"></div>
<div class="wrap" id="app"><div class="card muted">Loading…</div></div>
<div id="bar" class="bar hidden"></div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>

<script>
/* ======================= CORE-START (pure planning logic, no page code) ======================= */
var PlanCore = (function () {
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /** Finds the header row (the one containing all names) and turns the rows below it into objects. */
  function tableFrom(rows, must) {
    for (var h = 0; h < Math.min(rows.length, 10); h++) {
      var head = (rows[h] || []).map(function (x) { return String(x == null ? '' : x).trim(); });
      if (must.every(function (m) { return head.indexOf(m) >= 0; })) {
        var out = [];
        for (var i = h + 1; i < rows.length; i++) {
          var r = rows[i]; if (!r || !r.length) continue;
          var o = { __row: i + 1 };
          head.forEach(function (k, j) { if (k) o[k] = r[j]; });
          out.push(o);
        }
        return { head: head, rows: out, headRow: h };
      }
    }
    return null;
  }

  /** Blinkit "Stock On Hand" (Inventory) download. */
  function parseInventory(sheetRows) {
    var t = tableFrom(sheetRows, ['Item ID', 'Warehouse Facility ID', 'Total sellable', 'Last 7 days']);
    if (!t) return null;
    var first = String((sheetRows[0] || [])[0] || '');
    var m = first.match(/generated at\s+(.+)$/i);
    return {
      generatedAt: m ? m[1].trim() : '',
      rows: t.rows.filter(function (r) { return num(r['Item ID']); }).map(function (r) {
        return {
          item: num(r['Item ID']), name: String(r['Item Name'] || ''), whId: num(r['Warehouse Facility ID']),
          whName: String(r['Warehouse Facility Name'] || ''), sellable: num(r['Total sellable']),
          warehouse: num(r['Warehouse']), between: num(r['In-between']), darkstore: num(r['Darkstore']),
          s7: num(r['Last 7 days']), s15: num(r['Last 15 days']), s30: num(r['Last 30 days'])
        };
      })
    };
  }

  /** Blinkit "SELLER_BULK_SHIPMENT_INPUT" (Bulk RO) download. */
  function parseBulk(sheetRows) {
    var t = tableFrom(sheetRows, ['Warehouse ID', 'Item ID', 'Max Inventory', 'RO Quantity']);
    if (!t) return null;
    return {
      head: t.head,
      rows: t.rows.filter(function (r) { return num(r['Item ID']) && num(r['Warehouse ID']); }).map(function (r) {
        return {
          row: r.__row, whId: num(r['Warehouse ID']), whName: String(r['Warehouse Name'] || '').trim(), item: num(r['Item ID']),
          name: String(r['Item Name'] || ''), sellable: num(r['Sellable Quantity']), incoming: num(r['Incoming Quantity']),
          min: num(r['Suggested Min Inventory']), max: num(r['Max Inventory']),
          locked: String(r['Lock Status'] || '').toUpperCase() === 'LOCKED', remarks: String(r['Remarks'] || '').trim()
        };
      })
    };
  }

  /**
   * Blinkit's Inventory "generated at 2026-10-29 09:58:28" counts the stock as of the day before (28 Oct).
   * Returns { stockDate: 'yyyy-mm-dd', elapsed: whole days from the stock date to todayStr }, or null.
   */
  function stockInfo(generatedAt, todayStr) {
    var m = String(generatedAt || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    var t = String(todayStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m || !t) return null;
    var stock = Date.UTC(+m[1], +m[2] - 1, +m[3] - 1), now = Date.UTC(+t[1], +t[2] - 1, +t[3]);
    return { stockDate: new Date(stock).toISOString().slice(0, 10), elapsed: Math.max(0, Math.round((now - stock) / 864e5)) };
  }

  /** Warehouse names compared ignoring spaces and capitals ("Hyderabad H3 -  Feeder" = "hyderabad h3 - feeder"). */
  function whNorm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }

  function median(a) {
    a = a.slice().sort(function (x, y) { return x - y; });
    var n = a.length; if (!n) return 0;
    return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }

  /**
   * The plan for every warehouse × item row of the Bulk RO file.
   * o = { coverDays, minLine, roundTo, skus: {item: {sku, group, tier}}, openROs: [...], bulkAt: ms, elapsed: days }
   *  - elapsed = days from the stock date (Inventory generated-at date − 1) to today. Those days' sales are already
   *    gone, so the target is rate × (cover days + elapsed) and "days now" counts from today.
   *  - stock now = "Total sellable" of the Inventory file (warehouse + in-between + darkstore)
   *  - incoming  = Blinkit "Incoming Quantity" + RO Log lines Blinkit cannot know yet
   *                (Planned, or Created on Blinkit — R.O. PDF time, else app save time — after the Bulk file was downloaded)
   *  - daily rate ("Per day") = the HIGHEST of the 7-, 15- and 30-day averages (sold ÷ days), rounded UP to a
   *    whole unit — e.g. 37 in 7 days (5.29/day), 41 in 15 (2.73), 64 in 30 (2.13) → 6 a day.
   */
  function dailyRate(s7, s15, s30) { return s30 > 0 || s15 > 0 || s7 > 0 ? Math.ceil(Math.max(s7 / 7, s15 / 15, s30 / 30)) : 0; }

  function computePlan(inv, bulk, o) {
    var COVER = o.coverDays || 26, MIN = o.minLine || 10, RT = o.roundTo || 5, skus = o.skus || {};
    var invAt = {};
    inv.forEach(function (r) { invAt[r.whId + '|' + r.item] = r; });
    var rates = {};
    bulk.forEach(function (b) {
      var x = invAt[b.whId + '|' + b.item];
      if (x && x.s30 > 0) (rates[b.item] = rates[b.item] || []).push(dailyRate(x.s7, x.s15, x.s30));
    });
    var med = {};
    Object.keys(rates).forEach(function (k) { med[k] = median(rates[k]); });
    var extra = {}, recent = {}, older = {}, RECENT_MS = 3 * 864e5, LIVE_MS = 30 * 864e5;
    var bulkDay = o.bulkAt ? new Date(o.bulkAt + 330 * 60000).toISOString().slice(0, 10) : ''; // India date of the file
    (o.openROs || []).forEach(function (r) {
      // A Created RO is in Blinkit's Incoming once Blinkit has it: from the R.O. time printed on its PDF when known,
      // otherwise from when it was saved in the app.
      var at = r.blinkitAt || r.createdAt;
      var count = r.status === 'Planned' || (r.status === 'Created' && (!o.bulkAt || !at || at > o.bulkAt));
      var k = whNorm(r.wh) + '|' + num(r.item);
      if (count) extra[k] = (extra[k] || 0) + num(r.qty);
      // Created on Blinkit before the Bulk RO file but maybe not in its Incoming yet: from the last 3 days, or with no
      // appointment yet (Blinkit may list an RO as Incoming only once it has one), up to 30 days old (ROs expire).
      else if (r.status === 'Created' && o.bulkAt && at && (at >= o.bulkAt - RECENT_MS || (!r.appt && at >= o.bulkAt - LIVE_MS))) recent[k] = (recent[k] || 0) + num(r.qty);
      // Older Created ROs still on their way (under 30 days old, appointment not passed): Blinkit's Incoming is
      // matched to these first. One whose appointment has passed has most likely arrived.
      else if (r.status === 'Created' && o.bulkAt && at && at >= o.bulkAt - LIVE_MS && !(r.appt && bulkDay && String(r.appt) < bulkDay)) older[k] = (older[k] || 0) + num(r.qty);
    });

    return bulk.map(function (b) {
      var x = invAt[b.whId + '|' + b.item] || null;
      var s7 = x ? x.s7 : 0, s15 = x ? x.s15 : 0, s30 = x ? x.s30 : 0;
      var wh = x ? x.warehouse : 0, ds = x ? x.sellable - x.warehouse : 0, inc = b.incoming, app = extra[whNorm(b.whName) + '|' + b.item] || 0;
      // Safety: when Blinkit's Incoming is less than those recent ROs (Blinkit doesn't show them yet), count the
      // missing part from the RO Log, so the same stock is never planned twice.
      var kk = whNorm(b.whName) + '|' + b.item;
      var gap = Math.max(0, (recent[kk] || 0) - Math.max(0, inc - (older[kk] || 0)));
      app += gap;
      var pos = wh + ds + inc + app;
      var drr = dailyRate(s7, s15, s30), status, kind;
      if (s30 === 0) { drr = 0; status = pos === 0 ? 'Not live here' : 'In stock, no sales yet'; kind = pos === 0 ? 'notlive' : 'nosale'; }
      else if (s7 === s30) { status = 'New listing (≤7 days)'; kind = 'new'; }
      else if (s30 - s15 <= 0.1 * s30) { status = 'New listing (≤15 days)'; kind = 'new'; }
      else { status = 'Established'; kind = 'est'; }
      var EL = o.elapsed || 0;
      var target = drr * (COVER + EL), need = Math.max(0, target - pos), rec = 0, note = '';
      if (need >= MIN / 2) { rec = Math.ceil(need / RT) * RT; if (rec < MIN) rec = MIN; }
      if (rec > b.max) { note = 'Capped at Blinkit max ' + b.max + ' (needed ' + rec + ')'; rec = b.max >= RT ? Math.floor(b.max / RT) * RT : b.max; }
      var starter = 0;
      if (kind === 'notlive' && !b.locked && b.min > 0 && med[b.item] >= 1) {
        starter = Math.min(b.min, b.max, Math.max(MIN, Math.ceil(med[b.item] * COVER * 0.5 / RT) * RT));
      }

  function dispatchOf(r) { return r.appt ? prevWorkDay(addDays(r.appt, -transitOf(r.wh))) : (r.dispatch || ''); }
  /** Arrival at the warehouse: the appointment, or dispatch + shipping days. */
  function arrivalOf(r) { if (r.appt) return r.appt; var d = dispatchOf(r); return d ? addDays(d, transitOf(r.wh)) : ''; }
  /** One entry per RO as on Blinkit (merged RO / same RO number / one batch) from RO Log lines. */
  function roGroups(lines) {
    var g = {};
    (lines || []).forEach(function (r) {
      if (r.status === 'Cancelled') return;
      var k = r.merged ? 'M' + r.merged + r.wh : r.roNo ? 'N' + r.roNo + PlanCore.whNorm(r.wh) : 'B' + r.batch;
      var x = g[k] = g[k] || { key: k, wh: r.wh, groups: [], batches: [], units: 0, roNo: r.roNo, status: r.status, appt: r.appt, dispatch: r.dispatch, roDate: r.roDate, notes: r.notes || '', lines: [] };
      if (x.groups.indexOf(r.group) < 0) x.groups.push(r.group);
      if (x.batches.indexOf(r.batch) < 0) x.batches.push(r.batch);
      x.units += Number(r.qty) || 0; x.lines.push(r);
      if (r.appt) x.appt = r.appt;
      if (r.dispatch && !x.dispatch) x.dispatch = r.dispatch;
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  }
  /**
   * Spreads ROs (no appointment, no dispatch day) over the working days after packing, up to the daily capacity
   * on top of what is already planned, most urgent first. Returns { batchId: day } and the plan per RO.
   */
  function spreadDispatch(todo, openLines, urgency) {
    var c = dConf(), load = {}, out = {}, plan = [], skip = {};
    todo.forEach(function (t) { t.batches.forEach(function (b) { skip[b] = 1; }); });
    roGroups(openLines).forEach(function (x) { if (x.batches.some(function (b) { return skip[b]; })) return; var dd = dispatchOf(x); if (dd) load[dd] = (load[dd] || 0) + x.units; });
    var start = nextWorkDay(addDays(today(), c.pack));
    todo.slice().sort(function (a, b) { return (urgency(a) - urgency(b)) || (b.units - a.units); }).forEach(function (t) {
      var d = start;
      for (var i = 0; i < 90; i++) {
        if (isWorkDay(d) && ((load[d] || 0) + t.units <= c.cap || !(load[d] || 0))) break;
        d = addDays(d, 1);
      }
      load[d] = (load[d] || 0) + t.units;
      t.batches.forEach(function (b) { out[b] = d; });
      plan.push({ wh: t.wh, groups: t.groups, units: t.units, day: d });
    });
    return { dates: out, plan: plan.sort(function (a, b) { return a.day.localeCompare(b.day); }), load: load };
  }
  /** "Delivered 24 Nov · leaves the month tab 26 Nov" / "… · removed from the tab 26 Nov". */
  function deliveredPill(r) {
    var d = r.deliveredOn ? prettyDate(r.deliveredOn) : '';
    var gone = r.removedAt ? 'removed from the month tab ' + prettyDate(r.removedAt) : r.deliveredOn ? 'leaves the month tab ' + prettyDate(addDays(r.deliveredOn, 2)) : '';
    return '<span class="pill ok">Delivered' + (d ? ' ' + d : '') + '</span>' + (gone ? ' <span class="small muted">' + gone + '</span>' : '');
  }
  function skuText(sku, item) { return (sku ? String(sku) : 'No SKU') + ' · ' + item; }
  function skuOf(item) { var x = (S.boot.skus || []).filter(function (s) { return s.item === Number(item); })[0]; return x ? x.sku : ''; }
  // Always TBI, TBO, TBG first (the server's object can arrive in any key order), then any others.
  function groupList() {
    var order = ['TBI', 'TBO', 'TBG'], g = S.boot && S.boot.groups ? Object.keys(S.boot.groups) : [];
    return order.concat(g.filter(function (x) { return order.indexOf(x) < 0; }).sort());
  }
  function groupName(g) { return (S.boot && S.boot.groups && S.boot.groups[g]) || (g || 'No group'); }
  function msgs(list, cls) { return (list || []).map(function (w) { return '<div class="msg ' + (cls || 'warn') + '">' + esc(w) + '</div>'; }).join(''); }

  /* ---------------- server ---------------- */
  function serverUrl() {
    var id = null;
    try { id = new URLSearchParams(location.search).get('id'); } catch (e) { /* old browser */ }
    if (id) store('bp_api', id); else {
      id = load('bp_api') || API_URL;
      if (id && !IN_APPS_SCRIPT && history.replaceState) {
        try { history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(id) + location.hash); } catch (e) { /* ignore */ }
      }
    }
    if (!id) return null;
    return /^https?:/.test(id) ? id : 'https://script.google.com/macros/s/' + id + '/exec';
  }

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var fail = function (err) {
      var msg = String((err && err.message) || err).replace(/^Exception:\s*/, '');
      if (msg.indexOf('SESSION_EXPIRED') >= 0) { store('bp_token', null); S.token = null; showLogin('Please log in again.'); }
      return Promise.reject(new Error(msg));
    };
    if (IN_APPS_SCRIPT) {
      return new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args); }).catch(fail);
    }
    var url = serverUrl();
    if (!url) return fail(new Error('The app link is incomplete: it needs ?id=<Apps Script deployment ID>.'));
    var body = JSON.stringify({ fn: fn, args: args, rid: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) });
    var attempt = function (n) {
      return fetch(url, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
        .then(function (r) {
          if (!r.ok) throw Object.assign(new Error('The server is busy (' + r.status + '). Try again.'), { retry: true });
          return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw Object.assign(new Error('The server is busy. Try again.'), { retry: true }); } });
        }, function () { throw Object.assign(new Error('No internet connection, or the server could not be reached.'), { retry: true }); })
        .catch(function (e) { if (!e.retry || n >= 3) throw e; return new Promise(function (r) { setTimeout(r, [700, 1500, 3000][n]); }).then(function () { return attempt(n + 1); }); });
    };
    return attempt(0).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'Something went wrong.');
      return res.result;
    }).catch(fail);
  }

  function refreshBoot() { return api('getBoot', S.token).then(function (b) { S.boot = b; return b; }); }

  /* ======================= New Plan ======================= */
  function renderPlan() {

      '<div class="row ups">' +
      '<label class="drop' + (S.inv ? (invIsToday() ? ' ok' : ' stale') : '') + '" id="dInv"><input type="file" accept=".xlsx" id="fInv"><b>Inventory</b>' +
      '<span class="small muted">' + (S.invLoading ? '<span class="spin"></span> Reading Formula Sheet…' : S.inv ? (S.inv.fromSheet ? 'From Formula Sheet' : esc(S.inv.fileName)) + ' · ' + S.inv.rows.length + ' rows' + (S.inv.generatedAt ? ' · generated ' + esc(S.inv.generatedAt) : '') : 'InventoryData.xlsx (Stock On Hand)') +

        (S.restoredAt ? 'Restored the plan saved ' + new Date(S.restoredAt).toLocaleString('en-IN') + ' (files, typed quantities and filters). ' : '') +
        (S.draftOk === false ? '<b>These files are too big to keep in this browser — a refresh will clear the plan.</b> ' : 'The plan stays after a refresh until you wipe it. ') +
        '</div><div style="flex:0 0 auto"><button class="btn r" id="bWipe">🗑 Wipe plan</button></div></div>' : '') +
      '<div class="small muted" style="margin-top:8px">The Inventory comes from the sheet\'s Formula Sheet, which the daily 📦 Blinkit Inventory upload fills. Download a fresh Bulk RO file each time — Blinkit\'s max limits and locks change during the day.</div>' +
      '<div class="row" style="margin-top:10px">' +

      '<div><label class="f">New-listing starters</label><select id="pStart"><option value="0">No — only where it already sells</option><option value="1"' + (S.starters ? ' selected' : '') + '>Yes — add a starter qty where not live</option></select></div>' +

  /** "2026-10-29 09:58:28" (Blinkit's generated-at) is today. */
  function stockInfoNow() { return S.inv ? PlanCore.stockInfo(S.inv.generatedAt, today()) : null; }
  function invIsToday() { return !!(S.inv && String(S.inv.generatedAt || '').slice(0, 10) === today()); }

  /** Reads the Inventory that the daily updater pasted into "Formula Sheet". */
  function loadSheetInventory() {
    S.invTried = true; S.invLoading = true; S.invErr = '';
    renderPlan();
    api('getSheetInventory', S.token).then(function (rows) {
      var inv = PlanCore.parseInventory(rows);
      if (!inv) throw new Error('Formula Sheet does not look like a Blinkit Inventory download.');
      inv.fromSheet = true;
      S.inv = inv; S.invLoading = false; S.final = {};

    }, function (e) {

  }

  /** Reads a Blinkit Inventory or Bulk RO .xlsx. Returns 'bulk' or 'inv'; throws if it is neither. */
  function readBuffer(buf, name, at) {
    var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    var rowsOf = function (n) { return XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true }); };
    if (wb.SheetNames.indexOf('Bulk RO') >= 0) {
      var b = PlanCore.parseBulk(rowsOf('Bulk RO'));
      if (b) { S.bulk = b; S.bulkBuf = buf; S.bulkAt = at || Date.now(); S.bulkName = name; return 'bulk'; }
    }
    for (var i = 0; i < wb.SheetNames.length; i++) {
      var inv = PlanCore.parseInventory(rowsOf(wb.SheetNames[i]));
      if (inv) { inv.fileName = name; S.inv = inv; S.invBuf = buf; S.invErr = ''; return 'inv'; }
    }
    throw new Error(name + ' is not a Blinkit Inventory or Bulk RO file.');
  }

  function readFile(f) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        readBuffer(rd.result, f.name, f.lastModified);
        S.final = {};
        saveDraftFiles();
        renderPlan();
        freshPlan(false);
      } catch (e) { $('pErr').innerHTML = msgs([e.message], 'bad'); }
    };
    rd.readAsArrayBuffer(f);
  }

  /* ---- Draft: the plan survives a page refresh until "Wipe" (kept in this browser only) ---- */
  var DRAFT_FILES = 'bp_draft_files', DRAFT_STATE = 'bp_draft_state';
  function b64(buf) { var u = new Uint8Array(buf), s = '', CH = 0x8000; for (var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH)); return btoa(s); }
  function unb64(t) { var s = atob(t), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
  function draftUser() { return S.boot && S.boot.user ? S.boot.user.id : ''; }
  function saveDraftFiles() {
    var d = { user: draftUser(), savedAt: Date.now() };
    if (S.bulkBuf) d.bulk = { b64: b64(S.bulkBuf), name: S.bulkName, at: S.bulkAt };
    if (S.inv && !S.inv.fromSheet && S.invBuf) d.inv = { b64: b64(S.invBuf), name: S.inv.fileName };
    try { localStorage.setItem(DRAFT_FILES, JSON.stringify(d)); S.draftOk = true; }
    catch (e) { S.draftOk = false; try { localStorage.removeItem(DRAFT_FILES); } catch (e2) { /* ignore */ } }
  }
  var draftTimer = null;
  function saveDraftState(now) {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      if (!S.bulk && !S.inv) return;
      store(DRAFT_STATE, JSON.stringify({ user: draftUser(), edited: S.edited || {}, confirmed: S.confirmed || {}, filter: S.filter, cover: S.cover || null,
        starters: S.starters, invFromSheet: !!(S.inv && S.inv.fromSheet) }));
    }, now ? 0 : 250);
  }
  function wipeDraft() {
    store(DRAFT_FILES, null); store(DRAFT_STATE, null);
    S.inv = null; S.invBuf = null; S.invTried = false; S.invErr = ''; S.bulk = null; S.bulkBuf = null; S.bulkAt = null; S.bulkName = '';
    S.plan = null; S.final = {}; S.edited = {}; S.confirmed = {}; S.cover = null; S.starters = !!S.boot.settings.starters;
    S.filter = { whs: [], group: '', only: true, q: '', picks: [] };
  }
  /** Puts back the uploaded files, typed quantities and filters saved before the page was refreshed. */
  function restoreDraft() {
    var f, st;
    try { f = JSON.parse(load(DRAFT_FILES) || 'null'); st = JSON.parse(load(DRAFT_STATE) || 'null'); } catch (e) { return false; }
    if (!f || f.user !== draftUser() || !f.bulk) return false;
    try {
      readBuffer(unb64(f.bulk.b64), f.bulk.name, f.bulk.at);
      if (f.inv) readBuffer(unb64(f.inv.b64), f.inv.name);
    } catch (e) { return false; }
    if (st && st.user === draftUser()) {
      S.edited = st.edited || {};
      S.confirmed = st.confirmed || {};
      if (st.filter) { S.filter = st.filter; S.filter.picks = S.filter.picks || []; S.filter.whs = S.filter.whs || (S.filter.wh ? [S.filter.wh] : []); delete S.filter.wh; }
      if (st.cover) S.cover = st.cover;
      if (st.starters != null) S.starters = st.starters;
    }
    S.draftOk = true; S.keepEditsOnce = true; S.restoredAt = f.savedAt; S.snapOnce = true;
    return true;
  }

  /**
   * Works out the plan with the RO Log as it is right now (not the copy read when the page was opened), so ROs
   * added or changed elsewhere (another device, another person, the RO Log tab itself) are always counted.
   */
  function freshPlan(keepEdits) {
    if (!S.inv || !S.bulk) { recompute(keepEdits); return; }
    if ($('planOut') && !S.plan) $('planOut').innerHTML = '<div class="card muted"><span class="spin"></span> Reading the latest RO Log…</div>';
    refreshBoot().then(function () { recompute(keepEdits); }, function (e) {
      recompute(keepEdits);
      toast('Could not read the latest RO Log (' + e.message + '). The plan uses the one read when the page was opened.', 7000);
    });
  }

  function skuMap() { var m = {}; (S.boot.skus || []).forEach(function (s) { m[s.item] = s; }); return m; }

  function recompute(keepEdits) {
    if (!S.inv || !S.bulk) { S.plan = null; renderPlanOut(); return; }
    var s = S.boot.settings;
    var sm = skuMap();
    S.plan = PlanCore.computePlan(S.inv.rows, S.bulk.rows, {
      coverDays: S.cover || s.coverDays, minLine: s.minLine, roundTo: s.roundTo, skus: sm,
      openROs: S.boot.openROs, bulkAt: S.bulkAt, elapsed: (stockInfoNow() || {}).elapsed || 0
    }).filter(function (r) { return !(sm[r.item] && sm[r.item].active === false); }); // Settings → SKUs: Active unticked = left out
    var old = keepEdits ? S.edited || {} : {};
    S.edited = {}; S.final = {};
    if (!keepEdits || !S.confirmed) S.confirmed = {}; // a fresh plan starts with every Send box grey (suggested)
    S.plan.forEach(function (r) {
      var def = r.locked ? 0 : r.rec + (S.starters ? r.starter : 0);
      S.final[r.key] = old[r.key] !== undefined ? old[r.key] : def;
      if (old[r.key] !== undefined) S.edited[r.key] = old[r.key];
    });
    renderPlanOut();
    // A new plan updates the Dashboard; so does a plan brought back after a refresh (worked out again with the
    // current rules and RO Log), so the Dashboard never keeps an older calculation.
    if (!keepEdits || S.snapOnce) { S.snapOnce = false; saveSnapshot(); }
  }

  /**
   * After an RO is saved or changed anywhere (RO PDF, by hand, RO Log), the plan on New Plan is worked out again
   * with the new RO Log, and the Dashboard's copy is saved again. Quantities typed on the plan are kept.
   */
  function refreshPlanAfterRoChange() {
    if (!S.inv || !S.bulk) return;
    var keep = Object.keys(S.edited || {}).length > 0;
    recompute(keep);
    if (keep) saveSnapshot();
  }

  function saveSnapshot() {
    if (!can('Planner') || !S.plan) return;
    var rows = S.plan.filter(function (r) { return r.rate > 0 || r.position > 0; }).map(function (r) {
      return [r.wh, r.item, r.name, r.group, r.status, Math.round(r.rate * 10) / 10, r.position,
        r.daysAtStock == null ? '' : Math.round(r.daysAtStock * 10) / 10, r.rec, r.locked ? 'Yes' : '',
        r.whStock + r.dsStock, r.incoming + r.appIncoming, r.incoming, r.appIncoming];
    });
    var items = {}; S.plan.forEach(function (r) { items[r.item] = { item: r.item, name: r.name }; });
    var units = 0, lines = 0; S.plan.forEach(function (r) { if (r.rec > 0) { units += r.rec; lines++; } });
    api('saveSnapshot', S.token, rows, { inventoryAt: S.inv.generatedAt, bulkAt: S.bulkAt, units: units, lines: lines,
      items: Object.keys(items).map(function (k) { return items[k]; }) })
      .then(function () { return refreshBoot(); })
      .then(function () {
        // New items may have been added to the SKU list: show their group if an admin set one meanwhile.
        var m = skuMap(); S.plan.forEach(function (r) { var x = m[r.item]; if (x) { r.sku = x.sku; r.group = x.group; r.tier = x.tier; } });
        if (S.tab === 'plan') renderPlanOut();
      }, function () { /* the plan works without it */ });
  }

  function visibleRows() {
    var f = S.filter, q = f.q.toLowerCase(), picks = f.picks || [];
    return S.plan.filter(function (r) {
      if (f.whs.length && f.whs.indexOf(r.wh) < 0) return false;
      if (f.group && (r.group || '?') !== f.group) return false;
      // Picked SKUs: show every line of just those SKUs (even ones with nothing to send);
      // the search text then only drives the suggestion list.
      if (picks.length) return picks.indexOf(Number(r.item)) >= 0;
      // "Lines to send": a line you changed yourself stays on screen even at 0, so a block filled or typed down to 0
      // keeps its heading (and its ↺ reset) instead of disappearing.
      if (f.only && !(S.final[r.key] > 0) && !(r.locked && r.note) && !(S.edited && r.key in S.edited)) return false;
      if (q && (r.name + ' ' + r.sku + ' ' + r.item).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function totals() {
    var byWh = {}, units = 0, lines = 0, bad = 0;
    S.plan.forEach(function (r) {
      var q = S.final[r.key] || 0;
      if (q > 0) { units += q; lines++; (byWh[r.wh] = byWh[r.wh] || { units: 0, lines: 0 }); byWh[r.wh].units += q; byWh[r.wh].lines++; }
      if (q > r.max || (q > 0 && r.locked)) bad++;
    });
    return { byWh: byWh, units: units, lines: lines, bad: bad };
  }

  function renderPlanOut() {
    var out = $('planOut'); if (!out) return;
    if (!S.plan) {
      out.innerHTML = (S.inv || S.bulk) ? '<div class="card muted">Now add the ' + (S.inv ? 'Bulk RO' : 'Inventory') + ' file.</div>' : '';

    }

    S.plan.forEach(function (r) { if (whs.indexOf(r.wh) < 0) whs.push(r.wh); });
    whs.sort();
    var locked = S.plan.filter(function (r) { return r.locked && r.note; });
    var noGroup = S.plan.filter(function (r) { return !r.group && (S.final[r.key] || 0) > 0; });
    var info = [];
    var si = stockInfoNow();
    if (si) info.push('Stock as of ' + prettyDate(si.stockDate) + ' (Inventory generated ' + prettyDate(String(S.inv.generatedAt).slice(0, 10)) + '). ' +
      (si.elapsed ? si.elapsed + ' day' + (si.elapsed > 1 ? 's' : '') + ' of sales since then are taken off: days count from today and the plan covers ' + (S.cover || S.boot.settings.coverDays) + ' days from today.' : ''));
    else info.push('The Inventory has no "generated at" date, so its stock is taken as of today.');
    var inApp = S.plan.reduce(function (a, r) { return a + r.appIncoming; }, 0);
    if (inApp) info.push('Counted ' + fmt(inApp) + ' units from the RO Log that Blinkit\'s file cannot show yet (Planned, or created after this file was downloaded).');
    var gapAll = S.plan.reduce(function (a, r) { return a + (r.blinkitGap || 0); }, 0);
    if (gapAll) info.push('Of these, ' + fmt(gapAll) + ' units are from ROs created on Blinkit before this Bulk RO file (in the last 3 days, or with no appointment yet) that its Incoming does not show yet — counted so they are not sent twice.');
    var html = '<div class="card"><h2>2. Plan — ' + fmt(t.units) + ' units on ' + t.lines + ' lines</h2>' +
      '<div class="chips" id="whChips"><span class="chip' + (S.filter.whs.length ? '' : ' on') + '" data-wh="" title="All warehouses">All<b>' + fmt(t.units) + '</b></span>' +
      whs.map(function (w) { var x = t.byWh[w]; return '<span class="chip' + (S.filter.whs.indexOf(w) >= 0 ? ' on' : '') + '" title="Click to add or remove this warehouse" data-wh="' + esc(w) + '">' + esc(w.replace(/ - Feeder( Warehouse)?| Feeder$/, '')) + '<b>' + (x ? fmt(x.units) : 0) + '</b></span>'; }).join('') +
      '</div>' + (S.filter.whs.length ? '<div class="small muted" style="margin-top:4px">Showing ' + S.filter.whs.length + ' warehouse' + (S.filter.whs.length > 1 ? 's' : '') + ' · <span id="whPickU">' +
        fmt(S.filter.whs.reduce(function (a, w) { return a + (t.byWh[w] ? t.byWh[w].units : 0); }, 0)) + '</span> units — click more to add, click a ticked one to remove, <b>All</b> to clear.</div>' : '<div class="small muted" style="margin-top:4px">Click warehouses to pick one or more.</div>') +
      '<div class="row" style="margin-top:10px">' +
      '<div><label class="f">Group</label><select id="fGroup"><option value="">' + esc(groupList().join(' + ')) + '</option>' + groupList().map(function (g) { return '<option value="' + g + '"' + (S.filter.group === g ? ' selected' : '') + '>' + esc(groupName(g)) + '</option>'; }).join('') + '<option value="?"' + (S.filter.group === '?' ? ' selected' : '') + '>No group set</option></select></div>' +
      '<div><label class="f">Show</label><select id="fOnly"><option value="1">Lines to send (+ locked)</option><option value="0"' + (S.filter.only ? '' : ' selected') + '>All items</option></select></div>' +
      '<div class="srch"><label class="f">Search — pick one or more SKUs</label><input type="text" id="fQ" autocomplete="off" placeholder="SKU or item ID, Enter to add" value="' + esc(S.filter.q) + '"><div class="sugg hidden" id="fSugg"></div></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="bClr" title="Clear all filters">✕ Clear</button></div>' +
      '<div style="flex:0 0 auto"><button class="btn" id="bXls">⬇ Plan (Excel)</button></div></div>' +
      '<div class="picks" id="fPicks"></div>' +
      tiInfoHtml() + // (the stock-date and RO Log counting notes are no longer shown, on request)
      (noGroup.length ? '<div class="msg warn">' + noGroup.length + ' line(s) have no ' + groupList().join('/') + ' group, so they cannot be logged: ' + esc(noGroup.slice(0, 6).map(function (r) { return skuText(r.sku, r.item); }).join(', ')) + (noGroup.length > 6 ? '…' : '') + '. An admin sets it in Settings → SKUs.</div>' : '') +
      (locked.length ? '<details class="msg warn" id="lockedBox"' + (S.lockedOpen ? ' open' : '') + '><summary style="cursor:pointer"><b>Needed but locked on Blinkit (' + locked.length + ')</b> <span class="small">— click to ' + (S.lockedOpen ? 'hide' : 'show') + '</span></summary><div style="margin-top:6px">' + esc(locked.map(function (r) { return r.wh.replace(/ - Feeder( Warehouse)?| Feeder$/, '') + ' – ' + skuText(r.sku, r.item) + ' (' + r.note.match(/needed (\d+)/)[1] + ')'; }).join('; ')) + '</div></details>' : '') +
      '</div><div class="card" style="padding:0 0 4px" id="lines"></div>';
    out.innerHTML = html;
    // "Needed but locked" starts collapsed; it opens on click and stays as you left it.
    if ($('lockedBox')) $('lockedBox').addEventListener('toggle', function () {
      S.lockedOpen = this.open;
      var t = this.querySelector('summary .small'); if (t) t.textContent = '— click to ' + (this.open ? 'hide' : 'show');
    });
    $('whChips').onclick = function (e) {
      var c = e.target.closest('.chip'); if (!c) return;
      var w = c.getAttribute('data-wh'), list = S.filter.whs, i = list.indexOf(w);
      if (!w) list.length = 0; else if (i >= 0) list.splice(i, 1); else list.push(w);
      renderPlanOut();
    };
    $('fGroup').onchange = function () { S.filter.group = this.value; renderLines(); };
    $('fOnly').onchange = function () { S.filter.only = this.value === '1'; renderLines(); };
    initSkuPicker();
    $('bClr').onclick = function () { S.filter = { whs: [], group: '', only: true, q: '', picks: [] }; renderPlanOut(); };
    $('bXls').onclick = exportPlan;
    renderPicks();
    if ($('tiRe')) $('tiRe').onclick = function (e) { e.preventDefault(); S.ti = null; renderPlanOut(); loadTi(true); };
    loadTi(false);
    renderLines();
    renderBar();
  }

  // ---- Search: multi-SKU picker ----
  function skuChoices() {
    var seen = {}, out = [];
    S.plan.forEach(function (r) {
      var k = Number(r.item); if (seen[k]) return; seen[k] = 1;
      out.push({ item: k, sku: r.sku || '', name: r.name || '' });
    });
    return out.sort(function (a, b) { return String(a.sku || a.item).localeCompare(String(b.sku || b.item), undefined, { numeric: true }); });
  }
  function skuMatches(q) {
    q = String(q || '').trim().toLowerCase(); if (!q) return [];
    var picks = S.filter.picks;
    return skuChoices().filter(function (c) {
      return picks.indexOf(c.item) < 0 && (c.sku + ' ' + c.item + ' ' + c.name).toLowerCase().indexOf(q) >= 0;
    });
  }
  function addPicks(items) {
    var changed = false;
    items.forEach(function (it) { it = Number(it); if (it && S.filter.picks.indexOf(it) < 0) { S.filter.picks.push(it); changed = true; } });
    if (changed) { S.filter.q = ''; $('fQ').value = ''; renderPicks(); renderLines(); }
    return changed;
  }
  function renderPicks() {
    var box = $('fPicks'); if (!box) return;
    var all = skuChoices(), by = {}; all.forEach(function (c) { by[c.item] = c; });
    box.innerHTML = S.filter.picks.map(function (it) {
      var c = by[it] || { sku: '', item: it };
      return '<span class="chip on">' + esc(skuText(c.sku, c.item)) + '<button data-it="' + it + '" title="Remove">×</button></span>';
    }).join('') + (S.filter.picks.length ? '<span class="small muted" style="align-self:center">Showing all lines of ' + S.filter.picks.length + ' SKU' + (S.filter.picks.length > 1 ? 's' : '') + '</span>' : '');
    box.onclick = function (e) {
      var b = e.target.closest('button[data-it]'); if (!b) return;
      var it = Number(b.getAttribute('data-it'));
      S.filter.picks = S.filter.picks.filter(function (x) { return x !== it; });
      renderPicks(); renderLines();
    };
  }
  function initSkuPicker() {
    var inp = $('fQ'), sg = $('fSugg'), list = [], hi = 0;
    function draw() {
      list = skuMatches(inp.value).slice(0, 30);
      if (!list.length) { sg.classList.add('hidden'); return; }
      if (hi >= list.length) hi = 0;
      sg.innerHTML = list.map(function (c, i) {
        return '<div data-i="' + i + '" class="' + (i === hi ? 'on' : '') + '"><b>' + esc(c.sku || 'No SKU') + '</b> · ' + c.item + (c.name ? ' <small>' + esc(c.name) + '</small>' : '') + '</div>';
      }).join('');
      sg.classList.remove('hidden');
    }
    inp.oninput = function () {
      S.filter.q = this.value; hi = 0; draw();
      if (!S.filter.picks.length) renderLines();
    };
    inp.onfocus = draw;
    inp.onblur = function () { setTimeout(function () { sg.classList.add('hidden'); }, 150); };
    inp.onkeydown = function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!list.length) return; e.preventDefault();
        hi = (hi + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length; draw();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        // Several SKUs pasted at once (comma / space / new line separated): add each exact match.
        var parts = inp.value.split(/[\s,;]+/).filter(Boolean);
        if (parts.length > 1) {
          var all = skuChoices(), hits = [];
          parts.forEach(function (p) { p = p.toLowerCase(); all.forEach(function (c) { if (String(c.sku).toLowerCase() === p || String(c.item) === p) hits.push(c.item); }); });
          if (addPicks(hits)) { sg.classList.add('hidden'); return; }
        }
        if (list.length) { addPicks([list[hi].item]); hi = 0; draw(); }
      } else if (e.key === 'Escape') { sg.classList.add('hidden'); }
    };
    sg.onmousedown = function (e) {
      var d = e.target.closest('[data-i]'); if (!d) return;
      e.preventDefault(); addPicks([list[Number(d.getAttribute('data-i'))].item]); draw();
    };
  }

  // Days of cover after sending q more units (null when nothing sells).
  function daysAfter(r, q) { return r.rate > 0 ? (r.position + (q || 0)) / r.rate - r.elapsed : null; }
  // Days are always shown rounded DOWN to whole days (never below 0).
  function fmtDays(d) { return d == null || !isFinite(d) ? '–' : fmt(Math.max(0, Math.floor(d))); }

  function statusPill(r) {
    var cls = { est: '', low: 'warn', new: 'info', nosale: '', notlive: '' }[r.kind] || '';
    return '<span class="pill ' + cls + '">' + esc(r.status) + '</span>';
  }

  /* ---- TI: current stock in Travalate Inventory, per SKU (same for every warehouse) ---- */
  function tiNorm(x) { return String(x || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function tiKey(item, sku) { var x = skuMap()[Number(item)]; return tiNorm((x && x.tiSku) || sku || (x && x.sku)); }
  function tiQty(r) { if (!S.ti || !S.ti.ok) return null; var k = tiKey(r.item, r.sku); return k && S.ti.map[k] !== undefined ? S.ti.map[k] : null; }
  // A Send box counts in TI's "sending" only once confirmed: clicked into, typed in or filled (All). Until then it is
  // the planner's suggestion and shown grey.
  function isConfirmed(k) { return !!((S.confirmed && S.confirmed[k]) || (S.edited && k in S.edited)); }
  function sendOfItem(item) { var t = 0; S.plan.forEach(function (x) { if (x.item === item && isConfirmed(x.key)) t += S.final[x.key] || 0; }); return t; }
  function tiInner(r) {
    var q = tiQty(r);
    if (q == null) return '<b title="' + (S.ti && S.ti.ok ? 'Not found in Travalate Inventory — set its TI SKU in Settings → SKUs' : 'Travalate Inventory not loaded') + '">–</b>';
    var send = sendOfItem(r.item), over = send > q;
    // "sending N" = confirmed Send boxes of this SKU, all warehouses: grey while within TI, red once it is more.
    return '<b' + (over ? ' title="The plan sends ' + send + ' of this SKU (all warehouses) but TI has ' + q + '"' : '') + '>' + fmt(q) + '</b>' +
      (send > 0 ? '<span class="tiw' + (over ? '' : ' ok') + '" title="Confirmed Send quantity of this SKU, all warehouses together">sending ' + fmt(send) + '</span>' : '');
  }
  function tiCell(r) {
    var q = tiQty(r), over = q != null && sendOfItem(r.item) > q;
    return '<div class="right ti-c' + (over ? ' tiover' : '') + '" data-it="' + r.item + '"><span class="lbl">TI</span>' + tiInner(r) + '</div>';
  }
  function refreshTiCells(item) {
    var r = S.plan.filter(function (x) { return x.item === item; })[0]; if (!r) return;
    var q = tiQty(r), over = q != null && sendOfItem(item) > q;
    Array.prototype.forEach.call(document.querySelectorAll('.ti-c[data-it="' + item + '"]'), function (c) {
      c.classList.toggle('tiover', over); c.innerHTML = '<span class="lbl">TI</span>' + tiInner(r);
    });
  }
  /** Loads TI stock once per page (↻ reloads it); the plan works without it. */
  function loadTi(force) {
    if (S.tiLoading || (S.ti && !force)) return;
    S.tiLoading = true;
    api('getTiStock', S.token).then(function (res) {
      var map = {};
      (res.stocks || []).forEach(function (x) { map[tiNorm(x.sku)] = (map[tiNorm(x.sku)] || 0) + (Number(x.qty) || 0); });
      S.ti = { ok: !!res.ok, map: map, updatedAt: res.updatedAt, monthLabel: res.monthLabel, error: res.error, setup: res.setup };
    }, function (e) { S.ti = { ok: false, map: {}, error: e.message }; })
      .then(function () { S.tiLoading = false; if (S.tab === 'plan' && S.plan) renderPlanOut(); });
  }
  function tiInfoHtml() {
    if (!S.ti) return '<div class="msg info"><span class="spin"></span> Reading stock from Travalate Inventory (TI)…</div>';
    if (!S.ti.ok) return '<div class="msg warn">TI column: ' + esc(S.ti.error || 'Travalate Inventory could not be read.') + (S.ti.setup ? '' : ' <a href="#" id="tiRe">Try again</a>') + '</div>';
    var miss = [], seen = {};
    S.plan.forEach(function (r) { if (!seen[r.item] && (S.final[r.key] || 0) > 0 && tiQty(r) == null) { seen[r.item] = 1; miss.push(skuText(r.sku, r.item)); } });
    return '<div class="msg info">TI = stock in Travalate Inventory' + (S.ti.updatedAt ? ', read ' + new Date(S.ti.updatedAt).toLocaleString('en-IN') : '') + ' · <a href="#" id="tiRe">↻ refresh</a>' +
      '<br>Send boxes in <span style="color:var(--muted)">grey</span> are suggestions: they count in TI\'s "sending" once you click into them (or type / fill a quantity). "sending" turns red when it is more than TI.' +
      (miss.length ? '<br><b>' + miss.length + ' SKU(s) to send are not found in TI:</b> ' + esc(miss.slice(0, 8).join(', ')) + (miss.length > 8 ? '…' : '') + '. An admin sets their name in TI under Settings → SKUs → TI SKU.' : '') + '</div>';
  }

  /** A block heading's "260 units · 6 lines": the units and the lines being sent (quantity above 0) in it. */
  function blkSumText(keys) {
    var u = 0, n = 0;
    keys.forEach(function (k) { var q = S.final[k] || 0; if (q > 0) { u += q; n++; } });
    return fmt(u) + ' units · ' + n + (n === 1 ? ' line' : ' lines');
  }
  function renderLines() {
    saveDraftState(); // filters changed
    var rows = visibleRows(), box = $('lines'); if (!box) return;
    if (!rows.length) { box.innerHTML = '<div class="muted" style="padding:16px">Nothing to show with these filters.</div>'; return; }
    var groups = {};
    rows.forEach(function (r) { var k = r.wh + '||' + (r.group || '?'); (groups[k] = groups[k] || []).push(r); });
    // Send heading of each block: a small "fill all" box and a ↺ reset (both left out of the Tab order).
    var head = function (gi) {
      return '<div class="line head"><div>SKU · Item ID</div><div class="right">Sold 7d / 30d</div><div class="right">Per day</div><div class="right">Has now</div><div class="right c-days">Days now</div><div class="right c-max">Blinkit max</div>' +
        '<div class="sendH"><span>Send</span><span class="fillW"><input type="number" min="0" step="1" inputmode="numeric" class="fillQ" data-g="' + gi + '" tabindex="-1" placeholder="All" title="Type a quantity and press Enter: every Send box in this block gets it">' +
        '<button class="fillR" data-g="' + gi + '" tabindex="-1" title="Put every quantity in this block back to the suggestion">↺</button></span></div>' +
        '<div class="right" title="Current stock in Travalate Inventory (all warehouses together)">TI</div>' +
        '<div class="right">Days after</div></div>';
    };
    var blocks = [];
    var html = '';
    Object.keys(groups).sort().forEach(function (k) {
      var rs = groups[k], p = k.split('||');
      // Sorted by the planner's suggestion (not by what you typed), so rows stay put while you edit, fill or reset.
      var sug = function (r) { return r.locked ? 0 : r.rec + (S.starters ? r.starter : 0); };
      rs.sort(function (a, b) { return sug(b) - sug(a) || (a.daysNow == null ? 999 : a.daysNow) - (b.daysNow == null ? 999 : b.daysNow) || a.item - b.item; });
      var gi = blocks.push(rs.map(function (r) { return r.key; })) - 1;
      var shut = !!(S.shut && S.shut[k]);
      html += '<section class="whsec' + (shut ? ' shut' : '') + '" data-sk="' + esc(k) + '"><div class="whhead"><div class="grp tgl" style="padding:0 10px" title="Click to collapse / expand this block"><span><span class="chev">' + (shut ? '▸' : '▾') + '</span> ' + esc(p[0]) + ' · ' + esc(p[1] === '?' ? 'No group' : groupName(p[1])) + '</span><span class="blkSum">' + blkSumText(rs.map(function (r) { return r.key; })) + '</span></div>' + head(gi) + '</div>';
      rs.forEach(function (r) {
        var q = S.final[r.key] || 0, after = daysAfter(r, q);
        var over = q > r.max || (q > 0 && r.locked);
        var inc = r.incoming + r.appIncoming;
        html += '<div class="line' + (q > 0 ? ' send' : '') + (r.locked ? ' lock' : '') + '" data-k="' + esc(r.key) + '">' +
          '<div class="nm">' + (r.sku ? esc(r.sku) : '<span class="pill warn">No SKU</span>') + ' <span class="muted" style="font-weight:400">· ' + r.item + '</span> ' + statusPill(r) +
          '<small>' + (r.tier ? esc(r.tier) + ' · ' : '') + (r.daysNow != null && r.daysNow < 60 ? 'runs out ~' + prettyDate(addDays(today(), Math.max(0, Math.floor(r.daysNow)))) + ' · ' : '') +
          'stock ' + fmt(r.whStock + r.dsStock) + (inc ? ' + incoming ' + fmt(inc) : '') +
          (r.note ? ' · <b>' + esc(r.note) + '</b>' : (r.locked ? ' · Locked: ' + esc(r.remarks) : '')) +
          (r.starter && !r.locked ? ' · starter ' + r.starter : '') + '</small></div>' +
          '<div class="right"><span class="lbl">Sold 7d / 30d</span>' + fmt(r.s7) + ' / ' + fmt(r.s30) + '</div>' +
          '<div class="right"><span class="lbl">Per day</span>' + fmt(r.rate) + '</div>' +
          '<div class="right"><span class="lbl">Has now</span>' + fmt(r.position) + '</div>' +
          '<div class="right c-days">' + fmtDays(r.daysNow) + '</div>' +
          '<div class="right c-max">' + fmt(r.max) + '</div>' +
          '<div><span class="lbl">Send (max ' + fmt(r.max) + ')</span><input type="number" min="0" step="1" inputmode="numeric" class="q' + (over ? ' over' : '') + (isConfirmed(r.key) ? '' : ' pend') + '" value="' + (q || '') + '" placeholder="0"' + (r.locked || !can('Planner') ? ' disabled' : '') + '></div>' +
          tiCell(r) +
          '<div class="right"><span class="lbl">Days after</span><span class="dAfter">' + fmtDays(after) + '</span></div></div>';
      });
      html += '</section>';
    });
    box.innerHTML = '<div class="small" style="padding:10px 10px 0;text-align:right"><a href="#" id="shutAll">Collapse all</a> · <a href="#" id="openAll">Expand all</a></div>' + html;
    setStickTop();
    var setShut = function (sec, on) {
      S.shut = S.shut || {};
      S.shut[sec.getAttribute('data-sk')] = on;
      sec.classList.toggle('shut', on);
      sec.querySelector('.chev').textContent = on ? '▸' : '▾';
    };
    $('shutAll').onclick = function (e) { e.preventDefault(); Array.prototype.forEach.call(box.querySelectorAll('.whsec'), function (x) { setShut(x, true); }); };
    $('openAll').onclick = function (e) { e.preventDefault(); Array.prototype.forEach.call(box.querySelectorAll('.whsec'), function (x) { setShut(x, false); }); };
    var byKey = {}; S.plan.forEach(function (r) { byKey[r.key] = r; });
    var fillBlock = function (gi, v) {
      blocks[gi].forEach(function (k) {
        var r = byKey[k]; if (!r || r.locked) return;
        var q = Math.min(v, r.max); // never above Blinkit's max for that line
        S.final[k] = q; S.edited[k] = q;
      });
      renderLines(); renderBar(); toast('Filled ' + v + ' in every Send box of this block' + (blocks[gi].some(function (k) { return byKey[k] && v > byKey[k].max; }) ? ' (Blinkit max where lower)' : '') + '.');
    };
    var resetBlock = function (gi) {
      blocks[gi].forEach(function (k) {
        var r = byKey[k]; if (!r) return;
        delete S.edited[k];
        if (S.confirmed) delete S.confirmed[k]; // back to a grey suggestion
        S.final[k] = r.locked ? 0 : r.rec + (S.starters ? r.starter : 0);
      });
      renderLines(); renderBar(); toast('Quantities of this block are back to the suggestion.');
    };
    box.onkeydown = function (e) {
      if (!e.target.classList.contains('fillQ') || e.key !== 'Enter') return;
      e.preventDefault();
      if (e.target.value === '') return;
      fillBlock(Number(e.target.getAttribute('data-g')), Math.max(0, Math.round(Number(e.target.value) || 0)));
    };
    box.onclick = function (e) {
      var t = e.target.closest('.tgl');
      if (t) {
        var sec = t.closest('.whsec'), on = !sec.classList.contains('shut');
        setShut(sec, on);
        // Collapsing a block that is pinned at the top: bring its heading back into view.
        if (on && sec.getBoundingClientRect().top < 0) sec.scrollIntoView({ block: 'start' });
        return;
      }
      var b = e.target.closest('.fillR'); if (!b) return;
      resetBlock(Number(b.getAttribute('data-g')));
    };
    box.oninput = function (e) {
      if (!e.target.classList.contains('q')) return;
      var k = e.target.closest('.line').getAttribute('data-k');
      var v = Math.max(0, Math.round(Number(e.target.value) || 0));
      S.final[k] = v; S.edited[k] = v;
      var r = S.plan.filter(function (x) { return x.key === k; })[0];
      e.target.classList.toggle('over', v > r.max);
      e.target.closest('.line').classList.toggle('send', v > 0);
      var da = e.target.closest('.line').querySelector('.dAfter'); if (da) da.textContent = fmtDays(daysAfter(r, v));
      refreshTiCells(r.item);
      renderBar();
    };

  // Pinned warehouse headers sit just below the sticky top bar + tab row.
  function setStickTop() {
    var nav = document.querySelector('.nav'), top = document.querySelector('.top');
    // On a phone the top bar is taller (name, role, build on 3 lines): the tab row sticks right below it.
    if (nav && top) nav.style.top = top.offsetHeight + 'px';
    var h = (top ? top.offsetHeight : 0) + (nav && nav.offsetParent ? nav.offsetHeight : 0);
    if (h) document.documentElement.style.setProperty('--stickTop', h + 'px');
  }
  window.addEventListener('resize', setStickTop);

  // Ctrl+F (⌘F) jumps to the page's own search box: Dashboard → item search, New Plan → SKU search.
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || String(e.key).toLowerCase() !== 'f') return;
    var box = S.tab === 'dash' ? $('dQ') : S.tab === 'plan' ? $('fQ') : null;
    if (!box) return;
    e.preventDefault();
    box.focus(); box.select();
  });

  // Tabbing through the Send boxes: keep the focused box clear of the fixed bottom bar and of the
  // pinned warehouse heading at the top, by scrolling just enough.
  document.addEventListener('focusin', function (e) {
    var el = e.target;
    if (!el || !el.classList || !el.classList.contains('q')) return;
    // Clicking (or tabbing) into a Send box confirms it: it turns normal and now counts in TI's "sending".
    var ln = el.closest('.line'), ck = ln && ln.getAttribute('data-k');
    if (ck && S.plan && !isConfirmed(ck)) {
      (S.confirmed = S.confirmed || {})[ck] = true;
      el.classList.remove('pend');
      var rr = S.plan.filter(function (x) { return x.key === ck; })[0];
      if (rr) refreshTiCells(rr.item);
      saveDraftState();
    }
    requestAnimationFrame(function () { keepVisible(el); }); // after the browser's own scroll-into-view
  });
  function keepVisible(el) {
    var line = el.closest('.line') || el;
    var r = line.getBoundingClientRect(), gap = 8;
    var bar = $('bar'), barTop = bar && !bar.classList.contains('hidden') ? bar.getBoundingClientRect().top : window.innerHeight;
    var sec = line.closest('.whsec'), head = sec && sec.querySelector('.whhead');
    // Where the heading sits once pinned: just under the top bar, its own height tall (it may be mid-scroll now).
    var stick = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stickTop')) || 0;
    var headBottom = stick + (head ? head.offsetHeight : 0);
    // Keep the row in the middle part of the visible area: once it comes within ~2 rows of the bottom bar
    // or the pinned heading, scroll so it sits in the middle again (the rows around it stay visible too).
    var margin = Math.min(2 * r.height + gap, (barTop - headBottom) / 4);
    if (r.bottom > barTop - margin || r.top < headBottom + margin) {
      var mid = (headBottom + barTop) / 2;
      window.scrollBy(0, (r.top + r.bottom) / 2 - mid);
    }
  }

        roDate: $('cDate').value || today(), status: $('cStatus').value, source: 'Plan',

      }).then(function (res) {

  /**
   * The Excel files to make: "ALL" = one merged file, a group (TBI / TBO / TBG) = a file with only that group's lines.
   * The name says the group, and the warehouse when only one is ticked.
   */
  function roFiles(lines, kinds, whs) {
    var wh = whs.length === 1 ? '_' + whs[0].replace(/ - Feeder( Warehouse)?| Feeder$/, '').replace(/[^A-Za-z0-9]+/g, '') : '';
    var out = [];
    kinds.forEach(function (k) {
      var ls = k === 'ALL' ? lines : lines.filter(function (r) { return r.group === k; });
      if (!ls.length) return;
      out.push({ name: 'Blinkit_Bulk_RO_' + today() + wh + (k === 'ALL' ? '' : '_' + k) + '.xlsx', lines: ls,
        units: ls.reduce(function (a, r) { return a + (S.final[r.key] || 0); }, 0) });
    });
    return out;
  }
  /** Downloads the files one after another (a short pause so the browser takes each one). */
  function downloadFiles(files) {
    return files.reduce(function (p, f, i) {
      return p.then(function () { return downloadBlinkitFile(f.lines, f.name); })
        .then(function () { return i < files.length - 1 ? new Promise(function (r) { setTimeout(r, 700); }) : null; });
    }, Promise.resolve());
  }

  /** Blinkit's own Bulk RO file with RO Quantity and Shipping Address filled in for these lines. */
  function downloadBlinkitFile(lines, name) {
    var head = S.bulk.head;
    var qCol = PlanCore.colLetter(head.indexOf('RO Quantity')), aCol = PlanCore.colLetter(head.indexOf('Shipping Address'));
    var fills = {}; lines.forEach(function (r) { fills[r.row] = S.final[r.key]; });
    return JSZip.loadAsync(S.bulkBuf).then(function (zip) {
      return zip.file('xl/workbook.xml').async('string').then(function (wbx) {
        var m = wbx.match(/<sheet [^>]*name="Bulk RO"[^>]*r:id="([^"]+)"/) || wbx.match(/<sheet [^>]*r:id="([^"]+)"[^>]*name="Bulk RO"/);
        if (!m) throw new Error('The Bulk RO file looks different from usual (no "Bulk RO" sheet).');
        return zip.file('xl/_rels/workbook.xml.rels').async('string').then(function (rels) {
          var re = new RegExp('<Relationship [^>]*Id="' + m[1] + '"[^>]*>|<Relationship [^>]*Target="[^"]*"[^>]*Id="' + m[1] + '"[^>]*>');
          var rel = (rels.match(re) || [''])[0], tg = (rel.match(/Target="([^"]+)"/) || [])[1];
          if (!tg) throw new Error('Could not find the Bulk RO sheet inside the file.');
          var path = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, '');
          return zip.file(path).async('string').then(function (xml) {
            // Only the lines being ordered: Blinkit's other rows (other warehouses, items not ordered) are left out.
            var drop = {}; S.bulk.rows.forEach(function (b) { if (!fills[b.row]) drop[b.row] = 1; });
            zip.file(path, PlanCore.keepRowsXml(PlanCore.fillSheetXml(xml, fills, qCol, aCol, S.boot.settings.address), drop));
            return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
          });
        });
      });
    }).then(function (blob) { saveBlob(blob, name || 'Blinkit_Bulk_RO_' + today() + '.xlsx'); });
  }

  function saveBlob(blob, name) {
    // Inside the Android app the in-app browser cannot save downloads: hand the file to the app (→ Downloads).
    if (window.PlannerApp && window.PlannerApp.saveFile) {
      var rd = new FileReader();
      rd.onload = function () { window.PlannerApp.saveFile(String(rd.result).split(',')[1], name, blob.type || 'application/octet-stream'); };
      rd.readAsDataURL(blob);
      return;
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function exportPlan() {
    var rows = S.plan.map(function (r) {
      return { Warehouse: r.wh, Group: r.group, SKU: r.sku, 'Item ID': r.item, Status: r.status,
        'Sold 7d': r.s7, 'Sold 15d': r.s15, 'Sold 30d': r.s30, 'Per day': Math.round(r.rate * 10) / 10,
        'WH stock': r.whStock, 'Darkstore + transit': r.dsStock, 'Blinkit incoming': r.incoming, 'RO Log incoming': r.appIncoming,
        'Has now': r.position, 'Days now': r.daysNow == null ? '' : Math.max(0, Math.floor(r.daysNow)), 'Days since stock date': r.elapsed,
        Suggested: r.rec, Starter: r.starter, Send: S.final[r.key] || 0, 'Blinkit max': r.max, 'TI stock': tiQty(r) == null ? '' : tiQty(r), Note: r.note, Locked: r.locked ? r.remarks : '' };
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Plan');

  /**
   * One card per RO as it is on Blinkit. The app keeps one batch per group (each goes into its own TBI / TBO / TBG
   * block of the month tab), but batches created together with the Merged file, or carrying the same Blinkit RO
   * number for one warehouse, are one RO and are shown — and saved — together.
   */
  function cardsOf(rows) {
    var b = {}, cards = {};
    rows.forEach(function (r) { (b[r.batch] = b[r.batch] || []).push(r); });
    Object.keys(b).forEach(function (id) {
      var r0 = b[id][0];
      var key = r0.merged ? 'M|' + r0.merged + '|' + r0.wh : r0.roNo ? 'N|' + PlanCore.whNorm(r0.wh) + '|' + r0.roNo : 'B|' + id;
      (cards[key] = cards[key] || { key: key, batches: [], rows: [] }).batches.push(id);
      cards[key].rows = cards[key].rows.concat(b[id]);
    });
    return Object.keys(cards).map(function (k) { return cards[k]; }).sort(function (x, y) {
      return (y.rows[0].roDate + y.rows[0].batch).localeCompare(x.rows[0].roDate + x.rows[0].batch);
    });
  }

  function batchStatus(rs) {
    var st = {}; rs.forEach(function (r) { st[r.status] = 1; });
    var k = Object.keys(st); return k.length === 1 ? k[0] : 'Mixed';
  }

  function drawLog() {
    var box = $('logOut'); if (!box) return;
    var cs = cardsOf(S.logRows || []);
    if (!cs.length) { box.className = 'card muted'; box.innerHTML = 'No ROs for these filters.'; return; }
    box.className = '';
    var open = S.openBatch || {};
    var pc = { Planned: 'info', Created: 'warn', Delivered: 'ok', Cancelled: 'bad', Mixed: '' };
    var gOrder = groupList();
    box.innerHTML = cs.map(function (c, ci) {
      var rs = c.rows.slice().sort(function (a, b) { return gOrder.indexOf(a.group) - gOrder.indexOf(b.group); });
      var r0 = rs[0], st = batchStatus(rs), cg = roGroups(rs)[0] || { wh: r0.wh, appt: r0.appt, dispatch: r0.dispatch };
      var groups = []; rs.forEach(function (r) { if (groups.indexOf(r.group) < 0) groups.push(r.group); });
      var tabs = []; rs.forEach(function (r) { if (r.tabs && tabs.indexOf(r.tabs) < 0) tabs.push(r.tabs); });
      var units = rs.reduce(function (a, r) { return a + (r.status === 'Cancelled' ? 0 : r.qty); }, 0);
      var edit = can('Planner'), multi = groups.length > 1;
      return '<div class="ro' + (open[c.key] ? ' open' : '') + '" data-c="' + ci + '"><div class="h">' +

        '<span class="small">RO ' + prettyDate(r0.roDate) + '</span><span class="small"><b>' + fmt(units) + '</b> units · ' + rs.length + ' lines</span>' +
        (r0.appt ? '<span class="small">app ' + prettyDate(r0.appt) + '</span>' : '') + (dispatchOf(cg) ? '<span class="small">🚚 ' + prettyDate(dispatchOf(cg)) + '</span>' : '') + (r0.roNo ? '<span class="small">#' + esc(r0.roNo) + '</span>' : '') +

        (edit ? '<div class="row"><div><label class="f">Status (whole RO)</label><select class="bSt"><option value="">— keep —</option>' + ['Planned', 'Created', 'Delivered', 'Cancelled'].map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select></div>' +
          '<div class="bDelW hidden"><label class="f">Delivered on</label><input type="date" class="bDel" value="' + today() + '" max="' + today() + '"></div>' +
          '<div><label class="f">Appointment</label><input type="date" class="bAp" value="' + esc(r0.appt) + '"></div>' +
          '<div><label class="f">Dispatch day' + (cg.appt ? ' (from appointment)' : '') + '</label><input type="date" class="bDs" value="' + esc(dispatchOf(cg)) + '"' + (cg.appt ? ' disabled title="Worked out from the appointment"' : '') + '></div>' +
