        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th>' + (multi ? '<th>Group</th>' : '') + '<th class="right">Qty</th><th>Status</th>' + (edit ? '<th></th>' : '') + '</tr>' +
        rs.map(function (r) {
          return '<tr data-k="' + esc(r.key) + '"><td>' + esc(r.sku || 'No SKU') + '<div class="small muted">by ' + esc(r.createdBy) + (r.source && r.source !== 'Plan' ? ' · ' + esc(r.source === 'PDF' ? 'from PDF' : 'manual') : '') + '</div></td><td>' + r.item + '</td>' +
            (multi ? '<td>' + esc(r.group) + '</td>' : '') +
            '<td class="right">' + (edit && r.status !== 'Cancelled' ? '<input type="number" class="lQ" min="1" value="' + r.qty + '" style="width:80px;text-align:right">' : fmt(r.qty)) + '</td>' +
            '<td><span class="pill ' + pc[r.status] + '">' + r.status + '</span></td>' +
            (edit ? '<td class="nowrap">' + (r.status !== 'Cancelled' ? '<button class="btn sm lSave">Save</button> <button class="btn sm r lCan">Cancel line</button>' : '') + '</td>' : '') + '</tr>';
        }).join('') + '</table></div><div class="bmsg"></div></div></div>';
    }).join('');
    box.onchange = function (e) {
      if (!e.target.classList.contains('bSt')) return;
      e.target.closest('.ro').querySelector('.bDelW').classList.toggle('hidden', e.target.value !== 'Delivered');
    };
    box.onclick = function (e) {
      var ro = e.target.closest('.ro'); if (!ro) return;
      var c = cs[Number(ro.getAttribute('data-c'))];
      if (e.target.closest('.h')) { ro.classList.toggle('open'); (S.openBatch = S.openBatch || {})[c.key] = ro.classList.contains('open'); return; }
      var out = ro.querySelector('.bmsg');
      var done = function (r) { out.innerHTML = msgs(r && r.warnings, 'warn'); toast('Saved'); refreshBoot().then(refreshPlanAfterRoChange, function () {}); loadLog(); };
      var err = function (er) { out.innerHTML = msgs([er.message], 'bad'); };
      if (e.target.classList.contains('bSave')) {
        var ch = { appt: ro.querySelector('.bAp').value, roNo: ro.querySelector('.bNo').value.trim() };
        var st = ro.querySelector('.bSt').value; if (st) ch.status = st;
        if (st === 'Cancelled' && !confirm('Cancel the whole RO? Its quantities are taken out of the month tab.')) return;
        if (st === 'Delivered') {
          ch.deliveredOn = ro.querySelector('.bDel').value;
          if (!ch.deliveredOn) { ro.querySelector('.bmsg').innerHTML = msgs(['Enter the delivery date.'], 'bad'); return; }
        }
        e.target.disabled = true;
        // A merged RO is several batches (one per group): save each, then report all warnings together.
        var warns = [];
        c.batches.reduce(function (p, id) {
          return p.then(function () { return api('updateBatch', S.token, id, ch).then(function (r) { warns = warns.concat((r && r.warnings) || []); }); });
        }, Promise.resolve()).then(function () {
          var ds = ro.querySelector('.bDs');
          if (!ds || ds.disabled || ds.value === (c.rows[0].dispatch || '')) return;
          if (ds.value && !isWorkDay(ds.value)) { warns.push(prettyDate(ds.value) + ' is not a dispatch day; the dispatch day was not changed.'); return; }
          var dates = {}; c.batches.forEach(function (id) { dates[id] = ds.value; });
          return api('setDispatchDates', S.token, dates);
        }).then(function () { done({ warnings: warns }); }, err);
      }
      var tr = e.target.closest('tr'); if (!tr) return;
      var k = tr.getAttribute('data-k');
      if (e.target.classList.contains('lSave')) { e.target.disabled = true; api('updateROLine', S.token, k, { qty: Number(tr.querySelector('.lQ').value) }).then(done, err); }
      if (e.target.classList.contains('lCan')) { if (!confirm('Cancel this line? Its quantity is taken out of the month tab.')) return; e.target.disabled = true; api('updateROLine', S.token, k, { status: 'Cancelled' }).then(done, err); }
    };
  }

  /* ======================= Upload Blinkit R.O. PDFs ======================= */
  /** PDF text the way the Shipment Manager's extractPdfText_ builds it (text items grouped into lines by y). */
  function extractPdfText(buf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise.then(function (pdf) {
      var raw = '', p = 0;
      var next = function () {
        if (++p > pdf.numPages) return raw;
        return pdf.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (content) {
          var lineMap = {};
          content.items.forEach(function (item) {
            var y = item.transform ? Math.round(item.transform[5] * 10) / 10 : 0;
            (lineMap[y] = lineMap[y] || []).push(item.str);
          });
          Object.keys(lineMap).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) { raw += lineMap[y].join(' ') + '\n'; });
          raw += '\n';
          return next();
        });
      };
      return next();
    });
  }

  function addPdfFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      var e = { name: f.name, state: 'reading' };
      S.pdfs.unshift(e); // newest upload on top
      var rd = new FileReader();
      rd.onload = function () {
        extractPdfText(rd.result).then(function (text) {
          var d = PlanCore.readRoPdf(text, S.boot.warehouses);
          if (!d.ok) { e.state = 'err'; e.msg = d.message; }
          else {
            e.state = 'ready'; e.d = d;
            if (S.pdfs.some(function (x) { return x !== e && x.d && x.d.roNo === d.roNo; })) { e.state = 'err'; e.msg = 'RO ' + d.roNo + ' is already in this list.'; }
          }
          drawPdfs();
        }, function (err) { e.state = 'err'; e.msg = 'Could not read the PDF: ' + (err && err.message || err); drawPdfs(); });
      };
      rd.readAsArrayBuffer(f);
    });
    drawPdfs();
  }

  function pdfMatch(e) { return e.d && e.d.wh ? PlanCore.matchPlannerRo(e.d, S.boot.openROs) : null; }

  function drawPdfs() {
    var box = $('pdfList'); if (!box) return;
    var m = skuMap();
    var ready = S.pdfs.filter(function (e) { return e.state === 'ready'; });
    $('pdfAll').classList.toggle('hidden', ready.length < 2);
    box.innerHTML = S.pdfs.map(function (e, i) {
      if (e.state === 'reading') return '<div class="ro"><div class="h"><span class="spin"></span> Reading ' + esc(e.name) + '…</div></div>';
      if (e.state === 'err') return '<div class="ro"><div class="h"><span class="w">' + esc(e.name) + '</span><button class="btn sm pX" data-i="' + i + '">Remove</button></div><div class="b" style="display:block">' + msgs([e.msg], 'bad') + '</div></div>';
      var d = e.d, mt = pdfMatch(e);
      var noGroup = d.lines.filter(function (l) { return !(m[l.item] && m[l.item].group); });
      var notes = [];
      if (!d.totalOk) notes.push(['bad', 'The items add up to ' + d.sum + ' but the PDF says Total Quantity ' + d.total + '. Check the PDF before saving.']);
      if (!d.wh) notes.push(['warn', 'Warehouse "' + d.whRaw + '" is not one of the sheet\'s warehouses — choose it below.']);
      if (noGroup.length) notes.push(['bad', 'No ' + groupList().join('/') + ' group yet for ' + noGroup.map(function (l) { return skuText((m[l.item] || {}).sku, l.item); }).join(', ') + '. An admin sets it in Settings → SKUs, then save.']);
      if (mt) notes.push(['info', 'This is the planner\'s RO of ' + prettyDate(mt.roDate) + ' for this warehouse: the RO number is added to it, no new RO.' +
        (mt.diffs.length ? ' Quantities change to the PDF\'s: ' + mt.diffs.map(function (x) { return skuText((m[x.item] || {}).sku, x.item) + ' ' + x.from + ' → ' + x.to; }).join(', ') + '.' : '')]);
      else if (d.wh && e.state === 'ready') notes.push(['info', 'Saved as a new RO (Created) dated ' + prettyDate(d.roDate) + (S.pdfLogOnly ? ' — RO Log only (Log only is ticked).' : ' — into the RO Log and the month tab.')]);
      var done = e.state === 'saved' || e.state === 'skipped';
      // Collapsed by default (click the header to open). A PDF that needs something fixed opens by itself.
      var attention = !done && (!d.wh || noGroup.length > 0 || !d.totalOk);
      var isOpen = e.open !== undefined ? e.open : attention;
      var canSave = d.wh && !noGroup.length && e.state === 'ready';
      return '<div class="ro' + (isOpen ? ' open' : '') + '" data-i="' + i + '"><div class="h"><span class="chev" style="color:var(--muted)">' + (isOpen ? '▾' : '▸') + '</span><span class="w">RO ' + esc(d.roNo) + '</span>' +
        '<span class="small">' + esc(d.whRaw) + '</span><span class="small">RO ' + prettyDate(d.roDate) + (d.expiry ? ' · expires ' + prettyDate(d.expiry) : '') + '</span>' +
        '<span class="small"><b>' + fmt(d.sum) + '</b> units · ' + d.lines.length + ' items ' + (d.totalOk ? '✓' : '⚠') + '</span>' +
        (done ? '<span class="pill ' + (e.state === 'saved' ? 'ok' : 'warn') + '">' + (e.state === 'saved' ? 'Saved' : 'Skipped') + '</span>' :
          (attention ? '<span class="pill warn">' + (!d.wh ? 'choose warehouse' : noGroup.length ? 'SKU without group' : 'check total') + '</span>' : '') +
          '<span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm g pSave" data-i="' + i + '"' + (canSave ? '' : ' disabled') + '>' + (e.state === 'saving' ? '<span class="spin"></span>' : 'Save') + '</button>' +
          '<button class="btn sm pX" data-i="' + i + '">Remove</button></span>') + '</div><div class="b">' +
        (done ? msgs([e.msg], e.state === 'saved' ? 'ok' : 'warn') + msgs(e.warnings, 'warn') :
          '<div class="row"><div><label class="f">Warehouse</label><select class="pWh" data-i="' + i + '"><option value="">Choose…</option>' + (S.boot.warehouses || []).map(function (w) { return '<option' + (d.wh === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select></div></div>' +
          notes.map(function (n) { return '<div class="msg ' + n[0] + '">' + esc(n[1]) + '</div>'; }).join('')) +
        '<div class="scroll"><table class="t"><tr><th>SKU</th><th>Item ID</th><th>Group</th><th class="right">Qty</th></tr>' + d.lines.map(function (l) {
          var x = m[l.item] || {};
          return '<tr><td>' + esc(x.sku || 'No SKU') + '</td><td>' + l.item + '</td><td>' + esc(x.group || '—') + '</td><td class="right">' + fmt(l.qty) + '</td></tr>';
        }).join('') + '</table></div></div></div>';
    }).join('');
  }

  function savePdf(i) {
    var e = S.pdfs[i]; if (!e || e.state !== 'ready' || !e.d.wh) return Promise.resolve();
    var mt = pdfMatch(e);
    e.state = 'saving'; drawPdfs();
    return api('importPdfRO', S.token, { roNo: e.d.roNo, roDate: e.d.roDate, roAt: e.d.roAt, expiry: e.d.expiry, wh: e.d.wh, lines: e.d.lines }, mt ? mt.batches : [], !!S.pdfLogOnly)
      .then(function (r) {
        if (r.skipped) { e.state = 'skipped'; e.msg = r.message; drawPdfs(); return; }
        S.boot.openROs = r.openROs;
        refreshPlanAfterRoChange();
        e.state = 'saved'; e.warnings = r.warnings;
        e.msg = r.matched ? 'RO number added to the planner\'s RO' + (r.changes.length ? '; quantities updated: ' + r.changes.join(', ') : '') + '.'
          : 'Saved: ' + r.batches.map(function (b) { return b.group + ' ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); }).join(', ') + '.';
        drawPdfs();
      }, function (err) { e.state = 'ready'; e.err = err.message; drawPdfs(); toast(err.message, 6000); });
  }

      '<div><label class="f">RO date</label><input type="date" id="mDate" value="' + today() + '"></div>' +

      '<h3 style="margin-top:14px">Items</h3><div id="mLines"></div><button class="btn sm" id="mAdd">+ Add item</button>' +
      '<div id="mOut"></div><div style="margin-top:12px"><button class="btn g" id="mSave">Save RO</button></div></div></details>';
    if (typeof pdfjsLib === 'undefined') $('pdfList').innerHTML = msgs(['The PDF reader did not load (no internet?). Reload the page.'], 'bad');
    $('pdfIn').onchange = function () { addPdfFiles(this.files); this.value = ''; };
    $('pdfLogOnly').onchange = function () { S.pdfLogOnly = this.checked; drawPdfs(); };
    $('pdfAll').onclick = function () {
      var idx = S.pdfs.map(function (e, i) { return e.state === 'ready' && e.d.wh ? i : -1; }).filter(function (i) { return i >= 0; });
      idx.reduce(function (p, i) { return p.then(function () { return savePdf(i); }); }, Promise.resolve());
    };
    $('pdfList').onclick = function (ev) {
      var i = Number(ev.target.getAttribute('data-i'));
      if (ev.target.classList.contains('pSave')) { savePdf(i); return; }
      if (ev.target.classList.contains('pX')) { S.pdfs.splice(i, 1); drawPdfs(); return; }
      // Click on a card's header (not on its buttons): open / close it.

      var card = h.closest('.ro'), e = S.pdfs[Number(card.getAttribute('data-i'))]; if (!e || !e.d) return;
      e.open = !card.classList.contains('open'); drawPdfs();
    };
    $('pdfList').onchange = function (ev) {
      if (!ev.target.classList.contains('pWh')) return;
      var e = S.pdfs[Number(ev.target.getAttribute('data-i'))]; e.d.wh = ev.target.value; drawPdfs();
    };
    drawPdfs();
    var hint = function (item) {
      var s = skuMap()[Number(item)];
      return s ? esc(skuText(s.sku, s.item) + ' · ' + (s.group ? groupName(s.group) : 'no group — set it in Settings')) : (item ? 'Not in the SKU list' : '');
    };
    var draw = function () {
      $('mLines').innerHTML = S.manual.map(function (l, i) {

          '<div class="small muted mh">' + hint(l.item) + '</div></div>' +
          '<div style="flex:1 1 90px"><input type="number" class="mq" min="1" placeholder="Qty" value="' + esc(l.qty) + '"></div>' +
          '<div style="flex:0 0 auto"><button class="btn sm r mx">✕</button></div></div>';
      }).join('');
    };
    draw();
    $('mLines').oninput = function (e) {
      var i = Number(e.target.closest('[data-i]').getAttribute('data-i'));
      if (e.target.classList.contains('mi')) S.manual[i].item = e.target.value.trim();
      if (e.target.classList.contains('mq')) S.manual[i].qty = e.target.value;
    };
    $('mLines').onchange = function (e) {
      if (e.target.classList.contains('mi')) e.target.closest('[data-i]').querySelector('.mh').innerHTML = hint(e.target.value.trim());

    $('mSave').onclick = function () {
      var m = skuMap(), wh = $('mWh').value;
      var lines = S.manual.filter(function (l) { return Number(l.item) && Number(l.qty) > 0; });
      var err = [];
      if (!wh) err.push('Choose the warehouse.');
      if (!lines.length) err.push('Add at least one item with a quantity.');
      lines.forEach(function (l) { var s = m[Number(l.item)]; if (!s) err.push('Item ' + l.item + ' is not in the SKU list.'); else if (!s.group) err.push('Item ' + l.item + ' has no ' + groupList().join('/') + ' group.'); });

        lines: lines.map(function (l) { var s = m[Number(l.item)]; return { wh: wh, item: Number(l.item), sku: s.sku, name: s.name, group: s.group, qty: Number(l.qty) }; }),
        roDate: $('mDate').value || today(), status: $('mSt').value, source: 'Manual', appt: $('mAp').value, roNo: $('mNo').value.trim(), notes: $('mNote').value
      }).then(function (res) {

        refreshPlanAfterRoChange();
        $('mSave').disabled = false;
        $('mOut').innerHTML = msgs(res.batches.map(function (b) { return 'Saved ' + b.wh + ' ' + b.group + ': ' + fmt(b.units) + ' units' + (b.tab ? ' → ' + b.tab : ''); }), 'ok') + msgs(res.warnings, 'warn');
        draw();
      }, function (e) { $('mSave').disabled = false; $('mOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Dashboard ======================= */
  function renderDash() {
    $('app').innerHTML = '<div id="dashOut" class="card muted">Loading…</div>';
    api('getDashboard', S.token).then(function (d) {
      S.dash = d; S.dashWh = S.dashWh || ''; drawDash();
    }, function (e) { $('dashOut').innerHTML = msgs([e.message], 'bad'); });
  }

  function drawDash() {
    var d = S.dash, box = $('dashOut'); box.className = '';
    if (!d.meta || !d.rows.length) { box.className = 'card muted'; box.innerHTML = 'No data yet. Make a plan once (New Plan → upload the two files) and the dashboard fills from it.'; return; }
    var rows = d.rows.map(function (r) { return { wh: r[0], item: r[1], name: r[2], group: r[3], status: r[4], rate: Number(r[5]) || 0, pos: Number(r[6]) || 0, days: r[7] === '' ? null : Number(r[7]), rec: Number(r[8]) || 0, locked: r[9] === 'Yes',
      // Has = stock (Total sellable); Planned = on ROs not received yet. A snapshot from before the split has only the sum.
      has: r[10] === '' || r[10] === undefined ? null : Number(r[10]), planned: r[11] === '' || r[11] === undefined ? null : Number(r[11]),
      // Planned's two parts (snapshots from before 21 Nov 2026 don't have them).
      plBlinkit: r[12] === '' || r[12] === undefined ? null : Number(r[12]), plLog: r[13] === '' || r[13] === undefined ? null : Number(r[13]) }; });
    var ageDays = Math.floor((Date.now() - d.meta.at) / 864e5);
    // "Days" counts down every day from the stock date of the plan the dashboard was made from.
    var dsi = PlanCore.stockInfo(d.meta.inventoryAt, today()), el = dsi ? dsi.elapsed : 0;
    rows.forEach(function (r) { if (r.days != null) r.days = r.days - el; });
    var byWh = {};
    rows.forEach(function (r) {
      var w = byWh[r.wh] = byWh[r.wh] || { red: 0, amber: 0, items: 0, open: 0 };
      if (r.rate > 0) { w.items++; if (r.days < 7) w.red++; else if (r.days < 15) w.amber++; }
    });
    var whByNorm = {};
    Object.keys(byWh).forEach(function (w) { whByNorm[PlanCore.whNorm(w)] = w; });
    d.openROs.forEach(function (r) { var w = whByNorm[PlanCore.whNorm(r.wh)]; if (w) byWh[w].open += r.qty; });
    var whs = Object.keys(byWh).sort();
    // Sortable columns: click a heading for A→Z / lowest first, click again for Z→A / highest first.
    // Default: Per day, highest first (then fewest days). Empty values always go last.
    var COLS = [['wh', 'Warehouse', 't'], ['sku', 'SKU', 't'], ['item', 'Item ID', 'n'], ['group', 'Group', 't'], ['rate', 'Per day', 'n'],
      ['has', 'Has', 'n'], ['planned', 'Planned', 'n'], ['days', 'Days', 'n'], ['rec', 'Suggested', 'n']];
    var srt = S.dashSort = S.dashSort || { col: 'rate', dir: -1 };
    var val = function (r, c) {
      if (c === 'sku') return skuOf(r.item) || '';
      if (c === 'has') return r.has == null ? r.pos : r.has;
      return r[c];
    };
    var isText = COLS.filter(function (c) { return c[0] === srt.col; })[0][2] === 't';
    var list = rows.filter(function (r) { return r.rate > 0 && (!S.dashWh || r.wh === S.dashWh); }).sort(function (a, b) {
      var x = val(a, srt.col), y = val(b, srt.col);
      var ex = x == null || x === '', ey = y == null || y === '';
      if (ex || ey) return ex && ey ? 0 : ex ? 1 : -1;
      var c = isText ? String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' }) : x - y;
      return c * srt.dir || b.rate - a.rate || (a.days == null ? 1e9 : a.days) - (b.days == null ? 1e9 : b.days);
    });
    // Search (Ctrl+F): every word must appear in the row's warehouse, SKU, item ID or group.
    // "Planned without RO": the part of Planned that no open RO in the RO Log explains (e.g. ROs made on Blinkit
    // directly, or never uploaded as a PDF). Planned is from the plan; the RO Log is as it is now.
    var openQty = {};
    (d.openROs || []).forEach(function (x) { if (x.status === 'Planned' || x.status === 'Created') { var k = PlanCore.whNorm(x.wh) + '|' + Number(x.item); openQty[k] = (openQty[k] || 0) + (Number(x.qty) || 0); } });
    var noRo = function (r) { return r.planned > 0 ? Math.max(0, r.planned - (openQty[PlanCore.whNorm(r.wh) + '|' + Number(r.item)] || 0)) : 0; };
    var noRoCount = list.filter(function (r) { return noRo(r) > 0; }).length;
    var dashMatch = function (r) {
      if (S.dashNoRo && !(noRo(r) > 0)) return false;
      var words = String(S.dashQ || '').toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return true;
      var hay = (r.wh + ' ' + (skuOf(r.item) || '') + ' ' + r.item + ' ' + r.group).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    };
    var rowHtml = function (r) {
        var c = r.days < 7 ? 'bad' : r.days < 15 ? 'warn' : 'ok';
        return '<tr><td>' + esc(r.wh) + '</td><td>' + esc(skuOf(r.item) || 'No SKU') + (r.locked ? ' <span class="pill">locked</span>' : '') + '</td><td>' + r.item + '</td><td>' + esc(r.group) + '</td><td class="right">' + fmt(r.rate, 1) + '</td><td class="right">' + fmt(r.has == null ? r.pos : r.has) + '</td><td class="right">' + (r.planned == null ? '–' : r.planned ? (noRo(r) > 0 ? '<span class="pill warn" title="Planned with no open RO in the RO Log">' + fmt(noRo(r)) + ' without RO</span> ' : '') + '<a href="#" class="plk" data-wh="' + esc(r.wh) + '" data-it="' + r.item + '" title="How is this planned?">' + fmt(r.planned) + '</a>' : '') + '</td><td class="right"><span class="pill ' + c + '">' + fmt(r.days, 1) + '</span></td><td class="right">' + (r.rec ? fmt(r.rec) : '') + '</td></tr>';
    };
    var dashRows = function () { var m = list.filter(dashMatch); return m.length ? m.slice(0, 300).map(rowHtml).join('') : '<tr><td colspan="9" class="muted">No item matches the search.</td></tr>'; };
    var dashCountText = function () { var n = list.filter(dashMatch).length; return (S.dashQ || S.dashNoRo ? n + ' of ' + list.length + ' items match' + (S.dashNoRo ? ' (Planned without RO)' : '') : list.length + ' items') + (n > 300 ? ' · first 300 shown' : ''); };
    var sortHint = COLS.filter(function (c) { return c[0] === srt.col; })[0][1] + ', ' + (isText ? (srt.dir > 0 ? 'A → Z' : 'Z → A') : (srt.dir > 0 ? 'lowest first' : 'highest first'));
    box.innerHTML = '<div class="card"><h2>Days of cover</h2><div class="small muted">From the plan made ' + new Date(d.meta.at).toLocaleString('en-IN') + ' by ' + esc(d.meta.by) +
      (d.meta.inventoryAt ? ' · Blinkit inventory of ' + esc(d.meta.inventoryAt) : '') + (dsi ? ' · stock as of ' + prettyDate(dsi.stockDate) + ', so Days count from today (' + el + ' day' + (el === 1 ? '' : 's') + ' of sales taken off)' : '') + '. ROs created since then are not counted here.</div>' +
      (ageDays >= 2 ? '<div class="msg warn">This is ' + ageDays + ' days old — upload fresh files in New Plan.</div>' : '') +
      '<div class="stats" style="margin-top:10px">' + whs.map(function (w) {
        var x = byWh[w];
        return '<div class="stat" style="cursor:pointer;' + (S.dashWh === w ? 'outline:2px solid var(--brand)' : '') + '" data-wh="' + esc(w) + '"><div class="k">' + esc(w) + '</div>' +
          '<div><span class="pill bad">' + x.red + ' under 7d</span> <span class="pill warn">' + x.amber + ' 7–15d</span></div>' +
          '<div class="small muted" style="margin-top:4px">' + (x.open ? fmt(x.open) + ' units in open ROs' : 'no open ROs') + '</div></div>';
      }).join('') + '</div></div>' +
      '<details class="card" id="dCal"' + (S.dashCalOpen ? ' open' : '') + '><summary style="cursor:pointer;font-weight:700">📅 Calendar <span class="small muted" style="font-weight:400">— dispatch plan, last 7 days + next 30: 🚚 load per day, 📦 packing, 📍 arrivals, ⚠ warnings' + (S.dashWh ? ' · ' + esc(S.dashWh) : '') + '</span></summary><div id="dCalBody"></div></details>' +
      '<div class="card"><div class="row" style="align-items:center;margin-bottom:8px"><h3 style="flex:1 1 300px;margin:0">' + (S.dashWh ? esc(S.dashWh) + ' — ' : '') + 'Items <span class="small muted">(sorted by ' + esc(sortHint) + ' — click a heading to sort' + (S.dashWh ? ' · <a href="#" id="dAll">show all</a>' : '') + ')</span></h3>' +
        '<div style="flex:0 0 auto"><label class="chip' + (S.dashNoRo ? ' on' : '') + '" title="Items whose Planned (on its way) has no open RO in the RO Log"><input type="checkbox" id="dNoRo"' + (S.dashNoRo ? ' checked' : '') + ' style="display:none">Planned without RO <b>' + noRoCount + '</b></label></div>' +
        '<div style="flex:0 1 280px"><input type="search" id="dQ" placeholder="🔍 Search (Ctrl+F)" title="SKU, item ID, warehouse or group — several words narrow it down" value="' + esc(S.dashQ || '') + '" autocomplete="off"></div></div><div class="scroll"><table class="t" id="dTab"><tr>' +
        COLS.map(function (c) {
          var on = srt.col === c[0], arrow = on ? (srt.dir > 0 ? ' ▲' : ' ▼') : '';
          return '<th class="sortable' + (c[2] === 'n' && c[0] !== 'item' ? ' right' : '') + (on ? ' on' : '') + '" data-c="' + c[0] + '" title="Sort by ' + c[1] + '">' + c[1] + arrow + '</th>';
        }).join('') + '</tr>' +
      '<tbody id="dRows">' + dashRows() + '</tbody></table></div><div class="small muted" id="dCount" style="margin-top:6px">' + dashCountText() + '</div></div>';
    box.querySelector('.stats').onclick = function (e) { var s = e.target.closest('.stat'); if (!s) return; var w = s.getAttribute('data-wh'); S.dashWh = S.dashWh === w ? '' : w; drawDash(); };
    $('dNoRo').onchange = function () { S.dashNoRo = this.checked; drawDash(); };
    $('dQ').oninput = function () { S.dashQ = this.value; $('dRows').innerHTML = dashRows(); $('dCount').textContent = dashCountText(); };
    $('dQ').onkeydown = function (e) { if (e.key === 'Escape') { this.value = ''; this.oninput(); } };
    $('dTab').querySelector('tr').onclick = function (e) {
      var th = e.target.closest('th[data-c]'); if (!th) return;
      var c = th.getAttribute('data-c');
      S.dashSort = srt.col === c ? { col: c, dir: -srt.dir } : { col: c, dir: 1 };
      drawDash();
    };
    initDashCal(d, rows, el);
    $('dTab').onclick = function (e) {
      var a = e.target.closest('.plk'); if (!a) return;
      e.preventDefault();
      var wh = a.getAttribute('data-wh'), it = Number(a.getAttribute('data-it'));
      showPlanned(d, rows.filter(function (r) { return r.wh === wh && Number(r.item) === it; })[0]);
    };
    if ($('dAll')) $('dAll').onclick = function (e) { e.preventDefault(); S.dashWh = ''; drawDash(); };
  }

  /**
   * Dashboard: what makes up an item's "Planned" (stock on its way to the warehouse) at the time of the plan:
   * Blinkit's own Incoming (ROs already on Blinkit, from the Bulk RO file) + RO Log lines Blinkit could not show
   * yet (Planned, or Created after the Bulk RO file was downloaded). Below: that item's open ROs in the RO Log now.
   */
  function showPlanned(d, r) {
    if (!r) return;
    var bulkAt = d.meta && d.meta.bulkAt;
    var ros = (d.openROs || []).filter(function (x) { return PlanCore.whNorm(x.wh) === PlanCore.whNorm(r.wh) && Number(x.item) === Number(r.item); })
      .sort(function (a, b) { return String(b.roDate).localeCompare(String(a.roDate)); });
    var counted = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Planned' || (x.status === 'Created' && (!bulkAt || !at || at > bulkAt)); };
    // RO Log part beyond the lines counted by time = recent ROs Blinkit's Incoming did not show yet (safety rule).
    var byTime = ros.reduce(function (a, x) { return a + (counted(x) ? x.qty : 0); }, 0);
    var gapLeft = r.plLog != null ? Math.max(0, r.plLog - byTime) : 0;
    var isRecent = function (x) { var at = x.blinkitAt || x.createdAt; return x.status === 'Created' && bulkAt && at && at <= bulkAt && (at >= bulkAt - 3 * 864e5 || (!x.appt && at >= bulkAt - 30 * 864e5)); };
    var split = r.plBlinkit != null && r.plLog != null;
    var html = '<h2>Planned ' + fmt(r.planned) + ' — ' + esc(skuText(skuOf(r.item), r.item)) + '</h2><div class="small muted">' + esc(r.wh) +
      ' · stock on its way to the warehouse, at the time of the plan (' + new Date(d.meta.at).toLocaleString('en-IN') + ')</div>' +
      (split ? '<table class="t" style="margin-top:10px"><tr><td>Incoming in <b>Blinkit\'s Bulk RO file</b> (ROs already on Blinkit)</td><td class="right"><b>' + fmt(r.plBlinkit) + '</b></td></tr>' +
        '<tr><td>From the <b>RO Log</b>, not in Blinkit\'s file yet (Planned, or created after the file was downloaded)</td><td class="right"><b>' + fmt(r.plLog) + '</b></td></tr>' +
        '<tr><th>Planned</th><th class="right">' + fmt(r.planned) + '</th></tr></table>'
        : '<div class="msg info">The split into Blinkit\'s Incoming and RO Log lines shows from the next plan on (New Plan saves it).</div>') +
      '<h3 style="margin-top:12px">Open ROs for this item here (RO Log, now)</h3>' +
      (ros.length ? '<div class="scroll"><table class="t"><tr><th>RO date</th><th>RO No.</th><th>Status</th><th class="right">Qty</th><th>Appointment</th><th>In the RO Log part?</th></tr>' +
        ros.map(function (x) {
          return '<tr><td>' + prettyDate(x.roDate) + '</td><td>' + esc(x.roNo || '—') + '</td><td>' + roStatusPill(x.status, x.appt) + '</td><td class="right">' + fmt(x.qty) + '</td><td>' + apptCell(x) + '</td>' +
            '<td class="small">' + (counted(x) ? 'Yes' : gapLeft > 0 && isRecent(x) ? 'Yes — Blinkit\'s Incoming did not show it yet' : 'No — Blinkit\'s file already shows it') + '</td></tr>';
        }).join('') + '</table></div>'
        : '<div class="small muted">No open ROs for this item at this warehouse in the RO Log. ' + (split && r.plBlinkit ? 'The ' + fmt(r.plBlinkit) + ' are ROs on Blinkit that are not in the RO Log (e.g. made on Blinkit directly).' : '') + '</div>') +
      '<div class="small muted" style="margin-top:8px">ROs created or changed since the plan are listed here but not in the numbers above.</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn p" id="plOk">Close</button></div>';
    openModal(html);
    $('modalBox').style.maxWidth = '820px'; // wider: RO table with appointment boxes
    $('plOk').onclick = closeModal;
    // Appointment straight from here: saved like "Save RO" in the RO Log (RO Log + the RO heading in the month tab),
    // for every group of the RO (merged RO / same Blinkit RO number).
    $('modalBox').onclick = function (e) {
      var b = e.target.closest('.apSave'); if (!b) return;
      var x = ros[Number(b.getAttribute('data-i'))], val = $('modalBox').querySelector('.apIn[data-i="' + b.getAttribute('data-i') + '"]').value;
      var same = function (y) { return PlanCore.whNorm(y.wh) === PlanCore.whNorm(x.wh) && (x.merged ? y.merged === x.merged : x.roNo ? y.roNo === x.roNo : y.batch === x.batch); };
      var batches = []; (d.openROs || []).forEach(function (y) { if (same(y) && batches.indexOf(y.batch) < 0) batches.push(y.batch); });
      b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      var warns = [];
      batches.reduce(function (pr, id) { return pr.then(function () { return api('updateBatch', S.token, id, { appt: val }).then(function (res) { warns = warns.concat((res && res.warnings) || []); }); }); }, Promise.resolve())
        .then(function () {
          (d.openROs || []).forEach(function (y) { if (same(y)) y.appt = val; });
          refreshBoot().then(refreshPlanAfterRoChange, function () {});
          showPlanned(d, r);
          toast(val ? 'Appointment ' + prettyDate(val) + ' saved for RO ' + (x.roNo || '') : 'Appointment removed');
          if (warns.length) toast(warns.join(' '), 6000);
        }, function (er) { b.disabled = false; b.textContent = 'Save'; toast(er.message, 6000); });
    };
    function apptCell(x) {
      var i = ros.indexOf(x);
      if (!can('Planner') || x.status === 'Cancelled') return x.appt ? prettyDate(x.appt) : '—';
      return '<span class="nowrap"><input type="date" class="apIn" data-i="' + i + '" value="' + esc(x.appt || '') + '" style="width:140px;padding:5px 6px"> ' +
        '<button class="btn sm apSave" data-i="' + i + '">Save</button></span>';
    }
  }

  /**
   * Dashboard calendar — 38 days from 7 days ago, as a dispatch plan (Settings → Dispatch):
   *  🚚 load bar = units dispatched that day vs the daily capacity (red when over); 📦 packing days before a dispatch;
   *  📍 arrivals (appointment, or dispatch + shipping days); ⚠ items that run out before
   *  their next possible arrival; ⏳ ROs that expire without an appointment. Above the days: the warnings.
   *  Click a day for its details; a dispatch without an appointment can be moved to another day there.
   * Follows the warehouse picked on the dashboard.
   */
  function initDashCal(d, rows, el) {
    var det = $('dCal'); if (!det) return;
    var DAYS = 38, start = addDays(today(), -7), todayS = today(), c = dConf();
    var inWh = function (w) { return !S.dashWh || PlanCore.whNorm(w) === PlanCore.whNorm(S.dashWh); };
    var short = function (w) { return String(w).replace(/ - Feeder( Warehouse)?| Feeder$/, ''); };
    var dlab = function (k) { return new Date(k + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };
    var expiryOf = function (x) { var m = String(x.notes || '').match(/R\.O\. expiry (\d{1,2} [A-Za-z]{3} \d{4})/); if (!m) return ''; var t = new Date(m[1] + ' 12:00'); return isNaN(t) ? '' : t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); };
    var build = function () {
      var days = {}, warn = { gap: [], waiting: [], expiring: [], unsched: [] };
      var day = function (k) { return days[k] = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], load: 0 }; };
      var groups = roGroups(d.openROs).filter(function (x) { return inWh(x.wh); });
      groups.forEach(function (x) {
        var dd = dispatchOf(x), ar = arrivalOf(x), ex = expiryOf(x);
        if (x.roDate) day(x.roDate).ros.push(x);
        if (dd) {
          day(dd).disp.push(x); day(dd).load += x.units;
          var p = dd; for (var i = 0; i < c.pack; i++) { p = prevWorkDay(addDays(p, -1)); day(p).pack.push(x); }
        } else if (x.status === 'Created' || x.status === 'Planned') warn.unsched.push(x);
        if (ar) day(ar).arr.push(x);
        if (!x.appt && x.status === 'Created' && x.roDate && x.roDate <= addDays(todayS, -3)) warn.waiting.push(x);
        if (!x.appt && ex) { day(ex).exp.push(x); if (ex >= todayS && ex <= addDays(todayS, 5)) warn.expiring.push(x); }
      });
      // ⚠ An item that runs out before its next possible arrival (an open RO's arrival, or a new RO dispatched
      // after packing): shown on the day it runs out, with the days it would be out of stock.
      var arrOf = {};
      roGroups(d.openROs).forEach(function (x) { var ar = arrivalOf(x); if (!ar || ar < todayS) return; x.lines.forEach(function (l) { var k = PlanCore.whNorm(x.wh) + '|' + l.item; if (!arrOf[k] || ar < arrOf[k]) arrOf[k] = ar; }); });
      rows.forEach(function (r) {
        if (!(r.rate > 0) || r.days == null || !inWh(r.wh)) return;
        var out = addDays(todayS, Math.max(0, Math.floor(r.days)));
        var next = arrOf[PlanCore.whNorm(r.wh) + '|' + r.item] || addDays(nextWorkDay(addDays(todayS, c.pack)), transitOf(r.wh));
        if (out < next) {
          var gap = Math.round((new Date(next + 'T12:00:00') - new Date(out + 'T12:00:00')) / 864e5);
          var w = { r: r, out: out, next: next, gap: gap }; day(out).out.push(w); warn.gap.push(w);
        }
      });
      return { days: days, warn: warn };
    };
    var roLine = function (x, extra) {
      return '<li>' + esc(short(x.wh)) + ' · ' + esc(x.groups.join(' + ')) + ' · <b>' + fmt(x.units) + '</b> units' + (x.roNo ? ' · #' + esc(x.roNo) : '') + ' ' + roStatusPill(x.status, x.appt) + (extra || '') + '</li>';
    };
    var draw = function () {
      var B = build(), days = B.days, W = B.warn;
      var first = new Date(start + 'T12:00:00'), lead = (first.getDay() + 6) % 7; // weeks start on Monday
      var cells = '';
      for (var i = 0; i < lead; i++) cells += '<div class="cd empty"></div>';
      for (var j = 0; j < DAYS; j++) {
        var k = addDays(start, j), x = days[k] || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], load: 0 };
        var dd = new Date(k + 'T12:00:00'), off = !isWorkDay(k), over = x.load > c.cap;
        cells += '<div class="cd' + (k < todayS ? ' past' : '') + (k === todayS ? ' today' : '') + (off ? ' off' : '') + (S.dashCalDay === k ? ' sel' : '') + '" data-d="' + k + '">' +
          '<div class="cdn">' + dd.getDate() + (dd.getDate() === 1 || j === 0 ? ' ' + dd.toLocaleDateString('en-IN', { month: 'short' }) : '') + '</div>' +
          (x.load ? '<div class="ld' + (over ? ' over' : '') + '" title="Dispatch ' + fmt(x.load) + ' of ' + fmt(c.cap) + ' units"><span style="width:' + Math.min(100, Math.round(x.load / c.cap * 100)) + '%"></span></div><span class="cb ds' + (over ? ' over' : '') + '">🚚 ' + fmt(x.load) + '</span>' : '') +
          (x.pack.length ? '<span class="cb pk" title="Packing">📦 ' + x.pack.length + '</span>' : '') +
          (x.arr.length ? '<span class="cb ap" title="Arrivals">📍 ' + x.arr.length + '</span>' : '') +
          (x.out.length ? '<span class="cb out" title="Run out before the next arrival">⚠ ' + x.out.length + '</span>' : '') +
          (x.exp.length ? '<span class="cb out" title="RO expires without appointment">⏳ ' + x.exp.length + '</span>' : '') + '</div>';
      }
      var wl = function (icon, title, list, fn) { return list.length ? '<details class="calw"><summary>' + icon + ' <b>' + list.length + '</b> ' + title + '</summary><ul>' + list.map(fn).join('') + '</ul></details>' : ''; };
      var warns = wl('⚠', 'item(s) run out before their next possible arrival', W.gap.sort(function (a, b) { return a.out.localeCompare(b.out); }), function (w) { return '<li>' + esc(short(w.r.wh)) + ' · ' + esc(skuText(skuOf(w.r.item), w.r.item)) + ' — runs out ' + dlab(w.out) + ', next arrival ' + dlab(w.next) + ' · <b>' + w.gap + ' day' + (w.gap === 1 ? '' : 's') + ' out of stock</b></li>'; }) +
        wl('🕑', 'RO(s) awaiting appointment for more than 3 days', W.waiting, function (x) { return roLine(x, ' · RO ' + prettyDate(x.roDate)); }) +
        wl('⏳', 'RO(s) expire within 5 days without appointment', W.expiring, function (x) { return roLine(x, ' · expires ' + prettyDate(expiryOf(x))); }) +
        wl('📋', 'open RO(s) without a dispatch day', W.unsched, function (x) { return roLine(x, ''); }) +
        (W.unsched.length && can('Planner') ? '<button class="btn sm" id="calSched">Give them dispatch days</button>' : '');
      var sel = S.dashCalDay && days[S.dashCalDay], info = '';
      if (S.dashCalDay) {
        var x = sel || { disp: [], pack: [], arr: [], ros: [], out: [], exp: [], load: 0 };
        // Mark an arriving RO as delivered (asks the date; 2 days later it leaves the month tab).
        var delv = function (r) {
          if (!can('Planner')) return '';
          var dv = S.dashCalDay < todayS ? S.dashCalDay : todayS;
          return ' <span class="nowrap">· delivered on <input type="date" class="dlIn" data-k="' + esc(r.key) + '" value="' + dv + '" max="' + todayS + '" style="width:140px;padding:4px 6px"> <button class="btn sm g dlGo" data-k="' + esc(r.key) + '">Mark delivered</button></span>';
        };
        // An RO awaiting its appointment: enter it here (its dispatch day then follows the appointment).
        var apptAdd = function (r) {
          if (r.appt || !can('Planner')) return '';
          return ' <span class="nowrap">· appointment <input type="date" class="apIn2" data-k="' + esc(r.key) + '" min="' + todayS + '" style="width:140px;padding:4px 6px"> <button class="btn sm apGo2" data-k="' + esc(r.key) + '">Save</button></span>';
        };

    var initAddCombo = function () {

      var shown = [], hi = 0; addPick = '';
      var draw = function () {
        var words = inp.value.toLowerCase().split(/\s+/).filter(Boolean);

        lst.classList.remove('hidden');

    };
    var afterSkus = function (skus) {
      S.boot.skus = skus; edits = {}; draw();
      if (S.plan) recompute(true); // new groups/tiers, and SKUs set inactive drop out of the plan
    };
    var clashHtml = function (r) {
      if (!r.clashes || !r.clashes.length) return msgs(['No SKU is listed in two groups of the same warehouse in ' + r.tab + '.'], 'ok');
      return '<div class="msg warn"><b>' + r.clashes.length + ' SKU(s) are listed in two groups of the same warehouse in ' + esc(r.tab) + '.</b> Remove the extra row in the sheet, or the RO quantity can land in the wrong block.</div>' +
        '<div class="scroll"><table class="t"><tr><th>Warehouse</th><th>SKU · Item ID</th><th>Listed in</th></tr>' +
        r.clashes.map(function (c) { return '<tr><td>' + esc(c.wh) + '</td><td>' + esc(skuText(c.sku, c.item)) + '</td><td><b>' + esc(c.groups) + '</b></td></tr>'; }).join('') + '</table></div>';
    };
    var chg = function (a, b) { return a === b ? esc(b || '—') : '<span class="muted">' + esc(a || '—') + ' →</span> <b>' + esc(b || '—') + '</b>'; };
    $('kFromTab').onclick = function () {
      var b = this; b.disabled = true;
      api('groupsFromMonthTab', S.token, false).then(function (r) {
        b.disabled = false;
        if (!r.tab) { $('kTabOut').innerHTML = msgs(['No month tab with items found.'], 'warn'); return; }
        var html = '';
        if (!r.changes.length) html += msgs(['Every SKU already has the same group and tier as in ' + r.tab + '.'], 'ok');
        else {
          html += '<div class="msg info">' + r.changes.length + ' SKU(s) have a different group or tier in <b>' + esc(r.tab) + '</b>:</div>' +
            '<div class="scroll"><table class="t"><tr><th>SKU · Item ID</th><th>Group</th><th>Tier</th><th>In the tab</th></tr>' +
            r.changes.map(function (c) { return '<tr><td>' + esc(skuText(c.sku, c.item)) + '</td><td>' + chg(c.from, c.to) + '</td><td>' + chg(c.fromTier, c.toTier) + '</td><td class="small muted">' + esc(c.where) + '</td></tr>'; }).join('') +
            '</table></div><div style="margin:8px 0"><button class="btn p" id="kFromTabOk">Save these ' + r.changes.length + ' change(s)</button></div>';
        }
        $('kTabOut').innerHTML = html + clashHtml(r);
        if (!r.changes.length) return;
        $('kFromTabOk').onclick = function () {
          this.disabled = true;
          api('groupsFromMonthTab', S.token, true).then(function (r2) {
            afterSkus(r2.skus); $('kTabOut').innerHTML = msgs(['Saved ' + r2.changes.length + ' group / tier change(s) from ' + r2.tab + '.'], 'ok') + clashHtml(r2);
          }, function (e) { $('kTabOut').innerHTML = msgs([e.message], 'bad'); });
        };
      }, function (e) { b.disabled = false; $('kTabOut').innerHTML = msgs([e.message], 'bad'); });
    };
    $('kSave').onclick = function () {
      var rows = Object.keys(edits).map(function (k) { return edits[k]; });
      if (!rows.length) { $('kOut').innerHTML = msgs(['No changes.'], 'info'); return; }
      api('saveSkus', S.token, rows).then(function (skus) {
        afterSkus(skus); $('kOut').innerHTML = msgs(['Saved ' + rows.length + ' SKU(s).'], 'ok');
      }, function (e) { $('kOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Users (admin) ======================= */
  function renderUsers() {
    $('app').innerHTML = '<div class="card"><h2>Users</h2><div class="small muted">Admin: everything. Planner: plans, creates and edits ROs. Viewer: dashboard and RO Log only.</div><div class="scroll"><table class="t" id="uTab"><tr><td class="muted">Loading…</td></tr></table></div><div id="uOut"></div></div>' +
      '<div class="card"><h2>Add a user</h2><div class="row"><div><label class="f">User ID</label><input type="text" id="nId"></div><div><label class="f">Name</label><input type="text" id="nName"></div>' +
      '<div><label class="f">Role</label><select id="nRole"><option>Planner</option><option>Viewer</option><option>Admin</option></select></div><div><label class="f">PIN (4–8 digits)</label><input type="text" id="nPin" inputmode="numeric"></div>' +
      '<div style="flex:0 0 auto"><button class="btn p" id="nAdd">Add</button></div></div><div id="nOut"></div></div>';
    var load_ = function () {
      api('listUsers', S.token).then(function (us) {
        $('uTab').innerHTML = '<tr><th>User ID</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>' + us.map(function (u) {
          return '<tr data-u="' + esc(u.id) + '"><td>' + esc(u.id) + '</td><td><input type="text" class="uN" value="' + esc(u.name) + '"></td><td><select class="uR">' + ['Admin', 'Planner', 'Viewer'].map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select></td>' +
            '<td><input type="checkbox" class="uA"' + (u.active ? ' checked' : '') + '></td><td class="nowrap"><button class="btn sm uS">Save</button> <button class="btn sm uP">New PIN</button></td></tr>';
        }).join('');
      }, function (e) { $('uOut').innerHTML = msgs([e.message], 'bad'); });
    };
    load_();
    $('uTab').onclick = function (e) {
      var tr = e.target.closest('tr[data-u]'); if (!tr) return;
      var id = tr.getAttribute('data-u');
      if (e.target.classList.contains('uS')) api('saveUser', S.token, { id: id, name: tr.querySelector('.uN').value, role: tr.querySelector('.uR').value, active: tr.querySelector('.uA').checked }).then(function () { toast('Saved'); load_(); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); });
      if (e.target.classList.contains('uP')) { var p = prompt('New PIN for ' + id + ' (4–8 digits):'); if (p) api('resetUserPin', S.token, id, p).then(function () { toast('PIN changed'); }, function (er) { $('uOut').innerHTML = msgs([er.message], 'bad'); }); }
    };
    $('nAdd').onclick = function () {
      api('saveUser', S.token, { id: $('nId').value.trim(), name: $('nName').value.trim(), role: $('nRole').value, pin: $('nPin').value.trim() })
        .then(function () { $('nOut').innerHTML = msgs(['User added.'], 'ok'); ['nId', 'nName', 'nPin'].forEach(function (i) { $(i).value = ''; }); load_(); }, function (e) { $('nOut').innerHTML = msgs([e.message], 'bad'); });
    };
  }

  /* ======================= Account ======================= */
  function renderAccount() {
    $('app').innerHTML = '<div class="card" style="max-width:420px"><h2>' + esc(S.boot.user.name || S.boot.user.id) + '</h2><div class="small muted">' + esc(S.boot.user.id) + ' · ' + esc(S.boot.user.role) + '</div>' +
      '<h3 style="margin-top:14px">Change PIN</h3><label class="f">Current PIN</label><input type="password" id="aOld" inputmode="numeric"><div style="height:6px"></div>' +
      '<label class="f">New PIN (4–8 digits)</label><input type="password" id="aNew" inputmode="numeric"><div id="aOut"></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn p" id="aSave">Change PIN</button><button class="btn r" id="aOut2">Log out</button></div></div>';
    $('aSave').onclick = function () { api('changePin', S.token, $('aOld').value, $('aNew').value).then(function () { $('aOut').innerHTML = msgs(['PIN changed.'], 'ok'); }, function (e) { $('aOut').innerHTML = msgs([e.message], 'bad'); }); };
    $('aOut2').onclick = function () { api('logout', S.token).catch(function () {}); store('bp_token', null); S.token = null; S.boot = null; showLogin(); };
  }

  // Leaving or reloading the page: save the draft at once (typing is saved with a short delay).
  window.addEventListener('pagehide', function () {
    if (draftTimer && (S.bulk || S.inv)) {
      clearTimeout(draftTimer);
      store(DRAFT_STATE, JSON.stringify({ user: draftUser(), edited: S.edited || {}, confirmed: S.confirmed || {}, filter: S.filter, cover: S.cover || null,
        starters: S.starters, invFromSheet: !!(S.inv && S.inv.fromSheet) }));
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.plan && S.draftOk === false && Object.keys(S.edited || {}).length) { e.preventDefault(); e.returnValue = ''; }
  });

  // Android app's Back button: close a pop-up, else go back to the Dashboard; '' = nothing left (app may exit).
  window.appBack = function () {
    if (!$('modal').classList.contains('hidden')) { closeModal(); return 'handled'; }
    if (S.boot && S.tab !== 'dash' && $('nav') && !$('nav').classList.contains('hidden')) { go('dash'); return 'handled'; }
    return '';
  };

  /** Outside Apps Script (GitHub Pages copy, Android app) the page needs the planner's link once. */
  function showSetup(note) {
    $('app').innerHTML = '<div class="card login"><h2>Connect the planner</h2>' + (note ? msgs([note], 'warn') : '') +
      '<div class="small muted">Paste the planner\'s web-app link (Apps Script → Deploy → Manage deployments → Web app URL, ending in /exec) or just its Deployment ID (AKfycb…). Asked only once.</div>' +
      '<div style="height:8px"></div><input type="text" id="setupId" placeholder="https://script.google.com/macros/s/AKfycb…/exec" autocomplete="off">' +
      '<div style="height:10px"></div><button class="btn p" id="setupGo" style="width:100%">Continue</button></div>';
    $('setupGo').onclick = function () {
      var v = $('setupId').value.trim(), m = v.match(/\/macros\/s\/([A-Za-z0-9_-]+)/), id = m ? m[1] : v;
      if (!/^[A-Za-z0-9_-]{40,}$/.test(id)) { showSetup('That does not look like the planner link or a Deployment ID.'); return; }
      store('bp_api', id); showLogin();
    };
  }

  /* ---------------- start ---------------- */
  if (typeof XLSX === 'undefined' || typeof JSZip === 'undefined') {
    $('app').innerHTML = '<div class="card msg bad">Could not load the Excel tools (no internet?). Reload the page.</div>';
  } else if (!IN_APPS_SCRIPT && !serverUrl()) {
    showSetup();
  } else if (S.token) {
    refreshBoot().then(startApp, function (e) { if (S.token) $('app').innerHTML = msgs([e.message + ' — reload the page to try again.'], 'bad'); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
