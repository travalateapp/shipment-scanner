name: Build Planner APK

# Builds the Android app for the Blinkit Shipment Planner (planner-android/). The app carries the planner page
# (blinkit-planner/Index.html, copied in here) and talks to the planner's Apps Script web app.
#
# - Every push that changes the page or the app builds a test APK (download it from the run's "Artifacts").
# - A push to the planner's branch (claude/nifty-dijkstra-mfs54m) also publishes it, signed with the private key,
#   to the GitHub Release "planner-apk", so this link always gives the newest app:
#     https://github.com/<owner>/<repo>/releases/download/planner-apk/BlinkitPlanner.apk
#   Installed apps find it there and offer the update themselves. That release is never marked "latest", so the
#   Attendance app's updates are not affected.
#
# The planner's Apps Script Deployment ID (AKfycb…) is taken from the repository secret PLANNER_DEPLOYMENT_ID
# when it exists; without it the app asks for the planner link once on first start.
on:
  push:
    paths:
      - 'planner-android/**'
      - 'blinkit-planner/Index.html'
      - '.github/workflows/planner-apk.yml'

permissions:
  contents: write

concurrency:
  group: planner-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: claude/nifty-dijkstra-mfs54m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the planner page into the app
        run: |
          mkdir -p planner-android/app/src/main/assets
          cp blinkit-planner/Index.html planner-android/app/src/main/assets/index.html
          grep -o "PAGE_BUILD = '[^']*'" planner-android/app/src/main/assets/index.html || true

      # Same private key as the Attendance app (repository secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD), so updates always install over the old app. Without them (or on test
      # branches) a throwaway key is used and nothing is published.
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ "$GITHUB_REF_NAME" = "$RELEASE_BRANCH" ]; then
            echo "$KEYSTORE_B64" | base64 -d > planner-android/app/secret.keystore
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the private key from the repository secrets."
          else
            keytool -genkeypair -keystore planner-android/app/secret.keystore -storetype PKCS12 -alias attendance -keyalg RSA \
              -keysize 2048 -validity 2 -storepass test-build-only -keypass test-build-only -dname "CN=Test build only" >/dev/null 2>&1
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "Test build: signed with a throwaway key (not for the team)."
          fi

      - name: Build the APK
        working-directory: planner-android
        env:
          ORG_GRADLE_PROJECT_storeFile: secret.keystore
          ORG_GRADLE_PROJECT_storePassword: ${{ steps.key.outputs.real == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ steps.key.outputs.real == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
          ORG_GRADLE_PROJECT_deploymentId: ${{ secrets.PLANNER_DEPLOYMENT_ID }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }} \
            -PupdateRepo="${GITHUB_REPOSITORY}"
          cp app/build/outputs/apk/release/app-release.apk ../BlinkitPlanner.apk
          ls -l ../BlinkitPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlinkitPlanner-apk
          path: BlinkitPlanner.apk

      - name: Publish to the "planner-apk" release
        if: steps.key.outputs.real == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Blinkit Planner 1.${{ github.run_number }}"
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/planner-apk/BlinkitPlanner.apk"
          notes="Android app for the Blinkit Shipment Planner. Install: open ${link} on the phone. Installed apps offer this update themselves."
          if gh release view planner-apk >/dev/null 2>&1; then
            gh release upload planner-apk BlinkitPlanner.apk --clobber
            gh release edit planner-apk --title "$title" --notes "$notes" --latest=false
          else
            gh release create planner-apk BlinkitPlanner.apk --target "${{ github.sha }}" --title "$title" --notes "$notes" --latest=false
          fi
          echo "### Blinkit Planner APK ready ($title)" >> "$GITHUB_STEP_SUMMARY"
          echo "Install / share: $link" >> "$GITHUB_STEP_SUMMARY"
