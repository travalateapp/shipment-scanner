# Puts blinkit-planner/Planner.gs and Index.html into the Apps Script project and updates the existing web-app
# deployment to a new version (same app link), after every merge to main that changes them. Can also be run by
# hand from the Actions tab (with "dry run" to only check the setup).
#
# One-time setup (see blinkit-planner/README.md → "Automatic deploy"): repository secrets
#   CLASPRC_JSON          contents of .clasprc.json after `npx @google/clasp login` (the script owner's account)
#   PLANNER_SCRIPT_ID     Apps Script → Project Settings → Script ID (the script attached to the Blinkit sheet)
#   PLANNER_DEPLOYMENT_ID Deploy → Manage deployments → the planner web app's Deployment ID (AKfycb…)
name: Deploy Blinkit Planner

on:
  push:
    branches: [main]
    paths:
      - blinkit-planner/Planner.gs
      - blinkit-planner/Index.html
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the setup and show what would change (nothing is uploaded)'
        type: boolean
        default: false

concurrency:
  group: deploy-blinkit-planner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.PLANNER_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.PLANNER_DEPLOYMENT_ID }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check the setup
        id: setup
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Automatic deploy is not set up yet (secrets CLASPRC_JSON, PLANNER_SCRIPT_ID, PLANNER_DEPLOYMENT_ID). Skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Sign in (clasp)
        if: steps.setup.outputs.ready == 'true'
        run: |
          npm install -g @google/clasp@3.4.1 --no-audit --no-fund
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          clasp show-authorized-user

      - name: Download the current Apps Script project
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir gas && cd gas
          clasp clone "$SCRIPT_ID" --rootDir .
          echo "Files in the Apps Script project:"; ls -la

      - name: Put in the new Planner.gs and Index.html (the inventory updater's files are left alone)
        if: steps.setup.outputs.ready == 'true'
        working-directory: gas
        run: |
          # The Blinkit sheet's script also holds the daily inventory updater (Code.gs + UploadDialog.html).
          # Only the planner's own files are replaced; clasp names .gs files .js.
          server="Planner.js"
          [ -f Planner.gs ] && server="Planner.gs"
          if grep -l "function processInventoryUpload" "$server" >/dev/null 2>&1; then
            echo "::error::$server holds the inventory updater, not the planner. Stopped so nothing is overwritten."; exit 1
          fi
          [ -f "$server" ] && { diff -q "$server" ../blinkit-planner/Planner.gs >/dev/null && echo "Planner.gs: no change" || echo "Planner.gs: updated"; } || echo "Planner.gs: added"
          [ -f Index.html ] && { diff -q Index.html ../blinkit-planner/Index.html >/dev/null && echo "Index.html: no change" || echo "Index.html: updated"; } || echo "Index.html: added"
          cp ../blinkit-planner/Planner.gs "$server"
          cp ../blinkit-planner/Index.html Index.html
          echo "Other files kept as they are: $(ls | grep -v -e "^$server$" -e '^Index.html$' | tr '\n' ' ')"
          # Web-app settings must be in the manifest when deploying this way (as set up: Execute as Me, Anyone).
          node -e '
            const fs = require("fs"), m = JSON.parse(fs.readFileSync("appsscript.json", "utf8"));
            if (!m.webapp) { m.webapp = { executeAs: "USER_DEPLOYING", access: "ANYONE_ANONYMOUS" };
              fs.writeFileSync("appsscript.json", JSON.stringify(m, null, 2)); console.log("Added the web-app settings to appsscript.json"); }
            else console.log("Web-app settings:", JSON.stringify(m.webapp));'
          grep -o "const SERVER_VERSION = [0-9]*" "$server"

      - name: Upload and update the deployment (same app link)
        if: steps.setup.outputs.ready == 'true' && env.DRY_RUN != 'true'
        working-directory: gas
        run: |
          clasp push --force
          msg="GitHub $(echo "$GITHUB_SHA" | cut -c1-7): $(git -C .. log -1 --format=%s | cut -c1-80)"
          clasp redeploy "$DEPLOYMENT_ID" --description "$msg" | tee out.txt
          {
            echo "### ✅ Apps Script deployed"
            echo "$(cat out.txt)"
            echo ""
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: steps.setup.outputs.ready == 'true' && env.DRY_RUN == 'true'
        run: echo "### Dry run OK — sign-in works, the project was found and the files match up. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the sign-in file
        if: always()
        run: rm -f ~/.clasprc.json
