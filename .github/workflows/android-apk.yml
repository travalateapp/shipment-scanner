name: Build Android APK

# Builds the Android app (android/) that opens a web app full-screen: the attendance app (default) or the
# Karigar Production app (choose "production").
# Run it from GitHub: Actions → "Build Android APK" → Run workflow → choose the app → paste its link.
# The attendance APK is attached to the "latest" GitHub Release, so this link always gives the newest one:
#   https://github.com/<owner>/<repo>/releases/latest/download/Attendance.apk
# Production APKs are released with tags production-apk-v1.N (not marked "latest", so the attendance
# app's updates are not affected); the newest is listed on the repository's Releases page.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app'
        type: choice
        options: [attendance, production]
        default: attendance
      app_link:
        description: 'Your app link: the GitHub Pages link with ?id=…, the Apps Script /exec link, or just the deployment ID (AKfycb…)'
        required: true
  push:
    # Test builds of changes to the Android app (no release is published).
    branches-ignore: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the app link
        id: link
        env:
          LINK: ${{ inputs.app_link }}
          APP: ${{ inputs.app || 'attendance' }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$APP" = "production" ]; then
            {
              echo "folder=production"; echo "apk=Production.apk"; echo "appId=com.travalate.production"
              echo "appName=Travalate Production"; echo "tagPrefix=production-apk-"; echo "title=Production app"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "folder=attendance"; echo "apk=Attendance.apk"; echo "appId=com.travalate.attendance"
              echo "appName=Travalate Attendance"; echo "tagPrefix="; echo "title=Attendance app"
            } >> "$GITHUB_OUTPUT"
          fi
          base="https://${owner}.github.io/${repo}/$([ "$APP" = production ] && echo production || echo attendance)/"
          link="$(echo "$LINK" | tr -d '[:space:]')"
          if [ -z "$link" ]; then
            url="$base"                                    # test build without a link
          elif [[ "$link" == *github.io* ]]; then
            url="$link"                                    # the GitHub Pages link employees use
          elif [[ "$link" =~ /macros/s/([A-Za-z0-9_-]+) ]]; then
            url="${base}?id=${BASH_REMATCH[1]}"            # Apps Script /exec link
          elif [[ "$link" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            url="${base}?id=${link}"                       # just the deployment ID
          else
            echo "::error::This does not look like the app link or a deployment ID: $link"
            exit 1
          fi
          # Apps Script deployment IDs are 72 characters (AKfycb + 66). A shorter one was cut off while copying.
          id="$(echo "$url" | sed -n 's/.*[?&]id=\([A-Za-z0-9_-]*\).*/\1/p')"
          if [ -n "$id" ] && [ "${#id}" -lt 72 ]; then
            echo "::error::The deployment ID has only ${#id} characters, but Apps Script deployment IDs have 72. It was probably cut off while copying. In Apps Script open Deploy → Manage deployments, tap the copy icon next to the Deployment ID, and run this again with the whole ID."
            exit 1
          fi
          echo "App link: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The signing key is private: it lives only in the repository secrets ANDROID_KEYSTORE_BASE64 (the
      # keystore file in base64) and ANDROID_KEYSTORE_PASSWORD. Apps for employees are always signed with it,
      # so updates install over the old app. Test builds of branches without the secrets use a throwaway key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/secret.keystore
            echo "Signing with the private key from the repository secrets."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::The signing key is missing. Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions → New repository secret), then run this again."
            exit 1
          else
            keytool -genkeypair -keystore android/app/secret.keystore -storetype PKCS12 -alias attendance -keyalg RSA \
              -keysize 2048 -validity 2 -storepass test-build-only -keypass test-build-only -dname "CN=Test build only" >/dev/null 2>&1
            echo "Test build: signed with a throwaway key (not for employees)."
          fi

      - name: Build the APK
        working-directory: android
        env:
          # Read by Gradle as project properties (kept off the command line).
          ORG_GRADLE_PROJECT_storeFile: secret.keystore
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
        run: |
          gradle --no-daemon assembleRelease \
            -PappUrl="${{ steps.link.outputs.url }}" \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }} \
            -PupdateRepo="${GITHUB_REPOSITORY}" \
            -PappId="${{ steps.link.outputs.appId }}" \
            -PappName="${{ steps.link.outputs.appName }}" \
            -PupdateTagPrefix="${{ steps.link.outputs.tagPrefix }}"
          cp app/build/outputs/apk/release/app-release.apk "../${{ steps.link.outputs.apk }}"
          ls -l "../${{ steps.link.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.link.outputs.folder }}-apk
          path: ${{ steps.link.outputs.apk }}

      - name: Publish the APK as a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.link.outputs.apk }}"
          if [ "${{ steps.link.outputs.folder }}" = "production" ]; then
            tag="production-apk-v1.${{ github.run_number }}"
            gh release create "$tag" "$apk" \
              --target "${{ github.sha }}" \
              --title "Production app 1.${{ github.run_number }}" \
              --notes "Android app for karigars and staff. Download **$apk** below and install it. Opens: ${{ steps.link.outputs.url }}" \
              --latest=false
            link="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$apk"
          else
            tag="apk-v1.${{ github.run_number }}"
            gh release create "$tag" "$apk" \
              --target "${{ github.sha }}" \
              --title "Attendance app 1.${{ github.run_number }}" \
              --notes "Android app for employees. Download **$apk** below (or share https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$apk) and install it. Opens: ${{ steps.link.outputs.url }}" \
              --latest
            link="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$apk"
          fi
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Share this link: $link" >> "$GITHUB_STEP_SUMMARY"
