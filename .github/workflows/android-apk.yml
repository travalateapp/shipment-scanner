name: Build Android APK

# Builds the Android app (android/) that opens the attendance web app full-screen.
# Run it from GitHub: Actions → "Build Android APK" → Run workflow → paste your app link.
# The APK is attached to a GitHub Release, so this link always gives the newest one:
#   https://github.com/<owner>/<repo>/releases/latest/download/Attendance.apk
on:
  workflow_dispatch:
    inputs:
      app_link:
        description: 'Your app link: the GitHub Pages link with ?id=…, the Apps Script /exec link, or just the deployment ID (AKfycb…)'
        required: true
  push:
    # Test builds of changes to the Android app (no release is published).
    branches-ignore: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the app link
        id: link
        env:
          LINK: ${{ inputs.app_link }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}/attendance/"
          link="$(echo "$LINK" | tr -d '[:space:]')"
          if [ -z "$link" ]; then
            url="$base"                                    # test build without a link
          elif [[ "$link" == *github.io* ]]; then
            url="$link"                                    # the GitHub Pages link employees use
          elif [[ "$link" =~ /macros/s/([A-Za-z0-9_-]+) ]]; then
            url="${base}?id=${BASH_REMATCH[1]}"            # Apps Script /exec link
          elif [[ "$link" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            url="${base}?id=${link}"                       # just the deployment ID
          else
            echo "::error::This does not look like the app link or a deployment ID: $link"
            exit 1
          fi
          # Apps Script deployment IDs are 72 characters (AKfycb + 66). A shorter one was cut off while copying.
          id="$(echo "$url" | sed -n 's/.*[?&]id=\([A-Za-z0-9_-]*\).*/\1/p')"
          if [ -n "$id" ] && [ "${#id}" -lt 72 ]; then
            echo "::error::The deployment ID has only ${#id} characters, but Apps Script deployment IDs have 72. It was probably cut off while copying. In Apps Script open Deploy → Manage deployments, tap the copy icon next to the Deployment ID, and run this again with the whole ID."
            exit 1
          fi
          echo "App link: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The signing key is private: it lives only in the repository secrets ANDROID_KEYSTORE_BASE64 (the
      # keystore file in base64) and ANDROID_KEYSTORE_PASSWORD. Apps for employees are always signed with it,
      # so updates install over the old app. Test builds of branches without the secrets use a throwaway key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/secret.keystore
            echo "Signing with the private key from the repository secrets."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::The signing key is missing. Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions → New repository secret), then run this again."
            exit 1
          else
            keytool -genkeypair -keystore android/app/secret.keystore -storetype PKCS12 -alias attendance -keyalg RSA \
              -keysize 2048 -validity 2 -storepass test-build-only -keypass test-build-only -dname "CN=Test build only" >/dev/null 2>&1
            echo "Test build: signed with a throwaway key (not for employees)."
          fi

      - name: Build the APK
        working-directory: android
        env:
          # Read by Gradle as project properties (kept off the command line).
          ORG_GRADLE_PROJECT_storeFile: secret.keystore
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'test-build-only' }}
        run: |
          gradle --no-daemon assembleRelease \
            -PappUrl="${{ steps.link.outputs.url }}" \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }} \
            -PupdateRepo="${GITHUB_REPOSITORY}"
          cp app/build/outputs/apk/release/app-release.apk ../Attendance.apk
          ls -l ../Attendance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Attendance-apk
          path: Attendance.apk

      - name: Publish the APK as a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-v1.${{ github.run_number }}"
          gh release create "$tag" Attendance.apk \
            --target "${{ github.sha }}" \
            --title "Attendance app 1.${{ github.run_number }}" \
            --notes "Android app for employees. Download **Attendance.apk** below (or share https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Attendance.apk) and install it. Opens: ${{ steps.link.outputs.url }}" \
            --latest
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Share this link with employees: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Attendance.apk" >> "$GITHUB_STEP_SUMMARY"
