# Deploys cashbook-app/ to its Apps Script web app after every merge to main that changes it (same app link).
# Can also be run by hand from the Actions tab ("dry run" only checks the setup).
# Setup: see _new-app-template/AUTO-DEPLOY.md. Secrets: CLASPRC_JSON, CASHBOOK_SCRIPT_ID, CASHBOOK_DEPLOYMENT_ID
name: Deploy Cash Book App

on:
  push:
    branches: [main]
    paths:
      - 'cashbook-app/*.gs'
      - 'cashbook-app/*.html'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the setup and show what would change (nothing is uploaded)'
        type: boolean
        default: false

concurrency:
  group: deploy-cashbook-app
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      folder: cashbook-app
      fill_shared_secret: false
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.CASHBOOK_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.CASHBOOK_DEPLOYMENT_ID }}

