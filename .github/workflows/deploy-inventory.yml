# Deploys inventory-app/ to its Apps Script web app after every merge to main that changes it (same app link).
# Can also be run by hand from the Actions tab ("dry run" only checks the setup).
# Setup: see _new-app-template/AUTO-DEPLOY.md. Secrets: CLASPRC_JSON, INVENTORY_SCRIPT_ID, INVENTORY_DEPLOYMENT_ID, TRAVALATE_SHARED_SECRET
name: Deploy Inventory App

on:
  push:
    branches: [main]
    paths:
      - 'inventory-app/*.gs'
      - 'inventory-app/*.html'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the setup and show what would change (nothing is uploaded)'
        type: boolean
        default: false

concurrency:
  group: deploy-inventory-app
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      folder: inventory-app
      fill_shared_secret: true
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.INVENTORY_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.INVENTORY_DEPLOYMENT_ID }}
      SHARED_SECRET: ${{ secrets.TRAVALATE_SHARED_SECRET }}
