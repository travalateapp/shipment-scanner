# Read-only checks of the live Apps Script app, run from claude/* branches (never merged into main):
# health (ping / publicInfo) and the recent execution times (Apps Script → Executions).
name: Diagnose live app

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diagnose-live.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_ID: ${{ secrets.APPS_DEPLOYMENT_ID }}
      SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Health
        run: |
          url="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          for i in 1 2 3; do curl -sS -L -m 60 -o /dev/null -w "ping $i: %{time_total}s\n" "$url?ping=1" || true; done

      - name: Recent executions (durations)
        run: |
          node - <<'EOF'
          const c = JSON.parse(process.env.CLASPRC_JSON);
          const t = (c.tokens && (c.tokens.default || Object.values(c.tokens)[0])) || c.token || c;
          (async () => {
            const tr = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ client_id: t.client_id || (c.oauth2ClientSettings || {}).clientId, client_secret: t.client_secret || (c.oauth2ClientSettings || {}).clientSecret,
                refresh_token: t.refresh_token, grant_type: 'refresh_token' }) }).then(r => r.json());
            if (!tr.access_token) { console.log('token refresh failed:', tr.error, tr.error_description); return; }
            console.log('scopes:', tr.scope);
            const H = { Authorization: 'Bearer ' + tr.access_token };
            let rows = [], page = '';
            for (let k = 0; k < 4; k++) {
              const u = 'https://script.googleapis.com/v1/processes:listScriptProcesses?scriptId=' + process.env.SCRIPT_ID + '&pageSize=200' + (page ? '&pageToken=' + page : '');
              const r = await fetch(u, { headers: H }).then(r => r.json());
              if (r.error) { console.log('executions list:', r.error.code, r.error.status, r.error.message); return; }
              rows = rows.concat(r.processes || []); page = r.nextPageToken; if (!page) break;
            }
            const sec = p => parseFloat(String(p.duration || '0').replace('s', ''));
            console.log('executions read:', rows.length);
            const by = {};
            rows.forEach(p => { const d = new Date(p.startTime); const day = d.toISOString().slice(0, 10);
              const k = day + ' ' + (p.functionName || '?') + ' ' + (p.processType || ''); (by[k] = by[k] || []).push(sec(p)); });
            const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
            Object.keys(by).sort().forEach(k => { const a = by[k]; console.log(k.padEnd(48), 'n=' + String(a.length).padEnd(4), 'median ' + med(a).toFixed(2) + 's', 'max ' + Math.max(...a).toFixed(2) + 's'); });
            console.log('--- last 40 ---');
            rows.slice(0, 40).forEach(p => console.log(p.startTime, (p.functionName || '?').padEnd(10), String(p.duration).padEnd(10), p.processStatus, p.processType));
          })();
          EOF
